<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python for Engineers Week 10 Matplotlib: Plotting Engineering Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f0; --card:#ffffff; --ink:#1a1f24; --mute:#59636e; --line:#d9d6cb;
  --accent:#0a5aa0; --accent-ink:#ffffff; --accent-soft:#e4eef8;
  --ok:#17692f; --ok-bg:#e5f3e9; --bad:#a82217; --bad-bg:#fcebe8; --warn:#8a5a00; --warn-bg:#fdf3dc;
  --code-bg:#f0eee6; --out-bg:#e6edf6; --out-ink:#0a2a66;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151a; --card:#192028; --ink:#e7ebef; --mute:#9aa6b2; --line:#2c3641;
    --accent:#5eaeea; --accent-ink:#0b1219; --accent-soft:#17283a;
    --ok:#6fd08c; --ok-bg:#15301f; --bad:#ff8a7d; --bad-bg:#3a1b18; --warn:#f0c060; --warn-bg:#33290f;
    --code-bg:#10161c; --out-bg:#e6edf6; --out-ink:#0a2a66;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:50}
header.top{padding:28px 0 12px}
.kicker{font-size:13px;color:var(--mute);letter-spacing:.02em;margin:0 0 4px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.2;margin:0 0 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:13px;border:1px solid var(--line);background:var(--card);padding:2px 10px;border-radius:999px;color:var(--mute)}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--mute);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.statusbar{position:sticky;top:46px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:6px 12px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.statusbar .grow{flex:1}
main{padding:16px 0 80px}
.panel[hidden]{display:none}
h2{font-size:22px;margin:24px 0 8px;font-weight:600}
h3{font-size:18px;margin:0 0 6px;font-weight:600}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:22px}
li{margin:2px 0}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
.card .meta{font-size:13px;color:var(--mute);margin:0 0 8px}
.hook{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .big{font-size:24px;font-weight:600;font-family:var(--mono)}
.tile .lbl{font-size:13px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.bar>span{display:block;height:100%;background:var(--accent);width:0}
button.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.cell{margin:12px 0}
textarea.code{display:block;width:100%;font-family:var(--mono);font-size:14px;line-height:1.5;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;resize:vertical;tab-size:4;white-space:pre;overflow:auto;min-height:60px}
.stdin{margin-top:6px}
.stdin label{font-size:13px;color:var(--mute);display:block}
textarea.stdin-box{width:100%;font-family:var(--mono);font-size:13px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:48px}
.out{margin-top:8px}
pre.stdout{margin:0;background:var(--out-bg);color:var(--out-ink);font-family:var(--mono);font-size:13.5px;padding:10px 12px;border-radius:6px;border:1px solid #b9c8dc;overflow:auto;white-space:pre-wrap;word-break:break-word}
.err{margin-top:8px;border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:8px 12px;font-size:14px}
.err pre{margin:4px 0 0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;color:inherit}
.out img{max-width:100%;height:auto;background:#fff;border-radius:6px;margin-top:8px;border:1px solid var(--line)}
.tests{list-style:none;margin:8px 0 0;padding:0}
.tests li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.badge{font-family:var(--mono);font-size:12px;font-weight:500;padding:1px 8px;border-radius:4px;flex:none}
.badge.pass{background:var(--ok-bg);color:var(--ok)}
.badge.fail{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.hint{margin:8px 0;padding:8px 12px;background:var(--warn-bg);color:var(--ink);border-radius:6px;font-size:14px;border:1px solid var(--line)}
.q{margin:0 0 6px;font-weight:500}
.q p{margin:0 0 8px}
.q pre,.card pre{background:var(--code-bg);padding:8px 12px;border-radius:6px;overflow:auto;font-family:var(--mono);font-size:13.5px;font-weight:400;margin:0 0 10px}
.q pre code,.card pre code{background:none;padding:0}
.opts{list-style:none;padding:0;margin:0}
.opts button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:var(--ok-bg)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opts button:disabled{cursor:default}
.why{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:6px;background:var(--accent-soft)}
.checkq{margin:14px 0 4px;padding:12px;border:1px dashed var(--line);border-radius:8px}
.done-row{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.field input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-width:240px}
textarea.report{width:100%;min-height:200px;font-family:var(--mono);font-size:12.5px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px}
table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code-bg)}
.small{font-size:13px;color:var(--mute)}
@media (max-width:600px){ .field input{min-width:0;width:100%} .statusbar{top:44px} }
</style>
</head>

<script id="data" type="application/json">{"course_id": "pyeng", "course_title": "Python for Engineers", "pyodide_base": "https://cdn.jsdelivr.net/pyodide/v0.27.8/full/", "num": 10, "title": "Matplotlib: Plotting Engineering Data", "hook": "Engineers argue with graphs. A well-labeled curve shows a capacitor charging, a beam bending, or a sensor drifting in a way that a table of 500 numbers never will. This week you turn the arrays from week 9 into figures with titles, units, legends, and multiple panels, and you read engineering facts straight off the plot: time constants, maximum deflection, and noise.", "objectives": ["create line, scatter, bar, and histogram plots with Matplotlib", "label axes with units, add titles, legends, and grids", "plot several curves on one set of axes", "arrange several plots with <code>plt.subplots<\/code>", "plot an RC charging curve and read its time constant", "compute and plot a beam deflection curve"], "summary": "<ul><li><code>import matplotlib.pyplot as plt<\/code>. <code>fig, ax = plt.subplots()<\/code> creates the canvas and axes.<\/li><li><code>ax.plot(x, y)<\/code> draws a line. <code>ax.scatter(x, y)<\/code> draws points. <code>ax.bar<\/code> and <code>ax.hist<\/code> draw categories and distributions.<\/li><li>Label every axis with a quantity and unit: <code>set_title<\/code>, <code>set_xlabel<\/code>, <code>set_ylabel<\/code>. Add <code>ax.grid(True)<\/code>.<\/li><li>Give each curve <code>label=\"...\"<\/code> and call <code>ax.legend()<\/code> once.<\/li><li><code>ax.axhline<\/code> and <code>ax.axvline<\/code> draw reference lines. <code>\"ro\"<\/code> draws red dots.<\/li><li><code>plt.subplots(rows, columns)<\/code> makes several axes. Unpack them for small grids.<\/li><li>RC charging: <code>v = Vs * (1 - exp(-t / (R * C)))<\/code>. After one time constant, 63.2 percent.<\/li><li><code>np.polyfit(x, y, 1)<\/code> fits a line to measured data.<\/li><\/ul>", "lecture": [{"title": "Your first plot", "minutes": 20, "html": "<p>Matplotlib is the standard Python plotting library. Import its plotting module with <code>import matplotlib.pyplot as plt<\/code>. The workflow has three steps: create a figure and axes, plot data on the axes, then decorate the axes.<\/p>\n<p><code>fig, ax = plt.subplots()<\/code> creates both. <code>ax.plot(x, y)<\/code> draws a line through the points. In this page a figure appears below the cell automatically when the cell finishes, so you never need <code>plt.show()<\/code> here.<\/p>\n<p>The code below plots the parabola from week 9. Run it and check where the curve crosses the x-axis.<\/p>", "cells": [{"code": "import numpy as np\nimport matplotlib.pyplot as plt\n\nx = np.linspace(-2, 5, 71)\ny = x ** 2 - 3 * x + 2\n\nfig, ax = plt.subplots()\nax.plot(x, y)\nprint(len(ax.lines), \"line on the axes\")\n", "stdin": null, "note": "The curve crosses zero at x = 1 and x = 2, the roots you found last week."}], "check": {"q": "What does <code>fig, ax = plt.subplots()<\/code> create?", "options": ["A line plot of two variables", "Two separate figures", "An array of 2 values", "A figure and one set of axes"], "answer": 3, "why": "The figure is the canvas and the axes hold the plot. You plot on the axes with <code>ax.plot<\/code>."}}, {"title": "Titles, labels, units, and grids", "minutes": 15, "html": "<p>An unlabeled plot is a picture. A labeled plot is data. Engineering plots always show the quantity and its unit on each axis.<\/p>\n<ul><li><code>ax.set_title(\"Title\")<\/code><\/li><li><code>ax.set_xlabel(\"Time (s)\")<\/code><\/li><li><code>ax.set_ylabel(\"Voltage (V)\")<\/code><\/li><li><code>ax.grid(True)<\/code> adds grid lines so readers can estimate values<\/li><\/ul>\n<p>Write units in parentheses after the quantity name.<\/p>", "cells": [{"code": "t = np.linspace(0, 2, 200)\nv = 5 * np.sin(2 * np.pi * 1.5 * t)\n\nfig, ax = plt.subplots()\nax.plot(t, v)\nax.set_title(\"5 V, 1.5 Hz sine wave\")\nax.set_xlabel(\"Time (s)\")\nax.set_ylabel(\"Voltage (V)\")\nax.grid(True)\nprint(ax.get_title())\n", "stdin": null, "note": null}], "check": {"q": "Which call labels the horizontal axis?", "options": ["<code>ax.plot(\"Time (s)\")<\/code>", "<code>ax.set_xlabel(\"Time (s)\")<\/code>", "<code>ax.title(\"Time (s)\")<\/code>", "<code>ax.label_x(\"Time (s)\")<\/code>"], "answer": 1, "why": "Axis labels use <code>set_xlabel<\/code> and <code>set_ylabel<\/code>. Include the unit."}}, {"title": "Several curves and a legend", "minutes": 15, "html": "<p>Call <code>ax.plot<\/code> more than once to draw more than one curve. Give each call a <code>label=\"...\"<\/code>, then call <code>ax.legend()<\/code> once at the end so the reader can tell the curves apart.<\/p>\n<p>Style options go inside <code>plot<\/code>: <code>color=\"red\"<\/code>, <code>linestyle=\"--\"<\/code>, <code>linewidth=2<\/code>, <code>marker=\"o\"<\/code>. A short form such as <code>\"r--\"<\/code> means red dashed.<\/p>", "cells": [{"code": "I = np.linspace(0, 2, 50)\n\nfig, ax = plt.subplots()\nax.plot(I, I ** 2 * 5, label=\"R = 5 ohm\")\nax.plot(I, I ** 2 * 10, \"--\", label=\"R = 10 ohm\")\nax.set_xlabel(\"Current (A)\")\nax.set_ylabel(\"Power (W)\")\nax.legend()\nax.grid(True)\nprint(len(ax.lines), \"curves\")\n", "stdin": null, "note": "Doubling the resistance doubles the power at each current."}], "check": {"q": "What must you pass to <code>ax.plot<\/code> for a curve to appear in <code>ax.legend()<\/code> with a name?", "options": ["<code>text=\"name\"<\/code>", "<code>title=\"name\"<\/code>", "<code>legend=\"name\"<\/code>", "<code>label=\"name\"<\/code>"], "answer": 3, "why": "The legend reads the label of each plotted line."}}, {"title": "The RC charging curve", "minutes": 20, "html": "<p>A capacitor charging through a resistor follows <code>v(t) = Vs * (1 - exp(-t / (R * C)))<\/code>. The product <code>tau = R * C<\/code> is the <strong>time constant<\/strong>. After one <code>tau<\/code> the capacitor reaches 63.2 percent of the supply voltage. After about <code>5 * tau<\/code> it is effectively full.<\/p>\n<p>Plot it, then mark the time constant. <code>ax.axhline(y)<\/code> draws a horizontal reference line and <code>ax.axvline(x)<\/code> draws a vertical one. <code>ax.plot(x, y, \"ro\")<\/code> puts a single red dot on the curve.<\/p>", "cells": [{"code": "Vs = 5.0\nR = 10_000\nC = 100e-6\ntau = R * C\nt = np.linspace(0, 5 * tau, 501)\nv = Vs * (1 - np.exp(-t / tau))\n\nv_tau = Vs * (1 - np.exp(-1))\nprint(\"tau =\", tau, \"s\")\nprint(\"v at tau =\", round(v_tau, 3), \"V\")\n\nfig, ax = plt.subplots()\nax.plot(t, v, label=\"capacitor voltage\")\nax.axhline(Vs, linestyle=\":\", color=\"gray\", label=\"supply\")\nax.plot([tau], [v_tau], \"ro\", label=\"one time constant\")\nax.set_title(\"RC charging, R = 10 kohm, C = 100 uF\")\nax.set_xlabel(\"Time (s)\")\nax.set_ylabel(\"Voltage (V)\")\nax.legend()\nax.grid(True)\n", "stdin": null, "note": "The red dot sits at 63.2 percent of 5 V."}, {"code": "done = t[v >= 0.99 * Vs][0]\nprint(\"99 percent charged at\", round(done, 2), \"s\")\nprint(\"5 tau =\", 5 * tau, \"s\")\n", "stdin": null, "note": "A mask finds the first time the voltage passes 99 percent."}], "check": {"q": "After one time constant, an RC circuit has charged to about what fraction of the supply voltage?", "options": ["50 percent", "63 percent", "99 percent", "37 percent"], "answer": 1, "why": "<code>1 - exp(-1)<\/code> is 0.632."}}, {"title": "Scatter plots and fitted lines", "minutes": 15, "html": "<p>Measured data often goes on a <strong>scatter plot<\/strong> (<code>ax.scatter(x, y)<\/code>) because the points are separate readings, not a continuous curve. A fitted line goes on top with <code>ax.plot<\/code>.<\/p>\n<p><code>np.polyfit(x, y, 1)<\/code> returns the slope and intercept of the best straight line. Use <code>np.polyval(coeffs, x)<\/code> to evaluate the line at any x.<\/p>", "cells": [{"code": "rng = np.random.default_rng(1)\nvolts = np.linspace(0, 5, 11)\nreading = 2.0 * volts + 0.5 + rng.normal(0, 0.15, volts.size)\n\nslope, intercept = np.polyfit(volts, reading, 1)\nprint(\"slope\", round(slope, 2), \"intercept\", round(intercept, 2))\n\nfig, ax = plt.subplots()\nax.scatter(volts, reading, label=\"measured\")\nax.plot(volts, slope * volts + intercept, \"r-\", label=\"fit\")\nax.set_xlabel(\"Input (V)\")\nax.set_ylabel(\"Reading (counts)\")\nax.legend()\nax.grid(True)\n", "stdin": null, "note": "The seed makes the noise repeatable. The slope should land close to 2."}], "check": {"q": "What does <code>np.polyfit(x, y, 1)<\/code> return?", "options": ["The correlation of x and y", "The first point of the data", "A plot of x and y", "The slope and intercept of the best fit line"], "answer": 3, "why": "Degree 1 means a straight line, described by two coefficients."}}, {"title": "Subplots", "minutes": 15, "html": "<p><code>fig, axes = plt.subplots(rows, columns)<\/code> creates several axes in one figure. With two or more axes you get an array, so unpack one axis per variable when the grid is small: <code>fig, (ax1, ax2) = plt.subplots(1, 2)<\/code> for side by side, or <code>plt.subplots(2, 1)<\/code> for stacked.<\/p>\n<p>Plots that share a time axis should be stacked and use <code>sharex=True<\/code>. <code>fig.tight_layout()<\/code> stops labels from overlapping.<\/p>", "cells": [{"code": "t = np.linspace(0, 2, 400)\nv = 5 * np.sin(2 * np.pi * 2 * t)\ni = v / 100\n\nfig, (ax1, ax2) = plt.subplots(2, 1, sharex=True)\nax1.plot(t, v)\nax1.set_ylabel(\"Voltage (V)\")\nax2.plot(t, i * 1000, \"g\")\nax2.set_ylabel(\"Current (mA)\")\nax2.set_xlabel(\"Time (s)\")\nfig.tight_layout()\nprint(len(fig.axes), \"axes\")\n", "stdin": null, "note": "Current follows voltage across a 100 ohm resistor, so the shapes match."}], "check": {"q": "What does <code>plt.subplots(2, 3)<\/code> create?", "options": ["A figure with 3 rows and 2 columns of axes", "A figure with 2 rows and 3 columns of axes", "Two figures with 3 axes each", "A 2 by 3 array of data"], "answer": 1, "why": "The arguments are rows, then columns."}}, {"title": "Bar charts and histograms", "minutes": 15, "html": "<p>Use <code>ax.bar(names, values)<\/code> to compare categories and <code>ax.hist(data, bins=n)<\/code> to show how a set of readings is distributed. A histogram of repeated measurements usually looks like a bell curve centered on the true value.<\/p>", "cells": [{"code": "rng = np.random.default_rng(7)\nreadings = rng.normal(5.0, 0.1, 500)\n\nfig, (ax1, ax2) = plt.subplots(1, 2)\nax1.bar([\"R1\", \"R2\", \"R3\"], [4.7, 10.0, 2.2])\nax1.set_ylabel(\"Resistance (kohm)\")\nax2.hist(readings, bins=20)\nax2.set_xlabel(\"Reading (V)\")\nax2.set_ylabel(\"Count\")\nfig.tight_layout()\nprint(round(readings.mean(), 2), round(readings.std(), 2))\n", "stdin": null, "note": null}], "check": {"q": "Which plot shows how 500 repeated measurements spread around their average?", "options": ["A line plot of the sorted index", "A bar chart of the average", "A pie chart", "A histogram"], "answer": 3, "why": "A histogram counts readings in each range, which shows the spread."}}, {"title": "Beam deflection, start to finish", "minutes": 15, "html": "<p>A simply supported beam of length L with a load P at the center bends by <code>y(x) = P * x * (3 * L**2 - 4 * x**2) / (48 * E * I)<\/code> for positions <code>x<\/code> from 0 to <code>L/2<\/code>. The maximum deflection <code>P * L**3 / (48 * E * I)<\/code> is at the center. Engineers plot deflection downward, so this example flips the y-axis with <code>ax.invert_yaxis()<\/code>.<\/p>\n<p>Read the code, then change <code>P<\/code> to 2000 N and confirm the maximum doubles.<\/p>", "cells": [{"code": "P = 1000.0\nL = 2.0\nE = 200e9\nI = 8e-6\n\nx = np.linspace(0, L / 2, 101)\ndeflection = P * x * (3 * L ** 2 - 4 * x ** 2) / (48 * E * I)\nmax_mm = deflection.max() * 1000\nprint(\"Max deflection:\", round(max_mm, 3), \"mm at x =\", x[np.argmax(deflection)], \"m\")\n\nfig, ax = plt.subplots()\nax.plot(x, deflection * 1000)\nax.invert_yaxis()\nax.set_title(\"Half of a simply supported beam\")\nax.set_xlabel(\"Position (m)\")\nax.set_ylabel(\"Deflection (mm)\")\nax.grid(True)\n", "stdin": null, "note": null}]}], "lecture_minutes": 130, "lab": {"summary": "Plots with labels and legends: a power curve, a labeled sine wave, the RC charging curve with 95 percent time, two capacitors compared, a two-panel figure, and a beam deflection curve.", "intro_html": "<p>Each task builds a figure. Name your figure <code>fig<\/code> and your axes <code>ax<\/code> (or <code>ax1<\/code> and <code>ax2<\/code> for two panels) exactly as shown. The checks inspect the axes you created: the number of lines, the data on them, and the labels. A figure also appears below your code so you can check it by eye.<\/p>\n<p>Start every task with the imports shown in the starter code.<\/p>", "tasks": [{"id": "t1", "title": "Plot a power curve", "points": 15, "minutes": 20, "bonus": false, "prompt_html": "<p>A 10 ohm resistor carries currents from 0 to 2 A. Create <code>current = np.linspace(0, 2, 50)<\/code> and <code>power = current ** 2 * 10<\/code>. Create <code>fig, ax = plt.subplots()<\/code> and plot power against current with a single <code>ax.plot<\/code> call.<\/p>", "starter": "import numpy as np\nimport matplotlib.pyplot as plt\n\ncurrent = np.linspace(0, 2, 50)\npower = ...\n\nfig, ax = plt.subplots()\n# plot power against current\n", "hint_html": "<p><code>ax.plot(current, power)<\/code> draws the curve. Compute <code>power<\/code> first with array math.<\/p>", "stdin": null, "tests": {"setup": "import numpy as np\nimport matplotlib.pyplot as plt", "items": [["power values", "approx(power, np.linspace(0, 2, 50) ** 2 * 10)", "power = current ** 2 * 10"], ["one line on the axes", "len(ax.lines) == 1", "Call ax.plot once."], ["x data is current", "approx(ax.lines[0].get_xdata(), current)", "The first argument of plot is the x values."], ["y data is power", "approx(ax.lines[0].get_ydata(), power)", "The second argument of plot is the y values."]]}}, {"id": "t2", "title": "Label the sine wave", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Plot <code>v = 5 * np.sin(2 * np.pi * 1.5 * t)<\/code> against <code>t<\/code>. Then set the title to <code>5 V, 1.5 Hz sine wave<\/code>, the x label to <code>Time (s)<\/code>, the y label to <code>Voltage (V)<\/code>, and turn on the grid.<\/p>", "starter": "import numpy as np\nimport matplotlib.pyplot as plt\n\nt = np.linspace(0, 2, 200)\nv = 5 * np.sin(2 * np.pi * 1.5 * t)\n\nfig, ax = plt.subplots()\nax.plot(t, v)\n# add the title, labels, and grid\n", "hint_html": "<p>Use <code>ax.set_title(...)<\/code>, <code>ax.set_xlabel(...)<\/code>, <code>ax.set_ylabel(...)<\/code> with the exact text, then <code>ax.grid(True)<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import numpy as np\nimport matplotlib.pyplot as plt", "items": [["title", "ax.get_title() == '5 V, 1.5 Hz sine wave'", "Use ax.set_title with the exact text."], ["x label", "ax.get_xlabel() == 'Time (s)'", "Use ax.set_xlabel with the exact text."], ["y label", "ax.get_ylabel() == 'Voltage (V)'", "Use ax.set_ylabel with the exact text."], ["grid is on", "any(l.get_visible() for l in ax.xaxis.get_gridlines())", "Call ax.grid(True)."]]}}, {"id": "t3", "title": "RC curve and 95 percent time", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>For <code>Vs = 5.0<\/code>, <code>R = 10_000<\/code>, <code>C = 100e-6<\/code>, compute <code>tau<\/code>. Create <code>t = np.linspace(0, 5 * tau, 501)<\/code> and the voltage array <code>v<\/code>. Find <code>t_95<\/code>, the first time <code>v<\/code> reaches 95 percent of <code>Vs<\/code>. Plot <code>v<\/code> against <code>t<\/code> on <code>ax<\/code> and label both axes.<\/p>", "starter": "import numpy as np\nimport matplotlib.pyplot as plt\n\nVs = 5.0\nR = 10_000\nC = 100e-6\n\ntau = ...\nt = np.linspace(0, 5 * tau, 501)\nv = ...\nt_95 = ...\n\nfig, ax = plt.subplots()\n# plot v against t and label the 000.0<\/code> N, <code>L = 2.0<\/code> m, <code>E = 200e9<\/code> Pa, <code>I = 8e-6<\/code> m^4. Compute <code>deflection<\/code> (in meters) for <code>x = np.linspace(0, L / 2, 101)<\/code>, then <code>max_mm<\/code> (the largest deflection in millimeters) and <code>x_at_max<\/code> (the position of that maximum). Plot <code>deflection * 1000<\/code> against <code>x<\/code> on <code>ax<\/code>, invert the y-axis, and label both axes.<\/p>", "starter": "import numpy as np\nimport matplotlib.pyplot as plt\n\nP = 1000.0\nL = 2.0\nE = 200e9\nI = 8e-6\n\nx = np.linspace(0, L / 2, 101)\ndeflection = ...\nmax_mm = ...\nx_at_max = ...\n\nfig, ax = plt.subplots()\n# plot, invert the y axis, label the axes\n\nprint(max_mm, x_at_max)\n", "hint_html": "<p><code>deflection = P * x * (3 * L ** 2 - 4 * x ** 2) / (48 * E * I)<\/code>. <code>max_mm = deflection.max() * 1000<\/code>. <code>x_at_max = x[np.argmax(deflection)]<\/code>. Use <code>ax.invert_yaxis()<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import numpy as np\nimport matplotlib.pyplot as plt", "items": [["deflection formula", "approx(deflection[-1], 1000 * 2 ** 3 / (48 * 200e9 * 8e-6), rel=1e-6)", "At the center, deflection = P * L**3 / (48 * E * I)."], ["max_mm", "approx(max_mm, 0.10417, rel=1e-3)", "Take deflection.max() and multiply by 1000."], ["x_at_max is 1.0 m", "approx(x_at_max, 1.0)", "Index x with np.argmax(deflection)."], ["curve in millimeters", "len(ax.lines) == 1 and approx(ax.lines[0].get_ydata(), deflection * 1000)", "Plot deflection * 1000."], ["y axis inverted", "ax.yaxis_inverted()", "Call ax.invert_yaxis()."], ["axes labeled", "ax.get_xlabel() != '' and ax.get_ylabel() != ''", "Set both axis labels."]]}}, {"id": "b1", "title": "Histogram of noise", "points": 10, "minutes": 20, "bonus": true, "prompt_html": "<p>Draw a histogram of <code>noise<\/code> with 10 bins on <code>ax<\/code>, label the x axis <code>Reading (V)<\/code>, and store the mean of <code>noise<\/code> in <code>noise_mean<\/code>.<\/p>", "starter": "import numpy as np\nimport matplotlib.pyplot as plt\n\nrng = np.random.default_rng(3)\nnoise = rng.normal(5.0, 0.1, 200)\n\nfig, ax = plt.subplots()\nnoise_mean = ...\n# draw the histogram and label the x axis\n", "hint_html": "<p><code>ax.hist(noise, bins=10)<\/code> draws 10 bars. <code>noise.mean()<\/code> gives the average.<\/p>", "stdin": null, "tests": {"setup": "import numpy as np\nimport matplotlib.pyplot as plt", "items": [["ten bars", "len(ax.patches) == 10", "Use ax.hist(noise, bins=10)."], ["x label", "ax.get_xlabel() == 'Reading (V)'", "Use ax.set_xlabel."], ["mean", "approx(noise_mean, float(np.mean(noise)))", "Use noise.mean()."]]}}]}, "lab_minutes": 150, "quiz": [{"q": "Which line creates a figure and one set of axes?", "options": ["<code>ax = plt.figure.axes()<\/code>", "<code>fig, ax = plt.plot()<\/code>", "<code>fig, ax = plt.subplots()<\/code>", "<code>fig = plt.axes(1)<\/code>"], "answer": 2, "why": "<code>subplots<\/code> returns the figure and the axes together."}, {"q": "Which call draws a line through the points in <code>x<\/code> and <code>y<\/code> on the axes <code>ax<\/code>?", "options": ["<code>ax.line(x, y)<\/code>", "<code>ax.draw(x, y)<\/code>", "<code>ax.graph(x, y)<\/code>", "<code>ax.plot(x, y)<\/code>"], "answer": 3, "why": "<code>plot<\/code> draws a line. <code>scatter<\/code> draws separate points."}, {"q": "Which label is best for the vertical axis of a voltage plot?", "options": ["<code>Voltage (V)<\/code>", "<code>y<\/code>", "<code>Graph<\/code>", "<code>Voltage<\/code>"], "answer": 0, "why": "A quantity name plus a unit lets readers interpret the numbers."}, {"q": "A plot has two curves. What makes the legend show their names?", "options": ["Call <code>ax.legend()<\/code> only", "Pass <code>label=...<\/code> to each <code>ax.plot<\/code> and call <code>ax.legend()<\/code>", "Call <code>ax.names()<\/code>", "Pass <code>title=...<\/code> to each <code>ax.plot<\/code>"], "answer": 1, "why": "The legend reads the label of each line, but you must call <code>legend()<\/code> to draw it."}, {"q": "An RC circuit has R = 2 kohm and C = 500 uF. What is the time constant?", "options": ["4 s", "1000 s", "1 s", "0.001 s"], "answer": 2, "why": "tau = R * C = 2000 * 0.0005 = 1 s."}, {"q": "What fraction of the supply voltage does a charging capacitor reach after one time constant?", "options": ["100 percent", "About 50 percent", "About 37 percent", "About 63 percent"], "answer": 3, "why": "<code>1 - exp(-1)<\/code> is about 0.632."}, {"q": "Which plot suits a set of separate sensor readings with a fitted line on top?", "options": ["A scatter plot with a line plotted over it", "A pie chart", "A bar chart with a legend", "A histogram of the line"], "answer": 0, "why": "Points are separate measurements. The fit is a continuous line."}, {"q": "What does <code>np.polyfit(x, y, 1)<\/code> return?", "options": ["The average of x and y", "The slope and intercept of a straight line", "The y value at x = 1", "A figure object"], "answer": 1, "why": "A degree 1 fit has two coefficients."}, {"q": "What does <code>plt.subplots(1, 2)<\/code> create?", "options": ["Two rows with one axis", "A 1 by 2 array of data", "One row with two axes", "Two figures"], "answer": 2, "why": "The arguments are rows, then columns."}, {"q": "Which call shows how many readings fall in each range?", "options": ["<code>ax.fill(readings)<\/code>", "<code>ax.scatter(readings)<\/code>", "<code>ax.bar(readings)<\/code>", "<code>ax.hist(readings, bins=10)<\/code>"], "answer": 3, "why": "<code>hist<\/code> counts values in each bin."}, {"q": "Why do engineers invert the y-axis on a beam deflection plot?", "options": ["The beam bends downward, so the plot matches the physical shape", "To make the curve larger", "Matplotlib draws upside down by default", "To hide negative values"], "answer": 0, "why": "Reading the plot like the beam makes the result easier to understand."}, {"q": "A plot shows a curve but its axes have no labels. What is missing?", "options": ["A second curve", "The quantities and units that give the numbers meaning", "The figure object", "The data"], "answer": 1, "why": "Without labels, readers cannot tell what the axes measure."}], "quiz_minutes": 18, "quiz_intro_html": "<p>Answer each question. You see the explanation right after you choose. You can reset the quiz and try again.<\/p>"}</script>
<script id="harness" type="text/x-python">import sys, io, os, json, ast, base64, builtins, traceback, contextlib, math, random

os.environ.setdefault("MPLBACKEND", "Agg")
import importlib
if "" not in sys.path:
    sys.path.insert(0, "")

_OUT_CAP = 20000
_LECTURE_NS = {"__name__": "__main__"}


class _Capped(io.StringIO):
    def write(self, s):
        if self.tell() > _OUT_CAP:
            raise RuntimeError("Output limit reached. Your code printed too much text.")
        return super().write(s)


def approx(a, b, rel=1e-6, abs_=1e-9):
    try:
        if "numpy" in sys.modules:
            import numpy as _np
            if isinstance(a, _np.ndarray) or isinstance(b, _np.ndarray):
                return bool(_np.allclose(a, b, rtol=rel, atol=abs_))
        if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
            return len(a) == len(b) and all(approx(x, y, rel, abs_) for x, y in zip(a, b))
        return abs(float(a) - float(b)) <= max(abs_, rel * abs(float(b)))
    except Exception:
        return False


def uses_node(src, *names):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    wanted = tuple(getattr(ast, n) for n in names)
    return any(isinstance(n, wanted) for n in ast.walk(tree))


def calls_name(src, name):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    for n in ast.walk(tree):
        if isinstance(n, ast.Call):
            f = n.func
            if isinstance(f, ast.Name) and f.id == name:
                return True
            if isinstance(f, ast.Attribute) and f.attr == name:
                return True
    return False


def line_has(src, target, *words):
    """True when an assignment to `target` has every word on its right side."""
    for line in src.splitlines():
        s = line.strip()
        if s.startswith("#") or "=" not in s:
            continue
        left, _, right = s.partition("=")
        if left.strip() == target and all(w in right for w in words):
            return True
    return False


def run_with(src, inputs=(), ns=None):
    """Run student source with scripted input() values; return what it printed."""
    queue = list(inputs)
    old = builtins.input

    def _fake(prompt=""):
        print(prompt, end="")
        if not queue:
            raise EOFError("input() called more times than expected")
        v = queue.pop(0)
        print(v)
        return v

    buf = io.StringIO()
    builtins.input = _fake
    try:
        with contextlib.redirect_stdout(buf):
            exec(compile(src, "<your code>", "exec"), ns if ns is not None else {"__name__": "__main__"})
    finally:
        builtins.input = old
    return buf.getvalue()


def rerun(src, **over):
    """Execute student source again with top-level assignments replaced by the given constants.
    Returns the resulting namespace. Output is discarded."""
    tree = ast.parse(src)
    for node in tree.body:
        if (isinstance(node, ast.Assign) and len(node.targets) == 1
                and isinstance(node.targets[0], ast.Name) and node.targets[0].id in over):
            node.value = ast.Constant(over[node.targets[0].id])
    ast.fix_missing_locations(tree)
    ns = {"__name__": "__main__"}
    with contextlib.redirect_stdout(io.StringIO()):
        exec(compile(tree, "<your code>", "exec"), ns)
    return ns


def count_defs(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.FunctionDef) for n in ast.walk(tree))


def count_classes(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.ClassDef) for n in ast.walk(tree))


def _format_error(exc, code):
    lines = code.split("\n")
    if isinstance(exc, SyntaxError):
        ln = exc.lineno
        msg = "SyntaxError: " + str(exc.msg)
        if ln and 1 <= ln <= len(lines):
            msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
        return msg
    tb = traceback.TracebackException.from_exception(exc)
    ln = None
    for fs in tb.stack:
        if fs.filename == "<your code>":
            ln = fs.lineno
    msg = "".join(tb.format_exception_only()).strip()
    if ln and 1 <= ln <= len(lines):
        msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
    return msg


def _make_input(stdin_lines, out):
    queue = list(stdin_lines)

    def _input(prompt=""):
        out.write(str(prompt))
        if not queue:
            raise EOFError("input() ran out of lines. Type one value per line in the Input box under the code.")
        val = queue.pop(0)
        out.write(val + "\n")
        return val

    return _input


def _exec_code(code, ns, out):
    tree = ast.parse(code, "<your code>", "exec")
    last = None
    if tree.body and isinstance(tree.body[-1], ast.Expr):
        last = ast.Expression(tree.body.pop().value)
    exec(compile(tree, "<your code>", "exec"), ns)
    if last is not None:
        val = eval(compile(last, "<your code>", "eval"), ns)
        if val is not None:
            out.write(repr(val) + "\n")


def _collect_images():
    imgs = []
    if "matplotlib.pyplot" in sys.modules:
        import matplotlib.pyplot as plt
        for num in plt.get_fignums():
            fig = plt.figure(num)
            buf = io.BytesIO()
            fig.savefig(buf, format="png", dpi=100, bbox_inches="tight")
            imgs.append(base64.b64encode(buf.getvalue()).decode("ascii"))
        plt.close("all")
    return imgs


def reset_lecture():
    _LECTURE_NS.clear()
    _LECTURE_NS["__name__"] = "__main__"


def run_cell(req_json):
    req = json.loads(req_json)
    code = req.get("code", "")
    mode = req.get("mode", "fresh")
    stdin_lines = req.get("stdin") or []
    tests = req.get("tests")
    ns = _LECTURE_NS if mode == "lecture" else {"__name__": "__main__"}
    importlib.invalidate_caches()
    out = _Capped()
    err = None
    real_input = builtins.input
    builtins.input = _make_input(stdin_lines, out)
    try:
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
            try:
                random.seed()
                _exec_code(code, ns, out)
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                err = _format_error(exc, code)
    finally:
        builtins.input = real_input
    result = {"stdout": out.getvalue(), "error": err, "images": [], "tests": None}
    try:
        result["images"] = _collect_images()
    except Exception as exc:
        result["stdout"] += "\n(Plot could not be drawn: %s)" % exc
    if tests is not None:
        result["tests"] = _run_tests(tests, ns, code, err, out.getvalue())
    return json.dumps(result)


def _run_tests(tests, ns, code, err, stdout_text):
    items = tests.get("items", [])
    results = []
    if err is not None:
        for label, _expr, hint in items:
            results.append({"label": label, "ok": False, "msg": "Fix the error above first."})
        return results
    env = ns
    helpers = {
        "approx": approx, "out": stdout_text, "src": code, "ast": ast,
        "uses_node": uses_node, "calls_name": calls_name,
        "count_defs": count_defs, "run_with": run_with, "rerun": rerun, "count_classes": count_classes, "line_has": line_has,
        "math": math, "random": random, "io": io, "_in_tests": True,
    }
    _missing = object()
    saved = {k: env.get(k, _missing) for k in helpers}
    env.update(helpers)
    sink = _Capped()
    try:
        setup = tests.get("setup")
        if setup:
            try:
                with contextlib.redirect_stdout(sink):
                    exec(compile(setup, "<tests>", "exec"), env)
            except BaseException as exc:
                reason = "Could not run the checks: %s: %s" % (type(exc).__name__, exc)
                return [{"label": l, "ok": False, "msg": reason} for l, _e, _h in items]
        for label, expr, hint in items:
            try:
                with contextlib.redirect_stdout(sink):
                    ok = bool(eval(compile(expr, "<tests>", "eval"), env))
                results.append({"label": label, "ok": ok, "msg": "" if ok else hint})
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                results.append({"label": label, "ok": False,
                                "msg": "%s (%s: %s)" % (hint, type(exc).__name__, exc)})
    finally:
        for k, v in saved.items():
            if v is _missing:
                env.pop(k, None)
            else:
                env[k] = v
    return results

      hasResult: function () { return !!S.lab[t.id]; },
      onCheck: function (r) {
        var passed = r.tests ? r.tests.filter(function (x) { return x.ok; }).length : 0;
        S.lab[t.id] = { passed: passed, total: r.tests ? r.tests.length : 0, at: new Date().toISOString() };
        save(); note.textContent = 'Last check: ' + passed + ' of ' + S.lab[t.id].total + ' tests passed.'; updateLab();
      }
    });
    card.appendChild(cell); card.appendChild(note);
    p.appendChild(card);
  });
  p.appendChild(h('h2', { text: 'Submit your work' }));
  var rep = h('div', { class: 'card' });
  rep.appendChild(h('p', { text: 'Enter your name, then copy the report or download it. Submit it the way your instructor asks. The report lists your scores and your final code for each task.' }));
  var nm = h('input', { type: 'text', id: 'stname', 'aria-label': 'Your name', placeholder: 'Your name', autocomplete: 'name' });
  nm.value = S.name;
  nm.addEventListener('input', function () { S.name = nm.value; save(); });
  rep.appendChild(h('div', { class: 'field' }, [h('label', { for: 'stname', text: 'Name' }), nm]));
  var ta = h('textarea', { class: 'report', readonly: '', 'aria-label': 'Report text' });
  var b1 = h('button', { class: 'btn primary', text: 'Build report', onclick: function () { ta.value = buildReport(); } });
  var b2 = h('button', { class: 'btn', text: 'Copy report', onclick: function () {
    ta.value = buildReport(); ta.select();
    var done = function () { b2.textContent = 'Copied'; setTimeout(function () { b2.textContent = 'Copy report'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(done, function () { try { document.execCommand('copy'); done(); } catch (e) {} }); }
    else { try { document.execCommand('copy'); done(); } catch (e) {} }
  } });
  var b3 = h('button', { class: 'btn', text: 'Download .txt', onclick: function () {
    var txt = buildReport(); ta.value = txt;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
    a.download = 'week' + D.num + '_report.txt'; document.body.appendChild(a); a.click(); a.remove();
  } });
  rep.appendChild(h('div', { class: 'row' }, [b1, b2, b3]));
  rep.appendChild(ta);
  p.appendChild(rep);
  updateLab();
}
function quizTally() {
  var correct = 0, answered = 0;
  D.quiz.forEach(function (q, i) { var a = S.quiz[i]; if (a !== undefined && a !== null) { answered++; if (a === q.answer) { correct++; } } });
  return { correct: correct, answered: answered, total: D.quiz.length };
}
function buildReport() {
  var L = [], s = labScore(), q = quizTally();
  var max = D.lab.tasks.filter(function (t) { return !t.bonus; }).reduce(function (a, t) { return a + t.points; }, 0);
  var lec = D.lecture.filter(function (_s, i) { return S.lecDone[i]; }).length;
  L.push('Course: ' + D.course_title);
  L.push('Week ' + D.num + ': ' + D.title);
  L.push('Name: ' + (S.name || '(not entered)'));
  L.push('Generated: ' + new Date().toLocaleString());
  L.push('');
  L.push('Lecture sections marked complete: ' + lec + ' of ' + D.lecture.length);
  L.push('Lab score (browser autograder): ' + s.score + ' of ' + max + (s.bonus ? ', bonus ' + s.bonus : ''));
  L.push('Quiz: ' + q.correct + ' correct, ' + q.answered + ' answered, ' + q.total + ' questions');
  L.push('');
  D.lab.tasks.forEach(function (t, i) {
    var r = S.lab[t.id];
    L.push('==== ' + (t.bonus ? 'Bonus' : 'Task ' + (i + 1)) + ': ' + t.title + ' (' + (r ? r.passed + '/' + r.total + ' tests' : 'not checked') + ') ====');
    L.push(S.code['lab_' + t.id] !== undefined ? S.code['lab_' + t.id] : t.starter);
    L.push('');
  });
  return L.join('\n');
}

/* ---------- quiz ---------- */
function updateQuiz() {
  var q = quizTally();
  var el = document.getElementById('quizscore');
  if (el) { el.textContent = q.correct + ' correct of ' + q.answered + ' answered, ' + q.total + ' questions'; }
  tiles.quiz.textContent = q.correct + '/' + q.total;
}
function renderQuiz() {
  var p = document.getElementById('panel-quiz');
  p.innerHTML = '';
  p.appendChild(h('div', { class: 'card', html: D.quiz_intro_html }));
  p.appendChild(h('div', { class: 'row' }, [
    h('strong', { text: 'Score: ' }), h('span', { id: 'quizscore', class: 'badge info' }),
    h('span', { style: 'flex:1' }),
    h('button', { class: 'btn', text: 'Reset quiz', onclick: function () {
      if (!confirm('Clear all quiz answers?')) { return; } S.quiz = {}; save(); renderQuiz();
    } })
  ]));
  D.quiz.forEach(function (q, i) {
    var card = h('div', { class: 'card' });
    card.appendChild(h('p', { class: 'meta', text: 'Question ' + (i + 1) + ' of ' + D.quiz.length }));
    card.appendChild(mcq({ cls: 'qbox', q: q.q, options: q.options, answer: q.answer, why: q.why, saved: S.quiz[i], onAnswer: function (k) { S.quiz[i] = k; save(); updateQuiz(); } }));
    p.appendChild(card);
  });
  updateQuiz();
}

/* ---------- shell ---------- */
document.getElementById('kicker').textContent = D.course_title + ', Week ' + D.num;
document.getElementById('title').textContent = D.title;
document.title = D.course_title + ' Week ' + D.num + ' ' + D.title;
var chips = document.getElementById('chips');
[D.lecture_minutes + ' min lecture', D.lab_minutes + ' min lab', D.quiz.length + ' quiz questions'].forEach(function (t) { chips.appendChild(h('li', { text: t })); });
var tabs = [['overview', 'Overview'], ['lecture', 'Lecture'], ['lab', 'Lab'], ['quiz', 'Quiz']];
var tl = document.getElementById('tablist');
tabs.forEach(function (t) {
  var b = h('button', { role: 'tab', id: 'tab-' + t[0], 'aria-controls': 'panel-' + t[0], 'aria-selected': 'false', text: t[1] });
  b.addEventListener('click', function () { show(t[0]); });
  tl.appendChild(b);
});
function show(name) {
  tabs.forEach(function (t) {
    document.getElementById('panel-' + t[0]).hidden = (t[0] !== name);
    document.getElementById('tab-' + t[0]).setAttribute('aria-selected', t[0] === name ? 'true' : 'false');
  });
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
  window.scrollTo(0, 0);
  document.querySelectorAll('#panel-' + name + ' textarea.code').forEach(function (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 4, 640) + 'px'; });
}
renderOverview(); renderLecture(); renderLab(); renderQuiz();
var start = (location.hash || '').replace('#', '');
show(tabs.some(function (t) { return t[0] === start; }) ? start : 'overview');
})();
</script>
</body>
