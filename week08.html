<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python for Engineers Week 8 Debugging, Testing, and Midterm Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f0; --card:#ffffff; --ink:#1a1f24; --mute:#59636e; --line:#d9d6cb;
  --accent:#0a5aa0; --accent-ink:#ffffff; --accent-soft:#e4eef8;
  --ok:#17692f; --ok-bg:#e5f3e9; --bad:#a82217; --bad-bg:#fcebe8; --warn:#8a5a00; --warn-bg:#fdf3dc;
  --code-bg:#f0eee6; --out-bg:#e6edf6; --out-ink:#0a2a66;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151a; --card:#192028; --ink:#e7ebef; --mute:#9aa6b2; --line:#2c3641;
    --accent:#5eaeea; --accent-ink:#0b1219; --accent-soft:#17283a;
    --ok:#6fd08c; --ok-bg:#15301f; --bad:#ff8a7d; --bad-bg:#3a1b18; --warn:#f0c060; --warn-bg:#33290f;
    --code-bg:#10161c; --out-bg:#e6edf6; --out-ink:#0a2a66;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:50}
header.top{padding:28px 0 12px}
.kicker{font-size:13px;color:var(--mute);letter-spacing:.02em;margin:0 0 4px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.2;margin:0 0 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:13px;border:1px solid var(--line);background:var(--card);padding:2px 10px;border-radius:999px;color:var(--mute)}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--mute);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.statusbar{position:sticky;top:46px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:6px 12px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.statusbar .grow{flex:1}
main{padding:16px 0 80px}
.panel[hidden]{display:none}
h2{font-size:22px;margin:24px 0 8px;font-weight:600}
h3{font-size:18px;margin:0 0 6px;font-weight:600}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:22px}
li{margin:2px 0}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
.card .meta{font-size:13px;color:var(--mute);margin:0 0 8px}
.hook{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .big{font-size:24px;font-weight:600;font-family:var(--mono)}
.tile .lbl{font-size:13px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.bar>span{display:block;height:100%;background:var(--accent);width:0}
button.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.cell{margin:12px 0}
textarea.code{display:block;width:100%;font-family:var(--mono);font-size:14px;line-height:1.5;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;resize:vertical;tab-size:4;white-space:pre;overflow:auto;min-height:60px}
.stdin{margin-top:6px}
.stdin label{font-size:13px;color:var(--mute);display:block}
textarea.stdin-box{width:100%;font-family:var(--mono);font-size:13px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:48px}
.out{margin-top:8px}
pre.stdout{margin:0;background:var(--out-bg);color:var(--out-ink);font-family:var(--mono);font-size:13.5px;padding:10px 12px;border-radius:6px;border:1px solid #b9c8dc;overflow:auto;white-space:pre-wrap;word-break:break-word}
.err{margin-top:8px;border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:8px 12px;font-size:14px}
.err pre{margin:4px 0 0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;color:inherit}
.out img{max-width:100%;height:auto;background:#fff;border-radius:6px;margin-top:8px;border:1px solid var(--line)}
.tests{list-style:none;margin:8px 0 0;padding:0}
.tests li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.badge{font-family:var(--mono);font-size:12px;font-weight:500;padding:1px 8px;border-radius:4px;flex:none}
.badge.pass{background:var(--ok-bg);color:var(--ok)}
.badge.fail{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.hint{margin:8px 0;padding:8px 12px;background:var(--warn-bg);color:var(--ink);border-radius:6px;font-size:14px;border:1px solid var(--line)}
.q{margin:0 0 6px;font-weight:500}
.q p{margin:0 0 8px}
.q pre,.card pre{background:var(--code-bg);padding:8px 12px;border-radius:6px;overflow:auto;font-family:var(--mono);font-size:13.5px;font-weight:400;margin:0 0 10px}
.q pre code,.card pre code{background:none;padding:0}
.opts{list-style:none;padding:0;margin:0}
.opts button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:var(--ok-bg)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opts button:disabled{cursor:default}
.why{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:6px;background:var(--accent-soft)}
.checkq{margin:14px 0 4px;padding:12px;border:1px dashed var(--line);border-radius:8px}
.done-row{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.field input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-width:240px}
textarea.report{width:100%;min-height:200px;font-family:var(--mono);font-size:12.5px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px}
table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code-bg)}
.small{font-size:13px;color:var(--mute)}
@media (max-width:600px){ .field input{min-width:0;width:100%} .statusbar{top:44px} }
</style>
</head>

<script id="data" type="application/json">{"course_id": "pyeng", "course_title": "Python for Engineers", "pyodide_base": "https://cdn.jsdelivr.net/pyodide/v0.27.8/full/", "num": 8, "title": "Debugging, Testing, and Midterm Review", "hook": "Every program you write will contain bugs, and professional engineers spend more time finding them than writing the first draft. The difference between a frustrating hour and a five minute fix is a process: reproduce the problem, shrink it, form a guess, test the guess. This week you review weeks 1 through 7, learn that process, and use it on a set of broken programs before the midterm.", "objectives": ["describe the stages of a debugging process and apply them to a failing program", "tell syntax errors, runtime errors, and logic errors apart", "find off-by-one, operator precedence, boundary, and accumulator bugs", "write test cases that include normal values, edge values, and invalid values", "review the major ideas from weeks 1 through 7 for the midterm"], "summary": "<ul><li>Debugging process: reproduce, shrink, predict, observe, change one thing, then add a test.<\/li><li>Read a traceback from the last line up. Syntax and runtime errors stop the program. Logic errors give wrong answers silently.<\/li><li>Common logic bugs: off-by-one ranges, missing parentheses, wrong comparison operator, reset accumulators, mutating a list while looping.<\/li><li>Test cases come from the problem, not from your code. Include normal, edge, and invalid values.<\/li><li>Use <code>assert<\/code> for quick tests and a loop over a table of cases for many tests.<\/li><li>Midterm: weeks 1 through 7. Re-run lecture cells, redo labs without notes, and explain every wrong answer.<\/li><\/ul>", "lecture": [{"title": "Midterm overview and strategy", "minutes": 10, "html": "<p>The midterm quiz in this module covers weeks 1 through 7. It has 20 questions. Many ask you to predict what code prints. The fastest way to prepare is to run small pieces of code and compare the result with your prediction.<\/p>\n<p>Study plan:<\/p>\n<ul><li>Re-run the lecture cells from each week and change the values.<\/li><li>Redo one lab task from weeks 3, 4, 6, and 7 without looking at your old code.<\/li><li>For every wrong answer on the weekly quizzes, write one sentence about why the correct answer is correct.<\/li><\/ul>", "cells": [{"code": "topics = {\n    1: \"expressions, variables, Ohm's law\",\n    2: \"strings, f-strings, input, conversions\",\n    3: \"booleans and if / elif / else\",\n    4: \"for and while loops\",\n    5: \"functions, scope, assert, modules\",\n    6: \"lists, tuples, dictionaries\",\n    7: \"files, CSV, try / except\",\n}\nfor week, topic in topics.items():\n    print(week, topic)\n", "stdin": null, "note": null}]}, {"title": "Review: weeks 1 and 2", "minutes": 15, "html": "<p>Core ideas: arithmetic operators and precedence, variables, floats and rounding, the <code>math<\/code> module, strings and slicing, f-strings, <code>input()<\/code>, and conversions with <code>int<\/code>, <code>float<\/code>, and <code>str<\/code>.<\/p>\n<p>The most common mistakes: using <code>^<\/code> for powers, forgetting that <code>input()<\/code> returns text, and rounding before the final step of a calculation.<\/p>", "cells": [{"code": "v = 12\nr = 8\ni = v / r\nprint(f\"I = {i:.2f} A, P = {v * i:.1f} W\")\n", "stdin": null, "note": "Predict both numbers first."}], "check": {"q": "What does <code>\"Sensor-7\"[:6]<\/code> return?", "options": ["<code>Sensor-<\/code>", "<code>ensor-7<\/code>", "<code>Sensor-7<\/code>", "<code>Sensor<\/code>"], "answer": 3, "why": "The slice stops before index 6. Indexes 0 through 5 are the letters of Sensor."}}, {"title": "Review: weeks 3 and 4", "minutes": 10, "html": "<p>Core ideas: comparisons, <code>and<\/code>, <code>or<\/code>, <code>not<\/code>, <code>if<\/code> / <code>elif<\/code> / <code>else<\/code>, tolerance checks, <code>for<\/code> with <code>range<\/code>, <code>while<\/code> loops, accumulators, <code>break<\/code>, <code>continue<\/code>, and search loops.<\/p>\n<p>The most common mistakes: <code>=<\/code> where <code>==<\/code> belongs, branches in the wrong order, <code>range<\/code> stopping one short, and an accumulator that resets inside the loop.<\/p>", "cells": [{"code": "temps = [20.5, 21.0, 19.8, 22.3, 21.7]\ncount = 0\nfor t in temps:\n    if t > 21:\n        count += 1\nprint(count)\n", "stdin": null, "note": "Count the readings above 21 by hand, then run the cell."}], "check": {"q": "Which loop fits \"repeat until the capacitor voltage reaches 3 V\"?", "options": ["A nested <code>for<\/code> loop", "A <code>while<\/code> loop", "A <code>for<\/code> loop with <code>range(3)<\/code>", "An <code>if<\/code> statement"], "answer": 1, "why": "The number of passes is unknown, so a <code>while<\/code> loop with a condition on the voltage fits."}}, {"title": "Review: weeks 5 through 7", "minutes": 10, "html": "<p>Core ideas: functions, <code>return<\/code> versus <code>print<\/code>, defaults and keywords, scope, docstrings, <code>assert<\/code>, modules, lists and slicing, comprehensions, tuples, dictionaries, file modes, CSV parsing, and <code>try<\/code> / <code>except<\/code>.<\/p>\n<p>The most common mistakes: printing instead of returning, <code>b = a<\/code> for lists, reading a dictionary key that does not exist, opening a file with mode <code>\"w\"<\/code> when you meant <code>\"a\"<\/code>, and a bare <code>except:<\/code>.<\/p>", "cells": [{"code": "def to_float(text):\n    try:\n        return float(text)\n    except ValueError:\n        return None\n\nrows = [\"21.5\", \"N/A\", \"22.0\"]\nvalues = [to_float(r) for r in rows if to_float(r) is not None]\nprint(values)\n", "stdin": null, "note": null}], "check": {"q": "A function ends with <code>print(total)<\/code> and no <code>return<\/code>. What does <code>x = f()<\/code> store?", "options": ["The text <code>total<\/code>", "An empty string", "The value of <code>total<\/code>", "<code>None<\/code>"], "answer": 3, "why": "Without a <code>return<\/code>, a function gives back <code>None<\/code>."}}, {"title": "The debugging process", "minutes": 15, "html": "<p>A bug is a difference between what you expect and what happens. A reliable process:<\/p>\n<ol><li><strong>Reproduce.<\/strong> Find an input that fails every time.<\/li><li><strong>Shrink.<\/strong> Reduce the input and the code until the smallest failing example remains.<\/li><li><strong>Predict.<\/strong> Work out by hand what the correct answer should be.<\/li><li><strong>Observe.<\/strong> Print values at key points to see where the program leaves your prediction.<\/li><li><strong>Hypothesize and change one thing.<\/strong> Change one line, rerun, and compare.<\/li><li><strong>Add a test.<\/strong> Keep an <code>assert<\/code> that would catch the bug if it came back.<\/li><\/ol>\n<p>Read the <strong>traceback<\/strong> first. The last line names the error and the line above it gives the location. Many bugs have no traceback; those are logic errors, and they need steps 3 and 4.<\/p>", "cells": [{"code": "def average(values):\n    total = 0\n    for v in values:\n        total += v\n        print(\"DEBUG\", v, total)\n    return total / len(values)\n\nprint(average([2, 4, 9]))\n", "stdin": null, "note": "Print debugging shows the running total at each step. Remove the debug line when you finish."}], "check": {"q": "What do you do first with a bug you cannot yet explain?", "options": ["Change several lines at once to see what helps", "Find a small input that fails every time", "Rewrite the whole program", "Add random print statements everywhere"], "answer": 1, "why": "A short, repeatable failure gives you something you can test one change at a time."}}, {"title": "Common bug types", "minutes": 20, "html": "<p>Three families:<\/p>\n<ul><li><strong>Syntax error:<\/strong> the code breaks a grammar rule. Python refuses to run it. Fix the line it points to.<\/li><li><strong>Runtime error:<\/strong> the code runs and then fails: <code>NameError<\/code>, <code>TypeError<\/code>, <code>ValueError<\/code>, <code>IndexError<\/code>, <code>KeyError<\/code>, <code>ZeroDivisionError<\/code>.<\/li><li><strong>Logic error:<\/strong> the code runs to the end and gives the wrong answer. No message. Test with known answers.<\/li><\/ul>\n<p>Patterns that cause logic errors: off-by-one in a <code>range<\/code>, missing parentheses in a formula, a comparison that should be <code>&gt;=<\/code>, an accumulator set inside the loop, and removing items from a list while looping over it.<\/p>", "cells": [{"code": "total = 0\nfor i in range(1, 5):\n    total += i\nprint(total)\n", "stdin": null, "note": "The goal is 1 + 2 + 3 + 4 + 5 = 15. The loop stops before 5. Fix the range and rerun."}, {"code": "print(1 + 2 + 3 / 3)\nprint((1 + 2 + 3) / 3)\n", "stdin": null, "note": "Missing parentheses changed the formula."}, {"code": "values = [1, -999, -999, 2]\nfor v in values:\n    if v == -999:\n        values.remove(v)\nprint(values)\n", "stdin": null, "note": "The second -999 survives. Removing items from a list while looping skips items. Build a new list instead."}], "check": {"q": "Which kind of bug runs without an error message but gives the wrong answer?", "options": ["A <code>FileNotFoundError<\/code>", "A <code>NameError<\/code>", "A syntax error", "A logic error"], "answer": 3, "why": "Syntax and runtime errors stop the program with a message. Logic errors do not, so you find them by testing."}}, {"title": "Testing with cases", "minutes": 20, "html": "<p>A test case is an input and the answer you expect. Good tests cover three groups:<\/p>\n<ul><li><strong>Normal<\/strong> values that the program should handle<\/li><li><strong>Edge<\/strong> values at the boundaries (zero, one item, the exact limit)<\/li><li><strong>Invalid<\/strong> values (empty list, text where a number belongs)<\/li><\/ul>\n<p>Write the expected answer from the problem, not from running the code. Then run all cases in a loop and print a clear pass or fail for each. A small table of cases is easy to extend.<\/p>", "cells": [{"code": "def deadband(value, width):\n    \"\"\"Return 0 when abs(value) is below width, else value.\"\"\"\n    if abs(value) < width:\n        return 0\n    return value\n\ncases = [\n    (0.2, 0.5, 0),\n    (-0.4, 0.5, 0),\n    (0.5, 0.5, 0.5),\n    (-0.5, 0.5, -0.5),\n    (3.0, 0.5, 3.0),\n]\nfor value, width, expected in cases:\n    result = deadband(value, width)\n    status = \"ok\" if result == expected else \"FAIL\"\n    print(value, width, result, expected, status)\n", "stdin": null, "note": "Each case is value, width, and expected. Change a comparison in the function to see which case fails."}], "check": {"q": "Where should the expected answer in a test come from?", "options": ["A guess about what Python prints", "The problem, worked out by hand or from a trusted reference", "The output of the function you are testing", "The first value that makes the test pass"], "answer": 1, "why": "If you copy the answer from your own code, the test repeats its bugs."}}, {"title": "Debug practice: four broken functions", "minutes": 30, "html": "<p>Each cell contains a function with one bug and a test that fails. Predict the bug from the test message, fix the function, and rerun until the test passes. Work in order of difficulty.<\/p>\n<p>After each fix, add one more <code>assert<\/code> with a different input.<\/p>", "cells": [{"code": "def mean_of_two(a, b):\n    return a + b / 2\n\nassert mean_of_two(4, 8) == 6, \"mean_of_two(4, 8) should be 6\"\n", "stdin": null, "note": "Bug 1. Hint: precedence."}, {"code": "def is_even(n):\n    return n % 2 == 1\n\nassert is_even(4) is True, \"4 is even\"\n", "stdin": null, "note": "Bug 2. Hint: look at the comparison."}, {"code": "def last_item(values):\n    return values[len(values)]\n\nprint(last_item([3, 5, 9]))\n", "stdin": null, "note": "Bug 3. This one raises an error. Read the last line of the message and the line it points to."}, {"code": "def to_celsius(f):\n    return f - 32 * 5 / 9\n\nassert abs(to_celsius(212) - 100) < 1e-9, \"212 F should be 100 C\"\n", "stdin": null, "note": "Bug 4. Hint: write the formula on paper first and compare."}]}], "lecture_minutes": 130, "lab": {"summary": "A debug-the-bug challenge: fix six broken functions using tests, then add edge-case asserts to a function you write.", "intro_html": "<p>Every task gives you code that contains one or two bugs. The function names and parameters are correct. Read the description, predict what the right answer should be, find the bug, and fix it. The checks include edge cases, so a fix that only handles the sample is not enough.<\/p>\n<p>Change as little as you can. A small, targeted fix shows you found the actual bug.<\/p>", "tasks": [{"id": "t1", "title": "Off-by-one", "points": 15, "minutes": 20, "bonus": false, "prompt_html": "<p><code>sum_to(n)<\/code> should return 1 + 2 + ... + n. For <code>n = 0<\/code> it should return 0. Find and fix the bug.<\/p>", "starter": "def sum_to(n):\n    total = 0\n    for i in range(1, n):\n        total += i\n    return total\n\nprint(sum_to(5))\n", "hint_html": "<p>Predict <code>sum_to(5)<\/code>: it should be 15. The loop stops one number early because <code>range<\/code> excludes the stop value.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["sum_to(5) is 15", "sum_to(5) == 15", "The loop should include n."], ["sum_to(1) is 1", "sum_to(1) == 1", "Check the smallest positive input."], ["sum_to(0) is 0", "sum_to(0) == 0", "An empty loop should give 0."], ["sum_to(100) is 5050", "sum_to(100) == 5050", "Use range(1, n + 1)."]]}}, {"id": "t2", "title": "Precedence", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Two formulas return wrong answers. <code>parallel(r1, r2)<\/code> should return the parallel resistance of two resistors. <code>average3(a, b, c)<\/code> should return the mean of three numbers. Fix both.<\/p>", "starter": "def parallel(r1, r2):\n    return r1 * r2 / r1 + r2\n\ndef average3(a, b, c):\n    return a + b + c / 3\n\nprint(parallel(100, 100), average3(3, 6, 9))\n", "hint_html": "<p>Work each by hand with simple numbers: two 100 ohm resistors give 50 ohms, and the mean of 3, 6, and 9 is 6. Compare with what each function returns, and look at the order of operations.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["parallel(100, 100) is 50", "approx(parallel(100, 100), 50)", "The denominator is r1 + r2. Add parentheses."], ["parallel(220, 330) is 132", "approx(parallel(220, 330), 132)", "Test a second pair of values."], ["average3(3, 6, 9) is 6", "approx(average3(3, 6, 9), 6)", "The sum must be in parentheses before the division."], ["average3(0, 0, 3) is 1", "approx(average3(0, 0, 3), 1)", "Divide the whole sum by 3."]]}}, {"id": "t3", "title": "Boundary conditions", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p><code>classify(temp_c)<\/code> should return:<\/p>\n<ul><li><code>\"COLD\"<\/code> below 10<\/li><li><code>\"COOL\"<\/code> from 10 up to but not including 25<\/li><li><code>\"WARM\"<\/code> from 25 up to but not including 35<\/li><li><code>\"HOT\"<\/code> at 35 or more<\/li><\/ul>\n<p>The code has more than one bug. Fix them.<\/p>", "starter": "def classify(temp_c):\n    if temp_c > 10:\n        return \"COOL\"\n    elif temp_c > 25:\n        return \"WARM\"\n    elif temp_c > 35:\n        return \"HOT\"\n    return \"COLD\"\n\nprint(classify(5), classify(30))\n", "hint_html": "<p>Two things are wrong: the order of the branches (the first test catches almost everything) and the use of <code>&gt;<\/code> where <code>&gt;=<\/code> belongs. Start with the highest threshold.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["5 is COLD", "classify(5) == 'COLD'", "Values below 10 are COLD."], ["10 is COOL", "classify(10) == 'COOL'", "The lower limit is included: use >=."], ["24.9 is COOL", "classify(24.9) == 'COOL'", "The upper limit of COOL is below 25."], ["25 is WARM", "classify(25) == 'WARM'", "25 is included in WARM."], ["34 is WARM", "classify(34) == 'WARM'", "Check the order of your tests."], ["35 and 40 are HOT", "classify(35) == 'HOT' and classify(40) == 'HOT'", "Test the highest threshold first."]]}}, {"id": "t4", "title": "Changing a list while looping", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p><code>remove_bad(values)<\/code> should return a <strong>new<\/strong> list without any <code>-999<\/code> values and leave the input list unchanged. The current version misses values and changes the input. Fix it.<\/p>", "starter": "def remove_bad(values):\n    for v in values:\n        if v == -999:\n            values.remove(v)\n    return values\n\nprint(remove_bad([1, -999, -999, 2]))\n", "hint_html": "<p>Do not remove from the list you are looping over. Build a new list and append the values you want to keep.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["two bad values in a row", "remove_bad([1, -999, -999, 2]) == [1, 2]", "Build a new list instead of removing during the loop."], ["no bad values", "remove_bad([3, 4]) == [3, 4]", "Keep every good value, in order."], ["all bad values", "remove_bad([-999, -999]) == []", "The result can be empty."], ["input list is not changed", "(lambda data: (remove_bad(data), data)[1])([1, -999, 2]) == [1, -999, 2]", "Return a new list and leave the input list alone."]]}}, {"id": "t5", "title": "Accumulator and starting value bugs", "points": 20, "minutes": 30, "bonus": false, "prompt_html": "<p>Two functions have bugs:<\/p>\n<ul><li><code>highest(values)<\/code> returns the largest value, or <code>None<\/code> for an empty list. It fails when all values are negative.<\/li><li><code>count_above(values, limit)<\/code> returns how many values are greater than <code>limit<\/code>. It always returns 0 or 1.<\/li><\/ul>", "starter": "def highest(values):\n    best = 0\n    for v in values:\n        if v > best:\n            best = v\n    return best\n\ndef count_above(values, limit):\n    for v in values:\n        count = 0\n        if v > limit:\n            count += 1\n    return count\n\nprint(highest([-5, -2, -9]), count_above([1, 5, 7, 3], 4))\n", "hint_html": "<p>For <code>highest<\/code>, start with <code>None<\/code> and replace it on the first pass, or start with the first item. For <code>count_above<\/code>, move <code>count = 0<\/code> above the loop. Also check what <code>count_above<\/code> returns for an empty list.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["highest of negatives", "highest([-5, -2, -9]) == -2", "A starting value of 0 is larger than every negative number."], ["highest of positives", "highest([3, 8, 1]) == 8", "The function must still work for normal data."], ["highest of an empty list is None", "highest([]) is None", "Return None when there are no values."], ["count_above counts all matches", "count_above([1, 5, 7, 3], 4) == 2", "Set count = 0 before the loop."], ["count_above with no matches", "count_above([1, 2], 10) == 0", "Return 0 when nothing is above the limit."], ["count_above uses strict greater than", "count_above([4, 4, 5], 4) == 1", "Values equal to the limit do not count."]]}}, {"id": "t6", "title": "Parse a messy line", "points": 20, "minutes": 25, "bonus": false, "prompt_html": "<p><code>parse_reading(line)<\/code> should turn a line like <code>\"T1:21.5\"<\/code> into the tuple <code>(\"T1\", 21.5)<\/code>. Spaces around the pieces should be ignored: <code>\" T2 : 19 \"<\/code> gives <code>(\"T2\", 19.0)<\/code>. A line with no colon, or with a value that is not a number, should return <code>None<\/code>. The current version crashes or returns text instead of a number.<\/p>", "starter": "def parse_reading(line):\n    parts = line.split(\":\")\n    return parts[0], parts[1]\n\nprint(parse_reading(\"T1:21.5\"))\n", "hint_html": "<p>Strip each piece. Convert the second piece with <code>float<\/code>. Wrap the conversion in  "options": ["6", "3", "8", "10"], "answer": 0, "why": "<code>7 // 2<\/code> is 3 and <code>7 % 2<\/code> is 1. Multiplication runs first: 1 * 3 is 3. Then 3 + 3 is 6."}, {"q": "What does <code>f\"{1234.5678:.2f}\"<\/code> produce?", "options": ["1234.6", "1234.57", "1234.5678", "1,234.57"], "answer": 1, "why": "<code>.2f<\/code> rounds to two decimal places and adds no separator."}, {"q": "A 24 V supply drives an 8 ohm resistor. What is the current?", "options": ["16 A", "192 A", "3 A", "0.33 A"], "answer": 2, "why": "Ohm's law: I = V / R = 24 / 8 = 3 A."}, {"q": "What type does <code>\"Sensor-7\".split(\"-\")[1]<\/code> produce?", "options": ["<code>int<\/code>", "<code>list<\/code>", "<code>float<\/code>", "<code>str<\/code>"], "answer": 3, "why": "<code>split<\/code> returns text pieces. The piece <code>\"7\"<\/code> is a string until you convert it."}, {"q": "<pre><code>x = 15\nif x &gt; 20:\n    print(&quot;A&quot;)\nelif x &gt; 10:\n    print(&quot;B&quot;)\nif x &gt; 5:\n    print(&quot;C&quot;)<\/code><\/pre>\n<p>What prints?<\/p>", "options": ["<code>B<\/code> then <code>C<\/code>", "<code>A<\/code>, <code>B<\/code>, then <code>C<\/code>", "<code>B<\/code> only", "<code>C<\/code> only"], "answer": 0, "why": "The first ladder prints B because 15 is above 10. The second <code>if<\/code> is separate and prints C because 15 is above 5."}, {"q": "How many numbers does <code>range(1, 10)<\/code> produce?", "options": ["11", "9", "1", "10"], "answer": 1, "why": "It produces 1 through 9. The stop value is excluded."}, {"q": "<pre><code>x = 1\nwhile x &lt; 20:\n    x = x * 2<\/code><\/pre>\n<p>What is <code>x<\/code> after the loop?<\/p>", "options": ["20", "16", "32", "40"], "answer": 2, "why": "x takes the values 1, 2, 4, 8, 16, and 32. At 32 the condition is False."}, {"q": "<pre><code>def f(a, b=3):\n    return a ** b<\/code><\/pre>\n<p>What is <code>f(2)<\/code>?<\/p>", "options": ["5", "9", "6", "8"], "answer": 3, "why": "<code>b<\/code> defaults to 3, so 2 ** 3 is 8."}, {"q": "A function assigns <code>result = 5<\/code> inside its body. What happens when code outside the function prints <code>result<\/code>?", "options": ["A <code>NameError<\/code>", "It prints 0", "It prints 5", "It prints <code>None<\/code>"], "answer": 0, "why": "Names created inside a function are local and do not exist outside it."}, {"q": "What is <code>[5, 6, 7, 8][1:]<\/code>?", "options": ["<code>[6]<\/code>", "<code>[6, 7, 8]<\/code>", "<code>[5, 6, 7]<\/code>", "<code>[5, 6, 7, 8]<\/code>"], "answer": 1, "why": "A slice from index 1 with no stop runs to the end of the list."}, {"q": "What does <code>{\"A\": 1}.get(\"B\", 0)<\/code> return?", "options": ["<code>None<\/code>", "1", "0", "A <code>KeyError<\/code>"], "answer": 2, "why": "<code>get<\/code> returns the second argument when the key is missing."}, {"q": "What does <code>[n for n in range(10) if n % 3 == 0]<\/code> produce?", "options": ["<code>[0, 3, 6]<\/code>", "<code>[3, 6, 9]<\/code>", "<code>[1, 4, 7]<\/code>", "<code>[0, 3, 6, 9]<\/code>"], "answer": 3, "why": "The numbers from 0 to 9 that divide evenly by 3 are 0, 3, 6, and 9."}, {"q": "What happens with <code>t = (1, 2)<\/code> followed by <code>t[0] = 9<\/code>?", "options": ["A <code>TypeError<\/code>", "A <code>KeyError<\/code>", "<code>t<\/code> becomes <code>(9, 2)<\/code>", "<code>t<\/code> becomes <code>[9, 2]<\/code>"], "answer": 0, "why": "Tuples cannot be changed after creation."}, {"q": "What does <code>0.1 * 3 == 0.3<\/code> evaluate to?", "options": ["<code>True<\/code>", "<code>False<\/code>", "An error", "<code>0.3<\/code>"], "answer": 1, "why": "0.1 * 3 gives 0.30000000000000004 in binary floating point, which is not equal to 0.3."}, {"q": "Which file mode adds text to the end of an existing file?", "options": ["<code>\"w\"<\/code>", "<code>\"r\"<\/code>", "<code>\"a\"<\/code>", "<code>\"x\"<\/code>"], "answer": 2, "why": "<code>\"a\"<\/code> appends. <code>\"w\"<\/code> erases the file first."}, {"q": "<pre> actice.<\/p>"}</script>
<script id="harness" type="text/x-python">import sys, io, os, json, ast, base64, builtins, traceback, contextlib, math, random

os.environ.setdefault("MPLBACKEND", "Agg")
import importlib
if "" not in sys.path:
    sys.path.insert(0, "")

_OUT_CAP = 20000
_LECTURE_NS = {"__name__": "__main__"}


class _Capped(io.StringIO):
    def write(self, s):
        if self.tell() > _OUT_CAP:
            raise RuntimeError("Output limit reached. Your code printed too much text.")
        return super().write(s)


def approx(a, b, rel=1e-6, abs_=1e-9):
    try:
        if "numpy" in sys.modules:
            import numpy as _np
            if isinstance(a, _np.ndarray) or isinstance(b, _np.ndarray):
                return bool(_np.allclose(a, b, rtol=rel, atol=abs_))
        if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
            return len(a) == len(b) and all(approx(x, y, rel, abs_) for x, y in zip(a, b))
        return abs(float(a) - float(b)) <= max(abs_, rel * abs(float(b)))
    except Exception:
        return False


def uses_node(src, *names):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    wanted = tuple(getattr(ast, n) for n in names)
    return any(isinstance(n, wanted) for n in ast.walk(tree))


def calls_name(src, name):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    for n in ast.walk(tree):
        if isinstance(n, ast.Call):
            f = n.func
            if isinstance(f, ast.Name) and f.id == name:
                return True
            if isinstance(f, ast.Attribute) and f.attr == name:
                return True
    return False


def line_has(src, target, *words):
    """True when an assignment to `target` has every word on its right side."""
    for line in src.splitlines():
        s = line.strip()
        if s.startswith("#") or "=" not in s:
            continue
        left, _, right = s.partition("=")
        if left.strip() == target and all(w in right for w in words):
            return True
    return False


def run_with(src, inputs=(), ns=None):
    """Run student source with scripted input() values; return what it printed."""
    queue = list(inputs)
    old = builtins.input

    def _fake(prompt=""):
        print(prompt, end="")
        if not queue:
            raise EOFError("input() called more times than expected")
        v = queue.pop(0)
        print(v)
        return v

    buf = io.StringIO()
    builtins.input = _fake
    try:
        with contextlib.redirect_stdout(buf):
            exec(compile(src, "<your code>", "exec"), ns if ns is not None else {"__name__": "__main__"})
    finally:
        builtins.input = old
    return buf.getvalue()


def rerun(src, **over):
    """Execute student source again with top-level assignments replaced by the given constants.
    Returns the resulting namespace. Output is discarded."""
    tree = ast.parse(src)
    for node in tree.body:
        if (isinstance(node, ast.Assign) and len(node.targets) == 1
                and isinstance(node.targets[0], ast.Name) and node.targets[0].id in over):
            node.value = ast.Constant(over[node.targets[0].id])
    ast.fix_missing_locations(tree)
    ns = {"__name__": "__main__"}
    with contextlib.redirect_stdout(io.StringIO()):
        exec(compile(tree, "<your code>", "exec"), ns)
    return ns


def count_defs(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.FunctionDef) for n in ast.walk(tree))


def count_classes(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.ClassDef) for n in ast.walk(tree))


def _format_error(exc, code):
    lines = code.split("\n")
    if isinstance(exc, SyntaxError):
        ln = exc.lineno
        msg = "SyntaxError: " + str(exc.msg)
        if ln and 1 <= ln <= len(lines):
            msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
        return msg
    tb = traceback.TracebackException.from_exception(exc)
    ln = None
    for fs in tb.stack:
        if fs.filename == "<your code>":
            ln = fs.lineno
    msg = "".join(tb.format_exception_only()).strip()
    if ln and 1 <= ln <= len(lines):
        msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
    return msg


def _make_input(stdin_lines, out):
    queue = list(stdin_lines)

    def _input(prompt=""):
        out.write(str(prompt))
        if not queue:
            raise EOFError("input() ran out of lines. Type one value per line in the Input box under the code.")
        val = queue.pop(0)
        out.write(val + "\n")
        return val

    return _input


def _exec_code(code, ns, out):
    tree = ast.parse(code, "<your code>", "exec")
    last = None
    if tree.body and isinstance(tree.body[-1], ast.Expr):
        last = ast.Expression(tree.body.pop().value)
    exec(compile(tree, "<your code>", "exec"), ns)
    if last is not None:
        val = eval(compile(last, "<your code>", "eval"), ns)
        if val is not None:
            out.write(repr(val) + "\n")


def _collect_images():
    imgs = []
    if "matplotlib.pyplot" in sys.modules:
        import matplotlib.pyplot as plt
        for num in plt.get_fignums():
            fig = plt.figure(num)
            buf = io.BytesIO()
            fig.savefig(buf, format="png", dpi=100, bbox_inches="tight")
            imgs.append(base64.b64encode(buf.getvalue()).decode("ascii"))
        plt.close("all")
    return imgs


def reset_lecture():
    _LECTURE_NS.clear()
    _LECTURE_NS["__name__"] = "__main__"


def run_cell(req_json):
    req = json.loads(req_json)
    code = req.get("code", "")
    mode = req.get("mode", "fresh")
    stdin_lines = req.get("stdin") or []
    tests = req.get("tests")
    ns = _LECTURE_NS if mode == "lecture" else {"__name__": "__main__"}
    importlib.invalidate_caches()
    out = _Capped()
    err = None

    builtins.input = _make_input(stdin_lines, out)
    try:

            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                err = _format_error(exc, code)
    finally:
        builtins.input = real_input
    result = {"stdout": out.getvalue(), "error": err, "images": [], "tests": None}
    try:
        result["images"] = _collect_images()
    except Exception as exc:
        result["stdout"] += "\n(Plot could not be drawn: %s)" % exc
    if tests is not None:
        result["tests"] = _run_tests(tests, ns, code, err, out.getvalue())
    return json.dumps(result)


def _run_tests(tests, ns, code, err, stdout_text):
    items = tests.get("items", [])
    results = []
    if err is not None:
        for label, _expr, hint in items:
            results.append({"label": label, "ok": False, "msg": "Fix the error above first."})
        return results
    env = ns
    helpers = {
        "approx": approx, "out": stdout_text, "src": code, "ast": ast,
        "uses_node": uses_node, "calls_name": calls_name,
        "count_defs": count_defs, "run_with": run_with, "rerun": rerun, "count_classes": count_classes, "line_has": line_has,
        "math": math, "random": random, "io": io, "_in_tests": True,
    }
    _missing = object()
    saved = {k: env.get(k, _missing) for k in helpers}
    env.update(helpers)
    sink = _Capped()
    try:
        setup = tests.get("setup")
        if setup:
            try:
                with contextlib.redirect_stdout(sink):
                    exec(compile(setup, "<tests>", "exec"), env)
            except BaseException as exc:
                reason = "Could not run the checks: %s: %s" % (type(exc).__name__, exc)
                return [{"label": l, "ok": False, "msg": reason} for l, _e, _h in items]
        for label, expr, hint in items:
            try:
                with contextlib.redirect_stdout(sink):
                    ok = bool(eval(compile(expr, "<tests>", "eval"), env))
                results.append({"label": label, "ok": ok, "msg": "" if ok else hint})
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                results.append({"label": label, "ok": False,
                                "msg": "%s (%s: %s)" % (hint, type(exc).__name__, exc)})
    finally:
        for k, v in saved.items():
            if v is _missing:
                env.pop(k, None)
            else:
                env[k] = v
    return results

    run: function (req) {

    var txt = buildReport(); ta.value = txt;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
    a.download = 'week' + D.num + '_report.txt'; document.body.appendChild(a); a.click(); a.remove();
  } });
  rep.appendChild(h('div', { class: 'row' }, [b1, b2, b3]));
  rep.appendChild(ta);
  p.appendChild(rep);
  updateLab();
}
function quizTally() {
  var correct = 0, answered = 0;
  D.quiz.forEach(function (q, i) { var a = S.quiz[i]; if (a !== undefined && a !== null) { answered++; if (a === q.answer) { correct++; } } });
  return { correct: correct, answered: answered, total: D.quiz.length };
}
function buildReport() {
  var L = [], s = labScore(), q = quizTally();
  var max = D.lab.tasks.filter(function (t) { return !t.bonus; }).reduce(function (a, t) { return a + t.points; }, 0);
  var lec = D.lecture.filter(function (_s, i) { return S.lecDone[i]; }).length;
  L.push('Course: ' + D.course_title);
  L.push('Week ' + D.num + ': ' + D.title);
  L.push('Name: ' + (S.name || '(not entered)'));
  L.push('Generated: ' + new Date().toLocaleString());
  L.push('');
  L.push('Lecture sections marked complete: ' + lec + ' of ' + D.lecture.length);
  L.push('Lab score (browser autograder): ' + s.score + ' of ' + max + (s.bonus ? ', bonus ' + s.bonus : ''));
  L.push('Quiz: ' + q.correct + ' correct, ' + q.answered + ' answered, ' + q.total + ' questions');
  L.push('');
  D.lab.tasks.forEach(function (t, i) {
    var r = S.lab[t.id];
    L.push('==== ' + (t.bonus ? 'Bonus' : 'Task ' + (i + 1)) + ': ' + t.title + ' (' + (r ? r.passed + '/' + r.total + ' tests' : 'not checked') + ') ====');
    L.push(S.code['lab_' + t.id] !== undefined ? S.code['lab_' + t.id] : t.starter);
    L.push('');
  });
  return L.join('\n');
}

/* ---------- quiz ---------- */
function updateQuiz() {
  var q = quizTally();
  var el = document.getElementById('quizscore');
  if (el) { el.textContent = q.correct + ' correct of ' + q.answered + ' answered, ' + q.total + ' questions'; }
  tiles.quiz.textContent = q.correct + '/' + q.total;
}
function renderQuiz() {
  var p = document.getElementById('panel-quiz');
  p.innerHTML = '';
  p.appendChild(h('div', { class: 'card', html: D.quiz_intro_html }));
  p.appendChild(h('div', { class: 'row' }, [
    h('strong', { text: 'Score: ' }), h('span', { id: 'quizscore', class: 'badge info' }),
    h('span', { style: 'flex:1' }),
    h('button', { class: 'btn', text: 'Reset quiz', onclick: function () {
      if (!confirm('Clear all quiz answers?')) { return; } S.quiz = {}; save(); renderQuiz();
    } })
  ]));
  D.quiz.forEach(function (q, i) {
    var card = h('div', { class: 'card' });
    card.appendChild(h('p', { class: 'meta', text: 'Question ' + (i + 1) + ' of ' + D.quiz.length }));
    card.appendChild(mcq({ cls: 'qbox', q: q.q, options: q.options, answer: q.answer, why: q.why, saved: S.quiz[i], onAnswer: function (k) { S.quiz[i] = k; save(); updateQuiz(); } }));
    p.appendChild(card);
  });
  updateQuiz();
}

/* ---------- shell ---------- */
document.getElementById('kicker').textContent = D.course_title + ', Week ' + D.num;
document.getElementById('title').textContent = D.title;
document.title = D.course_title + ' Week ' + D.num + ' ' + D.title;
var chips = document.getElementById('chips');
[D.lecture_minutes + ' min lecture', D.lab_minutes + ' min lab', D.quiz.length + ' quiz questions'].forEach(function (t) { chips.appendChild(h('li', { text: t })); });
var tabs = [['overview', 'Overview'], ['lecture', 'Lecture'], ['lab', 'Lab'], ['quiz', 'Quiz']];
var tl = document.getElementById('tablist');
tabs.forEach(function (t) {
  var b = h('button', { role: 'tab', id: 'tab-' + t[0], 'aria-controls': 'panel-' + t[0], 'aria-selected': 'false', text: t[1] });
  b.addEventListener('click', function () { show(t[0]); });
  tl.appendChild(b);
});
function show(name) {
  tabs.forEach(function (t) {
    document.getElementById('panel-' + t[0]).hidden = (t[0] !== name);
    document.getElementById('tab-' + t[0]).setAttribute('aria-selected', t[0] === name ? 'true' : 'false');
  });
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
  window.scrollTo(0, 0);
  document.querySelectorAll('#panel-' + name + ' textarea.code').forEach(function (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 4, 640) + 'px'; });
}
renderOverview(); renderLecture(); renderLab(); renderQuiz();
var start = (location.hash || '').replace('#', '');
show(tabs.some(function (t) { return t[0] === start; }) ? start : 'overview');
})();
</script>
</body>
