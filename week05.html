<script id="data" type="application/json">{"course_id": "pyeng", "course_title": "Python for Engineers", "pyodide_base": "https://cdn.jsdelivr.net/pyodide/v0.27.8/full/", "num": 5, "title": "Functions and Modules: A Reusable Resistor Library", "hook": "A structural engineer's beam spreadsheet, a circuit designer's resistor tools, and a robotics team's motor formulas share one habit: write a calculation once, test it once, and reuse it everywhere. A bug fixed in one place stays fixed in all of them. This week you package calculations as functions, test them with assertions, and build a resistor library you will keep using for the rest of the course.", "objectives": ["define functions with parameters and <code>return<\/code> values, and call them", "explain the difference between <code>return<\/code> and <code>print<\/code>", "use default and keyword arguments", "describe local scope and avoid reading names a function does not own", "write docstrings and <code>assert<\/code> tests for your functions", "import standard library modules and your own module file"], "summary": "<ul><li><code>def name(parameters):<\/code> starts a function. <code>return value<\/code> sends a result back.<\/li><li><code>print<\/code> shows a value. <code>return<\/code> gives it to the caller. Functions that only print return <code>None<\/code>.<\/li><li>Defaults (<code>offset=0.0<\/code>) make parameters optional. Keywords (<code>f(5, offset=2)<\/code>) make calls readable.<\/li><li><code>return a, b<\/code> gives a tuple. Unpack it with <code>x, y = f(...)<\/code>.<\/li><li>Local variables exist only inside the function. Constants at the top of a file can be read.<\/li><li>Write a docstring for every function. Test with <code>assert<\/code> using answers you know by hand.<\/li><li><code>import math<\/code> gives <code>math.sqrt<\/code>. <code>from math import sqrt<\/code> gives <code>sqrt<\/code>. Your own <code>.py<\/code> files are modules too.<\/li><\/ul>", "lecture": [{"title": "Why functions", "minutes": 10, "html": "<p>A <strong>function<\/strong> is a named block of code that takes inputs, does work, and gives back a result. You already use functions: <code>print<\/code>, <code>len<\/code>, <code>round<\/code>, <code>math.sqrt<\/code>. This week you write your own.<\/p>\n<p>Three reasons engineers write functions:<\/p>\n<ul><li><strong>Reuse:<\/strong> one definition serves every place you need the calculation.<\/li><li><strong>Testing:<\/strong> you check a function once with known cases.<\/li><li><strong>Reading:<\/strong> a name like <code>parallel(r1, r2)<\/code> tells the reader more than a formula does.<\/li><\/ul>", "cells": [{"code": "r1 = 100\nr2 = 100\nprint(r1 * r2 / (r1 + r2))\nr1 = 220\nr2 = 330\nprint(r1 * r2 / (r1 + r2))\n", "stdin": null, "note": "Same formula, copied twice. Imagine finding a typo in the second copy after ten more copies."}]}, {"title": "Defining and calling functions", "minutes": 20, "html": "<p>Define a function with <code>def<\/code>, a name, parameters in parentheses, a colon, and an indented body. The <code>return<\/code> statement sends a value back to the caller and ends the function.<\/p>\n<p><code>return<\/code> and <code>print<\/code> are different. <code>print<\/code> shows a value on screen and gives back <code>None<\/code>. <code>return<\/code> hands the value to the code that called the function, so you can store it or use it in more math. A function that only prints cannot feed another calculation.<\/p>", "cells": [{"code": "def power(voltage, current):\n    return voltage * current\n\nprint(power(12, 2))\nresult = power(5, 0.5)\nprint(result)\n", "stdin": null, "note": null}, {"code": "def show_power(voltage, current):\n    print(voltage * current)\n\nx = show_power(12, 2)\nprint(x)\n", "stdin": null, "note": "<code>show_power<\/code> printed 24, then returned <code>None<\/code>. The variable <code>x<\/code> holds <code>None<\/code>."}], "check": {"q": "A function ends with <code>print(a * b)<\/code> and has no <code>return<\/code>. What does <code>x = f(2, 3)<\/code> store in <code>x<\/code>?", "options": ["<code>None<\/code>", "<code>6<\/code>", "<code>a * b<\/code>", "An error"], "answer": 0, "why": "A function without <code>return<\/code> gives back <code>None<\/code>. The 6 only appeared on screen."}}, {"title": "Parameters, defaults, and keyword arguments", "minutes": 20, "html": "<p>Parameters are the names inside the parentheses of <code>def<\/code>. Arguments are the values you pass when you call the function. Python matches them by position unless you name them.<\/p>\n<p>A <strong>default value<\/strong> makes a parameter optional: <code>def f(x, offset=0.0):<\/code>. Parameters with defaults go after the ones without. A <strong>keyword argument<\/strong> names the parameter in the call, such as <code>f(5, offset=2)<\/code>. Keywords make calls readable when a function has several numbers.<\/p>", "cells": [{"code": "def pressure_kpa(psi, offset_kpa=0.0):\n    return psi * 6.894757 + offset_kpa\n\nprint(pressure_kpa(30))\nprint(pressure_kpa(30, offset_kpa=-101.325))\nprint(pressure_kpa(offset_kpa=10, psi=0))\n", "stdin": null, "note": "The second call converts to gauge pressure by subtracting atmospheric pressure."}], "check": {"q": "Which call matches <code>def f(a, b=2, c=3):<\/code> and sets <code>c<\/code> only?", "options": ["<code>f(c=9)<\/code>", "<code>f(9, 2, 1, 3)<\/code>", "<code>f(1, c=9)<\/code>", "<code>f(b=2, 1)<\/code>"], "answer": 2, "why": "<code>a<\/code> has no default, so you must supply it. The keyword <code>c=9<\/code> skips <code>b<\/code>, which keeps its default."}}, {"title": "Returning more than one value", "minutes": 15, "html": "<p>A function can return several values separated by commas. Python packs them into a <strong>tuple<\/strong>. The caller unpacks them into separate variables.<\/p>\n<p>A tolerance range is a good use: one call gives the low and high limit.<\/p>", "cells": [{"code": "def tolerance_range(nominal, percent):\n    low = nominal * (1 - percent / 100)\n    high = nominal * (1 + percent / 100)\n    return low, high\n\nlow, high = tolerance_range(10000, 5)\nprint(round(low, 1), round(high, 1))\n", "stdin": null, "note": null}, {"code": "both = tolerance_range(100, 10)\nprint(both)\nprint(round(both[0], 1))\n", "stdin": null, "note": "Without unpacking you get a tuple. Position 0 is the first value."}], "check": {"q": "What does <code>a, b = f(x)<\/code> require of <code>f<\/code>?", "options": ["<code>f<\/code> returns two values", "<code>f<\/code> has two <code>return<\/code> words", "<code>f<\/code> has two parameters", "<code>f<\/code> prints two values"], "answer": 0, "why": "Unpacking assigns each returned value to a name, so the counts must match."}}, {"title": "Scope: where names live", "minutes": 15, "html": "<p>Variables created inside a function are <strong>local<\/strong>. They exist only while the function runs. Code outside the function cannot see them, and the function's local names do not collide with names elsewhere.<\/p>\n<p>A function can read a name defined at the top of the file, such as a constant. Avoid changing outside variables from inside a function. Pass values in as parameters and return results.<\/p>", "cells": [{"code": "def area(radius):\n    pi_value = 3.14159\n    return pi_value * radius ** 2\n\nprint(area(2))\n", "stdin": null, "note": null}, {"code": "print(pi_value)\n", "stdin": null, "note": "A NameError on purpose. <code>pi_value<\/code> was local to <code>area<\/code> and no longer exists."}, {"code": "G = 9.81\n\ndef weight(mass):\n    return mass * G\n\nprint(weight(10))\n", "stdin": null, "note": "A function can read the constant <code>G<\/code>. Capital letters tell a reader the value stays fixed."}], "check": {"q": "Where does a variable created inside a function exist?", "options": ["Everywhere in the program", "Forever, until you restart Python", "Only while that function runs", "Only in the first cell"], "answer": 2, "why": "Local names disappear when the function returns."}}, {"title": "Docstrings and assert tests", "minutes": 15, "html": "<p>A <strong>docstring<\/strong> is a string on the first line of a function that says what it does. Write one sentence with the inputs and the units. <code>help(function)<\/code> and <code>function.__doc__<\/code> show it.<\/p>\n<p>An <code>assert<\/code> statement checks that a condition is True and raises an <code>AssertionError<\/code> when it is not. A few assertions with known answers turn a function into a tested function. Choose cases where you know the correct answer without Python: two equal resistors in parallel give half the value.<\/p>", "cells": [{"code": "def parallel(r1, r2):\n    \"\"\"Return the parallel resistance of two resistors in ohms.\"\"\"\n    return r1 * r2 / (r1 + r2)\n\nassert parallel(100, 100) == 50\nassert abs(parallel(220, 330) - 132) < 1e-9\nprint(\"All tests passed\")\nprint(parallel.__doc__)\n", "stdin": null, "note": null}, {"code": "assert parallel(100, 100) == 60, \"expected 50 for equal resistors\"\n", "stdin": null, "note": "An AssertionError on purpose. The test says the answer should be 60. The function is right, so the test is wrong."}], "check": {"q": "What does <code>assert x &gt; 0<\/code> do when <code>x<\/code> is -3?", "options": ["Raises an <code>AssertionError<\/code>", "Sets <code>x<\/code> to 0", "Does nothing", "Prints False"], "answer": 0, "why": "A failed assertion stops the program and reports where the check failed."}}, {"title": "Modules and the standard library", "minutes": 15, "html": "<p>A <strong>module<\/strong> is a file of Python code that you load with <code>import<\/code>. Python ships with many (<code>math<\/code>, <code>random<\/code>, <code>statistics<\/code>, <code>datetime<\/code>). Two forms of import:<\/p>\n<ul><li><code>import math<\/code> then <code>math.sqrt(9)<\/code><\/li><li><code>from math import sqrt<\/code> then <code>sqrt(9)<\/code><\/li><\/ul>\n<p>Your own functions can live in a module too. Save them in a file such as <code>resistor_tools.py<\/code> and <code>import resistor_tools<\/code> from another file. The cell below creates a small module file inside this page's Python session and imports it.<\/p>", "cells": [{"code": "from statistics import mean\nreadings = [9.9, 10.1, 10.0]\nprint(round(mean(readings), 2))\n", "stdin": null, "note": "The square brackets make a list. Week 6 covers lists in detail."}, {"code": "code = '''\ndef series(a, b):\n    return a + b\n'''\nwith open(\"mytools.py\", \"w\") as f:\n    f.write(code)\n\nimport mytools\nprint(mytools.series(220, 330))\n", "stdin": null, "note": "The file is written inside the session. Week 7 covers files."}], "check": {"q": "How do you call <code>sqrt<\/code> after <code>import math<\/code>?", "options": ["<code>import sqrt(9)<\/code>", "<code>math(sqrt, 9)<\/code>", "<code>math.sqrt(9)<\/code>", "<code>sqrt(9)<\/code>"], "answer": 2, "why": "With <code>import math<\/code>, functions belong to the module name. <code>from math import sqrt<\/code> allows the short form."}}, {"title": "Putting it together: a resistor library", "minutes": 20, "html": "<p>A good library has small functions, clear names, docstrings, and tests. This library handles the calculations from weeks 1 to 4. Read it, run it, and add one function of your own at the end.<\/p>", "cells": [{"code": "import math\n\ndef series(r1, r2):\n    \"\"\"Return the series resistance in ohms.\"\"\"\n    return r1 + r2\n\ndef parallel(r1, r2):\n    \"\"\"Return the parallel resistance in ohms.\"\"\"\n    return r1 * r2 / (r1 + r2)\n\ndef led_resistor(supply_v, led_drop_v, current_a):\n    \"\"\"Return the series resistor in ohms for an LED.\"\"\"\n    return (supply_v - led_drop_v) / current_a\n\ndef cutoff_hz(r_ohm, c_farad):\n    \"\"\"Return the RC low-pass cutoff frequency in hertz.\"\"\"\n    return 1 / (2 * math.pi * r_ohm * c_farad)\n\nassert series(220, 330) == 550\nassert parallel(100, 100) == 50\nassert abs(led_resistor(5, 2, 0.02) - 150) < 1e-9\nprint(round(cutoff_hz(10000, 1e-7), 1), \"Hz\")\n", "stdin": null, "note": "Add a function that returns the power in a resistor and write one assert for it."}]}], "lecture_minutes": 130, "lab": {"summary": "Build and test a resistor and circuit function library: Ohm's law, series and parallel, dividers, RC cutoff, percent error, and an LED resistor with assertions.", "intro_html": "<p>You are building a library of circuit functions that you will import in later labs. The checks call your functions with known values, so each function must <strong>return<\/strong> its result. A function that prints a result and returns nothing fails the checks.<\/p>\n<p>Keep the function names and parameter names exactly as written. Write each function once, and keep the starting code for later tasks in place.<\/p>", "tasks": [{"id": "t1", "title": "Ohm's law functions", "points": 15, "minutes": 20, "bonus": false, "prompt_html": "<p>Write two functions:<\/p>\n<ul><li><code>ohms_law_current(voltage, resistance)<\/code> returns the current in amps<\/li><li><code>power(voltage, current)<\/code> returns the power in watts<\/li><\/ul>", "starter": "def ohms_law_current(voltage, resistance):\n    # return the current in amps\n    ...\n\ndef power(voltage, current):\n    # return the power in watts\n    ...\n\nprint(ohms_law_current(12, 4), power(12, 3))\n", "hint_html": "<p>Each body is one line: <code>return voltage / resistance<\/code> and <code>return voltage * current<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["12 V across 4 ohm gives 3 A", "approx(ohms_law_current(12, 4), 3.0)", "Return voltage / resistance."], ["5 V across 20 ohm gives 0.25 A", "approx(ohms_law_current(5, 20), 0.25)", "Return the value; do not print it."], ["12 V at 3 A gives 36 W", "approx(power(12, 3), 36.0)", "Return voltage * current."], ["both functions return values", "ohms_law_current(1, 1) is not None and power(1, 1) is not None", "Us <script id="harness" type="text/x-python">import sys, io, os, json, ast, base64, builtins, traceback, contextlib, math, random

os.environ.setdefault("MPLBACKEND", "Agg")
import importlib
if "" not in sys.path:
    sys.path.insert(0, "")

_OUT_CAP = 20000
_LECTURE_NS = {"__name__": "__main__"}


class _Capped(io.StringIO):
    def write(self, s):
        if self.tell() > _OUT_CAP:
            raise RuntimeError("Output limit reached. Your code printed too much text.")
        return super().write(s)


def approx(a, b, rel=1e-6, abs_=1e-9):
    try:
        if "numpy" in sys.modules:
            import numpy as _np
            if isinstance(a, _np.ndarray) or isinstance(b, _np.ndarray):
                return bool(_np.allclose(a, b, rtol=rel, atol=abs_))
        if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
            return len(a) == len(b) and all(approx(x, y, rel, abs_) for x, y in zip(a, b))
        return abs(float(a) - float(b)) <= max(abs_, rel * abs(float(b)))
    except Exception:
        return False


def uses_node(src, *names):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    wanted = tuple(getattr(ast, n) for n in names)
    return any(isinstance(n, wanted) for n in ast.walk(tree))


def calls_name(src, name):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    for n in ast.walk(tree):
        if isinstance(n, ast.Call):
            f = n.func
            if isinstance(f, ast.Name) and f.id == name:
                return True
            if isinstance(f, ast.Attribute) and f.attr == name:
                return True
    return False


def line_has(src, target, *words):
    """True when an assignment to `target` has every word on its right side."""
    for line in src.splitlines():
        s = line.strip()
        if s.startswith("#") or "=" not in s:
            continue
        left, _, right = s.partition("=")
        if left.strip() == target and all(w in right for w in words):
            return True
    return False


def run_with(src, inputs=(), ns=None):
    """Run student source with scripted input() values; return what it printed."""
    queue = list(inputs)
    old = builtins.input

    def _fake(prompt=""):
        print(prompt, end="")
        if not queue:
            raise EOFError("input() called more times than expected")
        v = queue.pop(0)
        print(v)
        return v

    buf = io.StringIO()
    builtins.input = _fake
    try:
        with contextlib.redirect_stdout(buf):
            exec(compile(src, "<your code>", "exec"), ns if ns is not None else {"__name__": "__main__"})
    finally:
        builtins.input = old
    return buf.getvalue()


def rerun(src, **over):
    """Execute student source again with top-level assignments replaced by the given constants.
    Returns the resulting namespace. Output is discarded."""
    tree = ast.parse(src)
    for node in tree.body:
        if (isinstance(node, ast.Assign) and len(node.targets) == 1
                and isinstance(node.targets[0], ast.Name) and node.targets[0].id in over):
            node.value = ast.Constant(over[node.targets[0].id])
    ast.fix_missing_locations(tree)
    ns = {"__name__": "__main__"}
    with contextlib.redirect_stdout(io.StringIO()):
        exec(compile(tree, "<your code>", "exec"), ns)
    return ns


def count_defs(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.FunctionDef) for n in ast.walk(tree))


def count_classes(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.ClassDef) for n in ast.walk(tree))


def _format_error(exc, code):
    lines = code.split("\n")
    if isinstance(exc, SyntaxError):
        ln = exc.lineno
        msg = "SyntaxError: " + str(exc.msg)
        if ln and 1 <= ln <= len(lines):
            msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
        return msg
    tb = traceback.TracebackException.from_exception(exc)
    ln = None
    for fs in tb.stack:
        if fs.filename == "<your code>":
            ln = fs.lineno
    msg = "".join(tb.format_exception_only()).strip()
    if ln and 1 <= ln <= len(lines):
        msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
    return msg


def _make_input(stdin_lines, out):
    queue = list(stdin_lines)

    def _input(prompt=""):
        out.write(str(prompt))
        if not queue:
            raise EOFError("input() ran out of lines. Type one value per line in the Input box under the code.")
        val = queue.pop(0)
        out.write(val + "\n")
        return val

    return _input


def _exec_code(code, ns, out):
    tree = ast.parse(code, "<your code>", "exec")
    last = None
    if tree.body and isinstance(tree.body[-1], ast.Expr):
        last = ast.Expression(tree.body.pop().value)
    exec(compile(tree, "<your code>", "exec"), ns)
    if last is not None:
        val = eval(compile(last, "<your code>", "eval"), ns)
        if val is not None:
            out.write(repr(val) + "\n")


def _collect_images():
    imgs = []
    if "matplotlib.pyplot" in sys.modules:
        import matplotlib.pyplot as plt
        for num in plt.get_fignums():
            fig = plt.figure(num)
            buf = io.BytesIO()
            fig.savefig(buf, format="png", dpi=100, bbox_inches="tight")
            imgs.append(base64.b64encode(buf.getvalue()).decode("ascii"))
        plt.close("all")
    return imgs


def reset_lecture():
    _LECTURE_NS.clear()
    _LECTURE_NS["__name__"] = "__main__"


def run_cell(req_json):
    req = json.loads(req_json)
    code = req.get("code", "")
    mode = req.get("mode", "fresh")
    stdin_lines = req.get("stdin") or []
    tests = req.get("tests")
    ns = _LECTURE_NS if mode == "lecture" else {"__name__": "__main__"}
    importlib.invalidate_caches()
    out = _Capped()
    err = None
    real_input = builtins.input
    builtins.input = _make_input(stdin_lines, out)
    try:
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
            try:
                random.seed()
                _exec_code(code, ns, out)
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                err = _format_error(exc, code)
    finally:
        builtins.input = real_input
    result = {"stdout": out.getvalue(), "error": err, "images": [], "tests": None}
    try:
        result["images"] = _collect_images()
    except Exception as exc:
        result["stdout"] += "\n(Plot could not be drawn: %s)" % exc
    if tests is not None:
        result["tests"] = _run_tests(tests, ns, code, err, out.getvalue())
    return json.dumps(result)


def _run_tests(tests, ns, code, err, stdout_text):
    items = tests.get("items", [])
    results = []
    if err is not None:
        for label, _expr, hint in items:
            results.append({"label": label, "ok": False, "msg": "Fix the error above first."})
        return results
    env = ns
    helpers = {
        "approx": approx, "out": stdout_text, "src": code, "ast": ast,
        "uses_node": uses_node, "calls_name": calls_name,
        "count_defs": count_defs, "run_with": run_with, "rerun": rerun, "count_classes": count_classes, "line_has": line_has,
        "math": math, "random": random, "io": io, "_in_tests": True,
    }
    _missing = object()
    saved = {k: env.get(k, _missing) for k in helpers}
    env.update(helpers)
    sink = _Capped()
    try:
        setup = tests.get("setup")
        if setup:
            try:
                with contextlib.redirect_stdout(sink):
                    exec(compile(setup, "<tests>", "exec"), env)
            except BaseException as exc:
                reason = "Could not run the checks: %s: %s" % (type(exc).__name__, exc)
                return [{"label": l, "ok": False, "msg": reason} for l, _e, _h in items]
        for label, expr, hint in items:
            try:
                with contextlib.redirect_stdout(sink):
                    ok = bool(eval(compile(expr, "<tests>", "eval"), env))
                results.append({"label": label, "ok": ok, "msg": "" if ok else hint})
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                results.append({"label": label, "ok": False,
                                "msg": "%s (%s: %s)" % (hint, type(exc).__name__, exc)})
    finally:
        for k, v in saved.items():
            if v is _missing:
                env.pop(k, None)
            else:
                env[k] = v
    return results

      await py.loadPackagesFromImports(m.code, quiet);

      const res = py.runPython('run_cell(_req_json)');
      postMessage({ type: 'result', result: JSON.parse(res) });

<script>
(function () {
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var HARNESS = document.getElementById('harness').textContent;
var WORKER_SRC = document.getElementById('worker-src').textContent;
var KEY = 'pyeng-' + D.course_id + '-w' + D.num;

/* ---------- storage ---------- */
var mem = null;
function loadState() {
  try { var s = localStorage.getItem(KEY); if (s) { return JSON.parse(s); } } catch (e) {}
  return mem || {};
}
var S = loadState();
S.name = S.name || ''; S.lecDone = S.lecDone || {}; S.checks = S.checks || {};
S.code = S.code || {}; S.lab = S.lab || {}; S.quiz = S.quiz || {};
function save() { mem = S; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- dom helpers ---------- */
function h(tag, attrs, kids) {
  var n = document.createElement(tag);
  if (attrs) { for (var k in attrs) {
    if (k === 'class') { n.className = attrs[k]; }
    else if (k === 'html') { n.innerHTML = attrs[k]; }
    else if (k === 'text') { n.textContent = attrs[k]; }
    else if (k.slice(0, 2) === 'on') { n.addEventListener(k.slice(2), attrs[k]); }
    else { n.setAttribute(k, attrs[k]); }
  } }
  if (kids) { kids.forEach(function (c) { if (c) { n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); } }); }
  return n;
}

/* ---------- python runner ---------- */
var Py = (function () {
  var worker = null, ready = false, current = null, queue = [], timer = null, nextId = 1;
  var stopBtn = document.getElementById('stopbtn');
  var statusEl = document.getElementById('pystatus');
  function status(t) { statusEl.textContent = t; }
  function start() {
    var blob = new Blob([WORKER_SRC], { type: 'text/javascript' });
    worker = new Worker(URL.createObjectURL(blob));
    ready = false;
    worker.onmessage = onMsg;
    worker.onerror = function (e) { finish(failure('The Python worker crashed: ' + (e.message || 'unknown error'))); };
    worker.postMessage({ type: 'init', harness: HARNESS, base: D.pyodide_base });
    status('Starting Python (the first start takes 10 to 30 seconds)...');
  }
  function kill() {
    if (worker) { worker.terminate(); worker = null; }
    ready = false; clearTimer();
  }
  function failure(msg, req) {
    var r = { stdout: '', error: msg, images: [], tests: null };
    if (req && req.tests) {
      r.tests = req.tests.items.map(function (it) { return { label: it[0], ok: false, msg: 'No result.' }; });
    }
    return r;
  }
  function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } stopBtn.hidden = true; }
  function armTimer() {
    clearTimer(); stopBtn.hidden = false;
    var secs = (current && current.req.timeout) || 20;
    timer = setTimeout(function () {
      kill();
      finish(failure('Stopped after ' + secs + ' seconds. Look for a loop that never ends. Python restarted, so run earlier cells again.', current && current.req));
      start();
    }, secs * 1000);
  }
  function finish(result) {
    var c = current; current = null; clearTimer();
    if (c) { c.resolve(result); }
    status(ready ? 'Python ready' : 'Python restarting...');
    pump();
  }
  function onMsg(e) {
    var m = e.data;
    if (m.type === 'ready') { ready = true; status('Python ready'); pump(); }
    else if (m.type === 'initerror') {
      kill();
      status('Python could not start');
      var q = queue.slice(); queue = [];
      if (current) { q.unshift(current); current = null; }
      q.forEach(function (c) { c.resolve(failure('Python could not start. It needs an internet connection to load. Reload the page and try again. Details: ' + m.message, c.req)); });
    }
    else if (m.type === 'status') { status(m.text); }
    else if (m.type === 'started') { status('Running...'); armTimer(); }
    else if (m.type === 'result') { finish(m.result); }
    else if (m.type === 'error') { finish(failure('Python error: ' + m.message, current && current.req)); }
    else if (m.type === 'resetdone') { status('Python session reset'); }
  }
  function pump() {
    if (!ready || current || !queue.length) { return; }
    current = queue.shift();
    status('Preparing...');
    stopBtn.hidden = false;
    worker.postMessage({ type: 'run', code: current.req.code, stdin: current.req.stdin || [], mode: current.req.mode, tests: current.req.tests || null });
  }
  stopBtn.addEventListener('click', function () {
    if (!current) { return; }
    kill();
    finish(failure('Stopped. Python restarted, so run earlier cells again.', current.req));
    start();
  });
  return {
    run: function (req) {
      return new Promise(function (resolve) {
        queue.push({ id: nextId++, req: req, resolve: resolve });
        if (!worker) { start(); } else { pump(); }
      });
    },
    reset: function () { if (worker && ready) { worker.postMessage({ type: 'reset' }); } }
  };
})();

/* ---------- result rendering ---------- */
function renderResult(box, r, opts) {

  if (!r.stdout && !r.error && !(r.images && r.images.length) && !(opts && opts.quietEmpty)) {

  }
  if (r.tests) {

}

/* ---------- code cell ---------- */
function codeCell(o) {

  var runBtn = h('button', { class: 'btn primary', text: o.tests ? 'Run' : 'Run cell' });

  var resetBtn = h('button', { class: 'btn', text: 'Reset code' });
  var hintBtn = (o.hint) ? h('button', { class: 'btn', text: 'Show hint' }) : null;
  var stale = h('span', { class: 'badge warn', text: 'Edited since last check', hidden: '' });
  stale.hidden = true;
  function go(withTests) {
    var req = { code: ta.value, stdin: stdinBox.value ? stdinBox.value.split('\n') : [], mode: o.mode, timeout: o.timeout || 20 };
    if (withTests) { req.tests = o.tests; }
    runBtn.disabled = true; if (checkBtn) { checkBtn.disabled = true; }
    out.innerHTML = ''; out.appendChild(h('p', { class: 'small', text: 'Working...' }));
    Py.run(req).then(function (r) {

    ta.value = o.code; delete S.code[o.key]; save(); fit(); syncStdin();
  });
  var hintBox = null;
  if (hintBtn) { hintBtn.addEventListener('click', function () {
    if (hintBox) { hintBox.remove(); hintBox = null; hintBtn.textContent = 'Show hint'; return; }
    hintBox = h('div', { class: 'hint', html: o.hint }); row.after(hintBox); hintBtn.textContent = 'Hide hint';
  }); }
  ta.addEventListener('input', function () {
    S.code[o.key] = ta.value; save(); fit(); syncStdin(); if (o.tests && o.hasResult && o.hasResult()) { stale.hidden = false; }

  wrap.appendChild(ta); wrap.appendChild(stdinWrap); wrap.appendChild(row); wrap.appendChild(out);
  setTimeout(function () { fit(); syncStdin(); }, 0);

}

/* ---------- multiple choice ---------- */

/* ---------- lecture ---------- */
function updateLecture() {

/* ---------- lab ---------- */
function labScore() {

  D.lab.tasks.forEach(function (t) {

  });
  return { score: Math.round(tot * 10) / 10, bonus: Math.round(bonus * 10) / 10 };
}
function updateLab() {
  var s = labScore();

  var el = document.getElementById('labscore'); if (el) { el.textContent = s.score + ' / ' + max + (s.bonus ? ' (+' + s.bonus + ' bonus)' : ''); }

function quizTally() {

  return { correct: correct, answered: answered, total: D.quiz.length };
}
function buildReport() {

    var card = h('div', { class: 'card' });
    card.appendChild(h('p', { class: 'meta', text: 'Question ' + (i + 1) + ' of ' + D.quiz.length }));
    card.appendChild(mcq({ cls: 'qbox', q: q.q, options: q.options, answer: q.answer, why: q.why, saved: S.quiz[i], onAnswer: function (k) { S.quiz[i] = k; save(); updateQuiz(); } }));
    p.appendChild(card);
  });
  updateQuiz();
}

/* ---------- shell ---------- */
document.getElementById('kicker').textContent = D.course_title + ', Week ' + D.num;
document.getElementById('title').textContent = D.title;
document.title = D.course_title + ' Week ' + D.num + ' ' + D.title;
var chips = document.getElementById('chips');
[D.lecture_minutes + ' min lecture', D.lab_minutes + ' min lab', D.quiz.length + ' quiz questions'].forEach(function (t) { chips.appendChild(h('li', { text: t })); });
var tabs = [['overview', 'Overview'], ['lecture', 'Lecture'], ['lab', 'Lab'], ['quiz', 'Quiz']];
var tl = document.getElementById('tablist');
tabs.forEach(function (t) {
  var b = h('button', { role: 'tab', id: 'tab-' + t[0], 'aria-controls': 'panel-' + t[0], 'aria-selected': 'false', text: t[1] });
  b.addEventListener('click', function () { show(t[0]); });
  tl.appendChild(b);
});
function show(name) {
  tabs.forEach(function (t) {
    document.getElementById('panel-' + t[0]).hidden = (t[0] !== name);
    document.getElementById('tab-' + t[0]).setAttribute('aria-selected', t[0] === name ? 'true' : 'false');
  });
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
  window.scrollTo(0, 0);
  document.querySelectorAll('#panel-' + name + ' textarea.code').forEach(function (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 4, 640) + 'px'; });
}
renderOverview(); renderLecture(); renderLab(); renderQuiz();
var start = (location.hash || '').replace('#', '');
show(tabs.some(function (t) { return t[0] === start; }) ? start : 'overview');
})();
</script>
</body>
</html>
