<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python for Engineers Week 11 Pandas: Tables of Engineering Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f0; --card:#ffffff; --ink:#1a1f24; --mute:#59636e; --line:#d9d6cb;
  --accent:#0a5aa0; --accent-ink:#ffffff; --accent-soft:#e4eef8;
  --ok:#17692f; --ok-bg:#e5f3e9; --bad:#a82217; --bad-bg:#fcebe8; --warn:#8a5a00; --warn-bg:#fdf3dc;
  --code-bg:#f0eee6; --out-bg:#e6edf6; --out-ink:#0a2a66;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151a; --card:#192028; --ink:#e7ebef; --mute:#9aa6b2; --line:#2c3641;
    --accent:#5eaeea; --accent-ink:#0b1219; --accent-soft:#17283a;
    --ok:#6fd08c; --ok-bg:#15301f; --bad:#ff8a7d; --bad-bg:#3a1b18; --warn:#f0c060; --warn-bg:#33290f;
    --code-bg:#10161c; --out-bg:#e6edf6; --out-ink:#0a2a66;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:50}
header.top{padding:28px 0 12px}
.kicker{font-size:13px;color:var(--mute);letter-spacing:.02em;margin:0 0 4px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.2;margin:0 0 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:13px;border:1px solid var(--line);background:var(--card);padding:2px 10px;border-radius:999px;color:var(--mute)}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--mute);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.statusbar{position:sticky;top:46px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:6px 12px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.statusbar .grow{flex:1}
main{padding:16px 0 80px}
.panel[hidden]{display:none}
h2{font-size:22px;margin:24px 0 8px;font-weight:600}
h3{font-size:18px;margin:0 0 6px;font-weight:600}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:22px}
li{margin:2px 0}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
.card .meta{font-size:13px;color:var(--mute);margin:0 0 8px}
.hook{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .big{font-size:24px;font-weight:600;font-family:var(--mono)}
.tile .lbl{font-size:13px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.bar>span{display:block;height:100%;background:var(--accent);width:0}
button.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.cell{margin:12px 0}
textarea.code{display:block;width:100%;font-family:var(--mono);font-size:14px;line-height:1.5;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;resize:vertical;tab-size:4;white-space:pre;overflow:auto;min-height:60px}
.stdin{margin-top:6px}
.stdin label{font-size:13px;color:var(--mute);display:block}
textarea.stdin-box{width:100%;font-family:var(--mono);font-size:13px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:48px}
.out{margin-top:8px}
pre.stdout{margin:0;background:var(--out-bg);color:var(--out-ink);font-family:var(--mono);font-size:13.5px;padding:10px 12px;border-radius:6px;border:1px solid #b9c8dc;overflow:auto;white-space:pre-wrap;word-break:break-word}
.err{margin-top:8px;border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:8px 12px;font-size:14px}
.err pre{margin:4px 0 0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;color:inherit}
.out img{max-width:100%;height:auto;background:#fff;border-radius:6px;margin-top:8px;border:1px solid var(--line)}
.tests{list-style:none;margin:8px 0 0;padding:0}
.tests li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.badge{font-family:var(--mono);font-size:12px;font-weight:500;padding:1px 8px;border-radius:4px;flex:none}
.badge.pass{background:var(--ok-bg);color:var(--ok)}
.badge.fail{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.hint{margin:8px 0;padding:8px 12px;background:var(--warn-bg);color:var(--ink);border-radius:6px;font-size:14px;border:1px solid var(--line)}
.q{margin:0 0 6px;font-weight:500}
.q p{margin:0 0 8px}
.q pre,.card pre{background:var(--code-bg);padding:8px 12px;border-radius:6px;overflow:auto;font-family:var(--mono);font-size:13.5px;font-weight:400;margin:0 0 10px}
.q pre code,.card pre code{background:none;padding:0}
.opts{list-style:none;padding:0;margin:0}
.opts button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:var(--ok-bg)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opts button:disabled{cursor:default}
.why{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:6px;background:var(--accent-soft)}
.checkq{margin:14px 0 4px;padding:12px;border:1px dashed var(--line);border-radius:8px}
.done-row{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.field input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-width:240px}
textarea.report{width:100%;min-height:200px;font-family:var(--mono);font-size:12.5px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px}
table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code-bg)}
.small{font-size:13px;color:var(--mute)}
@media (max-width:600px){ .field input{min-width:0;width:100%} .statusbar{top:44px} }
</style>
</head>

<script id="data" type="application/json">{"course_id": "pyeng", "course_title": "Python for Engineers", "pyodide_base": "https://cdn.jsdelivr.net/pyodide/v0.27.8/full/", "num": 11, "title": "Pandas: Tables of Engineering Data", "hook": "Real measurements arrive as tables: a sensor name, a time, a temperature, a current, and sometimes a blank where a reading failed. Pandas gives you a DataFrame, a table you can filter, sort, group, and repair with one-line commands. This week you load a multi-sensor log, find the hot spots, compute power, compare sensors, and handle the missing reading that every real data set contains.", "objectives": ["build a DataFrame and load one from CSV text", "select columns, rows, and single values with <code>[]<\/code>, <code>loc<\/code>, and <code>iloc<\/code>", "filter rows with boolean masks", "add computed columns such as power", "summarize with <code>mean<\/code>, <code>max<\/code>, <code>describe<\/code>, and <code>groupby<\/code>", "find and handle missing values with <code>isna<\/code>, <code>dropna<\/code>, and <code>fillna<\/code>"], "summary": "<ul><li>A DataFrame is a table. Build one from a dictionary of lists or from <code>pd.read_csv<\/code>.<\/li><li>Read CSV text with <code>pd.read_csv(io.StringIO(text))<\/code>. A blank number becomes NaN.<\/li><li><code>df[\"col\"]<\/code> is one column. <code>df.loc[label, col]<\/code> selects by label. <code>df.iloc[row, col]<\/code> selects by position.<\/li><li>Filter with masks: <code>df[(df[\"a\"] &gt; 1) &amp; (df[\"b\"] == \"x\")]<\/code>.<\/li><li>New columns come from vectorized formulas: <code>df[\"p\"] = df[\"i\"] ** 2 * R<\/code>.<\/li><li>Summaries skip NaN. <code>groupby(\"key\")[\"col\"].mean()<\/code> summarizes each group. <code>idxmax<\/code> returns the label of the largest value.<\/li><li><code>isna().sum()<\/code> counts missing values. <code>dropna()<\/code> removes rows. <code>fillna(v)<\/code> replaces NaN.<\/li><li>Pandas plots through Matplotlib: <code>series.plot(kind=\"bar\", ax=ax)<\/code>.<\/li><\/ul>", "lecture": [{"title": "Series and DataFrames", "minutes": 15, "html": "<p>A <strong>Series<\/strong> is one labeled column of values. A <strong>DataFrame<\/strong> is a table of Series that share a row index. Create one from a dictionary where each key is a column name and each value is a list.<\/p>\n<p>Useful attributes: <code>df.shape<\/code> gives (rows, columns), <code>df.columns<\/code> lists the column names, and <code>df.head()<\/code> shows the first rows. Import pandas as <code>pd<\/code>.<\/p>", "cells": [{"code": "import pandas as pd\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"part\": [\"R1\", \"R2\", \"R3\"],\n    \"ohms\": [4700, 10000, 2200],\n    \"tolerance\": [5, 1, 5],\n})\nprint(df)\nprint(df.shape)\nprint(list(df.columns))\n", "stdin": null, "note": "The numbers on the left are the row index."}], "check": {"q": "What does <code>df.shape<\/code> return for a table with 12 rows and 4 columns?", "options": ["<code>(12, 4)<\/code>", "<code>[12, 4]<\/code>", "<code>16<\/code>", "<code>(4, 12)<\/code>"], "answer": 0, "why": "<code>shape<\/code> is a tuple of rows then columns."}}, {"title": "Loading CSV data", "minutes": 15, "html": "<p><code>pd.read_csv(source)<\/code> turns CSV text into a DataFrame. The source is normally a file name. In this page you read from a string by wrapping it in <code>io.StringIO<\/code>, which behaves like an open file.<\/p>\n<p>Below, a twelve-row log from three sensors. Sensor B has one failed reading, shown as an empty field. Pandas stores a blank number as <strong>NaN<\/strong> (not a number).<\/p>", "cells": [{"code": "import io\n\nCSV = \"\"\"sensor,time_s,temp_c,current_a\nA,0,20.1,0.52\nA,10,20.8,0.55\nA,20,21.9,0.61\nA,30,23.4,0.66\nB,0,19.7,0.48\nB,10,19.9,0.49\nB,20,,0.50\nB,30,20.6,0.53\nC,0,25.0,0.80\nC,10,27.5,0.88\nC,20,30.1,0.97\nC,30,33.0,1.05\n\"\"\"\n\ndf = pd.read_csv(io.StringIO(CSV))\nprint(df.shape)\nprint(df.head(3).to_string())\n", "stdin": null, "note": "Keep this cell. The next cells reuse <code>df<\/code>."}, {"code": "print(df[\"temp_c\"].count(), \"valid temperatures\")\nprint(df[\"sensor\"].nunique(), \"sensors:\", df[\"sensor\"].unique().tolist())\n", "stdin": null, "note": null}], "check": {"q": "What does a blank number in a CSV file become in a DataFrame?", "options": ["An empty string in a number column", "The previous row's value", "NaN", "0"], "answer": 2, "why": "Pandas marks missing numbers as NaN so they are not counted as real readings."}}, {"title": "Selecting columns, rows, and values", "minutes": 20, "html": "<ul><li><code>df[\"temp_c\"]<\/code> is one column (a Series). <code>df[[\"sensor\", \"temp_c\"]]<\/code> is a smaller table.<\/li><li><code>df.loc[row_label, column_name]<\/code> selects by label.<\/li><li><code>df.iloc[row_number, column_number]<\/code> selects by position, counting from 0.<\/li><li><code>df.iloc[0:3]<\/code> is the first three rows.<\/li><\/ul>\n<p>The row index here is 0 to 11, so labels and positions match. They can differ after filtering.<\/p>", "cells": [{"code": "print(df[\"temp_c\"].max())\nprint(df.loc[3, \"temp_c\"])\nprint(df.iloc[2, 2])\nprint(df.iloc[0:2][[\"sensor\", \"temp_c\"]].to_string())\n", "stdin": null, "note": null}, {"code": "best = df[\"temp_c\"].idxmax()\nprint(\"Row\", best, \"is sensor\", df.loc[best, \"sensor\"])\n", "stdin": null, "note": "<code>idxmax<\/code> returns the row label of the largest value."}], "check": {"q": "Which expression returns the value in row 3 of column <code>temp_c<\/code> by label?", "options": ["<code>df.loc[3, \"temp_c\"]<\/code>", "<code>df[3, \"temp_c\"]<\/code>", "<code>df.iloc[\"temp_c\", 3]<\/code>", "<code>df.temp_c(3)<\/code>"], "answer": 0, "why": "<code>loc<\/code> takes a row label, then a column name."}}, {"title": "Filtering rows with masks", "minutes": 15, "html": "<p>Boolean masks work just like NumPy. <code>df[\"temp_c\"] &gt; 25<\/code> gives True or False for each row, and <code>df[mask]<\/code> keeps the True rows. Combine masks with <code>&amp;<\/code> and <code>|<\/code>, each comparison in parentheses.<\/p>\n<p>Always filter into a new variable so you keep the original table.<\/p>", "cells": [{"code": "hot = df[df[\"temp_c\"] > 25]\nprint(hot.to_string())\nprint(len(hot), \"hot readings\")\n", "stdin": null, "note": null}, {"code": "late_a = df[(df[\"sensor\"] == \"A\") & (df[\"time_s\"] >= 20)]\nprint(late_a[[\"time_s\", \"temp_c\"]].to_string())\n", "stdin": null, "note": null}], "check": {"q": "Which expression keeps rows where <code>temp_c<\/code> is above 25 and <code>sensor<\/code> is <code>\"C\"<\/code>?", "options": ["<code>df.filter(temp_c &gt; 25, sensor == \"C\")<\/code>", "<code>df[df[\"temp_c\"] &gt; 25 and df[\"sensor\"] == \"C\"]<\/code>", "<code>df[(df[\"temp_c\"] &gt; 25) &amp; (df[\"sensor\"] == \"C\")]<\/code>", "<code>df[\"temp_c\" &gt; 25 &amp; \"sensor\" == \"C\"]<\/code>"], "answer": 2, "why": "Use <code>&amp;<\/code> between comparisons, with each comparison in parentheses."}}, {"title": "Computed columns", "minutes": 15, "html": "<p>Assign to a new column name to add a column: <code>df[\"power_w\"] = df[\"current_a\"] ** 2 * 12<\/code>. The formula runs on the whole column, the same vectorized math as NumPy. Here the supply is a 12 ohm load, so power is current squared times 12.<\/p>\n<p>Round only when displaying (<code>round(2)<\/code>), not when storing, so later calculations keep full precision.<\/p>", "cells": [{"code": "df[\"power_w\"] = df[\"current_a\"] ** 2 * 12\nprint(df[[\"sensor\", \"time_s\", \"power_w\"]].head(3).round(3).to_string())\nprint(\"Max power:\", round(df[\"power_w\"].max(), 3), \"W\")\n", "stdin": null, "note": null}], "check": {"q": "What does <code>df[\"p\"] = df[\"i\"] ** 2 * 12<\/code> do?", "options": ["Adds a column <code>p<\/code> computed from every row of <code>i<\/code>", "Creates a single number named <code>p<\/code>", "Changes the column <code>i<\/code> in place", "Raises an error because <code>p<\/code> does not exist yet"], "answer": 0, "why": "Assigning to a new column name creates it, filled by the vectorized formula."}}, {"title": "Summaries and groupby", "minutes": 20, "html": "<p><code>df[\"temp_c\"].mean()<\/code>, <code>.min()<\/code>, <code>.max()<\/code>, <code>.std()<\/code>, <code>.count()<\/code> summarize a column and skip NaN automatically. <code>df.describe()<\/code> shows several statistics at once.<\/p>\n<p><code>df.groupby(\"sensor\")[\"temp_c\"].mean()<\/code> splits the rows by sensor, then averages each group. It is the table version of a loop over categories. <code>.agg([\"min\", \"max\"])<\/code> computes several statistics at once.<\/p>", "cells": [{"code": "means = df.groupby(\"sensor\")[\"temp_c\"].mean()\nprint(means.round(2).to_string())\nprint(\"Hottest on average:\", means.idxmax())\n", "stdin": null, "note": null}, {"code": "print(df.groupby(\"sensor\")[\"temp_c\"].agg([\"min\", \"max\"]).to_string())\nprint(round(df[\"temp_c\"].mean(), 2))\n", "stdin": null, "note": null}], "check": {"q": "What does <code>df.groupby(\"sensor\")[\"temp_c\"].mean()<\/code> return?", "options": ["The temperature of the first sensor", "One average for the whole table", "One average temperature per sensor", "A new column in <code>df<\/code>"], "answer": 2, "why": "<code>groupby<\/code> makes one group per sensor, and <code>mean<\/code> summarizes each group."}}, {"title": "Missing data", "minutes": 15, "html": "<p><code>df.isna()<\/code> marks missing cells. <code>df.isna().sum()<\/code> counts them per column. Choose how to repair them:<\/p>\n<ul><li><code>df.dropna()<\/code> removes any row that has a NaN.<\/li><li><code>df[\"temp_c\"].fillna(value)<\/code> replaces NaN in one column with a value such as the column mean.<\/li><\/ul>\n<p>Dropping loses a row. Filling invents a value. Pick based on how much data you have and what the number is used for, and record your choice.<\/p>", "cells": [{"code": "print(df.isna().sum().to_dict())\nclean = df.dropna()\nprint(\"After dropna:\", clean.shape)\nfilled = df[\"temp_c\"].fillna(df[\"temp_c\"].mean())\nprint(\"Filled value:\", round(filled.iloc[6], 2))\n", "stdin": null, "note": null}], "check": {"q": "What does <code>df.dropna()<\/code> do?", "options": ["Returns a copy without the rows that contain NaN", "Replaces NaN with 0", "Raises an error if any NaN exists", "Deletes the columns that contain NaN"], "answer": 0, "why": "<code>dropna<\/code> removes whole rows. Use <code>fillna<\/code> to repair values instead."}}, {"title": "Plotting from a DataFrame", "minutes": 15, "html": "<p>A Series has its own <code>plot<\/code> method that uses Matplotlib. Pass the axes you made with <code>ax=ax<\/code> so you can add labels as in week 10. <code>kind=\"bar\"<\/code> gives a bar chart.<\/p>\n<p>The cell below finds each sensor's temperature rise (maximum minus minimum) and plots it.<\/p>", "cells": [{"code": "import matplotlib.pyplot as plt\n\nrise = df.groupby(\"sensor\")[\"temp_c\"].max() - df.groupby(\"sensor\")[\"temp_c\"].min()\nprint(rise.round(1).to_string())\n\nfig, ax = plt.subplots()\nrise.plot(kind=\"bar\", ax=ax)\nax.set_ylabel(\"Temperature rise (C)\")\nax.set_title(\"Rise during the test\")\n", "stdin": null, "note": "Sensor C heats up fastest."}]}], "lecture_minutes": 130, "lab": {"summary": "A multi-sensor log: load the table, select and filter, add a power column, compare sensors with groupby, repair a missing reading, and plot the temperature rise.", "intro_html": "<p>Every task starts from the same twelve-row sensor log. The starter code includes the CSV text and imports. Read the table with <code>pd.read_csv(io.StringIO(CSV))<\/code> and name the table <code>df<\/code> as shown.<\/p>\n<p>Tasks build on the starter of their own task only. Each task is graded independently, so you do not need to finish them in order.<\/p>", "tasks": [{"id": "t1", "title": "Load and inspect", "points": 15, "minutes": 20, "bonus": false, "prompt_html": "< or, mean_power)\n", "hint_html": "<p><code>df[\"power_w\"] = df[\"current_a\"] ** 2 * 12<\/code>. <code>idx = df[\"power_w\"].idxmax()<\/code> gives the row label, then <code>df.loc[idx, \"sensor\"]<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import io\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt", "items": [["power_w column exists", "'power_w' in df.columns", "Assign to df['power_w']."], ["first power value", "approx(df['power_w'].iloc[0], 0.52 ** 2 * 12)", "power_w = current_a ** 2 * 12"], ["max_power", "approx(max_power, 1.05 ** 2 * 12)", "Use df['power_w'].max()."], ["max_sensor is C", "max_sensor == 'C'", "Use idxmax and loc."], ["mean_power", "approx(mean_power, float(((np.array([0.52,0.55,0.61,0.66,0.48,0.49,0.50,0.53,0.80,0.88,0.97,1.05]) ** 2) * 12).mean()))", "Use df['power_w'].mean()."]]}}, {"id": "t4", "title": "Compare sensors with groupby", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Create <code>means<\/code>, the average <code>temp_c<\/code> for each sensor, using <code>groupby<\/code>. Store <code>hottest<\/code> (the sensor with the highest average) and <code>coolest<\/code> (the lowest). Create <code>ranges<\/code>, a table with the <code>min<\/code> and <code>max<\/code> temperature of each sensor.<\/p>", "starter": "import io\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nCSV = \"\"\"sensor,time_s,temp_c,current_a\nA,0,20.1,0.52\nA,10,20.8,0.55\nA,20,21.9,0.61\nA,30,23.4,0.66\nB,0,19.7,0.48\nB,10,19.9,0.49\nB,20,,0.50\nB,30,20.6,0.53\nC,0,25.0,0.80\nC,10,27.5,0.88\nC,20,30.1,0.97\nC,30,33.0,1.05\n\"\"\"\n\ndf = pd.read_csv(io.StringIO(CSV))\n\nmeans = ...\nhottest = ...\ncoolest = ...\nranges = ...\n\nprint(means.round(2).to_string())\nprint(hottest, coolest)\n", "hint_html": "<p><code>means = df.groupby(\"sensor\")[\"temp_c\"].mean()<\/code>. <code>means.idxmax()<\/code> and <code>means.idxmin()<\/code> give the names. <code>ranges = df.groupby(\"sensor\")[\"temp_c\"].agg([\"min\", \"max\"])<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import io\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt", "items": [["mean of A", "approx(means['A'], 21.55)", "Group by 'sensor' and average temp_c."], ["mean of B ignores the blank", "approx(means['B'], 20.0666667, rel=1e-5)", "mean() skips NaN automatically."], ["mean of C", "approx(means['C'], 28.9)", "Average the four C readings."], ["hottest is C", "hottest == 'C'", "Use means.idxmax()."], ["coolest is B", "coolest == 'B'", "Use means.idxmin()."], ["ranges for C", "approx(ranges.loc['C', 'min'], 25.0) and approx(ranges.loc['C', 'max'], 33.0)", "Use .agg(['min', 'max'])."]]}}, {"id": "t5", "title": "Repair the missing reading", "points": 20, "minutes": 30, "bonus": false, "prompt_html": "<p>Count the missing values in each column and store the missing count of <code>temp_c<\/code> in <code>n_missing<\/code>. Create <code>dropped<\/code> (rows with any missing value removed) and <code>n_dropped_rows<\/code> (how many rows were removed). Create <code>df[\"temp_filled\"]<\/code> by replacing missing <code>temp_c<\/code> values with the mean temperature of sensor <code>B<\/code> (about 20.07). Store the repaired value for sensor <code>B<\/code> at 20 s in <code>repaired<\/code>.<\/p>", "starter": "import io\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nCSV = \"\"\"sensor,time_s,temp_c,current_a\nA,0,20.1,0.52\nA,10,20.8,0.55\nA,20,21.9,0.61\nA,30,23.4,0.66\nB,0,19.7,0.48\nB,10,19.9,0.49\nB,20,,0.50\nB,30,20.6,0.53\nC,0,25.0,0.80\nC,10,27.5,0.88\nC,20,30.1,0.97\nC,30,33.0,1.05\n\"\"\"\n\ndf = pd.read_csv(io.StringIO(CSV))\n\nn_missing = ...\ndropped = ...\nn_dropped_rows = ...\n# add df[\"temp_filled\"], filled with the mean temperature of sensor B\nrepaired = ...\n\nprint(n_missing, n_dropped_rows, repaired)\n", "hint_html": "<p><code>df[\"temp_c\"].isna().sum()<\/code> counts missing. <code>dropped = df.dropna()<\/code>. For the fill value use <code>b_mean = df[df[\"sensor\"] == \"B\"][\"temp_c\"].mean()<\/code> then <code>df[\"temp_c\"].fillna(b_mean)<\/code>. The repaired row is where sensor is B and time is 20.<\/p>", "stdin": null, "tests": {"setup": "import io\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt", "items": [["n_missing is 1", "int(n_missing) == 1", "Use df['temp_c'].isna().sum()."], ["dropped has 11 rows", "len(dropped) == 11", "Use df.dropna()."], ["n_dropped_rows is 1", "int(n_dropped_rows) == 1", "Compare row counts before and after."], ["no blanks in temp_filled", "int(df['temp_filled'].isna().sum()) == 0", "Use fillna on temp_c."], ["repaired value", "approx(repaired, 20.0666667, rel=1e-5)", "Fill with the mean of sensor B's valid readings."], ["other values unchanged", "approx(df['temp_filled'].iloc[0], 20.1)", "Only the missing cell changes."]]}}, {"id": "t6", "title": "Rise per sensor, plotted", "points": 20, "minutes": 25, "bonus": false, "prompt_html": "<p>Create <code>rise<\/code>, the maximum minus the minimum <code>temp_c<\/code> for each sensor (a Series indexed by sensor). Store <code>fastest<\/code> (the sensor with the largest rise). Plot <code>rise<\/code> as a bar chart on <code>ax<\/code>, with the y label <code>Temperature rise (C)<\/code> and the title <code>Rise during the test<\/code>.<\/p>", "starter": "import io\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nCSV = \"\"\"sensor,time_s,temp_c,current_a\nA,0,20.1,0.52\nA,10,20.8,0.55\nA,20,21.9,0.61\nA,30,23.4,0.66\nB,0,19.7,0.48\nB,10,19.9,0.49\nB,20,,0.50\nB,30,20.6,0.53\nC,0,25.0,0.80\nC,10,27.5,0.88\nC,20,30.1,0.97\nC,30,33.0,1.05\n\"\"\"\n\ndf = pd.read_csv(io.StringIO(CSV))\n\nrise = ...\nfastest = ...\n\nfig, ax = plt.subplots()\n# plot rise as a bar chart on ax, then set the y label and title\n", "hint_html": "<p><code>g = df.groupby(\"sensor\")[\"temp_c\"]<\/code> then <code>rise = g.max() - g.min()<\/code>. Plot with <code>rise.plot(kind=\"bar\", ax=ax)<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import io\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt", "items": [["rise values", "approx(rise['A'], 3.3) and approx(rise['B'], 0.9) and approx(rise['C'], 8.0)", "rise = group max minus group min."], ["fastest is C", "fastest == 'C'", "Use rise.idxmax()."], ["three bars", "len(ax.patches) == 3", "Use rise.plot(kind='bar', ax=ax)."], ["y label", "ax.get_ylabel() == 'Temperature rise (C)'", "Use ax.set_ylabel."], ["title", "ax.get_title() == 'Rise during the test'", "Use ax.set_title."]]}}, {"id": "b1", "title": "Reshape with pivot", "points": 10, "minutes": 20, "bonus": true, "prompt_html": "<p>Create <code>wide<\/code>, a table with one row per <code>time_s<\/code> and one column per sensor holding <code>temp_c<\/code>. Store the number of rows in <code>wide_rows<\/code> and the list of its column names in <code>wide_cols<\/code>.<\/p>", "starter": "import io\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nCSV = \"\"\"sensor,time_s,temp_c,current_a\nA,0,20.1,0.52\nA,10,20.8,0.55\nA,20,21.9,0.61\nA,30,23.4,0.66\nB,0,19.7,0.48\nB,10,19.9,0.49\nB,20,,0.50\nB,30,20.6,0.53\nC,0,25.0,0.80\nC,10,27.5,0.88\nC,20,30.1,0.97\nC,30,33.0,1.05\n\"\"\"\n\ndf = pd.read_csv(io.StringIO(CSV))\n\nwide = ...\nwide_rows = ...\nwide_cols = ...\n\nprint(wide.shape)\n", "hint_html": "<p><code>df.pivot(index=\"time_s\", columns=\"sensor\", values=\"temp_c\")<\/code> reshapes the table.<\/p>", "stdin": null, "tests": {"setup": "import io\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt", "items": [["shape is 4 by 3", "wide.shape == (4, 3)", "Use pivot with index='time_s' and columns='sensor'."], ["columns are sensors", "list(wide_cols) == ['A', 'B', 'C']", "The columns are the sensor names."], ["value check", "approx(wide.loc[30, 'C'], 33.0)", "values='temp_c'"]]}}]}, "lab_minutes": 150, "quiz": [{"q": "What does <code>pd.read_csv(io.StringIO(text))<\/code> do?", "options": ["Opens a file named by the string", "Converts a DataFrame to text", "Writes the string to a file", "Builds a DataFrame from CSV text held in a string"], "answer": 3, "why": "<code>StringIO<\/code> wraps text so <code>read_csv<\/code> can read it like a file."}, {"q": "A DataFrame has 12 rows and 4 columns. What is <code>df.shape<\/code>?", "options": ["<code>(12, 4)<\/code>", "<code>48<\/code>", "<code>(4, 12)<\/code>", "<code>[12, 4]<\/code>"], "answer": 0, "why": "<code>shape<\/code> lists rows first, then columns."}, {"q": "How do you select the <code>temp_c<\/code> column?", "options": ["<code>df(temp_c)<\/code>", "<code>df[\"temp_c\"]<\/code>", "<code>df.select(temp_c)<\/code>", "<code>df[temp_c]<\/code>"], "answer": 1, "why": "A column name is a string inside square brackets."}, {"q": "What is the difference between <code>loc<\/code> and <code>iloc<\/code>?", "options": ["They are identical", "<code>loc<\/code> is for rows and <code>iloc<\/code> is for columns", "<code>loc<\/code> selects by label and <code>iloc<\/code> selects by position", "<code>loc<\/code> is faster"], "answer": 2, "why": "<code>loc<\/code> uses labels and column names. <code>iloc<\/code> uses integer positions."}, {"q": "Which expression keeps rows where <code>temp_c<\/code> is above 25?", "options": ["<code>df[\"temp_c\" &gt; 25]<\/code>", "<code>df.keep(temp_c &gt; 25)<\/code>", "<code>df[temp_c &gt; 25]<\/code>", "<code>df[df[\"temp_c\"] &gt; 25]<\/code>"], "answer": 3, "why": "A boolean mask inside square brackets keeps the True rows."}, {"q": "How do you combine two conditions in a pandas filter?", "options": ["<code>(a &gt; 1) &amp; (b == 2)<\/code>", "<code>a &gt; 1, b == 2<\/code>", "<code>a &gt; 1 and b == 2<\/code>", "<code>a &gt; 1 &amp;&amp; b == 2<\/code>"], "answer": 0, "why": "Use <code>&amp;<\/code> with parentheses around each comparison."}, {"q": "What does <code>df[\"p\"] = df[\"i\"] ** 2 * 12<\/code> do if <code>p<\/code> is not <script id="harness" type="text/x-python">import sys, io, os, json, ast, base64, builtins, traceback, contextlib, math, random

os.environ.setdefault("MPLBACKEND", "Agg")
import importlib
if "" not in sys.path:
    sys.path.insert(0, "")

_OUT_CAP = 20000
_LECTURE_NS = {"__name__": "__main__"}


class _Capped(io.StringIO):
    def write(self, s):
        if self.tell() > _OUT_CAP:
            raise RuntimeError("Output limit reached. Your code printed too much text.")
        return super().write(s)


def approx(a, b, rel=1e-6, abs_=1e-9):
    try:
        if "numpy" in sys.modules:
            import numpy as _np
            if isinstance(a, _np.ndarray) or isinstance(b, _np.ndarray):
                return bool(_np.allclose(a, b, rtol=rel, atol=abs_))
        if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
            return len(a) == len(b) and all(approx(x, y, rel, abs_) for x, y in zip(a, b))
        return abs(float(a) - float(b)) <= max(abs_, rel * abs(float(b)))
    except Exception:
        return False


def uses_node(src, *names):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    wanted = tuple(getattr(ast, n) for n in names)
    return any(isinstance(n, wanted) for n in ast.walk(tree))


def calls_name(src, name):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    for n in ast.walk(tree):
        if isinstance(n, ast.Call):
            f = n.func
            if isinstance(f, ast.Name) and f.id == name:
                return True
            if isinstance(f, ast.Attribute) and f.attr == name:
                return True
    return False


def line_has(src, target, *words):
    """True when an assignment to `target` has every word on its right side."""
    for line in src.splitlines():
        s = line.strip()
        if s.startswith("#") or "=" not in s:
            continue
        left, _, right = s.partition("=")
        if left.strip() == target and all(w in right for w in words):
            return True
    return False


def run_with(src, inputs=(), ns=None):
    """Run student source with scripted input() values; return what it printed."""
    queue = list(inputs)
    old = builtins.input

    def _fake(prompt=""):
        print(prompt, end="")
        if not queue:
            raise EOFError("input() called more times than expected")
        v = queue.pop(0)
        print(v)
        return v

    buf = io.StringIO()
    builtins.input = _fake
    try:
        with contextlib.redirect_stdout(buf):
            exec(compile(src, "<your code>", "exec"), ns if ns is not None else {"__name__": "__main__"})
    finally:
        builtins.input = old
    return buf.getvalue()


def rerun(src, **over):
    """Execute student source again with top-level assignments replaced by the given constants.
    Returns the resulting namespace. Output is discarded."""
    tree = ast.parse(src)
    for node in tree.body:
        if (isinstance(node, ast.Assign) and len(node.targets) == 1
                and isinstance(node.targets[0], ast.Name) and node.targets[0].id in over):
            node.value = ast.Constant(over[node.targets[0].id])
    ast.fix_missing_locations(tree)
    ns = {"__name__": "__main__"}
    with contextlib.redirect_stdout(io.StringIO()):
        exec(compile(tree, "<your code>", "exec"), ns)
    return ns


def count_defs(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.FunctionDef) for n in ast.walk(tree))


def count_classes(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.ClassDef) for n in ast.walk(tree))


def _format_error(exc, code):
    lines = code.split("\n")
    if isinstance(exc, SyntaxError):
        ln = exc.lineno
        msg = "SyntaxError: " + str(exc.msg)
        if ln and 1 <= ln <= len(lines):
            msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
        return msg
    tb = traceback.TracebackException.from_exception(exc)
    ln = None
    for fs in tb.stack:
        if fs.filename == "<your code>":
            ln = fs.lineno
    msg = "".join(tb.format_exception_only()).strip()
    if ln and 1 <= ln <= len(lines):
        msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
    return msg


def _make_input(stdin_lines, out):
    queue = list(stdin_lines)

    def _input(prompt=""):
        out.write(str(prompt))
        if not queue:
            raise EOFError("input() ran out of lines. Type one value per line in the Input box under the code.")
        val = queue.pop(0)
        out.write(val + "\n")
        return val

    return _input


def _exec_code(code, ns, out):
    tree = ast.parse(code, "<your code>", "exec")
    last = None
    if tree.body and isinstance(tree.body[-1], ast.Expr):
        last = ast.Expression(tree.body.pop().value)
    exec(compile(tree, "<your code>", "exec"), ns)
    if last is not None:
        val = eval(compile(last, "<your code>", "eval"), ns)
        if val is not None:
            out.write(repr(val) + "\n")


def _collect_images():
    imgs = []
    if "matplotlib.pyplot" in sys.modules:
        import matplotlib.pyplot as plt
        for num in plt.get_fignums():
            fig = plt.figure(num)
            buf = io.BytesIO()
            fig.savefig(buf, format="png", dpi=100, bbox_inches="tight")
            imgs.append(base64.b64encode(buf.getvalue()).decode("ascii"))
        plt.close("all")
    return imgs


def reset_lecture():
    _LECTURE_NS.clear()
    _LECTURE_NS["__name__"] = "__main__"


def run_cell(req_json):
    req = json.loads(req_json)
    code = req.get("code", "")
    mode = req.get("mode", "fresh")
    stdin_lines = req.get("stdin") or []
    tests = req.get("tests")
    ns = _LECTURE_NS if mode == "lecture" else {"__name__": "__main__"}
    importlib.invalidate_caches()
    out = _Capped()
    err = None
    real_input = builtins.input
    builtins.input = _make_input(stdin_lines, out)
    try:
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
            try:
                random.seed()
                _exec_code(code, ns, out)
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                err = _format_error(exc, code)
    finally:
        builtins.input = real_input
    result = {"stdout": out.getvalue(), "error": err, "images": [], "tests": None}
    try:
        result["images"] = _collect_images()
    except Exception as exc:
        result["stdout"] += "\n(Plot could not be drawn: %s)" % exc
    if tests is not None:
        result["tests"] = _run_tests(tests, ns, code, err, out.getvalue())
    return json.dumps(result)


def _run_tests(tests, ns, code, err, stdout_text):
    items = tests.get("items", [])
    results = []
    if err is not None:
        for label, _expr, hint in items:
            results.append({"label": label, "ok": False, "msg": "Fix the error above first."})
        return results
    env = ns
    helpers = {
        "approx": approx, "out": stdout_text, "src": code, "ast": ast,
        "uses_node": uses_node, "calls_name": calls_name,
        "count_defs": count_defs, "run_with": run_with, "rerun": rerun, "count_classes": count_classes, "line_has": line_has,
        "math": math, "random": random, "io": io, "_in_tests": True,
    }
    _missing = object()
    saved = {k: env.get(k, _missing) for k in helpers}
    env.update(helpers)
    sink = _Capped()
    try:
        setup = tests.get("setup")
        if setup:
            try:
                with contextlib.redirect_stdout(sink):
                    exec(compile(setup, "<tests>", "exec"), env)
            except BaseException as exc:
                reason = "Could not run the checks: %s: %s" % (type(exc).__name__, exc)
                return [{"label": l, "ok": False, "msg": reason} for l, _e, _h in items]
        for label, expr, hint in items:
            try:
                with contextlib.redirect_stdout(sink):
                    ok = bool(eval(compile(expr, "<tests>", "eval"), env))
                results.append({"label": label, "ok": ok, "msg": "" if ok else hint})
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                results.append({"label": label, "ok": False,
                                "msg": "%s (%s: %s)" % (hint, type(exc).__name__, exc)})
    finally:
        for k, v in saved.items():
            if v is _missing:
                env.pop(k, None)
            else:
                env[k] = v
    return results

      await py.loadPackagesFromImports(m.code, quiet);

      card.appendChild(mcq({ q: s.check.q, options: s.check.options, answer: s.check.answer, why: s.check.why, saved: S.checks[id], onAnswer: function (k) { S.checks[id] = k; save(); } }));
    }
    var cb = h('input', { type: 'checkbox', id: 'done' + i });
    cb.checked = !!S.lecDone[i];
    cb.addEventListener('change', function () { S.lecDone[i] = cb.checked; save(); updateLecture(); });
    card.appendChild(h('div', { class: 'done-row' }, [cb, h('label', { for: 'done' + i, text: 'Mark this section complete' })]));
    p.appendChild(card);
  });
  p.appendChild(h('h2', { text: 'Week summary' }));
  p.appendChild(h('div', { class: 'card', html: D.summary }));
  updateLecture();
}

/* ---------- lab ---------- */
function labScore() {
  var tot = 0, bonus = 0;
  D.lab.tasks.forEach(function (t) {
    var r = S.lab[t.id]; if (r && r.total) { var v = t.points * r.passed / r.total; if (t.bonus) { bonus += v; } else { tot += v; } }
  });
  return { score: Math.round(tot * 10) / 10, bonus: Math.round(bonus * 10) / 10 };
}
function updateLab() {
  var s = labScore();
  var max = D.lab.tasks.filter(function (t) { return !t.bonus; }).reduce(function (a, t) { return a + t.points; }, 0);
  var el = document.getElementById('labscore'); if (el) { el.textContent = s.score + ' / ' + max + (s.bonus ? ' (+' + s.bonus + ' bonus)' : ''); }
  tiles.lab.textContent = s.score + '/' + max;
}
function renderLab() {
  var p = document.getElementById('panel-lab');
  p.innerHTML = '';
  p.appendChild(h('div', { class: 'card', html: D.lab.intro_html }));
  var sc = h('div', { class: 'row' }, [h('strong', { text: 'Lab score: ' }), h('span', { id: 'labscore', class: 'badge info', text: '0' }), h('span', { class: 'small', text: 'Updates each time you press Check my work.' })]);
  p.appendChild(sc);
  D.lab.tasks.forEach(function (t, i) {
    var card = h('div', { class: 'card' });
    card.appendChild(h('p', { class: 'meta', text: (t.bonus ? 'Bonus challenge' : 'Task ' + (i + 1)) + ', ' + t.points + (t.bonus ? ' bonus points' : ' points') + ', about ' + t.minutes + ' minutes' }));
    card.appendChild(h('h3', { text: t.title }));
    card.appendChild(h('div', { html: t.prompt_html }));
    var res = S.lab[t.id];
    var note = h('p', { class: 'small', text: res ? ('Last check: ' + res.passed + ' of ' + res.total + ' tests passed.') : 'Not checked yet.' });
    var cell = codeCell({
      key: 'lab_' + t.id, code: t.starter, stdin: t.stdin, mode: 'fresh', tests: t.tests, hint: t.hint_html, timeout: 20, label: 'Code for ' + t.title,
      hasResult: function () { return !!S.lab[t.id]; },
      onCheck: function (r) {
        var passed = r.tests ? r.tests.filter(function (x) { return x.ok; }).length : 0;
        S.lab[t.id] = { passed: passed, total: r.tests ? r.tests.length : 0, at: new Date().toISOString() };
        save(); note.textContent = 'Last check: ' + passed + ' of ' + S.lab[t.id].total + ' tests passed.'; updateLab();
      }
    });
    card.appendChild(cell); card.appendChild(note);
    p.appendChild(card);
  });
  p.appendChild(h('h2', { text: 'Submit your work' }));
  var rep = h('div', { class: 'card' });
  rep.appendChild(h('p', { text: 'Enter your name, then copy the report or download it. Submit it the way your instructor asks. The report lists your scores and your final code for each task.' }));
  var nm = h('input', { type: 'text', id: 'stname', 'aria-label': 'Your name', placeholder: 'Your name', autocomplete: 'name' });
  nm.value = S.name;
  nm.addEventListener('input', function () { S.name = nm.value; save(); });
  rep.appendChild(h('div', { class: 'field' }, [h('label', { for: 'stname', text: 'Name' }), nm]));
  var ta = h('textarea', { class: 'report', readonly: '', 'aria-label': 'Report text' });
  var b1 = h('button', { class: 'btn primary', text: 'Build report', onclick: function () { ta.value = buildReport(); } });
  var b2 = h('button', { class: 'btn', text: 'Copy report', onclick: function () {
    ta.value = buildReport(); ta.select();
    var done = function () { b2.textContent = 'Copied'; setTimeout(function () { b2.textContent = 'Copy report'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(done, function () { try { document.execCommand('copy'); done(); } catch (e) {} }); }
    else { try { document.execCommand('copy'); done(); } catch (e) {} }
  } });
  var b3 = h('button', { class: 'btn', text: 'Download .txt', onclick: function () {
    var txt = buildReport(); ta.value = txt;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
    a.download = 'week' + D.num + '_report.txt'; document.body.appendChild(a); a.click(); a.remove();
  } });
  rep.appendChild(h('div', { class: 'row' }, [b1, b2, b3]));
  rep.appendChild(ta);
  p.appendChild(rep);
  updateLab();
}
function quizTally() {
  var correct = 0, answered = 0;
  D.quiz.forEach(function (q, i) { var a = S.quiz[i]; if (a !== undefined && a !== null) { answered++; if (a === q.answer) { correct++; } } });
  return { correct: correct, answered: answered, total: D.quiz.length };
}
function buildReport() {
  var L = [], s = labScore(), q = quizTally();
  var max = D.lab.tasks.filter(function (t) { return !t.bonus; }).reduce(function (a, t) { return a + t.points; }, 0);
  var lec = D.lecture.filter(function (_s, i) { return S.lecDone[i]; }).length;
  L.push('Course: ' + D.course_title);
  L.push('Week ' + D.num + ': ' + D.title);
  L.push('Name: ' + (S.name || '(not entered)'));
  L.push('Generated: ' + new Date().toLocaleString());
  L.push('');
  L.push('Lecture sections marked complete: ' + lec + ' of ' + D.lecture.length);
  L.push('Lab score (browser autograder): ' + s.score + ' of ' + max + (s.bonus ? ', bonus ' + s.bonus : ''));
  L.push('Quiz: ' + q.correct + ' correct, ' + q.answered + ' answered, ' + q.total + ' questions');
  L.push('');
  D.lab.tasks.forEach(function (t, i) {
    var r = S.lab[t.id];
    L.push('==== ' + (t.bonus ? 'Bonus' : 'Task ' + (i + 1)) + ': ' + t.title + ' (' + (r ? r.passed + '/' + r.total + ' tests' : 'not checked') + ') ====');
    L.push(S.code['lab_' + t.id] !== undefined ? S.code['lab_' + t.id] : t.starter);
    L.push('');
  });
  return L.join('\n');
}

/* ---------- quiz ---------- */
function updateQuiz() {
  var q = quizTally();
  var el = document.getElementById('quizscore');
  if (el) { el.textContent = q.correct + ' correct of ' + q.answered + ' answered, ' + q.total + ' questions'; }
  tiles.quiz.textContent = q.correct + '/' + q.total;
}
function renderQuiz() {
  var p = document.getElementById('panel-quiz');
  p.innerHTML = '';
  p.appendChild(h('div', { class: 'card', html: D.quiz_intro_html }));
  p.appendChild(h('div', { class: 'row' }, [
    h('strong', { text: 'Score: ' }), h('span', { id: 'quizscore', class: 'badge info' }),
    h('span', { style: 'flex:1' }),
    h('button', { class: 'btn', text: 'Reset quiz', onclick: function () {
      if (!confirm('Clear all quiz answers?')) { return; } S.quiz = {}; save(); renderQuiz();
    } })
  ]));
  D.quiz.forEach(function (q, i) {
    var card = h('div', { class: 'card' });
    card.appendChild(h('p', { class: 'meta', text: 'Question ' + (i + 1) + ' of ' + D.quiz.length }));
    card.appendChild(mcq({ cls: 'qbox', q: q.q, options: q.options, answer: q.answer, why: q.why, saved: S.quiz[i], onAnswer: function (k) { S.quiz[i] = k; save(); updateQuiz(); } }));
    p.appendChild(card);
  });
  updateQuiz();
}

/* ---------- shell ---------- */
document.getElementById('kicker').textContent = D.course_title + ', Week ' + D.num;
document.getElementById('title').textContent = D.title;
document.title = D.course_title + ' Week ' + D.num + ' ' + D.title;
var chips = document.getElementById('chips');
[D.lecture_minutes + ' min lecture', D.lab_minutes + ' min lab', D.quiz.length + ' quiz questions'].forEach(function (t) { chips.appendChild(h('li', { text: t })); });
var tabs = [['overview', 'Overview'], ['lecture', 'Lecture'], ['lab', 'Lab'], ['quiz', 'Quiz']];
var tl = document.getElementById('tablist');
tabs.forEach(function (t) {
  var b = h('button', { role: 'tab', id: 'tab-' + t[0], 'aria-controls': 'panel-' + t[0], 'aria-selected': 'false', text: t[1] });
  b.addEventListener('click', function () { show(t[0]); });
  tl.appendChild(b);
});
function show(name) {
  tabs.forEach(function (t) {
    document.getElementById('panel-' + t[0]).hidden = (t[0] !== name);
    document.getElementById('tab-' + t[0]).setAttribute('aria-selected', t[0] === name ? 'true' : 'false');
  });
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
  window.scrollTo(0, 0);
  document.querySelectorAll('#panel-' + name + ' textarea.code').forEach(function (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 4, 640) + 'px'; });
}
renderOverview(); renderLecture(); renderLab(); renderQuiz();
var start = (location.hash || '').replace('#', '');
show(tabs.some(function (t) { return t[0] === start; }) ? start : 'overview');
})();
</script>
</body>
</html>
