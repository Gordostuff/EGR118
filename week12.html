<style>
:root{
  --bg:#f6f5f0; --card:#ffffff; --ink:#1a1f24; --mute:#59636e; --line:#d9d6cb;
  --accent:#0a5aa0; --accent-ink:#ffffff; --accent-soft:#e4eef8;
  --ok:#17692f; --ok-bg:#e5f3e9; --bad:#a82217; --bad-bg:#fcebe8; --warn:#8a5a00; --warn-bg:#fdf3dc;
  --code-bg:#f0eee6; --out-bg:#e6edf6; --out-ink:#0a2a66;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151a; --card:#192028; --ink:#e7ebef; --mute:#9aa6b2; --line:#2c3641;
    --accent:#5eaeea; --accent-ink:#0b1219; --accent-soft:#17283a;
    --ok:#6fd08c; --ok-bg:#15301f; --bad:#ff8a7d; --bad-bg:#3a1b18; --warn:#f0c060; --warn-bg:#33290f;
    --code-bg:#10161c; --out-bg:#e6edf6; --out-ink:#0a2a66;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:50}
header.top{padding:28px 0 12px}
.kicker{font-size:13px;color:var(--mute);letter-spacing:.02em;margin:0 0 4px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.2;margin:0 0 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:13px;border:1px solid var(--line);background:var(--card);padding:2px 10px;border-radius:999px;color:var(--mute)}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--mute);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.statusbar{position:sticky;top:46px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:6px 12px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.statusbar .grow{flex:1}
main{padding:16px 0 80px}
.panel[hidden]{display:none}
h2{font-size:22px;margin:24px 0 8px;font-weight:600}
h3{font-size:18px;margin:0 0 6px;font-weight:600}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:22px}
li{margin:2px 0}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
.card .meta{font-size:13px;color:var(--mute);margin:0 0 8px}
.hook{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .big{font-size:24px;font-weight:600;font-family:var(--mono)}
.tile .lbl{font-size:13px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.bar>span{display:block;height:100%;background:var(--accent);width:0}
button.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.cell{margin:12px 0}
textarea.code{display:block;width:100%;font-family:var(--mono);font-size:14px;line-height:1.5;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;resize:vertical;tab-size:4;white-space:pre;overflow:auto;min-height:60px}
.stdin{margin-top:6px}
.stdin label{font-size:13px;color:var(--mute);display:block}
textarea.stdin-box{width:100%;font-family:var(--mono);font-size:13px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:48px}
.out{margin-top:8px}
pre.stdout{margin:0;background:var(--out-bg);color:var(--out-ink);font-family:var(--mono);font-size:13.5px;padding:10px 12px;border-radius:6px;border:1px solid #b9c8dc;overflow:auto;white-space:pre-wrap;word-break:break-word}
.err{margin-top:8px;border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:8px 12px;font-size:14px}
.err pre{margin:4px 0 0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;color:inherit}
.out img{max-width:100%;height:auto;background:#fff;border-radius:6px;margin-top:8px;border:1px solid var(--line)}
.tests{list-style:none;margin:8px 0 0;padding:0}
.tests li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.badge{font-family:var(--mono);font-size:12px;font-weight:500;padding:1px 8px;border-radius:4px;flex:none}
.badge.pass{background:var(--ok-bg);color:var(--ok)}
.badge.fail{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.hint{margin:8px 0;padding:8px 12px;background:var(--warn-bg);color:var(--ink);border-radius:6px;font-size:14px;border:1px solid var(--line)}
.q{margin:0 0 6px;font-weight:500}
.q p{margin:0 0 8px}
.q pre,.card pre{background:var(--code-bg);padding:8px 12px;border-radius:6px;overflow:auto;font-family:var(--mono);font-size:13.5px;font-weight:400;margin:0 0 10px}
.q pre code,.card pre code{background:none;padding:0}
.opts{list-style:none;padding:0;margin:0}
.opts button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:var(--ok-bg)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opts button:disabled{cursor:default}
.why{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:6px;background:var(--accent-soft)}
.checkq{margin:14px 0 4px;padding:12px;border:1px dashed var(--line);border-radius:8px}
.done-row{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.field input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-width:240px}
textarea.report{width:100%;min-height:200px;font-family:var(--mono);font-size:12.5px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px}
table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code-bg)}
.small{font-size:13px;color:var(--mute)}
@media (max-width:600px){ .field input{min-width:0;width:100%} .statusbar{top:44px} }
</style>

<script id="data" type="application/json">{"course_id": "pyeng", "course_title": "Python for Engineers", "pyodide_base": "https://cdn.jsdelivr.net/pyodide/v0.27.8/full/", "num": 12, "title": "Numerical Methods: Roots, Linear Systems, and Curve Fits", "hook": "Algebra gives exact answers to a few problems. Engineering hands you the rest: a diode in series with a resistor, a truss joint with two unknown forces, a sensor with a calibration curve you must fit. This week you solve each with a short numerical method and check the result by substitution. Every method here is a handful of lines and every answer comes with an error you can measure.", "objectives": ["find a root of <code>f(x) = 0<\/code> by bisection and state its accuracy", "solve a nonlinear circuit for a diode voltage", "write a system of equations as <code>A x = b<\/code> and solve it with <code>np.linalg.solve<\/code>", "compute truss member forces from joint equilibrium", "fit a calibration line with <code>np.polyfit<\/code> and measure the residuals and R squared", "interpolate with <code>np.interp<\/code> and integrate with the trapezoid rule"], "summary": "<ul><li>Bisection: keep the half-interval where <code>f<\/code> changes sign. Each step halves the error. About 20 steps take width 1 to 1e-6.<\/li><li>Check a root with <code>abs(f(root))<\/code>. Report sensible digits.<\/li><li>A series diode circuit leads to <code>(Vs - Vd) / R - Id(Vd) = 0<\/code>, which bisection solves between 0 and 1 V.<\/li><li>Write linear equations as <code>A x = b<\/code> and solve with <code>np.linalg.solve(A, b)<\/code>. Check with <code>np.allclose(A @ x, b)<\/code>.<\/li><li>Joint equilibrium: forces sum to zero in x and y. Positive tension pulls on the joint.<\/li><li><code>np.polyfit(x, y, 1)<\/code> gives a line. Check residuals and R squared before trusting it. <code>np.polyval<\/code> evaluates a fit.<\/li><li><code>np.interp<\/code> estimates between samples. The trapezoid sum approximates area and energy.<\/li><\/ul>", "lecture": [{"title": "Why numerical methods", "minutes": 15, "html": "<p>Many equations have no closed-form solution. Try to solve <code>x**3 - 2*x - 5 = 0<\/code> with algebra: there is a formula for cubics, but it is unpleasant, and for <code>exp<\/code> and <code>sin<\/code> mixed with powers there is none. A computer finds a good approximate answer in milliseconds.<\/p>\n<p>A numerical method gives an answer with an error you control. You pick a <strong>tolerance<\/strong>, the size of error you accept, such as 1e-6. Then you verify the answer by substituting it back: if <code>f(x)<\/code> is close to zero, the root is good.<\/p>\n<p>Here is the target equation. A graph of <code>f<\/code> crosses zero near x = 2.1. Evaluate <code>f<\/code> at 2 and 3 and look at the signs.<\/p>", "cells": [{"code": "import math\nimport numpy as np\n\ndef f(x):\n    return x ** 3 - 2 * x - 5\n\nprint(f(2), f(3))\nprint(f(2) * f(3) < 0)\n", "stdin": null, "note": "<code>f(2)<\/code> is negative and <code>f(3)<\/code> is positive, so a root lies between them. This is the sign-change test."}], "check": {"q": "If <code>f(a)<\/code> is negative and <code>f(b)<\/code> is positive for a continuous <code>f<\/code>, what do you know?", "options": ["<code>f(a)<\/code> equals <code>f(b)<\/code>", "A root lies between <code>a<\/code> and <code>b<\/code>", "Exactly two roots exist", "No root lies between <code>a<\/code> and <code>b<\/code>"], "answer": 1, "why": "A continuous function must cross zero to change sign."}}, {"title": "Bisection", "minutes": 20, "html": "<p><strong>Bisection<\/strong> halves the interval again and again. Start with <code>a<\/code> and <code>b<\/code> where <code>f<\/code> changes sign. Find the midpoint <code>m<\/code>. If the sign change is in the left half, set <code>b = m<\/code>. Otherwise set <code>a = m<\/code>. Repeat until the interval is shorter than the tolerance.<\/p>\n<p>Each step halves the interval, so after n steps the interval is the starting width divided by 2 to the n. Going from width 1 to 1e-6 takes about 20 steps.<\/p>", "cells": [{"code": "def bisect(f, a, b, tol=1e-6):\n    \"\"\"Return a root of f between a and b. f(a) and f(b) must have opposite signs.\"\"\"\n    while b - a > tol:\n        m = (a + b) / 2\n        if f(a) * f(m) <= 0:\n            b = m\n        else:\n            a = m\n    return (a + b) / 2\n\nroot = bisect(f, 2, 3, 1e-6)\nprint(round(root, 5))\nprint(\"f(root) =\", round(f(root), 7))\n", "stdin": null, "note": "The residual <code>f(root)<\/code> shows how close to zero the function is at the answer."}, {"code": "import math\nsteps = math.ceil(math.log2((3 - 2) / 1e-6))\nprint(steps, \"steps for a tolerance of 1e-6\")\n", "stdin": null, "note": null}], "check": {"q": "After 10 bisection steps on an interval of width 8, how wide is the interval?", "options": ["8 / 100", "8 / 10", "8 / 20", "8 / 1024"], "answer": 3, "why": "Each step halves the width, so ten steps divide it by 2 to the 10, which is 1024."}}, {"title": "Engineering example: a diode and a resistor", "minutes": 15, "html": "<p>A 5 V supply drives a diode through a 1 kohm resistor. The diode current follows <code>Id = Is * (exp(Vd / nVt) - 1)<\/code>. The resistor current is <code>(Vs - Vd) / R<\/code>. In a series circuit they are equal, so the unknown diode voltage makes this function zero:<\/p>\n<p><code>g(Vd) = (Vs - Vd) / R - Is * (exp(Vd / nVt) - 1)<\/code><\/p>\n<p>You cannot isolate <code>Vd<\/code> with algebra. Bisection solves it. The diode voltage must be between 0 and 1 V, which gives the starting bracket.<\/p>", "cells": [{"code": "Is, nVt = 1e-12, 0.0259\nVs, R = 5.0, 1000.0\n\ndef g(vd):\n    return (Vs - vd) / R - Is * (math.exp(vd / nVt) - 1)\n\nvd = bisect(g, 0, 1, 1e-9)\ni_ma = (Vs - vd) / R * 1000\nprint(\"Diode voltage:\", round(vd, 4), \"V\")\nprint(\"Current:\", round(i_ma, 3), \"mA\")\n", "stdin": null, "note": "The familiar 0.6 to 0.7 V drop appears from the equation alone."}], "check": {"q": "Why is bisection a good fit for the diode circuit?", "options": ["It needs no starting values", "The equation cannot be solved for the voltage with algebra, and the sign changes between 0 V and 1 V", "The equation is linear", "Bisection always returns exactly zero"], "answer": 1, "why": "The exponential blocks an algebraic solution. A sign change gives bisection a bracket."}}, {"title": "Linear systems with NumPy", "minutes": 15, "html": "<p>Circuits and structures produce several linear equations in several unknowns. Write them as <code>A x = b<\/code>: <code>A<\/code> holds the coefficients, <code>x<\/code> holds the unknowns, and <code>b<\/code> holds the right-hand sides.<\/p>\n<p><code>np.linalg.solve(A, b)<\/code> returns <code>x<\/code>. Check the answer with <code>A @ x<\/code>, which should reproduce <code>b<\/code> (the <code>@<\/code> operator multiplies a matrix by a vector).<\/p>\n<p>Example, two mesh currents in a circuit: <code>10 i1 - 4 i2 = 12<\/code> and <code>-4 i1 + 12 i2 = 0<\/code>.<\/p>", "cells": [{"code": "A = np.array([[10.0, -4.0],\n              [-4.0, 12.0]])\nb = np.array([12.0, 0.0])\n\ni = np.linalg.solve(A, b)\nprint(np.round(i, 4))\nprint(np.allclose(A @ i, b))\n", "stdin": null, "note": "<code>allclose<\/code> confirms the answer satisfies both equations."}], "check": {"q": "In <code>A x = b<\/code>, what does <code>np.linalg.solve(A, b)<\/code> return?", "options": ["The determinant of <code>A<\/code>", "The matrix <code>A<\/code> inverted twice", "The vector <code>b<\/code>", "The unknown vector <code>x<\/code>"], "answer": 3, "why": "<code>solve<\/code> finds the <code>x<\/code> that satisfies the equations."}}, {"title": "Truss forces from joint equilibrium", "minutes": 20, "html": "<p>A truss joint holds still, so the forces on it sum to zero in x and in y. Two bars pull on a joint that carries a 1000 N downward load. Bar 1 leaves the joint at 150 degrees and bar 2 at 60 degrees. Let <code>T1<\/code> and <code>T2<\/code> be the tensions.<\/p>\n<ul><li>x direction: <code>T1 cos(150) + T2 cos(60) = 0<\/code><\/li><li>y direction: <code>T1 sin(150) + T2 sin(60) = 1000<\/code><\/li><\/ul>\n<p>Positive tension means the bar pulls on the joint. Solve the two equations together, and also report the size of the <strong>residual<\/strong>, <code>A @ T - b<\/code>, which is a numerical check.<\/p>", "cells": [{"code": "a1, a2 = np.radians(150), np.radians(60)\nA = np.array([[np.cos(a1), np.cos(a2)],\n              [np.sin(a1), np.sin(a2)]])\nb = np.array([0.0, 1000.0])\n\nT = np.linalg.solve(A, b)\nprint(\"T1 =\", round(T[0], 1), \"N\")\nprint(\"T2 =\", round(T[1], 1), \"N\")\nprint(\"max residual:\", abs(A @ T - b).max() < 1e-9)\n", "stdin": null, "note": "The steeper bar carries more force. Try other angles."}], "check": {"q": "Why does a truss joint give two equations?", "options": ["NumPy requires two equations", "The forces must sum to zero in the x direction and in the y direction", "Every joint has exactly two bars", "Two loads always act on the joint"], "answer": 1, "why": "Equilibrium in the plane is one equation per direction."}}, {"title": "Fitting a calibration curve", "minutes": 20, "html": "<p>A sensor reads 0.5 to 3.0 V while a reference thermometer reads the true temperature. You want a formula that converts voltage to temperature. <code>np.polyfit(V, T, 1)<\/code> gives the best-fit slope and intercept. Use <code>np.polyval(coeffs, V)<\/code> to evaluate the line.<\/p>\n<p>Measure the quality with <strong>residuals<\/strong> (<code>T - fit<\/code>) and with <strong>R squared<\/strong>: <code>1 - sum(residuals<strong>2) / sum((T - T.mean())<\/strong>2)<\/code>. A value close to 1 means the line explains almost all of the variation. A degree-2 fit adds a curvature term; check whether it helps before you use it.<\/p>", "cells": [{"code": "V = np.array([0.5, 1.0, 1.5, 2.0, 2.5, 3.0])\nT = np.array([10.2, 19.8, 30.5, 39.9, 50.4, 59.7])\n\nslope, intercept = np.polyfit(V, T, 1)\nfit = slope * V + intercept\nresid = T - fit\nr2 = 1 - np.sum(resid ** 2) / np.sum((T - T.mean()) ** 2)\n\nprint(\"T =\", round(slope, 2), \"* V +\", round(intercept, 2))\nprint(\"max residual:\", round(abs(resid).max(), 3), \"C\")\nprint(\"R squared:\", round(r2, 5))\nprint(\"At 2.2 V:\", round(slope * 2.2 + intercept, 2), \"C\")\n", "stdin": null, "note": "Residuals under 0.4 C on a 50 C span make a good linear calibration."}], "check": {"q": "What does an R squared of 0.9997 tell you about a line fit?", "options": ["The sensor is accurate to 0.03 percent", "The data has no noise", "The line passes through every point", "The line explains almost all of the variation in the data"], "answer": 3, "why": "R squared compares the leftover error to the spread of the data. It does not prove the sensor is accurate."}}, {"title": "Interpolation and the trapezoid rule", "minutes": 15, "html": "<p><code>np.interp(x_new, x, y)<\/code> estimates <code>y<\/code> at points between known samples by drawing straight lines between them. The known <code>x<\/code> values must be increasing.<\/p>\n<p>To find the area under a sampled curve, add up trapezoids: <code>sum((y[1:] + y[:-1]) / 2 * np.diff(x))<\/code>. For a power curve in watts over time in seconds, that area is energy in joules.<\/p>", "cells": [{"code": "print(np.interp(1.25, V, T))\n\nt = np.array([0.0, 1.0, 2.0, 3.0, 4.0])\np = np.array([0.0, 10.0, 40.0, 90.0, 160.0])\nenergy = np.sum((p[1:] + p[:-1]) / 2 * np.diff(t))\nprint(\"Energy:\", energy, \"J\")\n", "stdin": null, "note": "The true integral of this parabola is 213.3 J. The trapezoid sum overshoots because the curve bends upward. More samples would reduce the error."}], "check": {"q": "Which formula computes the trapezoid area under samples <code>y<\/code> at positions <code>x<\/code>?", "options": ["<code>np.sum(y * x)<\/code>", "<code>np.sum((y[1:] + y[:-1]) / 2 * np.diff(x))<\/code>", "<code>np.sum(y) * x<\/code>", "<code>np.diff(y).sum()<\/code>"], "answer": 1, "why": "Each trapezoid has width <code>diff(x)<\/code> and average height <code>(y[i] + y[i+1]) / 2<\/code>."}}, {"title": "Error, tolerance, and checking", "minutes": 10, "html": "<p>Every method here has a way to check itself.<\/p>\n<ul><li>Roots: <code>abs(f(root))<\/code> should be small. Bisection halves the error each step.<\/li><li>Linear systems: <code>np.allclose(A @ x, b)<\/code>.<\/li><li>Fits: look at residuals and R squared, and plot them.<\/li><li>Integration: double the number of samples and see how much the answer moves.<\/li><\/ul>\n<p>Report an answer with a sensible number of digits. A diode voltage of 0.575251413974911 V implies more precision than the model has. Four digits are enough.<\/p>", "cells": [{"code": "x = np.linspace(0, 3, 4)\ncoarse = np.sum((x[1:] ** 2 + x[:-1] ** 2) / 2 * np.diff(x))\nx = np.linspace(0, 3, 301)\nfine = np.sum((x[1:] ** 2 + x[:-1] ** 2) / 2 * np.diff(x))\nprint(round(coarse, 3), round(fine, 5), \"exact 9\")\n", "stdin": null, "note": "Using 100 times more intervals brings the area from 9.5 to 9.00005."}]}], "lecture_minutes": 130, "lab": {"summary": "Write bisection, solve the diode voltage, solve mesh currents, build a truss solver, calibrate a sensor, and integrate a power curve.", "intro_html": "<p>Several tasks ask you to write a function. The checks call your function with test inputs, so keep the names and arguments exactly as shown. Use only NumPy and the <code>math<\/code> module. All functions here must return numbers, not print them.<\/p>\n<p>Task t2 starts with <code>bisect<\/code> already written. In t1 you write your own.<\/p>", "tasks": [{"id": "t1", "title": "Write bisection", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Write <code>bisect(f, a, b, tol=1e-6)<\/code>. It returns the midpoint of the final interval after halving until <code>b - a &lt;= tol<\/code>. It must work when <code>f<\/code> decreases (<code>f(a) &gt; 0<\/code>) as well as when it increases.<\/p>", "starter": "def bisect(f, a, b, tol=1e-6):\n    # halve the interval until it is no wider than tol\n    ...\n", "hint_html": "<p>Loop <code>while b - a &gt; tol<\/code>. Compute <code>m = (a + b) / 2<\/code>. If <code>f(a) * f(m) &lt;= 0<\/code> the root is in the left half, so set <code>b = m<\/code>. Otherwise set <code>a = m<\/code>. Return <code>(a + b) / 2<\/code> after the loop.<\/p>", "stdin": null, "tests": {"setup": "import numpy as np\nimport math", "items": [["root of x^2 - 2", "approx(bisect(lambda x: x ** 2 - 2, 0, 2, 1e-9), 1.41421356, rel=1e-6)", "The root is the square root of 2."], ["root of a cubic", "approx(bisect(lambda x: x ** 3 - 2 * x - 5, 2, 3, 1e-9), 2.0945515, rel=1e-6)", "Keep the half-interval that holds the sign change."], ["decreasing function", "approx(bisect(lambda x: 5 - x, 0, 10, 1e-9), 5.0, rel=1e-6)", "f(a) times f(m) works for both directions."], ["tolerance is respected", "abs(bisect(lambda x: x - 1, 0, 8, 1e-3) - 1) < 1e-3", "Stop when b - a is no wider than tol."]]}}, {"id": "t2", "title": "Diode voltage", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Use the supplied <code>bisect<\/code> to solve the diode circuit (<code>Vs = 5.0<\/code>, <code>R = 1000.0<\/code>, <code>Is = 1e-12<\/code>, <code>nVt = 0.0259<\/code>). Define <code>g(vd)<\/code> as in the lecture. Store the diode voltage in <code>vd<\/code> (tolerance 1e-9, bracket 0 to 1) and the circuit current in milliamps in <code>i_ma<\/code>. Then store <code>Vs_check<\/code>, the sum of the diode voltage and the voltage across the resistor, which should equal the supply.<\/p>", "starter": "def bisect(f, a, b, tol=1e-6):\n    \"\"\"Return a root of f between a and b. f(a) and f(b) must have opposite signs.\"\"\"\n    while b - a > tol:\n        m = (a + b) / 2\n        if f(a) * f(m) <= 0:\n            b = m\n        else:\n            a = m\n    return (a + b) / 2\n\nimport math\n\nVs = 5.0\nR = 1000.0\nIs = 1e-12\nnVt = 0.0259\n\ndef g(vd):\n    ...\n\nvd = ...\ni_ma = ...\nVs_check = ...\n\nprint(vd, i_ma, Vs_check)\n", "hint_html": "<p><code>g<\/code> returns <code>(Vs - vd) / R - Is * (math.exp(vd / nVt) - 1)<\/code>. Then <code>vd = bisect(g, 0, 1, 1e-9)<\/code>. The current is <code>(Vs - vd) / R<\/code>, times 1000 for milliamps. The resistor voltage is <code>i_ma / 1000 * R<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import numpy as np\nimport math", "items": [["g is zero at the answer", "abs(g(vd)) < 1e-9", "g(vd) should be near zero at the root."], ["diode voltage", "approx(vd, 0.575251, rel=1e-5)", "Bracket the root between 0 and 1."], ["current in mA", "approx(i_ma, 4.42475, rel=1e-4)", "i = (Vs - vd) / R, times 1000."], ["voltages add to the supply", "approx(Vs_check, 5.0, rel=1e-9)", "Diode voltage plus resistor voltage."]]}}, {"id": "t3", "title": "Mesh currents", "points": 15, "minutes": 20, "bonus": false, "prompt_html": "<p>Solve <code>10 i1 - 4 i2 = 12<\/code> and <code>-4 i1 + 12 i2 = 0<\/code>. Build <code>A<\/code> and <code>b<\/code> as arrays, store the solution in <code>i<\/code>, and store <code>ok<\/code>, a Boolean that is True when <code>A @ i<\/code> reproduces <code>b<\/code>. Then store <code>p_total<\/code>, the total power delivered by the 12 V source: 12 times <code>i[0]<\/code>.<\/p>", "starter": "import numpy as np\n\nA = ...\nb = ...\ni = ...\nok = ...\np_total = ...\n\nprint(i, ok, p_total)\n", "hint_html": "<p><code>A = np.array([[10.0, -4.0], [-4.0, 12.0]])<\/code> and <code>b = np.array([12.0, 0.0])<\/code>. <code>i = np.linalg.solve(A, b)<\/code>. <code>np.allclose(A @ i, b)<\/code> gives <code>ok<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import numpy as np\nimport math", "items": [["i1", "approx(i[0], 18 / 13, rel=1e-9)", "Use np.linalg.solve(A, b)."], ["i2", "approx(i[1], 6 / 13, rel=1e-9)", "The second unknown is i[1]."], ["ok is True", "bool(ok) is True", "Use np.allclose(A @ i, b)."], ["source power", "approx(p_total, 12 * 18 / 13, rel=1e-9)", "p_total = 1 perature predicted at 2.2 V), and <code>v_for_45<\/code> (the voltage that corresponds to 45 C, found by inverting the line).<\/p>", "starter": "import numpy as np\n\nV = np.array([0.5, 1.0, 1.5, 2.0, 2.5, 3.0])\nT = np.array([10.2, 19.8, 30.5, 39.9, 50.4, 59.7])\n\nslope = ...\nintercept = ...\nmax_resid = ...\nr2 = ...\nt_at_22 = ...\nv_for_45 = ...\n\nprint(slope, intercept, max_resid, r2, t_at_22, v_for_45)\n", "hint_html": "<p><code>slope, intercept = np.polyfit(V, T, 1)<\/code>. Residuals are <code>T - (slope * V + intercept)<\/code>. R squared is <code>1 - sum(resid <strong> 2) / sum((T - T.mean()) <\/strong> 2)<\/code>. Solve <code>45 = slope * v + intercept<\/code> for <code>v<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import numpy as np\nimport math", "items": [["slope", "approx(slope, 19.925714, rel=1e-5)", "np.polyfit(V, T, 1) returns slope first."], ["intercept", "approx(intercept, 0.213333, rel=1e-4)", "Intercept is the second coefficient."], ["max residual", "approx(max_resid, 0.398095, rel=1e-4)", "Residuals are T minus the fitted values."], ["R squared", "approx(r2, 0.999698, rel=1e-5)", "1 - SS_res / SS_tot"], ["prediction at 2.2 V", "approx(t_at_22, 44.0499, rel=1e-5)", "slope * 2.2 + intercept"], ["voltage for 45 C", "approx(v_for_45, 2.24768, rel=1e-4)", "Invert the line: (45 - intercept) / slope."]]}}, {"id": "t6", "title": "Interpolate and integrate", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Write <code>trap(x, y)<\/code> that returns the trapezoid-rule area under the samples. Use it on the power data to store <code>energy<\/code> (joules). Then use <code>np.interp<\/code> to store <code>p_at_2_5<\/code>, the power at 2.5 s, and <code>t_at_100<\/code>, the time when the power reaches 100 W (interpolate time as a function of power).<\/p>", "starter": "import numpy as np\n\ndef trap(x, y):\n    ...\n\nt = np.array([0.0, 1.0, 2.0, 3.0, 4.0])\np = np.array([0.0, 10.0, 40.0, 90.0, 160.0])\n\nenergy = ...\np_at_2_5 = ...\nt_at_100 = ...\n\nprint(energy, p_at_2_5, t_at_100)\n", "hint_html": "<p><code>np.sum((y[1:] + y[:-1]) / 2 * np.diff(x))<\/code>. For power at 2.5 s, <code>np.interp(2.5, t, p)<\/code>. For the time at 100 W swap the roles: <code>np.interp(100, p, t)<\/code> (power is increasing, so this works).<\/p>", "stdin": null, "tests": {"setup": "import numpy as np\nimport math", "items": [["energy", "approx(energy, 220.0)", "Sum the trapezoids."], ["trap on x squared", "approx(trap(np.linspace(0, 3, 301), np.linspace(0, 3, 301) ** 2), 9.00005, rel=1e-6)", "trap must work for any arrays."], ["trap on a constant", "approx(trap([0, 2, 5], [3, 3, 3]), 15.0)", "Area of a rectangle: width 5, height 3."], ["power at 2.5 s", "approx(p_at_2_5, 65.0)", "np.interp(2.5, t, p)"], ["time at 100 W", "approx(t_at_100, 3 + 10 / 70, rel=1e-6)", "np.interp(100, p, t) treats power as the x values."]]}}, {"id": "b1", "title": "Newton's method", "points": 10, "minutes": 20, "bonus": true, "prompt_html": "<p>Write <code>newton(f, df, x0, steps)<\/code>. Starting at <code>x0<\/code>, repeat <code>x = x - f(x) / df(x)<\/code> for <code>steps<\/code> iterations and return <code>x<\/code>. Use it to store <code>sqrt2<\/code>, the result for <code>f(x) = x**2 - 2<\/code> starting at 1 with 6 steps.<\/p>", "starter": "def newton(f, df, x0, steps):\n    ...\n\nsqrt2 = ...\nprint(sqrt2)\n", "hint_html": "<p>Loop <code>steps<\/code> times, updating <code>x<\/code>. For <code>x**2 - 2<\/code> the derivative is <code>2 * x<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import numpy as np\nimport math", "items": [["sqrt2", "approx(sqrt2, 1.4142135623730951, rel=1e-12)", "Six steps converge to machine precision."], ["works on another function", "approx(newton(lambda x: x ** 3 - 8, lambda x: 3 * x ** 2, 3.0, 20), 2.0, rel=1e-9)", "The update uses f and its derivative."]]}}]}, "lab_minutes": 150, "quiz": [{"q": "A continuous function has <code>f(1) = -3<\/code> and <code>f(4) = 5<\/code>. What does this show?", "options": ["At least one root lies between 1 and 4", "The function is linear", "The function equals zero at 2.5", "No root lies between 1 and 4"], "answer": 0, "why": "A sign change means the function crosses zero."}, {"q": "How does bisection choose the next interval?", "options": ["It keeps the half with the larger value", "It keeps the half where the sign change is", "It moves both ends by the same amount", "It picks a random point"], "answer": 1, "why": "The root stays inside the half-interval where <code>f<\/code> changes sign."}, {"q": "Bisection starts with an interval of width 1. About how many steps does it need to reach a width of 1e-6?", "options": ["100", "6", "20", "1000000"], "answer": 2, "why": "2 to the 20 is about a million, so 20 halvings take width 1 to 1e-6."}, {"q": "How do you check that a root-finder gave a good answer?", "options": ["Run the program twice", "Compare it to the starting guess", "Check that it printed a decimal", "Substitute the answer into the function and look for a value near zero"], "answer": 3, "why": "A good root makes <code>f(root)<\/code> small."}, {"q": "Why can the diode circuit not be solved by simple algebra?", "options": ["The unknown voltage appears both linearly and inside an exponential", "Diodes are not circuits", "The resistor value is unknown", "It has no solution"], "answer": 0, "why": "A mix of linear and exponential terms in the same unknown blocks isolation."}, {"q": "What goes in the matrix <code>A<\/code> of <code>A x = b<\/code>?", "options": ["The right-hand sides", "The coefficients of the unknowns", "The unknowns", "The tolerance"], "answer": 1, "why": "Each row of <code>A<\/code> holds the coefficients of one equation."}, {"q": "How do you confirm that <code>x = np.linalg.solve(A, b)<\/code> is correct?", "options": ["Run <code>solve<\/code> again", "Print <code>A<\/code> and <code>b<\/code>", "Check that <code>np.allclose(A @ x, b)<\/code> is True", "Check that <code>x<\/code> is positive"], "answer": 2, "why": "Multiplying back should reproduce the right-hand sides."}, {"q": "Why do the forces at a truss joint give two equations?", "options": ["NumPy needs two equations", "The load has two components", "Every bar has two ends", "They must sum to zero in the x direction and in the y direction"], "answer": 3, "why": "Equilibrium in the plane means no net force in either direction."}, {"q": "<code>np.polyfit(x, y, 1)<\/code> returns which values?", "options": ["The slope, then the intercept", "The residuals", "The intercept, then the slope", "R squared"], "answer": 0, "why": "For degree 1 the coefficients are listed from the highest power down."}, {"q": "A line fit has an R squared of 0.50. What does that suggest?", "options": ["The sensor is broken", "The line explains only half of the variation, so check for curvature or noise", "The slope is 0.5", "The line is perfect"], "answer": 1, "why": "An R squared well below 1 means the model leaves much unexplained."}, {"q": "What does <code>np.interp(1.25, V, T)<\/code> do?", "options": ["Finds the maximum of T", "Fits a line to all points", "Estimates T at 1.25 from the nearest known points", "Rounds 1.25 to a sample"], "answer": 2, "why": "It draws straight lines between neighboring samples."}, {"q": "Why does the trapezoid rule give a better answer with more samples?", "options": ["The computer works harder", "The answer is rounded more", "It switches to a different formula", "Each straight-line piece fits the curve more closely"], "answer": 3, "why": "Narrower trapezoids leave less error between the line and the curve."}], "quiz_minutes": 18, "quiz_intro_html": "<p>Answer each question. You see the explanation right after you choose. You can reset the quiz and try again.<\/p>"}</script>
<script id="harness" type="text/x-python">import sys, io, os, json, ast, base64, builtins, traceback, contextlib, math, random

os.environ.setdefault("MPLBACKEND", "Agg")
import importlib
if "" not in sys.path:
    sys.path.insert(0, "")

_OUT_CAP = 20000
_LECTURE_NS = {"__name__": "__main__"}


class _Capped(io.StringIO):
    def write(self, s):
        if self.tell() > _OUT_CAP:
            raise RuntimeError("Output limit reached. Your code printed too much text.")
        return super().write(s)


def approx(a, b, rel=1e-6, abs_=1e-9):
    try:
        if "numpy" in sys.modules:
            import numpy as _np
            if isinstance(a, _np.ndarray) or isinstance(b, _np.ndarray):
                return bool(_np.allclose(a, b, rtol=rel, atol=abs_))
        if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
            return len(a) == len(b) and all(approx(x, y, rel, abs_) for x, y in zip(a, b))
        return abs(float(a) - float(b)) <= max(abs_, rel * abs(float(b)))
    except Exception:
        return False


def uses_node(src, *names):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    wanted = tuple(getattr(ast, n) for n in names)
    return any(isinstance(n, wanted) for n in ast.walk(tree))


def calls_name(src, name):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    for n in ast.walk(tree):
        if isinstance(n, ast.Call):
            f = n.func
            if isinstance(f, ast.Name) and f.id == name:
                return True
            if isinstance(f, ast.Attribute) and f.attr == name:
                return True
    return False


def line_has(src, target, *words):
    """True when an assignment to `target` has every word on its right side."""
    for line in src.splitlines():
        s = line.strip()
        if s.startswith("#") or "=" not in s:
            continue
        left, _, right = s.partition("=")
        if left.strip() == target and all(w in right for w in words):
            return True
    return False


def run_with(src, inputs=(), ns=None):
    """Run student source with scripted input() values; return what it printed."""
    queue = list(inputs)
    old = builtins.input

    def _fake(prompt=""):
        print(prompt, end="")
        if not queue:
            raise EOFError("input() called more times than expected")
        v = queue.pop(0)
        print(v)
        return v

    buf = io.StringIO()
    builtins.input = _fake
    try:
        with contextlib.redirect_stdout(buf):
            exec(compile(src, "<your code>", "exec"), ns if ns is not None else {"__name__": "__main__"})
    finally:
        builtins.input = old
    return buf.getvalue()


def rerun(src, **over):
    """Execute student source again with top-level assignments replaced by the given constants.
    Returns the resulting namespace. Output is discarded."""
    tree = ast.parse(src)
    for node in tree.body:
        if (isinstance(node, ast.Assign) and len(node.targets) == 1
                and isinstance(node.targets[0], ast.Name) and node.targets[0].id in over):
            node.value = ast.Constant(over[node.targets[0].id])
    ast.fix_missing_locations(tree)
    ns = {"__name__": "__main__"}
    with contextlib.redirect_stdout(io.StringIO()):
        exec(compile(tree, "<your code>", "exec"), ns)
    return ns


def count_defs(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.FunctionDef) for n in ast.walk(tree))


def count_classes(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.ClassDef) for n in ast.walk(tree))


def _format_error(exc, code):
    lines = code.split("\n")
    if isinstance(exc, SyntaxError):
        ln = exc.lineno
        msg = "SyntaxError: " + str(exc.msg)
        if ln and 1 <= ln <= len(lines):
            msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
        return msg
    tb = traceback.TracebackException.from_exception(exc)
    ln = None
    for fs in tb.stack:
        if fs.filename == "<your code>":
            ln = fs.lineno
    msg = "".join(tb.format_exception_only()).strip()
    if ln and 1 <= ln <= len(lines):
        msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
    return msg


def _make_input(stdin_lines, out):
    queue = list(stdin_lines)

    def _input(prompt=""):
        out.write(str(prompt))
        if not queue:
            raise EOFError("input() ran out of lines. Type one value per line in the Input box under the code.")
        val = queue.pop(0)
        out.write(val + "\n")
        return val

    return _input


def _exec_code(code, ns, out):
    tree = ast.parse(code, "<your code>", "exec")
    last = None
    if tree.body and isinstance(tree.body[-1], ast.Expr):
        last = ast.Expression(tree.body.pop().value)
    exec(compile(tree, "<your code>", "exec"), ns)
    if last is not None:
        val = eval(compile(last, "<your code>", "eval"), ns)
        if val is not None:
            out.write(repr(val) + "\n")


def _collect_images():
    imgs = []
    if "matplotlib.pyplot" in sys.modules:
        import matplotlib.pyplot as plt
        for num in plt.get_fignums():
            fig = plt.figure(num)
            buf = io.BytesIO()
            fig.savefig(buf, format="png", dpi=100, bbox_inches="tight")
            imgs.append(base64.b64encode(buf.getvalue()).decode("ascii"))
        plt.close("all")
    return imgs


def reset_lecture():
    _LECTURE_NS.clear()
    _LECTURE_NS["__name__"] = "__main__"


def run_cell(req_json):
    req = json.loads(req_json)
    code = req.get("code", "")
    mode = req.get("mode", "fresh")
    stdin_lines = req.get("stdin") or []
    tests = req.get("tests")
    ns = _LECTURE_NS if mode == "lecture" else {"__name__": "__main__"}
    importlib.invalidate_caches()
    out = _Capped()
    err = None
    real_input = builtins.input
    builtins.input = _make_input(stdin_lines, out)
    try:
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
            try:
                random.seed()
                _exec_code(code, ns, out)
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                err = _format_error(exc, code)
    finally:
        builtins.input = real_input
    result = {"stdout": out.getvalue(), "error": err, "images": [], "tests": None}
    try:
        result["images"] = _collect_images()
    except Exception as exc:
        result["stdout"] += "\n(Plot could not be drawn: %s)" % exc
    if tests is not None:
        result["tests"] = _run_tests(tests, ns, code, err, out.getvalue())
    return json.dumps(result)


def _run_tests(tests, ns, code, err, stdout_text):
    items = tests.get("items", [])
    results = []
    if err is not None:
        for label, _expr, hint in items:
            results.append({"label": label, "ok": False, "msg": "Fix the error above first."})
        return results
    env = ns
    helpers = {
        "approx": approx, "out": stdout_text, "src": code, "ast": ast,
        "uses_node": uses_node, "calls_name": calls_name,
        "count_defs": count_defs, "run_with": run_with, "rerun": rerun, "count_classes": count_classes, "line_has": line_has,
        "math": math, "random": random, "io": io, "_in_tests": True,
    }
    _missing = object()
    saved = {k: env.get(k, _missing) for k in helpers}
    env.update(helpers)
    sink = _Capped()
    try:
        setup = tests.get("setup")
        if setup:
            try:
                with contextlib.redirect_stdout(sink):
                    exec(compile(setup, "<tests>", "exec"), env)
            except BaseException as exc:
                reason = "Could not run the checks: %s: %s" % (type(exc).__name__, exc)
                return [{"label": l, "ok": False, "msg": reason} for l, _e, _h in items]
        for label, expr, hint in items:
            try:
                with contextlib.redirect_stdout(sink):
                    ok = bool(eval(compile(expr, "<tests>", "eval"), env))
                results.append({"label": label, "ok": ok, "msg": "" if ok else hint})
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                results.append({"label": label, "ok": False,
                                "msg": "%s (%s: %s)" % (hint, type(exc).__name__, exc)})
    finally:
        for k, v in saved.items():
            if v is _missing:
                env.pop(k, None)
            else:
                env[k] = v
    return results

  var p = document.getElementById('panel-lab');
  p.innerHTML = '';
  p.appendChild(h('div', { class: 'card', html: D.lab.intro_html }));
  var sc = h('div', { class: 'row' }, [h('strong', { text: 'Lab score: ' }), h('span', { id: 'labscore', class: 'badge info', text: '0' }), h('span', { class: 'small', text: 'Updates each time you press Check my work.' })]);
  p.appendChild(sc);
  D.lab.tasks.forEach(function (t, i) {
    var card = h('div', { class: 'card' });
    card.appendChild(h('p', { class: 'meta', text: (t.bonus ? 'Bonus challenge' : 'Task ' + (i + 1)) + ', ' + t.points + (t.bonus ? ' bonus points' : ' points') + ', about ' + t.minutes + ' minutes' }));
    card.appendChild(h('h3', { text: t.title }));
    card.appendChild(h('div', { html: t.prompt_html }));
    var res = S.lab[t.id];
    var note = h('p', { class: 'small', text: res ? ('Last check: ' + res.passed + ' of ' + res.total + ' tests passed.') : 'Not checked yet.' });
    var cell = codeCell({
      key: 'lab_' + t.id, code: t.starter, stdin: t.stdin, mode: 'fresh', tests: t.tests, hint: t.hint_html, timeout: 20, label: 'Code for ' + t.title,
      hasResult: function () { return !!S.lab[t.id]; },
      onCheck: function (r) {
        var passed = r.tests ? r.tests.filter(function (x) { return x.ok; }).length : 0;
        S.lab[t.id] = { passed: passed, total: r.tests ? r.tests.length : 0, at: new Date().toISOString() };
        save(); note.textContent = 'Last check: ' + passed + ' of ' + S.lab[t.id].total + ' tests passed.'; updateLab();
      }
    });
    card.appendChild(cell); card.appendChild(note);
    p.appendChild(card);
  });
  p.appendChild(h('h2', { text: 'Submit your work' }));
  var rep = h('div', { class: 'card' });
  rep.appendChild(h('p', { text: 'Enter your name, then copy the report or download it. Submit it the way your instructor asks. The report lists your scores and your final code for each task.' }));
  var nm = h('input', { type: 'text', id: 'stname', 'aria-label': 'Your name', placeholder: 'Your name', autocomplete: 'name' });
  nm.value = S.name;
  nm.addEventListener('input', function () { S.name = nm.value; save(); });
  rep.appendChild(h('div', { class: 'field' }, [h('label', { for: 'stname', text: 'Name' }), nm]));
  var ta = h('textarea', { class: 'report', readonly: '', 'aria-label': 'Report text' });
  var b1 = h('button', { class: 'btn primary', text: 'Build report', onclick: function () { ta.value = buildReport(); } });
  var b2 = h('button', { class: 'btn', text: 'Copy report', onclick: function () {
    ta.value = buildReport(); ta.select();
    var done = function () { b2.textContent = 'Copied'; setTimeout(function () { b2.textContent = 'Copy report'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(done, function () { try { document.execCommand('copy'); done(); } catch (e) {} }); }
    else { try { document.execCommand('copy'); done(); } catch (e) {} }
  } });
  var b3 = h('button', { class: 'btn', text: 'Download .txt', onclick: function () {
    var txt = buildReport(); ta.value = txt;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
    a.download = 'week' + D.num + '_report.txt'; document.body.appendChild(a); a.click(); a.remove();
  } });
  rep.appendChild(h('div', { class: 'row' }, [b1, b2, b3]));
  rep.appendChild(ta);
  p.appendChild(rep);
  updateLab();
}
function quizTally() {
  var correct = 0, answered = 0;
  D.quiz.forEach(function (q, i) { var a = S.quiz[i]; if (a !== undefined && a !== null) { answered++; if (a === q.answer) { correct++; } } });
  return { correct: correct, answered: answered, total: D.quiz.length };
}
function buildReport() {
  var L = [], s = labScore(), q = quizTally();
  var max = D.lab.tasks.filter(function (t) { return !t.bonus; }).reduce(function (a, t) { return a + t.points; }, 0);
  var lec = D.lecture.filter(function (_s, i) { return S.lecDone[i]; }).length;
  L.push('Course: ' + D.course_title);
  L.push('Week ' + D.num + ': ' + D.title);
  L.push('Name: ' + (S.name || '(not entered)'));
  L.push('Generated: ' + new Date().toLocaleString());
  L.push('');
  L.push('Lecture sections marked complete: ' + lec + ' of ' + D.lecture.length);
  L.push('Lab score (browser autograder): ' + s.score + ' of ' + max + (s.bonus ? ', bonus ' + s.bonus : ''));
  L.push('Quiz: ' + q.correct + ' correct, ' + q.answered + ' answered, ' + q.total + ' questions');
  L.push('');
  D.lab.tasks.forEach(function (t, i) {
    var r = S.lab[t.id];
    L.push('==== ' + (t.bonus ? 'Bonus' : 'Task ' + (i + 1)) + ': ' + t.title + ' (' + (r ? r.passed + '/' + r.total + ' tests' : 'not checked') + ') ====');
    L.push(S.code['lab_' + t.id] !== undefined ? S.code['lab_' + t.id] : t.starter);
    L.push('');
  });
  return L.join('\n');
}

/* ---------- quiz ---------- */
function updateQuiz() {
  var q = quizTally();
  var el = document.getElementById('quizscore');
  if (el) { el.textContent = q.correct + ' correct of ' + q.answered + ' answered, ' + q.total + ' questions'; }
  tiles.quiz.textContent = q.correct + '/' + q.total;
}
function renderQuiz() {
  var p = document.getElementById('panel-quiz');
  p.innerHTML = '';
  p.appendChild(h('div', { class: 'card', html: D.quiz_intro_html }));
  p.appendChild(h('div', { class: 'row' }, [
    h('strong', { text: 'Score: ' }), h('span', { id: 'quizscore', class: 'badge info' }),
    h('span', { style: 'flex:1' }),
    h('button', { class: 'btn', text: 'Reset quiz', onclick: function () {
      if (!confirm('Clear all quiz answers?')) { return; } S.quiz = {}; save(); renderQuiz();
    } })
  ]));
  D.quiz.forEach(function (q, i) {
    var card = h('div', { class: 'card' });
    card.appendChild(h('p', { class: 'meta', text: 'Question ' + (i + 1) + ' of ' + D.quiz.length }));
    card.appendChild(mcq({ cls: 'qbox', q: q.q, options: q.options, answer: q.answer, why: q.why, saved: S.quiz[i], onAnswer: function (k) { S.quiz[i] = k; save(); updateQuiz(); } }));
    p.appendChild(card);
  });
  updateQuiz();
}

/* ---------- shell ---------- */
document.getElementById('kicker').textContent = D.course_title + ', Week ' + D.num;
document.getElementById('title').textContent = D.title;
document.title = D.course_title + ' Week ' + D.num + ' ' + D.title;
var chips = document.getElementById('chips');
[D.lecture_minutes + ' min lecture', D.lab_minutes + ' min lab', D.quiz.length + ' quiz questions'].forEach(function (t) { chips.appendChild(h('li', { text: t })); });
var tabs = [['overview', 'Overview'], ['lecture', 'Lecture'], ['lab', 'Lab'], ['quiz', 'Quiz']];
var tl = document.getElementById('tablist');
tabs.forEach(function (t) {
  var b = h('button', { role: 'tab', id: 'tab-' + t[0], 'aria-controls': 'panel-' + t[0], 'aria-selected': 'false', text: t[1] });
  b.addEventListener('click', function () { show(t[0]); });
  tl.appendChild(b);
});
function show(name) {
  tabs.forEach(function (t) {
    document.getElementById('panel-' + t[0]).hidden = (t[0] !== name);
    document.getElementById('tab-' + t[0]).setAttribute('aria-selected', t[0] === name ? 'true' : 'false');
  });
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
  window.scrollTo(0, 0);
  document.querySelectorAll('#panel-' + name + ' textarea.code').forEach(function (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 4, 640) + 'px'; });
}
renderOverview(); renderLecture(); renderLab(); renderQuiz();
var start = (location.hash || '').replace('#', '');
show(tabs.some(function (t) { return t[0] === start; }) ? start : 'overview');
})();
</script>
