.q pre code,.card pre code{background:none;padding:0}

.opts button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;cursor:pointer}

.opts button:disabled{cursor:default}
.why{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:6px;background:var(--accent-soft)}

textarea.report{width:100%;min-height:200px;font-family:var(--mono);font-size:12.5px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px}
table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:14px}

<script id="data" type="application/json">{"course_id": "pyeng", "course_title": "Python for Engineers", "pyodide_base": "https://cdn.jsdelivr.net/pyodide/v0.27.8/full/", "num": 3, "title": "Booleans and Conditionals: Thermostats and Safety Interlocks", "hook": "Ariane 5 flight 501 left the launch pad in June 1996 and broke apart about 37 seconds later. The guidance software tried to store a number in a 16-bit signed integer that could not hold it. No check asked whether the value fit. One missing comparison cost a rocket. This week you learn conditionals, the tool that asks the question before the program acts.", "objectives": ["write comparisons and combine them with <code>and<\/code>, <code>or<\/code>, and <code>not<\/code>", "build <code>if<\/code>, <code>elif<\/code>, and <code>else<\/code> decision ladders in the right order", "check inputs and ranges before you use them", "compare floats with a tolerance instead of <code>==<\/code>", "model a thermostat with hysteresis and a machine safety interlock"], "summary": "<ul><li>Comparisons (<code>== != &lt; &gt; &lt;= &gt;=<\/code>) give <code>True<\/code> or <code>False<\/code>. Chain them: <code>0 &lt;= x &lt;= 100<\/code>.<\/li><li><code>and<\/code>, <code>or<\/code>, <code>not<\/code> combine booleans. Use parentheses when precedence could confuse a reader.<\/li><li><code>if<\/code>, <code>elif<\/code>, <code>else<\/code> need a colon and an indented block. The first True branch runs.<\/li><li>Order branches from most specific to least specific.<\/li><li>Validate inputs before use. State what is wrong when you reject a value.<\/li><li>Hysteresis uses a dead band and keeps the previous state inside it.<\/li><li>Compare floats with <code>abs(a - b) &lt;= tol<\/code> or <code>math.isclose<\/code>.<\/li><li>Test boundary values: just below, exactly at, and just above each limit.<\/li><\/ul>", "lecture": [{"title": "Ariane 5 and the missing range check", "minutes": 10, "html": "<p>A 16-bit signed integer holds whole numbers from -32768 to 32767. The Ariane 5 flight software converted a measured velocity value to that type. Ariane 5 flew faster than the earlier rocket the software was written for, so the value went out of range, the conversion failed, and the guidance computer shut down.<\/p>\n<p>A single comparison before the conversion would have caught the problem. Conditionals let a program inspect a value and choose what to do. Python gives you the range of a 16-bit integer with a short calculation.<\/p>", "cells": [{"code": "print(2 ** 15 - 1)\nprint(-(2 ** 15))\n", "stdin": null, "note": "These are the limits of a 16-bit signed integer."}], "check": {"q": "Which expression tests that <code>v<\/code> fits a 16-bit signed integer?", "options": ["<code>-32768 &lt;= v &lt;= 32767<\/code>", "<code>v == 32767<\/code>", "<code>v &gt; 0<\/code>", "<code>v &lt; 100000<\/code>"], "answer": 0, "why": "A range check needs both limits. Chained comparison makes it read like the algebra inequality."}}, {"title": "Booleans and comparison operators", "minutes": 20, "html": "<p>A <strong>boolean<\/strong> (<code>bool<\/code>) is either <code>True<\/code> or <code>False<\/code>. Comparisons produce booleans:<\/p>\n<table><thead><tr><th>Operator<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><code>==<\/code><\/td><td>equal to<\/td><\/tr><tr><td><code>!=<\/code><\/td><td>not equal to<\/td><\/tr><tr><td><code>&lt;<\/code> <code>&gt;<\/code><\/td><td>less than, greater than<\/td><\/tr><tr><td><code>&lt;=<\/code> <code>&gt;=<\/code><\/td><td>less than or equal, greater than or equal<\/td><\/tr><\/tbody><\/table>\n<p>Use <code>==<\/code> to compare and <code>=<\/code> to assign. Python lets you chain comparisons the way you write them in algebra: <code>0 &lt;= x &lt;= 100<\/code>.<\/p>", "cells": [{"code": "x = 7\nprint(x == 7)\nprint(x != 7)\nprint(x > 5, x <= 5)\nprint(0 <= x <= 10)\n", "stdin": null, "note": null}, {"code": "x = 7\nif x = 7:\n    print(\"seven\")\n", "stdin": null, "note": "A SyntaxError on purpose. Python suggests the fix in its message."}], "check": {"q": "What does <code>7 != 7<\/code> evaluate to?", "options": ["<code>True<\/code>", "An error", "<code>False<\/code>", "<code>7<\/code>"], "answer": 2, "why": "<code>!=<\/code> asks whether two values differ. 7 and 7 do not differ, so the answer is False."}}, {"title": "Logical operators: and, or, not", "minutes": 15, "html": "<p>Combine booleans with three operators:<\/p>\n<ul><li><code>a and b<\/code> is True only when both are True<\/li><li><code>a or b<\/code> is True when at least one is True<\/li><li><code>not a<\/code> flips True and False<\/li><\/ul>\n<p>Precedence from highest to lowest: comparisons, then <code>not<\/code>, then <code>and<\/code>, then <code>or<\/code>. Add parentheses whenever a reader could doubt the order.<\/p>\n<p>A safety rule often reads as an <code>or<\/code>: stop the machine if the door is open or the temperature is too high. A permission reads as an <code>and<\/code>: start only if the door is closed and the temperature is in range.<\/p>", "cells": [{"code": "print(True and False, True or False, not True)\n", "stdin": null, "note": null}, {"code": "door_closed = True\ntemp_c = 82\nprint(door_closed and temp_c < 90)\nprint(not door_closed or temp_c > 90)\nprint(not (temp_c > 75))\n", "stdin": null, "note": null}], "check": {"q": "What does <code>not (True and False)<\/code> evaluate to?", "options": ["<code>True<\/code>", "An error", "<code>None<\/code>", "<code>False<\/code>"], "answer": 0, "why": "<code>True and False<\/code> is False. <code>not False<\/code> is True."}}, {"title": "if, elif, and else", "minutes": 20, "html": "<p>An <code>if<\/code> statement runs a block of code only when its condition is True. Three rules of syntax:<\/p>\n<ol><li>The condition ends with a colon.<\/li><li>The block below it is <strong>indented<\/strong> (use 4 spaces).<\/li><li><code>elif<\/code> adds another test and <code>else<\/code> catches everything left.<\/li><\/ol>\n<p>Python checks conditions from the top and runs the <strong>first<\/strong> one that is True, then skips the rest. Put the most specific condition first.<\/p>", "cells": [{"code": "voltage = 4.8\nif voltage > 5.25:\n    print(\"Over range\")\nelif voltage >= 4.75:\n    print(\"Normal\")\nelse:\n    print(\"Under range\")\n", "stdin": null, "note": "Change <code>voltage<\/code> to 5.5 and then 4.0 and rerun."}, {"code": "score = 95\nif score >= 60:\n    grade = \"C or better\"\nelif score >= 90:\n    grade = \"A\"\nprint(grade)\n", "stdin": null, "note": "A logic bug. The 95 never reaches the second test. Swap the two conditions to fix it."}], "check": {"q": "In an if/elif/else ladder, how many blocks can run in one pass?", "options": ["All blocks with a True condition", "Exactly two", "At most one", "Every block, in order"], "answer": 2, "why": "Python runs the first block whose condition is True and skips the remaining branches."}}, {"title": "Decisions with state: a thermostat", "minutes": 15, "html": "<p>A thermostat that switches the heater on at exactly 21.0 C and off at exactly 21.0 C would click on and off rapidly when the temperature hovers near that value. Real controllers use <strong>hysteresis<\/strong>: a dead band around the setpoint. Turn the heater on when the temperature falls below the setpoint minus the band, turn it off when the temperature rises above the setpoint plus the band, and leave it alone in between.<\/p>\n<p>The program needs to remember the previous heater state, so the variable <code>heater_on<\/code> is both an input and an output.<\/p>", "cells": [{"code": "setpoint_c = 21.0\nband_c = 0.5\nheater_on = False\ntemp_c = 20.2\n\nif temp_c < setpoint_c - band_c:\n    heater_on = True\nelif temp_c > setpoint_c + band_c:\n    heater_on = False\n\nprint(\"Heater on:\", heater_on)\n", "stdin": null, "note": "Try 21.2 with <code>heater_on = True<\/code> at the top. The heater should stay on."}], "check": {"q": "The temperature is inside the dead band. What does the thermostat do?", "options": ["Leaves the heater in its current state", "Turns the heater on", "Raises an error", "Turns the heater off"], "answer": 0, "why": "Inside the band neither condition is True, so the variable keeps its earlier value. That prevents rapid on and off switching."}}, {"title": "Validating input", "minutes": 15, "html": "<p>Programs receive bad data. A technician types a percentage of 150, or a sensor reports a temperature of -999 when it disconnects. Check inputs before you use them and give a clear message when a value is out of range.<\/p>\n<p>A habit worth building: handle the bad case first and stop, so the normal case is easy to read. Next week loops make it possible to ask again; for now the program prints a message.<\/p>", "cells": [{"code": "level = int(input(\"Tank level in percent: \"))\nif level < 0 or level > 100:\n    print(\"Invalid level:\", level)\nelse:\n    print(\"Level accepted:\", level)\n", "stdin": ["150"], "note": "Change the Input box to <code>75<\/code> and run again."}, {"code": "pressure = float(input(\"Pressure (kPa): \"))\nif 90 <= pressure <= 110:\n    print(\"Within range\")\nelif pressure > 110:\n    print(\"High\")\nelse:\n    print(\"Low\")\n", "stdin": ["101.3"], "note": null}], "check": {"q": "Which condition is True for a value outside 0 to 100?", "options": ["<code>0 &lt;= level &lt;= 100<\/code>", "<code>level &lt; 0 and level &gt; 100<\/code>", "<code>level &lt; 0 or level &gt; 100<\/code>", "<code>level == 100<\/code>"], "answer": 2, "why": "A value outside the range is below 0 or above 100. No number is both, so the version with <code>and<\/code> is always False."}}, {"title": "Comparing floats with a tolerance", "minutes": 15, "html": "<p>Floats carry tiny rounding errors, so <code>==<\/code> between two calculated floats can fail. Check that values are close instead. Two common methods:<\/p>\n<ul><li><code>abs(a - b) &lt;= tol<\/code> with a tolerance you choose<\/li><li><code>math.isclose(a, b)<\/code> which uses a small relative tolerance by default<\/li><\/ul>\n<p>Engineers already think this way: a 10 kilohm resistor with 5 percent tolerance is within spec between 9500 and 10500 ohms.<\/p>", "cells": [{"code": "import math\nprint(0.1 + 0.2 == 0.3)\nprint(math.isclose(0.1 + 0.2, 0.3))\n", "stdin": null, "note": null}, {"code": "nominal = 10000\nmeasured = 9870\ntolerance = 0.05\nprint(abs(measured - nominal) <= nominal * tolerance)\n", "stdin": null, "note": null}], "check": {"q": "Why avoid <code>==<\/code> when comparing two calculated floats?", "options": ["Rounding errors can make equal values differ in the last digits", "<code>==<\/code> is slower than <code>&lt;<\/code>", "<code>==<\/code> only works on whole numbers", "Python does not allow it"], "answer": 0, "why": "Floats store binary approximations. Compare with a tolerance when exactness is not guaranteed."}}, {"title": "Putting it together: an oven interlock", "minutes": 20, "html": "<p>This program decides what an oven controller does. The rules use all of this week: comparisons, <code>and<\/code>, <code>or<\/code>, <code>not<\/code>, and an <code>if<\/code> ladder. Read the rules in plain language first.<\/p>\n<ul><li>Stop if the door is open or the temperature is above 250 C.<\/li><li>Warn if the temperature is above 220 C (and the stop rule did not fire).<\/li><li>Otherwise run.<\/li><\/ul>\n<p>Predict the result for each set of values, then change the variables and test the boundary values 220 and 250.<\/p>", "cells": [{"code": "door_closed = True\ntemp_c = 230\n\nif (not door_closed) or temp_c > 250:\n    state = \"STOP\"\nelif temp_c > 220:\n    state = \"WARN\"\nelse:\n    state = \"RUN\"\n\nprint(state)\n", "stdin": null, "note": null}, {"code": "door_closed = False\ntemp_c = 100\n\nif (not door_closed) or temp_c > 250:\n    state = \"STOP\"\nelif temp_c > 220:\n    state = \"WARN\"\nelse:\n    state = \"RUN\"\n\nprint(state)\n", "stdin": null, "note": "The door rule outranks the temperature rule because it comes first."}], "check": {"q": "With <code>temp_c = 220<\/code>, which state does the oven code give (door closed)?", "options": ["<code>WARN<\/code>", "<code>STOP<\/code>", "<code>RUN<\/code>", "No state"], "answer": 2, "why": "The warning needs <code>temp_c &gt; 220<\/code>. At exactly 220 the test is False, so the code falls to <code>else<\/code>."}}], "lecture_minutes": 130, "lab": {"summary": "A thermostat with hysteresis, battery status ladder, input validation, and a machine safety interlock.", "intro_html": "<p>You are writing the decision logic for small control systems. Most checks here run your code several times with different values. The checks replace the first assignment to each named variable (for example <code>temp_c<\/code>) and then run the rest of your code. Keep the starting assignments as plain lines at the top, such as <code>temp_c = 19.8<\/code>, and write your logic below them.<\/p>\n<p>Boundaries matter. Read each task for the exact comparison operators it needs.<\/p>", "tasks": [{"id": "t1", "title": "Comparisons and tolerance", "points": 15, "minutes": 20, "bonus": false, "prompt_html": "<p>A 5 V rail measures <code>measured = 4.93<\/code>. The nominal value is <code>nominal = 5.0<\/code> and the tolerance is <code>tolerance_percent = 2<\/code>. Create three booleans:<\/p>\n<ul><li><code>within_tolerance<\/code>: the measured value is within the tolerance percent of nominal (use <code>abs(...)<\/code>)<\/li><li><code>is_low<\/code>: the measured value is below nominal<\/li><li><code>in_window<\/code>: the measured value is between 4.5 and 5.5 inclusive (use a chained comparison)<\/li><\/ul>", "starter": "measured = 4.93\nnominal = 5.0\ntolerance_percent = 2\n\nwithin_tolerance = ...\nis_low = ...\nin_window = ...\n\nprint(within_tolerance, is_low, in_window)\n", "hint_html": "<p>Percent error is <code>abs(measured - nominal) / nominal * 100<\/code>. Compare it with <code>tolerance_percent<\/code> using <code>&lt;=<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["4.93 V is within 2 percent", "rerun(src)['within_tolerance'] is True", "Use abs(measured - nominal) / nominal * 100 <= tolerance_percent."], ["5.2 V is outside 2 percent", "rerun(src, measured=5.2)['within_tolerance'] is False", "5.2 V is 4 percent high."], ["is_low is True for 4.93 and False for 5.2", "rerun(src)['is_low'] is True and rerun(src, measured=5.2)['is_low'] is False", "Compare measured with nominal using <."], ["in_window includes the limits and excludes 5.6", "rerun(src, measured=4.5)['in_window'] is True and rerun(src, measured=5.5)['in_window'] is True and rerun(src, measured=5.6)['in_window'] is False", "Use 4.5 <= measured <= 5.5."]]}}, {"id": "t2", "title": "Battery status ladder", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Set <code>status<\/code> for a single lithium-ion cell from <code>battery_v<\/code>:<\/p>\n<ul><li>4.1 V or more: <code>\"FULL\"<\/code><\/li><li>3.7 V or more: <code>\"GOOD\"<\/code><\/li><li>3.3 V or more: <code>\"LOW\"<\/code><\/li><li>below 3.3 V: <code>\"EMPTY\"<\/code><\/li><\/ul>\n<p>Use <code>if<\/code>, <code>elif<\/code>, and <code>else<\/code>. Then print the status.<\/p>", "starter": "battery_v = 3.55\n\n# Set status with an if / elif / else ladder\n\nprint(status)\n", "hint_html": "<p>Start with the highest threshold. Because Python runs the first True branch, <code>elif battery_v &gt;= 3.7<\/code> only runs when the value is below 4.1.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["3.55 V is LOW", "rerun(src)['status'] == 'LOW'", "3.55 is at least 3.3 but below 3.7."], ["4.2 V and 4.1 V are FULL", "rerun(src, battery_v=4.2)['status'] == 'FULL' and rerun(src, battery_v=4.1)['status'] == 'FULL'", "Use >= for the FULL threshold."], ["3.9 V is GOOD", "rerun(src, battery_v=3.9)['status'] == 'GOOD'", "Check the order of your branches."], ["3.3 V is LOW and 3.0 V is EMPTY", "rerun(src, battery_v=3.3)['status'] == 'LOW' and rerun(src, battery_v=3.0)['status'] == 'EMPTY'", "Use >= 3.3 for LOW and else for EMPTY."]]}}, {"id": "t3", "title": "Thermostat with hysteresis", "points": 20, "minutes": 25, "bonus": false, "prompt_html": "<p>Update <code>heater_on<\/code> (a boolean) each time the code runs:<\/p>\n<ul><li>If <code>temp_c<\/code> is below <code>setpoint_c - hysteresis_c<\/code>, the heater turns on.<\/li><li>If <code>temp_c<\/code> is above <code>setpoint_c + hysteresis_c<\/code>, the heater turns off.<\/li><li>Otherwise the heater keeps its current state.<\/li><\/ul>\n<p>Print <code>Heater on: True<\/code> or <code>Heater on: False<\/code> at the end.<\/p>", "starter": "temp_c = 19.8\nsetpoint_c = 21.0\nhysteresis_c = 0.5\nheater_on = False\n\n# Update heater_on here\n\nprint(\"Heater on:\", heater_on)\n", "hint_html": "<p>Use <code>if<\/code> then <code>elif<\/code>, and no <code>else<\/code>. When neither condition is True the variable keeps its old value, which is the dead-band behavior you want.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["cold room turns the heater on", "rerun(src, temp_c=19.0, heater_on=False)['heater_on'] is True", "19.0 is below 20.5, so turn the heater on."], ["warm room turns the heater off", "rerun(src, temp_c=22.0, heater_on=True)['heater_on'] is False", "22.0 is above 21.5, so turn the heater off."], ["inside the band a running heater keeps running", "rerun(src, temp_c=21.2, heater_on=True)['heater_on'] is True", "Do not change heater_on inside the band."], ["inside the band an idle heater stays off", "rerun(src, temp_c=20.8, heater_on=False)['heater_on'] is False", "Do not change heater_on inside the band."], ["exactly at the lower limit changes nothing", "rerun(src, temp_c=20.5, heater_on=False)['heater_on'] is False", "Use < not <= for the on condition."], ["printed line matches the final state", "out.strip() == 'Heater on: True'", "Print with print(\"Heater on:\", heater_on)."]]}}, {"id": "t4", "title": "Validate a throttle input", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Read an integer throttle percentage with <code>input()<\/code>. If it is from 0 to 100 inclusive, print <code>Throttle set to 40%<\/code> (with the actual value). Otherwise print <code>Invalid throttle: 140<\/code> (with the actual value). The final line printed must be one of those two lines.<\/p>", "starter": "throttle = ...   # read the input and convert to int\n\n# Print the right message\n", "hint_html": "<p><code>throttle = int(input(\"Throttle percent: \"))<\/code>. Use a chained comparison for the valid range and <code>else<\/code> for everything else.<\/p>", "stdin": ["40"], "tests": {"setup": "", "items": [["40 is accepted", "run_with(src, ['40']).splitlines()[-1] == 'Throttle set to 40%'", "Print: Throttle set to 40%"], ["100 and 0 are accepted", "run_with(src, ['100']).splitlines()[-1] == 'Throttle set to 100%' and run_with(src, ['0']).splitlines()[-1] == 'Throttle set to 0%'", "The limits 0 and 100 are valid. Use <=."], ["140 is rejected", "run_with(src, ['140']).splitlines()[-1] == 'Invalid throttle: 140'", "Print: Invalid throttle: 140"], ["-5 is rejected", "run_with(src, ['-5']).splitlines()[-1] == 'Invalid throttle: -5'", "Negative values are invalid."]]}}, {"id": "t5", "title": "Machine safety interlock", "points": 25, "minutes": 35, "bonus": false, "prompt_html": "<p>Set <code>state<\/code> to <code>\"STOP\"<\/code>, <code>\"WARN\"<\/code>, or <code>\"RUN\"<\/code> using these rules in this priority order:<\/p>\n<ol><li>STOP if <code>door_closed<\/code> is False, or <code>temp_c<\/code> is above 90, or <code>pressure_kpa<\/code> is above 800.<\/li><li>WARN if <code>temp_c<\/code> is above 75 or <code>pressure_kpa<\/code> is above 650.<\/li><li>RUN otherwise.<\/li><\/ol>\n<p>Print the state. The limits are strict: exactly 90 is not above 90.<\/p>", "starter": "door_closed = True\ntemp_c = 50\npressure_kpa = 300\n\n# Set state here\n\nprint(state)\n", "hint_html": "<p>Write the STOP test first, then <code>elif<\/code> for WARN, then <code>else<\/code> for RUN. For the door use <code>not door_closed<\/code>. Combine the three STOP conditions with <code>or<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["normal conditions give RUN", "rerun(src)['state'] == 'RUN'", "With the door closed, 50 C, and 300 kPa the machine runs."], ["open door gives STOP", "rerun(src, door_closed=False)['state'] == 'STOP'", "An open door stops the machine regardless of other values."], ["95 C gives STOP", "rerun(src, temp_c=95)['state'] == 'STOP'", "Temperatures above 90 stop the machine."], ["850 kPa gives STOP", "rerun(src, pressure_kpa=850)['state'] == 'STOP'", "Pressures above 800 stop the machine."], ["80 C gives WARN", "rerun(src, temp_c=80)['state'] == 'WARN'", "Above 75 but not above 90 is a warning."], ["700 kPa gives WARN", "rerun(src, pressure_kpa=700)['state'] == 'WARN'", "Above 650 but not above 800 is a warning."], ["exactly 75 C and 650 kPa give RUN", "rerun(src, temp_c=75, pressure_kpa=650)['state'] == 'RUN'", "The limits are strict. Use > not >=."], ["exactly 90 C gives WARN", "rerun(src, temp_c=90)['state'] == 'WARN'", "90 is not above 90, so the STOP rule does not fire; WARN does."], ["door open outranks a WARN reading", "rerun(src, door_closed=False, temp_c=80)['state'] == 'STOP'", "Check the STOP rule before the WARN rule."]]}}, {"id": "t6", "title": "Range check for a 16-bit integer", "points": 10, "minutes": 20, "bonus": false, "prompt_html": "<p>Apply the Ariane 5 lesson. For <code>value = 40000<\/code>:<\/p>\n<ul><li>Set <code>fits_int16<\/code> to True when <code>value<\/code> is from -32768 to 32767 inclusive, else False.<\/li><li>Set <code>message<\/code> to <code>\"OK to convert\"<\/code> when it fits, or <code>\"Range error: do not convert\"<\/code> when it does not.<\/li><\/ul>", "starter": "value = 40000\n\nfits_int16 = ...\nmessage = ...\n\nprint(message)\n", "hint_html": "<p><code>fits_int16 = -32768 &lt;= value &lt;= 32767<\/code>. Then use <code>if fits_int16:<\/code> and <code>else:<\/code> to choose the message.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["40000 does not fit", "rerun(src)['fits_int16'] is False and rerun(src)['message'] == 'Range error: do not convert'", "40000 is above 32767."], ["30000 fits", "rerun(src, value=30000)['fits_int16'] is True and rerun(src, value=30000)['message'] == 'OK to convert'", "30000 is inside the range."], ["limits -32768 and 32767 fit", "rerun(src, value=-32768)['fits_int16'] is True and rerun(src, value=32767)['fits_int16'] is True", "Use <= on both ends."], ["one step outside does not fit", "rerun(src, value=32768)['fits_int16'] is False and rerun(src, value=-32769)['fits_int16'] is False", "32768 and -32769 are out of range."]]}}, {"id": "b1", "title": "Choose a fuse rating", "points": 10, "minutes": 20, "bonus": true, "prompt_html": "<p>As a practice rule for this exercise, pick the smallest standard fuse that is at least 1.25 times the load current. Standard values in amps: 1, 2, 3, 5, 7.5, 10, 15, 20, 25, 30. If none is large enough, set <code>fuse_a<\/code> to <code>\"none\"<\/code>. This is a coding exercise, not a design rule for real equipment.<\/p>\n<p>Compute <code>need_a = load_a * 1.25<\/code> and set <code>fuse_a<\/code>.<\/p>", "starter": "load_a = 6.0\n\nneed_a = ...\nfuse_a = ...\n\nprint(fuse_a)\n", "hint_html": "<p>Use an <code>if<\/code> / <code>elif<\/code> ladder from the smallest fuse upward: <code>if need_a &lt;= 1:<\/code> then <code>elif need_a &lt;= 2:<\/code> and so on, ending with <code>else: fuse_a = \"none\"<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["6 A load gives a 7.5 A fuse", "rerun(src)['fuse_a'] == 7.5", "6 * 1.25 is 7.5, which a 7.5 A fuse covers."], ["2 A load gives 3 A", "rerun(src, load_a=2.0)['fuse_a'] == 3", "2.5 A needed, so the next standard value is 3."], ["0.5 A load gives 1 A", "rerun(src, load_a=0.5)['fuse_a'] == 1", "The smallest fuse covers small loads."], ["8 A load gives 10 A and 25 A gives none", "rerun(src, load_a=8.0)['fuse_a'] == 10 and rerun(src, load_a=25.0)['fuse_a'] == 'none'", "Handle the case where no fuse is large enough."]]}}]}, "lab_minutes": 150, "quiz": [{"q": "What does <code>5 == 5.0<\/code> evaluate to?", "options": ["An error", "<code>False<\/code>", "<code>5<\/code>", "<code>True<\/code>"], "answer": 3, "why": "Python compares the numeric values, and 5 equals 5.0."}, {"q": "What does <code>3 &gt; 2 and 2 &gt; 5<\/code> evaluate to?", "options": ["<code>False<\/code>", "<code>3<\/code>", "<code>None<\/code>", "<code>True<\/code>"], "answer": 0, "why": "The second comparison is False, and <code>and<\/code> needs both sides True."}, {"q": "What does <code>not (3 &gt; 2 or 1 &gt; 5)<\/code> evaluate to?", "options": ["<code>True<\/code>", "<code>False<\/code>", "An error", "<code>3<\/code>"], "answer": 1, "why": "<code>3 &gt; 2<\/code> is True, so the <code>or<\/code> is True, and <code>not True<\/code> is False."}, {"q": "Which operator tests whether two values are equal?", "options": ["<code>=<\/code>", "<code>=&gt;<\/code>", "<code>==<\/code>", "<code>!=<\/code>"], "answer": 2, "why": "<code>==<\/code> compares. A single <code>=<\/code> assigns."}, {"q": "In an if/elif/else ladder, how many branches run?", "options": ["Exactly two", "Every branch whose condition is True", "All of them", "At most one"], "answer": 3, "why": "Python runs the first True branch and skips the rest."}, {"q": "<pre><code>score = 75\nif score &gt;= 90:\n    grade = &quot;A&quot;\nelif score &gt;= 70:\n    grade = &quot;B&quot;\nelse:\n    grade = &quot;C&quot;<\/code><\/pre>\n<p>What is <code>grade<\/code>?<\/p>", "options": ["<code>\"B\"<\/code>", "<code>\"A\"<\/code>", "<code>\"C\"<\/code>", "<code>\"B\"<\/code> and <code>\"C\"<\/code>"], "answer": 0, "why": "75 fails the first test and passes the second, so the second branch runs and the ladder ends."}, {"q": "What marks the body of an <code>if<\/code> block in Python?", "options": ["Parentheses around the condition", "A colon, then indentation", "Curly braces", "The word <code>then<\/code>"], "answer": 1, "why": "The condition ends with a colon and the block that follows is indented."}, {"q": "What does <code>math.isclose(0.1 + 0.2, 0.3)<\/code> return?", "options": ["<code>0.3<\/code>", "An error", "<code>True<\/code>", "<code>False<\/code>"], "answer": 2, "why": "<code>isclose<\/code> allows a small tolerance, so it ignores the tiny rounding difference."}, {"q": "What is the largest 16-bit signed integer?", "options": ["32768", "16384", "65535", "32767"], "answer": 3, "why": "A 16-bit signed integer ranges from -32768 to 32767, which is 2 to the 15th minus 1 at the top."}, {"q": "What should code do before converting a float to a 16-bit integer?", "options": ["Check that the value is inside the allowed range", "Print the value", "Round the value to two decimals", "Multiply the value by 16"], "answer": 0, "why": "A range check prevents the conversion error that destroyed Ariane 5 flight 501."}, {"q": "With <code>x = 10<\/code>, what does <code>x &gt; 5 and x &lt; 8<\/code> evaluate to?", "options": ["<code>True<\/code>", "<code>False<\/code>", "<code>10<\/code>", "<code>None<\/code>"], "answer": 1, "why": "<code>x &lt; 8<\/code> is False, so the <code>and<\/code> expression is False."}, {"q": "A thermostat uses hysteresis. The temperature is inside the dead band. What happens to the heater?", "options": ["It switches every second", "It turns off", "It keeps its previous state", "It turns on"], "answer": 2, "why": "Inside the band neither threshold test is True, so the state is unchanged. That avoids rapid cycling."}], "quiz_minutes": 18, "quiz_intro_html": "<p>Answer each question. You see the explanation right after you choose. You can reset the quiz and try again.<\/p>"}</script>
<script id="harness" type="text/x-python">import sys, io, os, json, ast, base64, builtins, traceback, contextlib, math, random

os.environ.setdefault("MPLBACKEND", "Agg")
import importlib
if "" not in sys.path:
    sys.path.insert(0, "")

_OUT_CAP = 20000
_LECTURE_NS = {"__name__": "__main__"}


class _Capped(io.StringIO):
    def write(self, s):
        if self.tell() > _OUT_CAP:
            raise RuntimeError("Output limit reached. Your code printed too much text.")
        return super().write(s)


def approx(a, b, rel=1e-6, abs_=1e-9):
    try:
        if "numpy" in sys.modules:
            import numpy as _np
            if isinstance(a, _np.ndarray) or isinstance(b, _np.ndarray):
                return bool(_np.allclose(a, b, rtol=rel, atol=abs_))
        if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
            return len(a) == len(b) and all(approx(x, y, rel, abs_) for x, y in zip(a, b))
        return abs(float(a) - float(b)) <= max(abs_, rel * abs(float(b)))
    except Exception:
        return False


def uses_node(src, *names):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    wanted = tuple(getattr(ast, n) for n in names)
    return any(isinstance(n, wanted) for n in ast.walk(tree))


def calls_name(src, name):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    for n in ast.walk(tree):
        if isinstance(n, ast.Call):
            f = n.func
            if isinstance(f, ast.Name) and f.id == name:
                return True
            if isinstance(f, ast.Attribute) and f.attr == name:
                return True
    return False


def line_has(src, target, *words):
    """True when an assignment to `target` has every word on its right side."""
    for line in src.splitlines():
        s = line.strip()
        if s.startswith("#") or "=" not in s:
            continue
        left, _, right = s.partition("=")
        if left.strip() == target and all(w in right for w in words):
            return True
    return False


def run_with(src, inputs=(), ns=None):
    """Run student source with scripted input() values; return what it printed."""
    queue = list(inputs)
    old = builtins.input

    def _fake(prompt=""):
        print(prompt, end="")
        if not queue:
            raise EOFError("input() called more times than expected")
        v = queue.pop(0)
        print(v)
        return v

    buf = io.StringIO()
    builtins.input = _fake
    try:
        with contextlib.redirect_stdout(buf):
            exec(compile(src, "<your code>", "exec"), ns if ns is not None else {"__name__": "__main__"})
    finally:
        builtins.input = old
    return buf.getvalue()


def rerun(src, **over):
    """Execute student source again with top-level assignments replaced by the given constants.
    Returns the resulting namespace. Output is discarded."""
    tree = ast.parse(src)
    for node in tree.body:
        if (isinstance(node, ast.Assign) and len(node.targets) == 1
                and isinstance(node.targets[0], ast.Name) and node.targets[0].id in over):
            node.value = ast.Constant(over[node.targets[0].id])
    ast.fix_missing_locations(tree)
    ns = {"__name__": "__main__"}
    with contextlib.redirect_stdout(io.StringIO()):
        exec(compile(tree, "<your code>", "exec"), ns)
    return ns


def count_defs(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.FunctionDef) for n in ast.walk(tree))


def count_classes(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.ClassDef) for n in ast.walk(tree))


def _format_error(exc, code):
    lines = code.split("\n")
    if isinstance(exc, SyntaxError):
        ln = exc.lineno
        msg = "SyntaxError: " + str(exc.msg)
        if ln and 1 <= ln <= len(lines):
            msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
        return msg
    tb = traceback.TracebackException.from_exception(exc)
    ln = None
    for fs in tb.stack:
        if fs.filename == "<your code>":
            ln = fs.lineno
    msg = "".join(tb.format_exception_only()).strip()
    if ln and 1 <= ln <= len(lines):
        msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
    return msg


def _make_input(stdin_lines, out):
    queue = list(stdin_lines)

    def _input(prompt=""):
        out.write(str(prompt))
        if not queue:
            raise EOFError("input() ran out of lines. Type one value per line in the Input box under the code.")
        val = queue.pop(0)
        out.write(val + "\n")
        return val

    return _input


def _exec_code(code, ns, out):
    tree = ast.parse(code, "<your code>", "exec")
    last = None
    if tree.body and isinstance(tree.body[-1], ast.Expr):
        last = ast.Expression(tree.body.pop().value)
    exec(compile(tree, "<your code>", "exec"), ns)
    if last is not None:
        val = eval(compile(last, "<your code>", "eval"), ns)
        if val is not None:
            out.write(repr(val) + "\n")


def _collect_images():
    imgs = []
    if "matplotlib.pyplot" in sys.modules:
        import matplotlib.pyplot as plt
        for num in plt.get_fignums():
            fig = plt.figure(num)
            buf = io.BytesIO()
            fig.savefig(buf, format="png", dpi=100, bbox_inches="tight")
            imgs.append(base64.b64encode(buf.getvalue()).decode("ascii"))
        plt.close("all")
    return imgs


def reset_lecture():
    _LECTURE_NS.clear()
    _LECTURE_NS["__name__"] = "__main__"


def run_cell(req_json):
    req = json.loads(req_json)
    code = req.get("code", "")
    mode = req.get("mode", "fresh")
    stdin_lines = req.get("stdin") or []
    tests = req.get("tests")
    ns = _LECTURE_NS if mode == "lecture" else {"__name__": "__main__"}
    importlib.invalidate_caches()
    out = _Capped()
    err = None
    real_input = builtins.input
    builtins.input = _make_input(stdin_lines, out)
    try:
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
            try:
                random.seed()
                _exec_code(code, ns, out)
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                err = _format_error(exc, code)
    finally:
        builtins.input = real_input
    result = {"stdout": out.getvalue(), "error": err, "images": [], "tests": None}
    try:
        result["images"] = _collect_images()
    except Exception as exc:
        result["stdout"] += "\n(Plot could not be drawn: %s)" % exc
    if tests is not None:
        result["tests"] = _run_tests(tests, ns, code, err, out.getvalue())
    return json.dumps(result)


def _run_tests(tests, ns, code, err, stdout_text):
    items = tests.get("items", [])
    results = []
    if err is not None:
        for label, _expr, hint in items:
            results.append({"label": label, "ok": False, "msg": "Fix the error above first."})
        return results
    env = ns
    helpers = {
        "approx": approx, "out": stdout_text, "src": code, "ast": ast,
        "uses_node": uses_node, "calls_name": calls_name,
        "count_defs": count_defs, "run_with": run_with, "rerun": rerun, "count_classes": count_classes, "line_has": line_has,
        "math": math, "random": random, "io": io, "_in_tests": True,
    }
    _missing = object()
    saved = {k: env.get(k, _missing) for k in helpers}
    env.update(helpers)
    sink = _Capped()
    try:
        setup = tests.get("setup")
        if setup:
            try:
                with contextlib.redirect_stdout(sink):
                    exec(compile(setup, "<tests>", "exec"), env)
            except BaseException as exc:
                reason = "Could not run the checks: %s: %s" % (type(exc).__name__, exc)
                return [{"label": l, "ok": False, "msg": reason} for l, _e, _h in items]
        for label, expr, hint in items:
            try:
                with contextlib.redirect_stdout(sink):
                    ok = bool(eval(compile(expr, "<tests>", "eval"), env))
                results.append({"label": label, "ok": ok, "msg": "" if ok else hint})
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                results.append({"label": label, "ok": False,
                                "msg": "%s (%s: %s)" % (hint, type(exc).__name__, exc)})
    finally:
        for k, v in saved.items():
            if v is _missing:
                env.pop(k, None)
            else:
                env[k] = v
    return results

/* ---------- python runner ---------- */
var Py = (function () {
  var worker = null, ready = false, current = null, queue = [], timer = null, nextId = 1;
  var stopBtn = document.getElementById('stopbtn');
  var statusEl = document.getElementById('pystatus');
  function status(t) { statusEl.textContent = t; }
  function start() {
    var blob = new Blob([WORKER_SRC], { type: 'text/javascript' });
    worker = new Worker(URL.createObjectURL(blob));

  function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } stopBtn.hidden = true; }
  function armTimer() {
    clearTimer(); stopBtn.hidden = false;
    var secs = (current && current.req.timeout) || 20;
    timer = setTimeout(function () {
      kill();
      finish(failure('Stopped after ' + secs + ' seconds. Look for a loop that never ends. Python restarted, so run earlier cells again.', current && current.req));
      start();
    }, secs * 1000);
  }
  function finish(result) {
    var c = current; current = null; clearTimer();
    if (c) { c.resolve(result); }
    status(ready ? 'Python ready' : 'Python restarting...');
    pump();
  }
  function onMsg(e) {
    var m = e.data;
    if (m.type === 'ready') { ready = true; status('Python ready'); pump(); }
    else if (m.type === 'initerror') {
      kill();
      status('Python could not start');
      var q = queue.slice(); queue = [];
      if (current) { q.unshift(current); current = null; }
      q.forEach(function (c) { c.resolve(failure('Python could not start. It needs an internet connection to load. Reload the page and try again. Details: ' + m.message, c.req)); });
    }

    else if (m.type === 'started') { status('Running...'); armTimer(); }
    else if (m.type === 'result') { finish(m.result); }
    else if (m.type === 'error') { finish(failure('Python error: ' + m.message, current && current.req)); }

    if (!ready || current || !queue.length) { return; }
    current = queue.shift();

    worker.postMessage({ type: 'run', code: current.req.code, stdin: current.req.stdin || [], mode: current.req.mode, tests: current.req.tests || null });
  }
  stopBtn.addEventListener('click', function () {
    if (!current) { return; }
    kill();
    finish(failure('Stopped. Python restarted, so run earlier cells again.', current.req));
    start();
  });

    run: function (req) {
      return new Promise(function (resolve) {
        queue.push({ id: nextId++, req: req, resolve: resolve });
        if (!worker) { start(); } else { pump(); }
      });
    },
    reset: function () { if (worker && ready) { worker.postMessage({ type: 'reset' }); } }
  };
})();

    else { try { document.execCommand('copy'); done(); } catch (e) {} }
  } });
  var b3 = h('button', { class: 'btn', text: 'Download .txt', onclick: function () {
    var txt = buildReport(); ta.value = txt;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
    a.download = 'week' + D.num + '_report.txt'; document.body.appendChild(a); a.click(); a.remove();
  } });
  rep.appendChild(h('div', { class: 'row' }, [b1, b2, b3]));
  rep.appendChild(ta);
  p.appendChild(rep);
  updateLab();
}
function quizTally() {
  var correct = 0, answered = 0;
  D.quiz.forEach(function (q, i) { var a = S.quiz[i]; if (a !== undefined && a !== null) { answered++; if (a === q.answer) { correct++; } } });
  return { correct: correct, answered: answered, total: D.quiz.length };
}
function buildReport() {
  var L = [], s = labScore(), q = quizTally();
  var max = D.lab.tasks.filter(function (t) { return !t.bonus; }).reduce(function (a, t) { return a + t.points; }, 0);
  var lec = D.lecture.filter(function (_s, i) { return S.lecDone[i]; }).length;
  L.push('Course: ' + D.course_title);
  L.push('Week ' + D.num + ': ' + D.title);
  L.push('Name: ' + (S.name || '(not entered)'));
  L.push('Generated: ' + new Date().toLocaleString());
  L.push('');
  L.push('Lecture sections marked complete: ' + lec + ' of ' + D.lecture.length);
  L.push('Lab score (browser autograder): ' + s.score + ' of ' + max + (s.bonus ? ', bonus ' + s.bonus : ''));
  L.push('Quiz: ' + q.correct + ' correct, ' + q.answered + ' answered, ' + q.total + ' questions');
  L.push('');
  D.lab.tasks.forEach(function (t, i) {
    var r = S.lab[t.id];
    L.push('==== ' + (t.bonus ? 'Bonus' : 'Task ' + (i + 1)) + ': ' + t.title + ' (' + (r ? r.passed + '/' + r.total + ' tests' : 'not checked') + ') ====');
    L.push(S.code['lab_' + t.id] !== undefined ? S.code['lab_' + t.id] : t.starter);
    L.push('');
  });
  return L.join('\n');
}

/* ---------- quiz ---------- */
function updateQuiz() {
  var q = quizTally();
  var el = document.getElementById('quizscore');
  if (el) { el.textContent = q.correct + ' correct of ' + q.answered + ' answered, ' + q.total + ' questions'; }
  tiles.quiz.textContent = q.correct + '/' + q.total;
}
function renderQuiz() {
  var p = document.getElementById('panel-quiz');
  p.innerHTML = '';
  p.appendChild(h('div', { class: 'card', html: D.quiz_intro_html }));
  p.appendChild(h('div', { class: 'row' }, [
    h('strong', { text: 'Score: ' }), h('span', { id: 'quizscore', class: 'badge info' }),
    h('span', { style: 'flex:1' }),
    h('button', { class: 'btn', text: 'Reset quiz', onclick: function () {
      if (!confirm('Clear all quiz answers?')) { return; } S.quiz = {}; save(); renderQuiz();
    } })
  ]));
  D.quiz.forEach(function (q, i) {
    var card = h('div', { class: 'card' });
    card.appendChild(h('p', { class: 'meta', text: 'Question ' + (i + 1) + ' of ' + D.quiz.length }));
    card.appendChild(mcq({ cls: 'qbox', q: q.q, options: q.options, answer: q.answer, why: q.why, saved: S.quiz[i], onAnswer: function (k) { S.quiz[i] = k; save(); updateQuiz(); } }));
    p.appendChild(card);
  });
  updateQuiz();
}

/* ---------- shell ---------- */
document.getElementById('kicker').textContent = D.course_title + ', Week ' + D.num;
document.getElementById('title').textContent = D.title;
document.title = D.course_title + ' Week ' + D.num + ' ' + D.title;
var chips = document.getElementById('chips');
[D.lecture_minutes + ' min lecture', D.lab_minutes + ' min lab', D.quiz.length + ' quiz questions'].forEach(function (t) { chips.appendChild(h('li', { text: t })); });
var tabs = [['overview', 'Overview'], ['lecture', 'Lecture'], ['lab', 'Lab'], ['quiz', 'Quiz']];
var tl = document.getElementById('tablist');
tabs.forEach(function (t) {
  var b = h('button', { role: 'tab', id: 'tab-' + t[0], 'aria-controls': 'panel-' + t[0], 'aria-selected': 'false', text: t[1] });
  b.addEventListener('click', function () { show(t[0]); });
  tl.appendChild(b);
});
function show(name) {
  tabs.forEach(function (t) {
    document.getElementById('panel-' + t[0]).hidden = (t[0] !== name);
    document.getElementById('tab-' + t[0]).setAttribute('aria-selected', t[0] === name ? 'true' : 'false');
  });
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
  window.scrollTo(0, 0);
  document.querySelectorAll('#panel-' + name + ' textarea.code').forEach(function (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 4, 640) + 'px'; });
}
renderOverview(); renderLecture(); renderLab(); renderQuiz();
var start = (location.hash || '').replace('#', '');
show(tabs.some(function (t) { return t[0] === start; }) ? start : 'overview');
})();
</script>
