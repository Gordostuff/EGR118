<style>
:root{
  --bg:#f6f5f0; --card:#ffffff; --ink:#1a1f24; --mute:#59636e; --line:#d9d6cb;

    --bg:#11151a; --card:#192028; --ink:#e7ebef; --mute:#9aa6b2; --line:#2c3641;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:50}
header.top{padding:28px 0 12px}
.kicker{font-size:13px;color:var(--mute);letter-spacing:.02em;margin:0 0 4px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.2;margin:0 0 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:13px;border:1px solid var(--line);background:var(--card);padding:2px 10px;border-radius:999px;color:var(--mute)}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--mute);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.statusbar{position:sticky;top:46px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:6px 12px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.statusbar .grow{flex:1}
main{padding:16px 0 80px}
.panel[hidden]{display:none}
h2{font-size:22px;margin:24px 0 8px;font-weight:600}
h3{font-size:18px;margin:0 0 6px;font-weight:600}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:22px}
li{margin:2px 0}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:1px 5px;border-radius:4px}

.tile .big{font-size:24px;font-weight:600;font-family:var(--mono)}
.tile .lbl{font-size:13px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.bar>span{display:block;height:100%;background:var(--accent);width:0}
button.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.cell{margin:12px 0}
textarea.code{display:block;width:100%;font-family:var(--mono);font-size:14px;line-height:1.5;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;resize:vertical;tab-size:4;white-space:pre;overflow:auto;min-height:60px}
.stdin{margin-top:6px}
.stdin label{font-size:13px;color:var(--mute);display:block}
textarea.stdin-box{width:100%;font-family:var(--mono);font-size:13px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:48px}
.out{margin-top:8px}
pre.stdout{margin:0;background:var(--out-bg);color:var(--out-ink);font-family:var(--mono);font-size:13.5px;padding:10px 12px;border-radius:6px;border:1px solid #b9c8dc;overflow:auto;white-space:pre-wrap;word-break:break-word}
.err{margin-top:8px;border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:8px 12px;font-size:14px}
.err pre{margin:4px 0 0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;color:inherit}
.out img{max-width:100%;height:auto;background:#fff;border-radius:6px;margin-top:8px;border:1px solid var(--line)}
.tests{list-style:none;margin:8px 0 0;padding:0}
.tests li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.badge{font-family:var(--mono);font-size:12px;font-weight:500;padding:1px 8px;border-radius:4px;flex:none}
.badge.pass{background:var(--ok-bg);color:var(--ok)}
.badge.fail{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.hint{margin:8px 0;padding:8px 12px;background:var(--warn-bg);color:var(--ink);border-radius:6px;font-size:14px;border:1px solid var(--line)}
.q{margin:0 0 6px;font-weight:500}
.q p{margin:0 0 8px}
.q pre,.card pre{background:var(--code-bg);padding:8px 12px;border-radius:6px;overflow:auto;font-family:var(--mono);font-size:13.5px;font-weight:400;margin:0 0 10px}
.q pre code,.card pre code{background:none;padding:0}
.opts{list-style:none;padding:0;margin:0}
.opts button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:var(--ok-bg)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opts button:disabled{cursor:default}
.why{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:6px;background:var(--accent-soft)}
.checkq{margin:14px 0 4px;padding:12px;border:1px dashed var(--line);border-radius:8px}
.done-row{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.field input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-width:240px}
textarea.report{width:100%;min-height:200px;font-family:var(--mono);font-size:12.5px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px}
table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code-bg)}
.small{font-size:13px;color:var(--mute)}
@media (max-width:600px){ .field input{min-width:0;width:100%} .statusbar{top:44px} }

<script id="data" type="application/json">{"course_id": "pyeng", "course_title": "Python for Engineers", "pyodide_base": "https://cdn.jsdelivr.net/pyodide/v0.27.8/full/", "num": 4, "title": "Loops: Projectile Tables and Trial-and-Error Design", "hook": "The ENIAC computer was built during World War II to calculate artillery firing tables. By commonly cited figures, a person with a desk calculator needed roughly 20 hours for one trajectory, and ENIAC finished one in under a minute. A firing table is a list of the same calculation repeated for many angles and distances. This week you write that repetition with loops and use it to search for a design that meets a target.", "objectives": ["write <code>for<\/code> loops with <code>range<\/code> and <code>while<\/code> loops with a clear stopping condition", "accumulate totals, counts, and maximum values inside a loop", "stop or skip iterations with <code>break<\/code> and <code>continue<\/code>", "print a formatted table of projectile motion results", "search a range of values to find a design that meets a target"], "summary": "<ul><li><code>while condition:<\/code> repeats until the condition is False. Change something inside so it can end.<\/li><li><code>for item in range(start, stop, step):<\/code> runs once per value. The stop value is excluded.<\/li><li>Initialize accumulators before the loop: totals start at 0, maximums start at a low value or <code>None<\/code>.<\/li><li><code>x += 1<\/code> means <code>x = x + 1<\/code>.<\/li><li><code>break<\/code> exits a loop. <code>continue<\/code> skips to the next pass.<\/li><li>Nested loops multiply: 4 outer passes times 5 inner passes is 20 inner runs.<\/li><li>A search loop tries values, tracks the best result so far, and reports the winner after the loop.<\/li><\/ul>", "lecture": [{"title": "Firing tables and repetition", "minutes": 10, "html": "<p>A projectile launched at speed <code>v0<\/code> and angle <code>theta<\/code> has height <code>y = v0 * sin(theta) * t - 0.5 * g * t ** 2<\/code> after <code>t<\/code> seconds, with <code>g = 9.81<\/code> m/s squared. To tabulate the height at several times without a loop, you copy the formula once per time. That works for three rows and fails at three hundred. The cell below shows the repetitive version.<\/p>", "cells": [{"code": "import math\nv0 = 20.0\ng = 9.81\nvy = v0 * math.sin(math.radians(45))\nprint(vy * 0 - 0.5 * g * 0 ** 2)\nprint(vy * 1 - 0.5 * g * 1 ** 2)\nprint(vy * 2 - 0.5 * g * 2 ** 2)\n", "stdin": null, "note": "Three copies of one formula. A loop writes it once."}]}, {"title": "while loops", "minutes": 20, "html": "<p>A <code>while<\/code> loop repeats a block as long as its condition is True. The syntax matches <code>if<\/code>: a colon, then an indented block. The condition is checked before every pass.<\/p>\n<p>Every <code>while<\/code> loop needs three parts:<\/p>\n<ol><li>Something that starts the condition (a counter or a value)<\/li><li>A condition that can become False<\/li><li>A change inside the loop that moves toward False<\/li><\/ol>\n<p>If the change is missing, the loop never ends. Python stops any cell that runs more than 20 seconds, but your own programs on a real machine would keep running until you interrupt them.<\/p>", "cells": [{"code": "count = 1\nwhile count <= 5:\n    print(\"Pass\", count)\n    count = count + 1\nprint(\"Done\")\n", "stdin": null, "note": null}, {"code": "current_ma = 100.0\nhalvings = 0\nwhile current_ma >= 1:\n    current_ma = current_ma / 2\n    halvings += 1\nprint(halvings, current_ma)\n", "stdin": null, "note": "<code>x += 1<\/code> is shorthand for <code>x = x + 1<\/code>. Predict <code>halvings<\/code> before you run the cell."}], "check": {"q": "What makes a <code>while<\/code> loop run forever?", "options": ["The loop prints a value", "The loop body has more than five lines", "The loop uses a counter", "Nothing inside the loop moves the condition toward False"], "answer": 3, "why": "The condition must be able to become False. Without a change to the variable it tests, it never does."}}, {"title": "for loops and range", "minutes": 20, "html": "<p>A <code>for<\/code> loop repeats a block once for each value in a sequence. <code>range<\/code> makes a sequence of whole numbers:<\/p>\n<ul><li><code>range(5)<\/code> gives 0, 1, 2, 3, 4<\/li><li><code>range(2, 6)<\/code> gives 2, 3, 4, 5 (the end is excluded)<\/li><li><code>range(0, 10, 3)<\/code> gives 0, 3, 6, 9 (the third number is the step)<\/li><\/ul>\n<p>Use <code>for<\/code> when you know how many passes you need. Use <code>while<\/code> when you repeat until a condition changes.<\/p>", "cells": [{"code": "for i in range(5):\n    print(i)\n", "stdin": null, "note": null}, {"code": "print(list(range(2, 6)))\nprint(list(range(0, 10, 3)))\nprint(list(range(5, 0, -1)))\n", "stdin": null, "note": "<code>list(...)<\/code> shows the values that <code>range<\/code> produces. Lists get full coverage in week 6."}, {"code": "R = 2\nfor current in range(1, 6):\n    power = current ** 2 * R\n    print(f\"{current} A: {power:.1f} W\")\n", "stdin": null, "note": null}], "check": {"q": "Which values does <code>range(2, 6)<\/code> produce?", "options": ["2, 3, 4, 5, 6", "2, 3, 4, 5", "3, 4, 5, 6", "2, 6"], "answer": 1, "why": "The start is included and the end is excluded."}}, {"title": "Accumulators: totals, counts, and maximums", "minutes": 15, "html": "<p>Many loops build a result across passes. Start the result before the loop, update it inside, and use it after.<\/p>\n<ul><li><strong>Total:<\/strong> <code>total = 0<\/code> before, <code>total += value<\/code> inside<\/li><li><strong>Count:<\/strong> <code>count = 0<\/code> before, <code>count += 1<\/code> inside an <code>if<\/code><\/li><li><strong>Maximum:<\/strong> keep the best value so far and replace it when you see a better one<\/li><li><strong>Average:<\/strong> total divided by count, after the loop<\/li><\/ul>\n<p>Initialize before the loop. A variable created inside the loop starts over on every pass.<\/p>", "cells": [{"code": "total = 0\nfor minute in range(10):\n    power_w = 5 + 2 * minute\n    total += power_w\nprint(total, \"watt-minutes\")\nprint(round(total / 60, 3), \"Wh\")\n", "stdin": null, "note": null}, {"code": "best = 0\nfor n in range(1, 8):\n    value = n * (10 - n)\n    if value > best:\n        best = value\nprint(best)\n", "stdin": null, "note": "This is the maximum pattern. Change the formula and run it again."}], "check": {"q": "Where should <code>total = 0<\/code> go for a running total?", "options": ["After the loop", "Inside the loop, on the first line", "Anywhere; the position does not matter", "Before the loop"], "answer": 3, "why": "If you set the total inside the loop it resets to 0 on every pass and the final value only reflects the last pass."}}, {"title": "Projectile motion table", "minutes": 20, "html": "<p>Now apply loops to a real calculation. The horizontal position is <code>x = v0 * cos(theta) * t<\/code>. The height is <code>y = v0 * sin(theta) * t - 0.5 * g * t ** 2<\/code>. We step time forward by 0.5 s and print a row each time until the projectile hits the ground.<\/p>\n<p>The loop runs until <code>y<\/code> becomes negative, so a <code>while<\/code> loop fits. We do not know in advance how many rows we need. The <code>break<\/code> statement exits a loop immediately. Study how the program tracks the highest row it has seen.<\/p>", "cells": [{"code": "import math\nv0 = 20.0\nangle = math.radians(45)\ng = 9.81\n\nt = 0.0\nmax_height = 0.0\nwhile True:\n    x = v0 * math.cos(angle) * t\n    y = v0 * math.sin(angle) * t - 0.5 * g * t ** 2\n    if y < 0:\n        break\n    print(f\"{t:4.1f} {x:7.2f} {y:7.2f}\")\n    if y > max_height:\n        max_height = y\n    t += 0.5\n\nprint(\"Highest row:\", round(max_height, 2), \"m\")\n", "stdin": null, "note": "Change <code>v0<\/code> to 30 and the angle to 30 degrees, then run again."}], "check": {"q": "Why does the table code use <code>while True<\/code> with a <code>break<\/code>?", "options": ["<code>for<\/code> loops cannot use <code>range<\/code>", "The number of rows is not known until y turns negative", "Python requires <code>break<\/code> in every loop", "<code>while True<\/code> is faster"], "answer": 1, "why": "When the stopping point depends on a calculated value, a loop that checks inside and breaks fits better than a fixed count."}}, {"title": "break and continue", "minutes": 15, "html": "<p>Two statements change the flow of a loop:<\/p>\n<ul><li><code>break<\/code> ends the loop at once<\/li><li><code>continue<\/code> skips the rest of the current pass and goes to the next one<\/li><\/ul>\n<p>Use them sparingly. A loop with a clear condition is easier to read than one with several exits. <code>continue<\/code> is handy for ignoring bad readings without a deep <code>if<\/code> nest.<\/p>", "cells": [{"code": "for n in range(1, 10):\n    if n % 3 == 0:\n        continue\n    if n > 7:\n        break\n    print(n)\n", "stdin": null, "note": "Predict the output. Which numbers disappear and why?"}], "check": {"q": "What does <code>continue<\/code> do inside a loop?", "options": ["Restarts the program", "Ends the loop", "Pauses the loop for one second", "Skips to the next pass of the loop"], "answer": 3, "why": "<code>continue<\/code> ends only the current pass. The loop keeps running with the next value."}}, {"title": "Nested loops", "minutes": 10, "html": "<p>A loop inside a loop repeats the inner loop completely for every pass of the outer loop. Engineers use nested loops to test every combination: each resistor with each capacitor, each speed with each angle.<\/p>\n<p>The number of passes multiplies. An outer loop of 4 and an inner loop of 5 run the inner block 20 times.<\/p>", "cells": [{"code": "count = 0\nfor r in range(100, 401, 100):\n    for c in range(1, 4):\n        count += 1\n        print(r, c)\nprint(\"Combinations:\", count)\n", "stdin": null, "note": null}], "check": {"q": "An outer loop runs 4 times and an inner loop runs 5 times for each outer pass. How many times does the inner block run?", "options": ["5", "20", "9", "4"], "answer": 1, "why": "The inner block runs 5 times for each of the 4 outer passes, so 4 times 5 is 20."}}, {"title": "Trial-and-error design: find the launch angle", "minutes": 20, "html": "<p>Engineers often need a design that hits a target. Sometimes an equation gives the answer directly. When it does not, you can try many values and keep the best one. This is a <strong>search<\/strong> loop.<\/p>\n<p>The range of a projectile on level ground is <code>R = v0 ** 2 * sin(2 * theta) / g<\/code>. We want a range of 60 m at 30 m/s. The loop tries each whole-degree angle from 1 to 45, measures how far each is from the target, and keeps the closest. It remembers the smallest error in <code>best_error<\/code> and the matching angle in <code>best_angle<\/code>.<\/p>", "cells": [{"code": "import math\nv0 = 30.0\ng = 9.81\ntarget_range = 60.0\n\nbest_angle = None\nbest_error = None\nfor angle_deg in range(1, 46):\n    r = v0 ** 2 * math.sin(math.radians(2 * angle_deg)) / g\n    error = abs(r - target_range)\n    if best_error is None or error < best_error:\n        best_error = error\n        best_angle = angle_deg\n\nprint(\"Best angle:\", best_angle, \"degrees\")\nprint(\"Range error:\", round(best_error, 2), \"m\")\n", "stdin": null, "note": "<code>None<\/code> means no value yet. The first pass always replaces it."}], "check": {"q": "Why does the search start with <code>best_error = None<\/code>?", "options": ["It makes the loop run faster", "Python requires it for loops", "<code>None<\/code> is the smallest possible number", "No error has been measured before the first pass"], "answer": 3, "why": "<code>None<\/code> marks that no candidate exists yet, so the first candidate becomes the best so far."}}], "lecture_minutes": 130, "lab": {"summary": "A projectile motion table and a launch-angle search, plus loop exercises for energy, halving, power tables, and component combinations.", "intro_html": "<p>You are building the tools an artillery table maker would recognize: a repeated calculation, a printed table, and a search for the best setting. Task checks for printed tables compare numbers, so small differences in spacing do not matter. Checks that need other starting values replace your top-level assignments and run your code again; keep those starting assignments as plain lines.<\/p>\n<p>Python stops a cell that runs longer than 20 seconds. If you hit that limit, look at your loop condition first.<\/p>", "tasks": [{"id": "t1", "title": "Accumulate energy", "points": 15, "minutes": 20, "bonus": false, "prompt_html": "<p>A device draws <code>5 + 2 * minute<\/code> watts during each minute from minute 0 to minute 9 (ten minutes in all). Use a <code>for<\/code> loop to add the energy used. Each minute contributes <code>power_w / 60<\/code> watt-hours. Store the total in <code>energy_wh<\/code>.<\/p>", "starter": "energy_wh = 0.0\n\n# Loop over the ten minutes and add each minute's energy\n\nprint(round(energy_wh, 3), \"Wh\")\n", "hint_html": "<p>Use <code>for minute in range(10):<\/code>. Inside, compute <code>power_w = 5 + 2 * minute<\/code> and then <code>energy_wh += power_w / 60<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["energy_wh is 140/60", "approx(energy_wh, 140 / 60, rel=1e-9)", "Add power_w / 60 for each minute from 0 to 9."], ["uses a for loop", "uses_node(src, 'For')", "Use a for loop with range."], ["prints the rounded total", "out.strip() == '2.333 Wh'", "Print the total rounded to 3 decimals followed by Wh."]]}}, {"id": "t2", "title": "Halve until small", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>A leakage current starts at <code>current_ma = 100.0<\/code> milliamps and halves with each filter stage. Use a <code>while<\/code> loop to halve it until it is below 1 mA. Count the stages in <code>halvings<\/code>. Print <code>halvings<\/code> and <c om the target in <code>best_error<\/code>. Print <code>best_angle<\/code> and <code>best_error<\/code> rounded to 2 decimals.<\/p>", "starter": "import math\n\nv0 = 30.0\ng = 9.81\ntarget_range = 60.0\n\nbest_angle = None\nbest_error = None\n\n# Search the angles here\n\nprint(best_angle, round(best_error, 2))\n", "hint_html": "<p>Loop with <code>for angle_deg in range(1, 46):<\/code>. Compute the range with <code>math.radians(2 * angle_deg)<\/code>. Update both best values when <code>best_error is None or error &lt; best_error<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import math", "items": [["best angle for 60 m is 20 degrees", "best_angle == 20", "Try each angle, track the smallest error, and keep that angle."], ["best error matches the range at 20 degrees", "approx(best_error, abs(900 / 9.81 * math.sin(math.radians(40)) - 60), rel=1e-6)", "Compute error as abs(range - target_range)."], ["target 80 m gives 30 degrees", "rerun(src, target_range=80.0)['best_angle'] == 30", "Use the variable target_range in the loop."], ["target 40 m gives 13 degrees", "rerun(src, target_range=40.0)['best_angle'] == 13", "Use the variable target_range in the loop."]]}}, {"id": "t6", "title": "Count resistor pairs", "points": 15, "minutes": 20, "bonus": false, "prompt_html": "<p>Use nested <code>for<\/code> loops. The first resistor <code>r1<\/code> takes the values 100, 200, 300, 400. The second resistor <code>r2<\/code> takes the values 50, 100, 150, 200. Count how many pairs have a series total from 300 to 500 ohms inclusive. Store the count in <code>pair_count<\/code>.<\/p>", "starter": "pair_count = 0\n\n# Nested loops here\n\nprint(pair_count)\n", "hint_html": "<p><code>for r1 in range(100, 401, 100):<\/code> and inside it <code>for r2 in range(50, 201, 50):<\/code>. Check <code>300 &lt;= r1 + r2 &lt;= 500<\/code> and add 1 to <code>pair_count<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["pair_count is 10", "pair_count == 10", "Check the range limit ition <code>count &lt; 3<\/code> is False."}, {"q": "What causes an infinite <code>while<\/code> loop?", "options": ["The condition never becomes False", "The body is indented", "The loop uses <code>range<\/code>", "The loop contains <code>print<\/code>"], "answer": 0, "why": "The condition must change. If nothing in the loop moves it toward False, the loop never ends."}, {"q": "What does <code>break<\/code> do?", "options": ["Restarts the loop", "Exits the loop immediately", "Pauses the loop", "Skips to the next pass"], "answer": 1, "why": "<code>break<\/code> ends the loop. <code>continue<\/code> skips to the next pass."}, {"q": "<pre><code>for n in range(1, 7):\n    if n % 2 == 0:\n        continue\n    print(n)<\/code><\/pre>\n<p>Which numbers print?<\/p>", "options": ["1, 3, 5, 7", "2, 4, 6", "1, 3, 5", "1, 2, 3, 4, 5, 6"], "answer": 2, "why": "Even numbers hit <code>continue<\/code> and skip the print. The odd numbers 1, 3, and 5 print."}, {"q": "Where does a running total variable start?", "options": ["After the loop", "Inside the loop", "In the <code>range<\/code> call", "Before the loop"], "answer": 3, "why": "Setting it inside the loop would reset it on every pass."}, {"q": "A loop runs 3 times. Inside it, a nested loop runs 4 times. How many times does the inner body run?", "options": ["12", "7", "4", "3"], "answer": 0, "why": "The inner body runs 4 times per outer pass, so 3 times 4 is 12."}, {"q": "In a search loop for the smallest error, what should the loop store?", "options": ["Only the largest error", "The best error so far and the value that produced it", "Only the last error", "Every error in a printed line"], "answer": 1, "why": "Compare each new error with the best so far, and update both the error and its matching value when you find a better one."}, {"q": "Which loop fits best when you do not know how many passes you need?", "options": ["A nested <code>for<\/code> loop", "A <code>for<\/code> loop with <code>range<\/code>", "A <code>while<\/cod <script id="harness" type="text/x-python">import sys, io, os, json, ast, base64, builtins, traceback, contextlib, math, random

os.environ.setdefault("MPLBACKEND", "Agg")
import importlib
if "" not in sys.path:
    sys.path.insert(0, "")

_OUT_CAP = 20000
_LECTURE_NS = {"__name__": "__main__"}


class _Capped(io.StringIO):
    def write(self, s):
        if self.tell() > _OUT_CAP:
            raise RuntimeError("Output limit reached. Your code printed too much text.")
        return super().write(s)


def approx(a, b, rel=1e-6, abs_=1e-9):
    try:
        if "numpy" in sys.modules:
            import numpy as _np
            if isinstance(a, _np.ndarray) or isinstance(b, _np.ndarray):
                return bool(_np.allclose(a, b, rtol=rel, atol=abs_))
        if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
            return len(a) == len(b) and all(approx(x, y, rel, abs_) for x, y in zip(a, b))
        return abs(float(a) - float(b)) <= max(abs_, rel * abs(float(b)))
    except Exception:
        return False


def uses_node(src, *names):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    wanted = tuple(getattr(ast, n) for n in names)
    return any(isinstance(n, wanted) for n in ast.walk(tree))


def calls_name(src, name):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    for n in ast.walk(tree):
        if isinstance(n, ast.Call):
            f = n.func
            if isinstance(f, ast.Name) and f.id == name:
                return True
            if isinstance(f, ast.Attribute) and f.attr == name:
                return True
    return False


def line_has(src, target, *words):
    """True when an assignment to `target` has every word on its right side."""
    for line in src.splitlines():
        s = line.strip()
        if s.startswith("#") or "=" not in s:
            continue
        left, _, right = s.partition("=")
        if left.strip() == target and all(w in right for w in words):
            return True
    return False


def run_with(src, inputs=(), ns=None):
    """Run student source with scripted input() values; return what it printed."""
    queue = list(inputs)
    old = builtins.input

    def _fake(prompt=""):
        print(prompt, end="")
        if not queue:
            raise EOFError("input() called more times than expected")
        v = queue.pop(0)
        print(v)
        return v

    buf = io.StringIO()
    builtins.input = _fake
    try:
        with contextlib.redirect_stdout(buf):
            exec(compile(src, "<your code>", "exec"), ns if ns is not None else {"__name__": "__main__"})
    finally:
        builtins.input = old
    return buf.getvalue()


def rerun(src, **over):
    """Execute student source again with top-level assignments replaced by the given constants.
    Returns the resulting namespace. Output is discarded."""
    tree = ast.parse(src)
    for node in tree.body:
        if (isinstance(node, ast.Assign) and len(node.targets) == 1
                and isinstance(node.targets[0], ast.Name) and node.targets[0].id in over):
            node.value = ast.Constant(over[node.targets[0].id])
    ast.fix_missing_locations(tree)
    ns = {"__name__": "__main__"}
    with contextlib.redirect_stdout(io.StringIO()):
        exec(compile(tree, "<your code>", "exec"), ns)
    return ns


def count_defs(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.FunctionDef) for n in ast.walk(tree))


def count_classes(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.ClassDef) for n in ast.walk(tree))


def _format_error(exc, code):
    lines = code.split("\n")
    if isinstance(exc, SyntaxError):
        ln = exc.lineno
        msg = "SyntaxError: " + str(exc.msg)
        if ln and 1 <= ln <= len(lines):
            msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
        return msg
    tb = traceback.TracebackException.from_exception(exc)
    ln = None
    for fs in tb.stack:
        if fs.filename == "<your code>":
            ln = fs.lineno
    msg = "".join(tb.format_exception_only()).strip()
    if ln and 1 <= ln <= len(lines):
        msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
    return msg


def _make_input(stdin_lines, out):
    queue = list(stdin_lines)

    def _input(prompt=""):
        out.write(str(prompt))
        if not queue:
            raise EOFError("input() ran out of lines. Type one value per line in the Input box under the code.")
        val = queue.pop(0)
        out.write(val + "\n")
        return val

    return _input


def _exec_code(code, ns, out):
    tree = ast.parse(code, "<your code>", "exec")
    last = None
    if tree.body and isinstance(tree.body[-1], ast.Expr):
        last = ast.Expression(tree.body.pop().value)
    exec(compile(tree, "<your code>", "exec"), ns)
    if last is not None:
        val = eval(compile(last, "<your code>", "eval"), ns)
        if val is not None:
            out.write(repr(val) + "\n")


def _collect_images():
    imgs = []
    if "matplotlib.pyplot" in sys.modules:
        import matplotlib.pyplot as plt
        for num in plt.get_fignums():
            fig = plt.figure(num)
            buf = io.BytesIO()
            fig.savefig(buf, format="png", dpi=100, bbox_inches="tight")
            imgs.append(base64.b64encode(buf.getvalue()).decode("ascii"))
        plt.close("all")
    return imgs


def reset_lecture():
    _LECTURE_NS.clear()
    _LECTURE_NS["__name__"] = "__main__"


def run_cell(req_json):
    req = json.loads(req_json)
    code = req.get("code", "")
    mode = req.get("mode", "fresh")
    stdin_lines = req.get("stdin") or []
    tests = req.get("tests")
    ns = _LECTURE_NS if mode == "lecture" else {"__name__": "__main__"}
    importlib.invalidate_caches()
    out = _Capped()
    err = None
    real_input = builtins.input
    builtins.input = _make_input(stdin_lines, out)
    try:
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
            try:
                random.seed()
                _exec_code(code, ns, out)
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                err = _format_error(exc, code)
    finally:
        builtins.input = real_input
    result = {"stdout": out.getvalue(), "error": err, "images": [], "tests": None}
    try:
        result["images"] = _collect_images()
    except Exception as exc:
        result["stdout"] += "\n(Plot could not be drawn: %s)" % exc
    if tests is not None:
        result["tests"] = _run_tests(tests, ns, code, err, out.getvalue())
    return json.dumps(result)


def _run_tests(tests, ns, code, err, stdout_text):
    items = tests.get("items", [])
    results = []
    if err is not None:
        for label, _expr, hint in items:
            results.append({"label": label, "ok": False, "msg": "Fix the error above first."})
        return results
    env = ns
    helpers = {
        "approx": approx, "out": stdout_text, "src": code, "ast": ast,
        "uses_node": uses_node, "calls_name": calls_name,
        "count_defs": count_defs, "run_with": run_with, "rerun": rerun, "count_classes": count_classes, "line_has": line_has,
        "math": math, "random": random, "io": io, "_in_tests": True,
    }
    _missing = object()
    saved = {k: env.get(k, _missing) for k in helpers}
    env.update(helpers)
    sink = _Capped()
    try:
        setup = tests.get("setup")
        if setup:
            try:
                with contextlib.redirect_stdout(sink):
                    exec(compile(setup, "<tests>", "exec"), env)
            except BaseException as exc:
                reason = "Could not run the checks: %s: %s" % (type(exc).__name__, exc)
                return [{"label": l, "ok": False, "msg": reason} for l, _e, _h in items]
        for label, expr, hint in items:
            try:
                with contextlib.redirect_stdout(sink):
                    ok = bool(eval(compile(expr, "<tests>", "eval"), env))
                results.append({"label": label, "ok": ok, "msg": "" if ok else hint})
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                results.append({"label": label, "ok": False,
                                "msg": "%s (%s: %s)" % (hint, type(exc).__name__, exc)})
    finally:
        for k, v in saved.items():
            if v is _missing:
                env.pop(k, None)
            else:
                env[k] = v
    return results

      if (m.tests && m.tests.setup) { await py.loadPackagesFromImports(m.tests.setup, quiet); }
      postMessage({ type: 'started' });
      py.globals.set('_req_json', JSON.stringify({ code: m.code, stdin: m.stdin, mode: m.mode, tests: m.tests }));
      const res = py.runPython('run_cell(_req_json)');
      postMessage({ type: 'result', result: JSON.parse(res) });
    } catch (err) {
      postMessage({ type: 'error', message: String(err) });
    }
  }
};

<script>
(function () {
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var HARNESS = document.getElementById('harness').textContent;
var WORKER_SRC = document.getElementById('worker-src').textContent;
var KEY = 'pyeng-' + D.course_id + '-w' + D.num;

/* ---------- storage ---------- */
var mem = null;
function loadState() {
  try { var s = localStorage.getItem(KEY); if (s) { return JSON.parse(s); } } catch (e) {}
  return mem || {};
}
var S = loadState();
S.name = S.name || ''; S.lecDone = S.lecDone || {}; S.checks = S.checks || {};
S.code = S.code || {}; S.lab = S.lab || {}; S.quiz = S.quiz || {};
function save() { mem = S; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- dom helpers ---------- */
function h(tag, attrs, kids) {
  var n = document.createElement(tag);
  if (attrs) { for (var k in attrs) {
    if (k === 'class') { n.className = attrs[k]; }
    else if (k === 'html') { n.innerHTML = attrs[k]; }
    else if (k === 'text') { n.textContent = attrs[k]; }
    else if (k.slice(0, 2) === 'on') { n.addEventListener(k.slice(2), attrs[k]); }
    else { n.setAttribute(k, attrs[k]); }
  } }
  if (kids) { kids.forEach(function (c) { if (c) { n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); } }); }
  return n;
}

/* ---------- python runner ---------- */
var Py = (function () {
  var worker = null, ready = false, current = null, queue = [], timer = null, nextId = 1;
  var stopBtn = document.getElementById('stopbtn');
  var statusEl = document.getElementById('pystatus');
  function status(t) { statusEl.textContent = t; }
  function start() {
    var blob = new Blob([WORKER_SRC], { type: 'text/javascript' });
    worker = new Worker(URL.createObjectURL(blob));
    ready = false;
    worker.onmessage = onMsg;
    worker.onerror = function (e) { finish(failure('The Python worker crashed: ' + (e.message || 'unknown error'))); };
    worker.postMessage({ type: 'init', harness: HARNESS, base: D.pyodide_base });
    status('Starting Python (the first start takes 10 to 30 seconds)...');
  }
  function kill() {
    if (worker) { worker.terminate(); worker = null; }
    ready = false; clearTimer();
  }
  function failure(msg, req) {
    var r = { stdout: '', error: msg, images: [], tests: null };
    if (req && req.tests) {
      r.tests = req.tests.items.map(function (it) { return { label: it[0], ok: false, msg: 'No result.' }; });
    }
    return r;
  }
  function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } stopBtn.hidden = true; }
  function armTimer() {
    clearTimer(); stopBtn.hidden = false;
    var secs = (current && current.req.timeout) || 20;
    timer = setTimeout(function () {
      kill();
      finish(failure('Stopped after ' + secs + ' seconds. Look for a loop that never ends. Python restarted, so run earlier cells again.', current && current.req));
      start();
    }, secs * 1000);
  }
  function finish(result) {
    var c = current; current = null; clearTimer();
    if (c) { c.resolve(result); }
    status(ready ? 'Python ready' : 'Python restarting...');
    pump();
  }
  function onMsg(e) {
    var m = e.data;
    if (m.type === 'ready') { ready = true; status('Python ready'); pump(); }
    else if (m.type === 'initerror') {
      kill();
      status('Python could not start');
      var q = queue.slice(); queue = [];
      if (current) { q.unshift(current); current = null; }
      q.forEach(function (c) { c.resolve(failure('Python could not start. It needs an internet connection to load. Reload the page and try again. Details: ' + m.message, c.req)); });
    }
    else if (m.type === 'status') { status(m.text); }
    else if (m.type === 'started') { status('Running...'); armTimer(); }
    else if (m.type === 'result') { finish(m.result); }
    else if (m.type === 'error') { finish(failure('Python error: ' + m.message, current && current.req)); }
    else if (m.type === 'resetdone') { status('Python session reset'); }
  }
  function pump() {
    if (!ready || current || !queue.length) { return; }
    current = queue.shift();
    status('Preparing...');
    stopBtn.hidden = false;
    worker.postMessage({ type: 'run', code: current.req.code, stdin: current.req.stdin || [], mode: current.req.mode, tests: current.req.tests || null });
  }
  stopBtn.addEventListener('click', function () {
    if (!current) { return; }
    kill();
    finish(failure('Stopped. Python restarted, so run earlier cells again.', current.req));
    start();
  });
  return {
    run: function (req) {
      return new Promise(function (resolve) {
        queue.push({ id: nextId++, req: req, resolve: resolve });
        if (!worker) { start(); } else { pump(); }
      });
    },
    reset: function () { if (worker && ready) { worker.postMessage({ type: 'reset' }); } }
  };
})();

/* ---------- result rendering ---------- */
function renderResult(box, r, opts) {
  box.innerHTML = '';
  if (r.stdout) { box.appendChild(h('pre', { class: 'stdout', text: r.stdout.replace(/\n$/, '') })); }
  if (r.error) { box.appendChild(h('div', { class: 'err', role: 'alert' }, [h('strong', { text: 'Error' }), h('pre', { text: r.error })])); }
  (r.images || []).forEach(function (b64) { box.appendChild(h('img', { src: 'data:image/png;base64,' + b64, alt: 'Plot produced by your code' })); });
  if (!r.stdout && !r.error && !(r.images && r.images.length) && !(opts && opts.quietEmpty)) {
    box.appendChild(h('p', { class: 'small', text: 'Ran with no output. Use print() to see values.' }));
  }
  if (r.tests) {
    var ul = h('ul', { class: 'tests' });
    r.tests.forEach(function (t) {
      ul.appendChild(h('li', null, [
        h('span', { class: 'badge ' + (t.ok ? 'pass' : 'fail'), text: t.ok ? 'PASS' : 'FAIL' }),
        h('span', { text: t.label + (t.ok || !t.msg ? '' : ' Hint: ' + t.msg) })
      ]));
    });
    box.appendChild(ul);
  }
}

/* ---------- code cell ---------- */
function codeCell(o) {
  var wrap = h('div', { class: 'cell' });
  var ta = h('textarea', { class: 'code', spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off', 'aria-label': o.label || 'Python code editor' });
  ta.value = (S.code[o.key] !== undefined) ? S.code[o.key] : o.code;
  function fit() { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 4, 640) + 'px'; }
  var stdinWrap = h('div', { class: 'stdin' });
  var stdinBox = h('textarea', { class: 'stdin-box', spellcheck: 'false', 'aria-label': 'Input lines for input() calls' });
  var stdinKey = o.key + ':stdin';
  stdinBox.value = (S.code[stdinKey] !== undefined) ? S.code[stdinKey] : (o.stdin || []).join('\n');
  stdinWrap.appendChild(h('label', { text: 'Input box: type one line per input() call, in order.' }));
  stdinWrap.appendChild(stdinBox);
  function syncStdin() { stdinWrap.hidden = ta.value.indexOf('input(') === -1; }
  var out = h('div', { class: 'out', 'aria-live': 'polite' });
  var runBtn = h('button', { class: 'btn primary', text: o.tests ? 'Run' : 'Run cell' });
  var checkBtn = o.tests ? h('button', { class: 'btn', text: 'Check my work' }) : null;
  var resetBtn = h('button', { class: 'btn', text: 'Reset code' });
  var hintBtn = (o.hint) ? h('button', { class: 'btn', text: 'Show hint' }) : null;
  var stale = h('span', { class: 'badge warn', text: 'Edited since last check', hidden: '' });
  stale.hidden = true;
  function go(withTests) {
    var req = { code: ta.value, stdin: stdinBox.value ? stdinBox.value.split('\n') : [], mode: o.mode, timeout: o.timeout || 20 };
    if (withTests) { req.tests = o.tests; }
    runBtn.disabled = true; if (checkBtn) { checkBtn.disabled = true; }
    out.innerHTML = ''; out.appendChild(h('p', { class: 'small', text: 'Working...' }));
    Py.run(req).then(function (r) {
      runBtn.disabled = false; if (checkBtn) { checkBtn.disabled = false; }
      renderResult(out, r);
      if (withTests && o.onCheck) { o.onCheck(r); stale.hidden = true; }
    });
  }
  runBtn.addEventListener('click', function () { go(false); });
  if (checkBtn) { checkBtn.addEventListener('click', function () { go(true); }); }
  resetBtn.addEventListener('click', function () {
    if (ta.value !== o.code && !confirm('Replace your code with the starting code?')) { return; }
    ta.value = o.code; delete S.code[o.key]; save(); fit(); syncStdin();
  });
  var hintBox = null;
  if (hintBtn) { hintBtn.addEventListener('click', function () {
    if (hintBox) { hintBox.remove(); hintBox = null; hintBtn.textContent = 'Show hint'; return; }
    hintBox = h('div', { class: 'hint', html: o.hint }); row.after(hintBox); hintBtn.textContent = 'Hide hint';
  }); }
  ta.addEventListener('input', function () {
    S.code[o.key] = ta.value; save(); fit(); syncStdin(); if (o.tests && o.hasResult && o.hasResult()) { stale.hidden = false; }
  });
  stdinBox.addEventListener('input', function () { S.code[stdinKey] = stdinBox.value; save(); });
  ta.addEventListener('keydown', function (e) {
    if (e.key === 'Tab' && !e.shiftKey) {
      e.preventDefault();
      var s = ta.selectionStart, en = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 4;
      ta.dispatchEvent(new Event('input'));
    } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); go(false); }
  });
  var row = h('div', { class: 'row' }, [runBtn, checkBtn, hintBtn, resetBtn, stale]);
  wrap.appendChild(ta); wrap.appendChild(stdinWrap); wrap.appendChild(row); wrap.appendChild(out);
  setTimeout(function () { fit(); syncStdin(); }, 0);
  wrap.refit = function () { fit(); };
  return wrap;
}

/* ---------- multiple choice ---------- */
function mcq(o) {
  var box = h('div', { class: o.cls || 'checkq' });
  box.appendChild(h('div', { class: 'q', html: o.q }));
  var ul = h('ul', { class: 'opts' });
  var btns = [];
  var why = h('div', { class: 'why', hidden: '' }); why.hidden = true;
  function lock(choice) {
    btns.forEach(function (b, i) {
      b.disabled = true;
      if (i === o.answer) { b.classList.add('right'); }
      else if (i === choice) { b.classList.add('wrong'); }
    });
    var ok = choice === o.answer;
    why.hidden = false;
    why.innerHTML = '';
    why.appendChild(h('strong', { text: ok ? 'Correct. ' : 'Not quite. ' }));
    why.appendChild(h('span', { html: o.why }));
  }
  o.options.forEach(function (t, i) {
    var b = h('button', { type: 'button', html: t });
    b.addEventListener('click', function () { if (o.saved === undefined || o.saved === null) { o.onAnswer(i); } lock(i); });
    btns.push(b); ul.appendChild(h('li', null, [b]));
  });
  box.appendChild(ul); box.appendChild(why);
  if (o.saved !== undefined && o.saved !== null) { lock(o.saved); }

}

/* ---------- lecture ---------- */
function updateLecture() {
  var n = D.lecture.length, done = D.lecture.filter(function (_s, i) { return S.lecDone[i]; }).length;
  var bar = document.getElementById('lecbar'); if (bar) { bar.firstChild.style.width = (100 * done / n) + '%'; }

  ]);

/* ---------- lab ---------- */
function labScore() {
  var tot = 0, bonus = 0;
  D.lab.tasks.forEach(function (t) {
    var r = S.lab[t.id]; if (r && r.total) { var v = t.points * r.passed / r.total; if (t.bonus) { bonus += v; } else { tot += v; } }
  });
  return { score: Math.round(tot * 10) / 10, bonus: Math.round(bonus * 10) / 10 };
}
function updateLab() {
  var s = labScore();
  var max = D.lab.tasks.filter(function (t) { return !t.bonus; }).reduce(function (a, t) { return a + t.points; }, 0);
  var el = document.getElementById('labscore'); if (el) { el.textContent = s.score + ' / ' + max + (s.bonus ? ' (+' + s.bonus + ' bonus)' : ''); }
  tiles.lab.textContent = s.score + '/' + max;
}
function renderLab() {

  p.innerHTML = '';

  p.appendChild(sc);

    var card = h('div', { class: 'card' });
    card.appendChild(h('p', { class: 'meta', text: (t.bonus ? 'Bonus challenge' : 'Task ' + (i + 1)) + ', ' + t.points + (t.bonus ? ' bonus points' : ' points') + ', about ' + t.minutes + ' minutes' }));
    card.appendChild(h('h3', { text: t.title }));
    card.appendChild(h('div', { html: t.prompt_html }));
    var res = S.lab[t.id];
    var note = h('p', { class: 'small', text: res ? ('Last check: ' + res.passed + ' of ' + res.total + ' tests passed.') : 'Not checked yet.' });
    var cell = codeCell({
      key: 'lab_' + t.id, code: t.starter, stdin: t.stdin, mode: 'fresh', tests: t.tests, hint: t.hint_html, timeout: 20, label: 'Code for ' + t.title,
      hasResult: function () { return !!S.lab[t.id]; },
      onCheck: function (r) {
        var passed = r.tests ? r.tests.filter(function (x) { return x.ok; }).length : 0;
        S.lab[t.id] = { passed: passed, total: r.tests ? r.tests.length : 0, at: new Date().toISOString() };
        save(); note.textContent = 'Last check: ' + passed + ' of ' + S.lab[t.id].total + ' tests passed.'; updateLab();
      }
    });
    card.appendChild(cell); card.appendChild(note);
    p.appendChild(card);
  });
  p.appendChild(h('h2', { text: 'Submit your work' }));
  var rep = h('div', { class: 'card' });

  var nm = h('input', { type: 'text', id: 'stname', 'aria-label': 'Your name', placeholder: 'Your name', autocomplete: 'name' });
  nm.value = S.name;

  rep.appendChild(h('div', { class: 'field' }, [h('label', { for: 'stname', text: 'Name' }), nm]));
  var ta = h('textarea', { class: 'report', readonly: '', 'aria-label': 'Report text' });
  var b1 = h('button', { class: 'btn primary', text: 'Build report', onclick: function () { ta.value = buildReport(); } });
  var b2 = h('button', { class: 'btn', text: 'Copy report', onclick: function () {
    ta.value = buildReport(); ta.select();
    var done = function () { b2.textContent = 'Copied'; setTimeout(function () { b2.textContent = 'Copy report'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(done, function () { try { document.execCommand('copy'); done(); } catch (e) {} }); }
    else { try { document.execCommand('copy'); done(); } catch (e) {} }
  } });
  var b3 = h('button', { class: 'btn', text: 'Download .txt', onclick: function () {
    var txt = buildReport(); ta.value = txt;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
    a.download = 'week' + D.num + '_report.txt'; document.body.appendChild(a); a.click(); a.remove();
  } });
  rep.appendChild(h('div', { class: 'row' }, [b1, b2, b3]));

function quizTally() {
  var correct = 0, answered = 0;
  D.quiz.forEach(function (q, i) { var a = S.quiz[i]; if (a !== undefined && a !== null) { answered++; if (a === q.answer) { correct++; } } });
  return { correct: correct, answered: answered, total: D.quiz.length };
}
function buildReport() {
  var L = [], s = labScore(), q = quizTally();
  var max = D.lab.tasks.filter(function (t) { return !t.bonus; }).reduce(function (a, t) { return a + t.points; }, 0);
  var lec = D.lecture.filter(function (_s, i) { return S.lecDone[i]; }).length;

  L.push('Lab score (browser autograder): ' + s.score + ' of ' + max + (s.bonus ? ', bonus ' + s.bonus : ''));
  L.push('Quiz: ' + q.correct + ' correct, ' + q.answered + ' answered, ' + q.total + ' questions');
  L.push('');
  D.lab.tasks.forEach(function (t, i) {
    var r = S.lab[t.id];
    L.push('==== ' + (t.bonus ? 'Bonus' : 'Task ' + (i + 1)) + ': ' + t.title + ' (' + (r ? r.passed + '/' + r.total + ' tests' : 'not checked') + ') ====');
    L.push(S.code['lab_' + t.id] !== undefined ? S.code['lab_' + t.id] : t.starter);

  updateQuiz();
}

/* ---------- shell ---------- */
document.getElementById('kicker').textContent = D.course_title + ', Week ' + D.num;
document.getElementById('title').textContent = D.title;
document.title = D.course_title + ' Week ' + D.num + ' ' + D.title;
var chips = document.getElementById('chips');
[D.lecture_minutes + ' min lecture', D.lab_minutes + ' min lab', D.quiz.length + ' quiz questions'].forEach(function (t) { chips.appendChild(h('li', { text: t })); });
var tabs = [['overview', 'Overview'], ['lecture', 'Lecture'], ['lab', 'Lab'], ['quiz', 'Quiz']];
var tl = document.getElementById('tablist');
tabs.forEach(function (t) {
  var b = h('button', { role: 'tab', id: 'tab-' + t[0], 'aria-controls': 'panel-' + t[0], 'aria-selected': 'false', text: t[1] });
  b.addEventListener('click', function () { show(t[0]); });
  tl.appendChild(b);
});
function show(name) {
  tabs.forEach(function (t) {
    document.getElementById('panel-' + t[0]).hidden = (t[0] !== name);
    document.getElementById('tab-' + t[0]).setAttribute('aria-selected', t[0] === name ? 'true' : 'false');
  });
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
  window.scrollTo(0, 0);
  document.querySelectorAll('#panel-' + name + ' textarea.code').forEach(function (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 4, 640) + 'px'; });
}
renderOverview(); renderLecture(); renderLab(); renderQuiz();
var start = (location.hash || '').replace('#', '');
show(tabs.some(function (t) { return t[0] === start; }) ? start : 'overview');
})();
</script>
</body>
</html>
