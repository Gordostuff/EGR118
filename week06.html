<title>Python for Engineers Week 6 Lists, Tuples, and Dictionaries: Sensor Log Processing</title>

<style>
:root{
  --bg:#f6f5f0; --card:#ffffff; --ink:#1a1f24; --mute:#59636e; --line:#d9d6cb;
  --accent:#0a5aa0; --accent-ink:#ffffff; --accent-soft:#e4eef8;
  --ok:#17692f; --ok-bg:#e5f3e9; --bad:#a82217; --bad-bg:#fcebe8; --warn:#8a5a00; --warn-bg:#fdf3dc;
  --code-bg:#f0eee6; --out-bg:#e6edf6; --out-ink:#0a2a66;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151a; --card:#192028; --ink:#e7ebef; --mute:#9aa6b2; --line:#2c3641;
    --accent:#5eaeea; --accent-ink:#0b1219; --accent-soft:#17283a;
    --ok:#6fd08c; --ok-bg:#15301f; --bad:#ff8a7d; --bad-bg:#3a1b18; --warn:#f0c060; --warn-bg:#33290f;
    --code-bg:#10161c; --out-bg:#e6edf6; --out-ink:#0a2a66;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:50}
header.top{padding:28px 0 12px}
.kicker{font-size:13px;color:var(--mute);letter-spacing:.02em;margin:0 0 4px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.2;margin:0 0 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:13px;border:1px solid var(--line);background:var(--card);padding:2px 10px;border-radius:999px;color:var(--mute)}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--mute);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.statusbar{position:sticky;top:46px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:6px 12px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.statusbar .grow{flex:1}
main{padding:16px 0 80px}
.panel[hidden]{display:none}
h2{font-size:22px;margin:24px 0 8px;font-weight:600}
h3{font-size:18px;margin:0 0 6px;font-weight:600}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:22px}
li{margin:2px 0}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
.card .meta{font-size:13px;color:var(--mute);margin:0 0 8px}
.hook{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .big{font-size:24px;font-weight:600;font-family:var(--mono)}
.tile .lbl{font-size:13px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.bar>span{display:block;height:100%;background:var(--accent);width:0}
button.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.cell{margin:12px 0}
textarea.code{display:block;width:100%;font-family:var(--mono);font-size:14px;line-height:1.5;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;resize:vertical;tab-size:4;white-space:pre;overflow:auto;min-height:60px}
.stdin{margin-top:6px}
.stdin label{font-size:13px;color:var(--mute);display:block}
textarea.stdin-box{width:100%;font-family:var(--mono);font-size:13px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:48px}
.out{margin-top:8px}
pre.stdout{margin:0;background:var(--out-bg);color:var(--out-ink);font-family:var(--mono);font-size:13.5px;padding:10px 12px;border-radius:6px;border:1px solid #b9c8dc;overflow:auto;white-space:pre-wrap;word-break:break-word}
.err{margin-top:8px;border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:8px 12px;font-size:14px}
.err pre{margin:4px 0 0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;color:inherit}
.out img{max-width:100%;height:auto;background:#fff;border-radius:6px;margin-top:8px;border:1px solid var(--line)}
.tests{list-style:none;margin:8px 0 0;padding:0}
.tests li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.badge{font-family:var(--mono);font-size:12px;font-weight:500;padding:1px 8px;border-radius:4px;flex:none}
.badge.pass{background:var(--ok-bg);color:var(--ok)}
.badge.fail{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.hint{margin:8px 0;padding:8px 12px;background:var(--warn-bg);color:var(--ink);border-radius:6px;font-size:14px;border:1px solid var(--line)}
.q{margin:0 0 6px;font-weight:500}
.q p{margin:0 0 8px}
.q pre,.card pre{background:var(--code-bg);padding:8px 12px;border-radius:6px;overflow:auto;font-family:var(--mono);font-size:13.5px;font-weight:400;margin:0 0 10px}
.q pre code,.card pre code{background:none;padding:0}
.opts{list-style:none;padding:0;margin:0}
.opts button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:var(--ok-bg)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opts button:disabled{cursor:default}
.why{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:6px;background:var(--accent-soft)}
.checkq{margin:14px 0 4px;padding:12px;border:1px dashed var(--line);border-radius:8px}
.done-row{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.field input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-width:240px}
textarea.report{width:100%;min-height:200px;font-family:var(--mono);font-size:12.5px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px}
table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code-bg)}
.small{font-size:13px;color:var(--mute)}
@media (max-width:600px){ .field input{min-width:0;width:100%} .statusbar{top:44px} }
</style>

<script id="data" type="application/json">{"course_id": "pyeng", "course_title": "Python for Engineers", "pyodide_base": "https://cdn.jsdelivr.net/pyodide/v0.27.8/full/", "num": 6, "title": "Lists, Tuples, and Dictionaries: Sensor Log Processing", "hook": "Test data arrives as long columns of numbers: temperatures, pressures, voltages, one reading after another, with the occasional bad value from a loose connector. Handling one reading at a time stops being practical after about five readings. This week you store readings in collections, clean them, and summarize them by sensor.", "objectives": ["create, index, slice, and change lists", "loop over lists and compute totals, averages, minimums, and maximums", "write list comprehensions that transform and filter data", "use tuples for fixed groups of values and unpack them", "build and read dictionaries to look up values by name", "combine lists and dictionaries to summarize a sensor log"], "summary": "<ul><li>Lists <code>[...]<\/code> hold ordered, changeable items. Tuples <code>(...)<\/code> are fixed. Dictionaries <code>{key: value}<\/code> look things up by key.<\/li><li>Index from 0. <code>a[-1]<\/code> is the last item. Slices exclude the stop index.<\/li><li><code>append<\/code>, <code>remove<\/code>, <code>pop<\/code>, and <code>sort<\/code> change a list. <code>sorted<\/code> returns a new list.<\/li><li><code>b = a<\/code> makes a second name for the same list. Use <code>a.copy()<\/code> for a separate list.<\/li><li><code>for item in a<\/code>, <code>enumerate(a)<\/code>, and <code>zip(a, b)<\/code> walk lists. <code>sum<\/code>, <code>min<\/code>, <code>max<\/code>, <code>len<\/code> summarize them.<\/li><li>A comprehension builds a list in one line: <code>[expr for item in a if condition]<\/code>.<\/li><li><code>d.get(key, default)<\/code> avoids a <code>KeyError<\/code>. <code>d.items()<\/code> gives pairs for a loop.<\/li><li>Group data with a dictionary of lists. Clean bad values before computing statistics.<\/li><\/ul>", "lecture": [{"title": "Collections of data", "minutes": 10, "html": "<p>Until now each variable held one value. A sensor log holds hundreds. Python has three built-in collections for this work:<\/p>\n<ul><li><strong>list<\/strong>: an ordered group you can change, written with square brackets<\/li><li><strong>tuple<\/strong>: an ordered group you cannot change, written with parentheses<\/li><li><strong>dictionary<\/strong>: a group of name and value pairs, written with curly braces<\/li><\/ul>\n<p>Choosing the right one is a design decision. A list fits a series of readings. A tuple fits a pair such as (sensor, value). A dictionary fits a lookup, such as a calibration factor for each sensor.<\/p>", "cells": [{"code": "readings = [20.5, 21.0, 19.8, 22.3]\nprint(readings)\nprint(type(readings))\n", "stdin": null, "note": null}]}, {"title": "Lists: indexing, slicing, and changing", "minutes": 20, "html": "<p>List indexing works like string indexing. The first item is at index 0 and the last is at index -1. A slice <code>a[start:stop]<\/code> gives a new list that excludes <code>stop<\/code>.<\/p>\n<p>Lists change in place:<\/p>\n<ul><li><code>a.append(x)<\/code> adds to the end<\/li><li><code>a[i] = x<\/code> replaces an item<\/li><li><code>a.remove(x)<\/code> deletes the first item equal to x<\/li><li><code>a.pop()<\/code> deletes and returns the last item<\/li><li><code>len(a)<\/code> counts the items<\/li><\/ul>\n<p>Two variable names can refer to the same list. <code>b = a<\/code> does <strong>not<\/strong> copy. Use <code>a.copy()<\/code> when you need a separate list.<\/p>", "cells": [{"code": "readings = [20.5, 21.0, 19.8, 22.3]\nprint(readings[0], readings[-1])\nprint(readings[1:3])\nreadings.append(21.7)\nprint(len(readings))\nreadings[2] = 20.1\nprint(readings)\n", "stdin": null, "note": null}, {"code": "a = [1, 2, 3]\nb = a\nb.append(4)\nprint(a)\nc = a.copy()\nc.append(5)\nprint(a, c)\n", "stdin": null, "note": "<code>b = a<\/code> makes a second name for the same list. Predict both lines before you run."}, {"code": "values = [3, 1, 2]\nprint(sorted(values))\nprint(values)\nvalues.sort()\nprint(values)\n", "stdin": null, "note": "<code>sorted<\/code> returns a new list. <code>sort<\/code> changes the list in place and returns <code>None<\/code>."}], "check": {"q": "After <code>a = [1, 2]<\/code>, <code>b = a<\/code>, <code>b.append(3)<\/code>, what is <code>a<\/code>?", "options": ["<code>[1, 2, 3]<\/code> and <code>b<\/code> is <code>[1, 2]<\/code>", "<code>[1, 2, 3]<\/code>", "<code>[1, 2]<\/code>", "<code>[3]<\/code>"], "answer": 1, "why": "<code>b = a<\/code> makes <code>b<\/code> another name for the same list, so changes through <code>b<\/code> show up in <code>a<\/code>."}}, {"title": "Looping over lists", "minutes": 15, "html": "<p><code>for item in a:<\/code> visits each item in order. You do not need <code>range<\/code> or an index. Use <code>enumerate(a)<\/code> when you also want the position, and <code>zip(a, b)<\/code> to walk two lists together.<\/p>\n<p>Built-in functions shorten common jobs: <code>sum<\/code>, <code>min<\/code>, <code>max<\/code>, <code>len<\/code>, and <code>sorted<\/code>. Write the explicit loop once so you understand it, then use the built-in.<\/p>", "cells": [{"code": "readings = [20.5, 21.0, 19.8, 22.3]\ntotal = 0\nfor r in readings:\n    total += r\nprint(round(total / len(readings), 2))\nprint(round(sum(readings) / len(readings), 2), max(readings), min(readings))\n", "stdin": null, "note": null}, {"code": "times = [0, 1, 2]\ntemps = [20.5, 21.0, 19.8]\nfor i, t in enumerate(times):\n    print(i, t)\nfor t, v in zip(times, temps):\n    print(f\"t={t}s  T={v} C\")\n", "stdin": null, "note": null}], "check": {"q": "What does <code>zip(a, b)<\/code> do inside a <code>for<\/code> loop?", "options": ["Compresses the lists into a file", "Sorts both lists", "Joins both lists into one list", "Walks both lists together, giving one pair per pass"], "answer": 3, "why": "<code>zip<\/code> pairs the first items, then the second items, and so on."}}, {"title": "List comprehensions", "minutes": 15, "html": "<p>A <strong>list comprehension<\/strong> builds a new list in one line. The pattern is <code>[expression for item in old_list]<\/code>. Add <code>if<\/code> at the end to keep only some items: <code>[expression for item in old_list if condition]<\/code>.<\/p>\n<p>Read it as: for each item in the old list, compute the expression, and keep it if the condition is True. A comprehension is a short loop. Use a regular loop when the body takes more than one step.<\/p>", "cells": [{"code": "f_values = [32, 68, 212]\nc_values = [round((f - 32) * 5 / 9, 1) for f in f_values]\nprint(c_values)\n", "stdin": null, "note": null}, {"code": "readings = [20.5, 21.0, 19.8, 22.3]\nwarm = [r for r in readings if r > 21]\nprint(warm)\nraw = [20.5, -999, 21.0, -999, 22.3]\nclean = [r for r in raw if r != -999]\nprint(clean)\n", "stdin": null, "note": "A common data cleaning step. Many sensors report -999 when they have no valid reading."}], "check": {"q": "What does <code>[x * 2 for x in [1, 2, 3] if x &gt; 1]<\/code> produce?", "options": ["<code>[2, 4, 6]<\/code>", "<code>[4, 6]<\/code>", "<code>[2, 3]<\/code>", "<code>[1, 2, 3]<\/code>"], "answer": 1, "why": "The <code>if<\/code> keeps 2 and 3, and the expression doubles them."}}, {"title": "Tuples", "minutes": 15, "html": "<p>A tuple is like a list that you cannot change after you create it. Use tuples for small fixed groups: a coordinate <code>(3, 4)<\/code>, a reading <code>(\"T1\", 21.5)<\/code>, a pair of limits <code>(9500, 10500)<\/code>. Functions that return several values return tuples.<\/p>\n<p><strong>Unpacking<\/strong> assigns each item to a name: <code>x, y = point<\/code>.<\/p>", "cells": [{"code": "point = (3, 4)\nx, y = point\nprint(x, y)\nimport math\nprint(math.hypot(x, y))\n", "stdin": null, "note": null}, {"code": "point[0] = 10\n", "stdin": null, "note": "A TypeError on purpose. Tuples do not allow item assignment."}, {"code": "def min_max(values):\n    return min(values), max(values)\n\nlow, high = min_max([20.5, 21.0, 19.8])\nprint(low, high)\n", "stdin": null, "note": null}], "check": {"q": "Which item can you change after creation?", "options": ["An item in a tuple", "A character in a string", "A number", "An item in a list"], "answer": 3, "why": "Lists allow changes. Tuples and strings do not."}}, {"title": "Dictionaries", "minutes": 20, "html": "<p>A <strong>dictionary<\/strong> stores pairs. You look up a <strong>value<\/strong> by its <strong>key<\/strong>. Keys are usually strings or numbers. Use <code>d[key]<\/code> to read, <code>d[key] = value<\/code> to add or change, <code>key in d<\/code> to test, and <code>d.get(key, default)<\/code> to read with a fallback. A missing key with square brackets raises <code>KeyError<\/code>.<\/p>\n<p><code>d.items()<\/code> gives key and value pairs for a loop. A dictionary can count things: add 1 to <code>counts.get(name, 0)<\/code> for each name you see.<\/p>", "cells": [{"code": "calibration = {\"A\": 1.02, \"B\": 0.98}\nprint(calibration[\"A\"])\ncalibration[\"C\"] = 1.0\nprint(\"B\" in calibration)\nprint(calibration.get(\"Z\", 1.0))\nfor name, factor in calibration.items():\n    print(name, factor)\n", "stdin": null, "note": null}, {"code": "print(calibration[\"Z\"])\n", "stdin": null, "note": "A KeyError on purpose. Use <code>.get<\/code> when a key may be missing."}, {"code": "counts = {}\nfor sensor in [\"A\", \"B\", \"A\", \"A\"]:\n    counts[sensor] = counts.get(sensor, 0) + 1\nprint(counts)\n", "stdin": null, "note": null}], "check": {"q": "What does <code>d.get(\"x\", 0)<\/code> return when <code>\"x\"<\/code> is not a key in <code>d<\/code>?", "options": ["<code>\"x\"<\/code>", "<code>0<\/code>", "A <code>KeyError<\/code>", "<code>None<\/code>"], "answer": 1, "why": "The second argument is the fallback value for a missing key."}}, {"title": "Combining structures", "minutes": 15, "html": "<p>Real data mixes the structures. A common shape is a list of dictionaries, one per record. A second common shape is a dictionary of lists, one list of readings per sensor.<\/p>\n<p>To group readings by sensor, build a dictionary of lists. Start with an empty dictionary. For each reading, make sure its sensor has a list, then append the value.<\/p>", "cells": [{"code": "logs = [\n    {\"sensor\": \"T1\", \"value\": 21.5},\n    {\"sensor\": \"T2\", \"value\": 19.0},\n    {\"sensor\": \"T1\", \"value\": 22.0},\n]\nt1_values = [r[\"value\"] for r in logs if r[\"sensor\"] == \"T1\"]\nprint(t1_values)\n", "stdin": null, "note": null}, {"code": "groups = {}\nfor r in logs:\n    name = r[\"sensor\"]\n    if name not in groups:\n        groups[name] = []\n    groups[name].append(r[\"value\"])\nprint(groups)\n", "stdin": null, "note": null}], "check": {"q": "Why create <code>groups[name] = []<\/code> before the first append?", "options": ["Dictionaries require square brackets", "It makes the loop faster", "Lists must start empty", "A missing key has no list to append to"], "answer": 3, "why": "<code>groups[name].append(...)<\/code> fails with a <code>KeyError<\/code> if <code>name<\/code> is not yet a key."}}, {"title": "Putting it together: a sensor log report", "minutes": 20, "html": "<p>This program takes a raw log of (sensor, value) pairs, drops the bad readings, groups the good values by sensor, and prints a summary. Each step uses an idea from this week. Read the code from top to bottom and predict the output.<\/p>", "cells": [{"code": "raw = [\n    (\"T1\", 21.0), (\"T2\", 17.0), (\"T1\", 23.0), (\"T2\", -999),\n    (\"T1\", 25.0), (\"T2\", 19.0), (\"T1\", -999), (\"T2\", 18.0),\n]\nBAD = -999\n\ngroups = {}\nbad_count = 0\nfor sensor, value in raw:\n    if value == BAD:\n        bad_count += 1\n        continue\n    if sensor not in groups:\n        groups[sensor] = []\n    groups[sensor].append(value)\n\nfor name, v in groups.items():\n    print(f\"{name}: n={len(v)} min={min(v)} mean={sum(v) / len(v):.1f} max={max(v)}\")\nprint(\"Bad readings dropped:\", bad_count)\n", "stdin": null, "note": null}]}], "lecture_minutes": 130, "lab": {"summary": "A sensor log processor that cleans bad readings, converts units with comprehensions, applies calibration, and summarizes each sensor.", "intro_html": "<p>You are writing the data-handling core of a test logging tool. Each task uses a small list or dictionary you can inspect by eye, so you can check your results by hand before you press Check my work.<\/p>\n<p>Where a task starts with sample data, keep the starting assignments in place. Checks that rerun your code replace those top-level assignments with other data to confirm your code does not rely on one specific list.<\/p>", "tasks": [{"id": "t1", "title": "List statistics", "points": 15, "minutes": 20, "bonus": false, "prompt_html": "<p>For <code>temps = [20.5, 21.0, 19.8, 22.3, 21.7]<\/code> create these variables:<\/p>\n<ul><li><code>first<\/code> and <code>last<\/code>: the first and last readings<\/li><li><code>count<\/code>: how many readings<\/li><li><code>highest<\/code> and <code>lowest<\/code><\/li><li><code>average<\/code>: the mean of the readings<\/li><\/ul>", "starter": "temps = [20.5, 21.0, 19.8, 22.3, 21.7]\n\nfirst = ...\nlast = ...\ncount = ...\nhighest = ...\nlowest = ...\naverage = ...\n\nprint(first, last, count, highest, lowest, round(average, 2))\n", "hint_html": "<p>Use <code>temps[0]<\/code>, <code>temps[-1]<\/code>, <code>len(temps)<\/code>, <code>max(temps)<\/code>, <code>min(temps)<\/code>, and <code>sum(temps) / len(temps)<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["first and last", "first == 20.5 and last == 21.7", "Index 0 is the first item and -1 is the last."], ["count is 5", "count == 5", "Use len(temps)."], ["highest and lowest", "highest == 22.3 and lowest == 19.8", "Use max(temps) and min(temps)."], ["average is 21.06", "approx(average, 21.06, rel=1e-9)", "Divide the sum by the count."], ["works for another list", "approx(rerun(src.replace('temps = [20.5, 21.0, 19.8, 22.3, 21.7]', 'temps = [1.0, 2.0, 6.0]'))['average'], 3.0)", "Use the variable temps in each formula instead of typing numbers."]]}}, {"id": "t2", "title": "Clean bad readings", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>A sensor reports <code>-999<\/code> when it has no valid reading. For <code>raw = [20.5, -999, 21.0, 19.8, -999, 22.3]<\/code> create:<\/p>\n<ul><li><code>clean<\/code>: a new list with the bad values removed<\/li><li><code>bad_count<\/code>: how many values were removed<\/li><\/ul>\n<p>Do not change <code>raw<\/code>.<\/p>", "starter": "raw = [20.5, -999, 21.0, 19.8, -999, 22.3]\n\nclean = ...\nbad_count = ...\n\nprint(clean, bad_count)\n", "hint_html": "<p>Loop over <code>raw<\/code>. If a value is not -999, append it to <code>clean<\/code>. Then <code>bad_count = len(raw) - len(clean)<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["clean list", "clean == [20.5, 21.0, 19.8, 22.3]", "Keep only values that are not -999, in order."], ["bad_count is 2", "bad_count == 2", "Count the removed readings."], ["raw is unchanged", "raw == [20.5, -999, 21.0, 19.8, -999, 22.3]", "Build a new list. Do not remove items from raw."], ["works for other data", "rerun(src.replace('[20.5, -999, 21.0, 19.8, -999, 22.3]', '[-999, 5.0, -999]'))['clean'] == [5.0]", "Use the variable raw in your loop."]]}}, {"id": "t3", "title": "Convert units with a comprehension", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Use list comprehensions. For <code>f_values = [32, 68, 98.6, 212]<\/code>:<\/p>\n<ul><li><code>c_values<\/code>: each value converted to Celsius and rounded to 1 decimal<\/li><li><code>hot<\/code>: the Celsius values above 30<\/li><\/ul>", "starter": "f_values = [32, 68, 98.6, 212]\n\nc_values = ...\nhot = ...\n\nprint(c_values, hot)\n", "hint_html": "<p><code>[round((f - 32) * 5 / 9, 1) for f in f_values]<\/code>. For <code>hot<\/code>, filter <code>c_values<\/code> with <code>if c &gt; 30<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["c_values", "c_values == [0.0, 20.0, 37.0, 100.0]", "Convert each value with (f - 32) * 5 / 9 and round to 1 decimal."], ["hot", "hot == [37.0, 100.0]", "Keep the Celsius values greater than 30."], ["uses list comprehensions", "len([n for n in ast.walk(ast.parse(src)) if isinstance(n, ast.ListComp)]) >= 2", "Write both lists as list comprehensions."]]}}, {"id": "t4", "title": "Return a tuple", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Write <code>min_max(values)<\/code> that returns a tuple <code>(smallest, largest)<\/code>. Then use it to unpack <code>lo, hi = min_max(temps)<\/code> for the given list and compute <code>spread = hi - lo<\/code>.<\/p>", "starter": "temps = [20.5, 21.0, 19.8, 22.3, 21.7]\n\ndef min_max(values):\n    ...\n\nlo, hi = min_max(temps)\nspread = hi - lo\n\nprint(lo, hi, spread)\n", "hint_html": "<p><code>return min(values), max(values)<\/code> returns a tuple. The two lines after the function are already written for you.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["min_max returns a tuple", "min_max([3, 1, 2]) == (1, 3)", "Return min(values), max(values)."], ["works for one item", "min_max([7]) == (7, 7)", "The smallest and largest of one item are the same."], ["spread is 2.5", "approx(spread, 2.5)", "spread = hi - lo"]]}}, {"id": "t5", "title": "Calibration dictionary", "points": 20, "minutes": 30, "bonus": false, "prompt_html": "<p>Each sensor has a calibration factor in the dictionary <code>calibration<\/code>. <code>readings<\/code> is a list of <code>(sensor, value)<\/code> tuples.<\/p>\n<ul><li><code>calibrated<\/code>: a list of each value times its sensor's factor, rounded to 2 decimals, in the same order<\/li><li><code>totals<\/code>: a dictionary that maps each sensor name to the sum of its calibrated values, rounded to 2 decimals<\/li><\/ul>", "starter": "calibration = {\"A\": 1.02, \"B\": 0.98, \"C\": 1.00}\nreadings = [(\"A\", 10.0), (\"B\", 10.0), (\"C\", 10.0), (\"A\", 20.0)]\n\ncalibrated = []\ntotals = {}\n\n# Loop over readings and fill both\n\nprint(calibrated)\nprint(totals)\n", "hint_html": "<p>Unpack each tuple in the loop: <code>for sensor, value in readings:<\/code>. Use <code>calibration[sensor]<\/code>. For <code>totals<\/code>, use <code>totals[sensor] = totals.get(sensor, 0) + cal_value<\/code>, then round each total after the loop.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["calibrated list", "calibrated == [10.2, 9.8, 10.0, 20.4]", "Multiply each value by calibration[sensor] and round to 2 decimals."], ["totals has three sensors", "sorted(totals.keys()) == ['A', 'B', 'C']", "Add each sensor as a key the first time you see it."], ["total for A is 30.6", "approx(totals['A'], 30.6)", "Add the calibrated values for each sensor."], ["totals for B and C", "approx(totals['B'], 9.8) and approx(totals['C'], 10.0)", "Each sensor gets its own total."], ["rounded to 2 decimals", "all(round(v, 2) == v for v in totals.values())", "Round each total to 2 decimals after summing."]]}}, {"id": "t6", "title": "Summarize a log of records", "points": 20, "minutes": 25, "bonus": false, "prompt_html": "<p><code>logs<\/code> is a list of dictionaries. A <code>value<\/code> of <code>-999<\/code> is a bad reading.<\/p>\n<ul><li><code>stats<\/code>: a dictionary that maps each sensor to a dictionary with <code>\"count\"<\/code> (good readings only) and <code>\"mean\"<\/code> of the good readings<\/li><li><code>bad_total<\/code>: the number of bad readings in the whole log<\/li><\/ul>", "starter": "logs = [\n    {\"sensor\": \"T1\", \"value\": 20.0},\n    {\"sensor\": \"T2\", \"value\": 18.5},\n    {\"sensor\": \"T1\", \"value\": 22.0},\n    {\"sensor\": \"T2\", \"value\": -999},\n    {\"sensor\": \"T1\", \"value\": -999},\n    {\"sensor\": \"T2\", \"value\": 19.5},\n    {\"sensor\": \"T1\", \"value\": 24.0},\n    {\"sensor\": \"T2\", \"value\": 20.5},\n]\n\nstats = {}\nbad_total = 0\n\n# Group the good values, count the bad ones, then compute count and mean\n\nprint(stats)\nprint(bad_total)\n", "hint_html": "<p>Build a temporary dictionary of lists, <code>groups<\/code>, as in the lecture. Skip bad values (count them). After the loop, fill <code>stats[name] = {\"count\": len(v), \"mean\": sum(v) / len(v)}<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["two sensors in stats", "sorted(stats.keys()) == ['T1', 'T2']", "Use the sensor name as the key."], ["T1 count and mean", "stats['T1']['count'] == 3 and approx(stats['T1']['mean'], 22.0)", "T1 has three good readings: 20.0, 22.0, and 24.0."], ["T2 count and mean", "stats['T2']['count'] == 3 and approx(stats['T2']['mean'], 19.5)", "T2 has three good readings: 18.5, 19.5, and 20.5."], ["bad_total is 2", "bad_total == 2", "Count every -999 in the whole log."]]}}, {"id": "b1", "title": "Find the hottest sensor", "points": 10, "minutes": 20, "bonus": true, "prompt_html": "<p>Given <code>stats<\/code> below, set <code>hottest<\/code> to the sensor name with the highest <code>\"mean\"<\/code>. Use a loop or <code>max<\/code> with a <code>key<\/code>.<\/p>", "starter": "stats = {\"T1\": {\"count\": 3, \"mean\": 22.0}, \"T2\": {\"count\": 3, \"mean\": 19.5}, \"T3\": {\"count\": 2, \"mean\": 23.4}}\n\nhottest = ...\n\nprint(hottest)\n", "hint_html": "<p>Loop over <code>stats.items()<\/code>, track the best mean so far and its name. Or use <code>max(stats, key=lambda name: stats[name][\"mean\"])<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["hottest is T3", "hottest == 'T3'", "Compare the mean values, not the names."]]}}]}, "lab_minutes": 150, "quiz": [{"q": "<pre><code>a = [10, 20, 30, 40]<\/code><\/pre>\n<p>What is <code>a[1:3]<\/code>?<\/p>", "options": ["<code>[10, 20]<\/code>", "<code>[10, 20, 30]<\/code>", "<code>[20, 30]<\/code>", "<code>[20, 30, 40]<\/code>"], "answer": 2, "why": "The , which is the sensor name."}, {"q": "What does <code>sorted([3, 1, 2])<\/code> return?", "options": ["<code>(1, 2, 3)<\/code>", "<code>[3, 1, 2]<\/code>", "<code>None<\/code>", "<code>[1, 2, 3]<\/code>"], "answer": 3, "why": "<code>sorted<\/code> returns a new sorted list. <code>list.sort()<\/code> is the in-place version and returns <code>None<\/code>."}, {"q": "What does <code>[r for r in [5, -999, 7] if r != -999]<\/code> produce?", "options": ["<code>[5, 7]<\/code>", "<code>[]<\/code>", "<code>[-999]<\/code>", "<code>[5, -999, 7]<\/code>"], "answer": 0, "why": "The condition drops the bad value and keeps the rest in order."}, {"q": "Why does <code>groups[name].append(x)<\/code> fail for a new sensor name?", "options": ["<code>name<\/code> must be an integer", "The key does not exist yet, so Python raises a <code>KeyError<\/code>", "Dictionaries cannot hold lists", "<code>append<\/code> only works on numbers"], "answer": 1, "why": "Create an empty list for the key first, or use a check such as <code>if name not in groups<\/code>."}], "quiz_minutes": 18, "quiz_intro_html": "<p>Answer each question. You see the explanation right after you choose. You can reset the quiz and try again.<\/p>"}</script>
<script id="harness" type="text/x-python">import sys, io, os, json, ast, base64, builtins, traceback, contextlib, math, random

os.environ.setdefault("MPLBACKEND", "Agg")
import importlib
if "" not in sys.path:
    sys.path.insert(0, "")

_OUT_CAP = 20000
_LECTURE_NS = {"__name__": "__main__"}


class _Capped(io.StringIO):
    def write(self, s):
        if self.tell() > _OUT_CAP:
            raise RuntimeError("Output limit reached. Your code printed too much text.")
        return super().write(s)


def approx(a, b, rel=1e-6, abs_=1e-9):
    try:
        if "numpy" in sys.modules:
            import numpy as _np
            if isinstance(a, _np.ndarray) or isinstance(b, _np.ndarray):
                return bool(_np.allclose(a, b, rtol=rel, atol=abs_))
        if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
            return len(a) == len(b) and all(approx(x, y, rel, abs_) for x, y in zip(a, b))
        return abs(float(a) - float(b)) <= max(abs_, rel * abs(float(b)))
    except Exception:
        return False


def uses_node(src, *names):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    wanted = tuple(getattr(ast, n) for n in names)
    return any(isinstance(n, wanted) for n in ast.walk(tree))


def calls_name(src, name):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    for n in ast.walk(tree):
        if isinstance(n, ast.Call):
            f = n.func
            if isinstance(f, ast.Name) and f.id == name:
                return True
            if isinstance(f, ast.Attribute) and f.attr == name:
                return True
    return False


def line_has(src, target, *words):
    """True when an assignment to `target` has every word on its right side."""
    for line in src.splitlines():
        s = line.strip()
        if s.startswith("#") or "=" not in s:
            continue
        left, _, right = s.partition("=")
        if left.strip() == target and all(w in right for w in words):
            return True
    return False


def run_with(src, inputs=(), ns=None):
    """Run student source with scripted input() values; return what it printed."""
    queue = list(inputs)
    old = builtins.input

    def _fake(prompt=""):
        print(prompt, end="")
        if not queue:
            raise EOFError("input() called more times than expected")
        v = queue.pop(0)
        print(v)
        return v

    buf = io.StringIO()
    builtins.input = _fake
    try:
        with contextlib.redirect_stdout(buf):
            exec(compile(src, "<your code>", "exec"), ns if ns is not None else {"__name__": "__main__"})
    finally:
        builtins.input = old
    return buf.getvalue()


def rerun(src, **over):
    """Execute student source again with top-level assignments replaced by the given constants.
    Returns the resulting namespace. Output is discarded."""
    tree = ast.parse(src)
    for node in tree.body:
        if (isinstance(node, ast.Assign) and len(node.targets) == 1
                and isinstance(node.targets[0], ast.Name) and node.targets[0].id in over):
            node.value = ast.Constant(over[node.targets[0].id])
    ast.fix_missing_locations(tree)
    ns = {"__name__": "__main__"}
    with contextlib.redirect_stdout(io.StringIO()):
        exec(compile(tree, "<your code>", "exec"), ns)
    return ns


def count_defs(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.FunctionDef) for n in ast.walk(tree))


def count_classes(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.ClassDef) for n in ast.walk(tree))


def _format_error(exc, code):
    lines = code.split("\n")
    if isinstance(exc, SyntaxError):
        ln = exc.lineno
        msg = "SyntaxError: " + str(exc.msg)
        if ln and 1 <= ln <= len(lines):
            msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
        return msg
    tb = traceback.TracebackException.from_exception(exc)
    ln = None
    for fs in tb.stack:
        if fs.filename == "<your code>":
            ln = fs.lineno
    msg = "".join(tb.format_exception_only()).strip()
    if ln and 1 <= ln <= len(lines):
        msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
    return msg


def _make_input(stdin_lines, out):
    queue = list(stdin_lines)

    def _input(prompt=""):
        out.write(str(prompt))
        if not queue:
            raise EOFError("input() ran out of lines. Type one value per line in the Input box under the code.")
        val = queue.pop(0)
        out.write(val + "\n")
        return val

    return _input


def _exec_code(code, ns, out):
    tree = ast.parse(code, "<your code>", "exec")
    last = None
    if tree.body and isinstance(tree.body[-1], ast.Expr):
        last = ast.Expression(tree.body.pop().value)
    exec(compile(tree, "<your code>", "exec"), ns)
    if last is not None:
        val = eval(compile(last, "<your code>", "eval"), ns)
        if val is not None:
            out.write(repr(val) + "\n")


def _collect_images():
    imgs = []
    if "matplotlib.pyplot" in sys.modules:
        import matplotlib.pyplot as plt
        for num in plt.get_fignums():
            fig = plt.figure(num)
            buf = io.BytesIO()
            fig.savefig(buf, format="png", dpi=100, bbox_inches="tight")
            imgs.append(base64.b64encode(buf.getvalue()).decode("ascii"))
        plt.close("all")
    return imgs

    err = None

                    raise
                err = _format_error(exc, code)
    finally:
        builtins.input = real_input
    result = {"stdout": out.getvalue(), "error": err, "images": [], "tests": None}
    try:
        result["images"] = _collect_images()
    except Exception as exc:
        result["stdout"] += "\n(Plot could not be drawn: %s)" % exc
    if tests is not None:
        result["tests"] = _run_tests(tests, ns, code, err, out.getvalue())
    return json.dumps(result)


def _run_tests(tests, ns, code, err, stdout_text):
    items = tests.get("items", [])
    results = []
    if err is not None:
        for label, _expr, hint in items:
            results.append({"label": label, "ok": False, "msg": "Fix the error above first."})
        return results
    env = ns
    helpers = {
        "approx": approx, "out": stdout_text, "src": code, "ast": ast,
        "uses_node": uses_node, "calls_name": calls_name,
        "count_defs": count_defs, "run_with": run_with, "rerun": rerun, "count_classes": count_classes, "line_has": line_has,
        "math": math, "random": random, "io": io, "_in_tests": True,
    }
    _missing = object()
    saved = {k: env.get(k, _missing) for k in helpers}
    env.update(helpers)
    sink = _Capped()
    try:
        setup = tests.get("setup")
        if setup:
            try:
                with contextlib.redirect_stdout(sink):
                    exec(compile(setup, "<tests>", "exec"), env)
            except BaseException as exc:
                reason = "Could not run the checks: %s: %s" % (type(exc).__name__, exc)
                return [{"label": l, "ok": False, "msg": reason} for l, _e, _h in items]
        for label, expr, hint in items:
            try:
                with contextlib.redirect_stdout(sink):
                    ok = bool(eval(compile(expr, "<tests>", "eval"), env))
                results.append({"label": label, "ok": ok, "msg": "" if ok else hint})
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                results.append({"label": label, "ok": False,
                                "msg": "%s (%s: %s)" % (hint, type(exc).__name__, exc)})
    finally:
        for k, v in saved.items():
            if v is _missing:
                env.pop(k, None)
            else:
                env[k] = v
    return results

    run: function (req) {

    var txt = buildReport(); ta.value = txt;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
    a.download = 'week' + D.num + '_report.txt'; document.body.appendChild(a); a.click(); a.remove();
  } });
  rep.appendChild(h('div', { class: 'row' }, [b1, b2, b3]));
  rep.appendChild(ta);
  p.appendChild(rep);
  updateLab();
}
function quizTally() {
  var correct = 0, answered = 0;
  D.quiz.forEach(function (q, i) { var a = S.quiz[i]; if (a !== undefined && a !== null) { answered++; if (a === q.answer) { correct++; } } });
  return { correct: correct, answered: answered, total: D.quiz.length };
}
function buildReport() {
  var L = [], s = labScore(), q = quizTally();
  var max = D.lab.tasks.filter(function (t) { return !t.bonus; }).reduce(function (a, t) { return a + t.points; }, 0);
  var lec = D.lecture.filter(function (_s, i) { return S.lecDone[i]; }).length;
  L.push('Course: ' + D.course_title);
  L.push('Week ' + D.num + ': ' + D.title);
  L.push('Name: ' + (S.name || '(not entered)'));
  L.push('Generated: ' + new Date().toLocaleString());
  L.push('');
  L.push('Lecture sections marked complete: ' + lec + ' of ' + D.lecture.length);
  L.push('Lab score (browser autograder): ' + s.score + ' of ' + max + (s.bonus ? ', bonus ' + s.bonus : ''));
  L.push('Quiz: ' + q.correct + ' correct, ' + q.answered + ' answered, ' + q.total + ' questions');
  L.push('');
  D.lab.tasks.forEach(function (t, i) {
    var r = S.lab[t.id];
    L.push('==== ' + (t.bonus ? 'Bonus' : 'Task ' + (i + 1)) + ': ' + t.title + ' (' + (r ? r.passed + '/' + r.total + ' tests' : 'not checked') + ') ====');
    L.push(S.code['lab_' + t.id] !== undefined ? S.code['lab_' + t.id] : t.starter);
    L.push('');
  });
  return L.join('\n');
}

/* ---------- quiz ---------- */
function updateQuiz() {
  var q = quizTally();
  var el = document.getElementById('quizscore');
  if (el) { el.textContent = q.correct + ' correct of ' + q.answered + ' answered, ' + q.total + ' questions'; }
  tiles.quiz.textContent = q.correct + '/' + q.total;
}
function renderQuiz() {
  var p = document.getElementById('panel-quiz');
  p.innerHTML = '';
  p.appendChild(h('div', { class: 'card', html: D.quiz_intro_html }));
  p.appendChild(h('div', { class: 'row' }, [
    h('strong', { text: 'Score: ' }), h('span', { id: 'quizscore', class: 'badge info' }),
    h('span', { style: 'flex:1' }),
    h('button', { class: 'btn', text: 'Reset quiz', onclick: function () {
      if (!confirm('Clear all quiz answers?')) { return; } S.quiz = {}; save(); renderQuiz();
    } })
  ]));
  D.quiz.forEach(function (q, i) {
    var card = h('div', { class: 'card' });
    card.appendChild(h('p', { class: 'meta', text: 'Question ' + (i + 1) + ' of ' + D.quiz.length }));
    card.appendChild(mcq({ cls: 'qbox', q: q.q, options: q.options, answer: q.answer, why: q.why, saved: S.quiz[i], onAnswer: function (k) { S.quiz[i] = k; save(); updateQuiz(); } }));
    p.appendChild(card);
  });
  updateQuiz();
}

/* ---------- shell ---------- */
document.getElementById('kicker').textContent = D.course_title + ', Week ' + D.num;
document.getElementById('title').textContent = D.title;
document.title = D.course_title + ' Week ' + D.num + ' ' + D.title;
var chips = document.getElementById('chips');
[D.lecture_minutes + ' min lecture', D.lab_minutes + ' min lab', D.quiz.length + ' quiz questions'].forEach(function (t) { chips.appendChild(h('li', { text: t })); });
var tabs = [['overview', 'Overview'], ['lecture', 'Lecture'], ['lab', 'Lab'], ['quiz', 'Quiz']];
var tl = document.getElementById('tablist');
tabs.forEach(function (t) {
  var b = h('button', { role: 'tab', id: 'tab-' + t[0], 'aria-controls': 'panel-' + t[0], 'aria-selected': 'false', text: t[1] });
  b.addEventListener('click', function () { show(t[0]); });
  tl.appendChild(b);
});
function show(name) {
  tabs.forEach(function (t) {
    document.getElementById('panel-' + t[0]).hidden = (t[0] !== name);
    document.getElementById('tab-' + t[0]).setAttribute('aria-selected', t[0] === name ? 'true' : 'false');
  });
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
  window.scrollTo(0, 0);
  document.querySelectorAll('#panel-' + name + ' textarea.code').forEach(function (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 4, 640) + 'px'; });
}
renderOverview(); renderLecture(); renderLab(); renderQuiz();
var start = (location.hash || '').replace('#', '');
show(tabs.some(function (t) { return t[0] === start; }) ? start : 'overview');
})();
</script>
</body>
