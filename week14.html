<script id="data" type="application/json">{"course_id": "pyeng", "course_title": "Python for Engineers", "pyodide_base": "https://cdn.jsdelivr.net/pyodide/v0.27.8/full/", "num": 14, "title": "Classes: Modeling Parts, Batteries, and Controllers", "hook": "A battery has a capacity, a charge, and a way to be drained. A resistor has a value, a tolerance, and a power rating. Writing these as separate variables and functions gets messy once you have ten batteries and twenty resistors. A class bundles the data and the behavior into one object, so a program reads like the system it models. This week you build part models, a sensor family with inheritance, a thermostat, and a virtual Arduino loop that runs entirely in Python.", "objectives": ["define a class with <code>__init__<\/code>, attributes, and methods", "change object state safely with methods that check their inputs", "print objects readably with <code>__str__<\/code>", "store objects in lists and compute with them", "extend a class with inheritance and override a method", "model a controller in a setup and loop structure like an Arduino sketch"], "summary": "<ul><li>A class bundles attributes and methods. <code>__init__(self, ...)<\/code> sets attributes. Every method takes <code>self<\/code> first.<\/li><li>Create an object with <code>ClassName(args)<\/code>. Call a method with <code>obj.method()<\/code>.<\/li><li>Make methods protect the object from invalid states, for example <code>min(request, available)<\/code>.<\/li><li><code>__str__<\/code> controls <code>print(obj)<\/code>. <code>__lt__<\/code> lets <code>sorted<\/code> order objects.<\/li><li>Objects work in lists, comprehensions, and <code>sum<\/code>, <code>max<\/code>, and <code>sorted<\/code>.<\/li><li>Inheritance: <code>class Child(Parent)<\/code>. A child can override a method and call <code>super()<\/code>.<\/li><li>A setup and loop structure maps onto a class plus a <code>for<\/code> loop over ticks. Hysteresis stops chattering.<\/li><li>Test classes with <code>assert<\/code> on normal, edge, and invalid cases.<\/li><\/ul>", "lecture": [{"title": "Why classes", "minutes": 15, "html": "<p>So far you stored related values in separate variables or dictionaries. A <strong>class<\/strong> bundles related data (<strong>attributes<\/strong>) with the functions that use it (<strong>methods<\/strong>). An <strong>object<\/strong> is one instance of a class: one resistor, one battery.<\/p>\n<p>A class is a plan, and each object built from it has its own data. Classes help you avoid parallel lists such as <code>names<\/code>, <code>values<\/code>, and <code>tolerances<\/code> that must stay aligned.<\/p>", "cells": [{"code": "r = {\"ohms\": 10000, \"tolerance\": 5}\nprint(r[\"ohms\"] * (1 + r[\"tolerance\"] / 100))\n", "stdin": null, "note": "A dictionary works for one resistor. The class version follows next."}], "check": {"q": "What is the difference between a class and an object?", "options": ["They are the same", "A class holds only functions, and an object holds only numbers", "An object is the plan, and a class is one thing built from it", "A class is the plan, and an object is one thing built from it"], "answer": 3, "why": "Many objects can come from one class, and each object has its own attribute values."}}, {"title": "Defining a class", "minutes": 20, "html": "<p><code>class Name:<\/code> starts a class. The special method <code>__init__<\/code> runs when you create an object and sets up its attributes. Every method takes <code>self<\/code> as its first parameter: <code>self<\/code> is the object the method is working on. Attributes are stored as <code>self.name = value<\/code>.<\/p>\n<p>Create an object by calling the class like a function: <code>Resistor(10000, 5)<\/code>. Call a method with a dot: <code>r.high()<\/code>.<\/p>", "cells": [{"code": "class Resistor:\n    def __init__(self, ohms, tolerance=5):\n        self.ohms = ohms\n        self.tolerance = tolerance\n\n    def high(self):\n        return self.ohms * (1 + self.tolerance / 100)\n\n    def low(self):\n        return self.ohms * (1 - self.tolerance / 100)\n\n    def __str__(self):\n        return f\"{self.ohms} ohm +/-{self.tolerance}%\"\n\nr = Resistor(10000, 5)\nprint(r.ohms, r.tolerance)\nprint(r.low(), r.high())\nprint(r)\n", "stdin": null, "note": "The <code>__str__<\/code> method controls what <code>print<\/code> shows."}, {"code": "a = Resistor(4700)\nb = Resistor(220, 1)\nprint(a, \"|\", b)\nb.ohms = 330\nprint(b)\nprint(a.ohms)\n", "stdin": null, "note": "Each object keeps its own attributes. Changing <code>b<\/code> does not change <code>a<\/code>."}], "check": {"q": "Inside a method, what does <code>self<\/code> refer to?", "options": ["The class definition", "The object the method was called on", "The first argument of the program", "A global variable"], "answer": 1, "why": "<code>r.high()<\/code> runs <code>high<\/code> with <code>self<\/code> set to <code>r<\/code>."}}, {"title": "Methods that change state", "minutes": 15, "html": "<p>Methods can change attributes. A good method protects the object from invalid states. A battery should not hold a negative charge, and it should not charge past capacity.<\/p>\n<p>Below, <code>discharge<\/code> removes charge for a current and a time. It clamps to what is available and returns the charge actually drawn.<\/p>", "cells": [{"code": "class Battery:\n    def __init__(self, capacity_mah, voltage=3.7):\n        self.capacity_mah = capacity_mah\n        self.charge_mah = capacity_mah\n        self.voltage = voltage\n\n    def discharge(self, current_ma, hours):\n        used = min(current_ma * hours, self.charge_mah)\n        self.charge_mah -= used\n        return used\n\n    def percent(self):\n        return 100 * self.charge_mah / self.capacity_mah\n\nb = Battery(2000)\nprint(b.discharge(500, 1), b.percent())\nprint(b.discharge(500, 10), b.percent())\n", "stdin": null, "note": "The second call asks for 5000 mAh but only 1500 remains."}], "check": {"q": "Why does <code>discharge<\/code> use <code>min(current_ma * hours, self.charge_mah)<\/code>?", "options": ["To prevent the current from being negative", "To convert hours to minutes", "To make the method faster", "So the charge never goes below zero"], "answer": 3, "why": "<code>min<\/code> caps the draw at the charge that is left."}}, {"title": "Printing and comparing objects", "minutes": 10, "html": "<p>Printing an object without <code>__str__<\/code> shows an unhelpful memory address. Define <code>__str__<\/code> to return text for people. Define <code>__lt__<\/code> (less than) so that <code>sorted<\/code> can order your objects: <code>sorted(list)<\/code> uses <code>&lt;<\/code> between items.<\/p>\n<p>Methods whose names start and end with two underscores are called <strong>special methods<\/strong>. Python calls them for you.<\/p>", "cells": [{"code": "class Part:\n    def __init__(self, name, ohms):\n        self.name = name\n        self.ohms = ohms\n\n    def __str__(self):\n        return f\"{self.name} ({self.ohms} ohm)\"\n\n    def __lt__(self, other):\n        return self.ohms < other.ohms\n\nparts = [Part(\"R2\", 10000), Part(\"R1\", 220), Part(\"R3\", 4700)]\nfor p in sorted(parts):\n    print(p)\n", "stdin": null, "note": null}], "check": {"q": "Which special method makes <code>print(obj)<\/code> show readable text?", "options": ["<code>__print__<\/code>", "<code>__str__<\/code>", "<code>__init__<\/code>", "<code>__lt__<\/code>"], "answer": 1, "why": "<code>print<\/code> calls <code>str(obj)<\/code>, which uses <code>__str__<\/code>."}}, {"title": "Lists of objects", "minutes": 15, "html": "<p>Objects go in lists like any value. Loops and comprehensions then compute across them. For resistors in series the total is the sum. In parallel, the total is the reciprocal of the sum of reciprocals.<\/p>", "cells": [{"code": "class Resistor:\n    def __init__(self, ohms, tolerance=5):\n        self.ohms = ohms\n        self.tolerance = tolerance\n\n    def high(self):\n        return self.ohms * (1 + self.tolerance / 100)\n\n    def low(self):\n        return self.ohms * (1 - self.tolerance / 100)\n\n    def __str__(self):\n        return f\"{self.ohms} ohm +/-{self.tolerance}%\"\n\nrs = [Resistor(100), Resistor(200), Resistor(300)]\nseries = sum(r.ohms for r in rs)\nparallel = 1 / sum(1 / r.ohms for r in rs)\nprint(series, round(parallel, 2))\nprint(max(r.high() for r in rs))\nprint([str(r) for r in rs if r.ohms > 150])\n", "stdin": null, "note": null}], "check": {"q": "What is the total resistance of 100 ohm and 100 ohm in parallel?", "options": ["25 ohm", "100 ohm", "200 ohm", "50 ohm"], "answer": 3, "why": "<code>1 / (1/100 + 1/100) = 50<\/code>."}}, {"title": "Inheritance", "minutes": 15, "html": "<p>A <strong>subclass<\/strong> reuses a class and changes or adds to it. Write <code>class Child(Parent):<\/code>. The child gets all the parent's methods. If the child defines a method with the same name, that version <strong>overrides<\/strong> the parent's. Use <code>super().__init__(...)<\/code> to run the parent's setup.<\/p>\n<p>A sensor family: every sensor has a name and a <code>read(raw)<\/code> method. A linear sensor converts a raw reading with a gain and an offset. A clamped linear sensor also limits the result to a range.<\/p>", "cells": [{"code": "class Sensor:\n    def __init__(self, name):\n        self.name = name\n\n    def read(self, raw):\n        return raw\n\nclass LinearSensor(Sensor):\n    def __init__(self, name, gain, offset):\n        super().__init__(name)\n        self.gain = gain\n        self.offset = offset\n\n    def read(self, raw):\n        return self.gain * raw + self.offset\n\nclass ClampedSensor(LinearSensor):\n    def __init__(self, name, gain, offset, low, high):\n        super().__init__(name, gain, offset)\n        self.low = low\n        self.high = high\n\n    def read(self, raw):\n        return max(self.low, min(self.high, super().read(raw)))\n\nsensors = [Sensor(\"raw\"), LinearSensor(\"temp\", 20, 0.2), ClampedSensor(\"safe\", 20, 0.2, 0, 50)]\nfor s in sensors:\n    print(s.name, round(s.read(3.0), 1))\n", "stdin": null, "note": "All three share the same method name. Each class defines its own behavior."}], "check": {"q": "What does <code>super().read(raw)<\/code> do inside <code>ClampedSensor.read<\/code>?", "options": ["Reads a second sensor", "Calls the parent class version of <code>read<\/code>", "Calls the same method again forever", "Creates a new sensor"], "answer": 1, "why": "<code>super()<\/code> gives access to the parent's version of the method."}}, {"title": "A virtual Arduino loop", "minutes": 25, "html": "<p>An Arduino sketch has a <code>setup()<\/code> that runs once and a <code>loop()<\/code> that runs forever. You can model the same structure in Python with a class and a fixed number of ticks. The thermostat below reads a temperature, decides about the heater, and the room responds.<\/p>\n<p>The thermostat uses <strong>hysteresis<\/strong>: it turns the heater on below <code>setpoint - band<\/code> and off above <code>setpoint + band<\/code>. Between those limits it keeps its current state, which stops rapid switching. The room warms 0.5 degrees per tick with the heater on and cools 0.3 per tick with it off.<\/p>\n<p>You are building the same logic you would run on a real board. A free simulator such as Wokwi can run the Arduino C++ version if you want to try it later; it is optional for this course.<\/p>", "cells": [{"code": "class Thermostat:\n    def __init__(self, setpoint, band):\n        self.setpoint = setpoint\n        self.band = band\n        self.on = False\n\n    def update(self, temp):\n        if temp < self.setpoint - self.band:\n            self.on = True\n        elif temp > self.setpoint + self.band:\n            self.on = False\n        return self.on\n\ndef simulate(th, ticks, start=18.0):\n    temp = start\n    log = []\n    for tick in range(ticks):\n        heater = th.update(temp)\n        temp += 0.5 if heater else -0.3\n        log.append((tick, round(temp, 2), heater))\n    return log\n\nlog = simulate(Thermostat(21, 1), 60)\nsteady = [row[1] for row in log[10:]]\nprint(\"Range after warm-up:\", min(steady), \"to\", max(steady))\nswitches = sum(1 for a, b in zip(log, log[1:]) if a[2] != b[2])\nprint(\"Heater switched\", switches, \"times\")\n", "stdin": null, "note": "The temperature stays between about 19.8 and 22.5 degrees. Try a band of 0.2 and count the switches."}], "check": {"q": "What is the purpose of hysteresis in a thermostat?", "options": ["It saves the setpoint in memory", "It measures the temperature more accurately", "It makes the room heat faster", "It prevents rapid on and off switching near the setpoint"], "answer": 3, "why": "Separate on and off thresholds leave a band where the heater keeps its state."}}, {"title": "Testing a class", "minutes": 15, "html": "<p>Test a class by building an object, calling methods, and checking results with <code>assert<\/code>. Test the normal case, the edges (empty, full, zero), and the invalid cases (negative input). Write the tests before you trust the class.<\/p>", "cells": [{"code": "b = Battery(1000)\nassert b.percent() == 100\nassert b.discharge(100, 2) == 200\nassert b.percent() == 80\nassert b.discharge(1000, 5) == 800\nassert b.percent() == 0\nassert b.discharge(10, 1) == 0\nprint(\"all Battery tests passed\")\n", "stdin": null, "note": "The last assertion tests an empty battery: no more charge can be drawn."}]}], "lecture_minutes": 130, "lab": {"summary": "Build a Resistor class, a Battery class, a series and parallel calculator, a sensor family, a thermostat, and a DC motor model.", "intro_html": "<p>Each task asks for a class or function with exact names and method names. The checks create your objects and call your methods with new values, so hard-coded answers fail. Methods return values and do not print them, unless the task says otherwise.<\/p>", "tasks": [{"id": "t1", "title": "Resistor class", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Write <code>class Resistor<\/code> with <code>__init__(self, ohms, tolerance=5)<\/code>, <code>low()<\/code> (the lowest possible value), <code>high()<\/code> (the highest possible value), <code>power(current)<\/code> (the power in watts, <code>current ** 2 * ohms<\/code>), and <code>__str__<\/code> that returns text like <code>10000 ohm +/-5%<\/code>.<\/p>", "starter": "class Resistor:\n    def __init__(self, ohms, tolerance=5):\n        ...\n\n    def low(self):\n        ...\n\n    def high(self):\n        ...\n\n    def power(self, current):\n        ...\n\n    def __str__(self):\n        ...\n\nr = Resistor(10000, 5)\nprint(r, r.low(), r.high(), r.power(0.01))\n", "hint_html": "<p>Store both inputs in <code>self<\/code>. <code>low<\/code> is <code>self.ohms * (1 - self.tolerance / 100)<\/code>. For <code>__str__<\/code> return an f-string: <code>f\"{self.ohms} ohm +/-{self.tolerance}%\"<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import math", "items": [["low and high", "approx(Resistor(10000, 5).low(), 9500) and approx(Resistor(10000, 5).high(), 10500)", "Apply the tolerance as a percent."], ["default tolerance is 5", "approx(Resistor(100).high(), 105)", "Use tolerance=5 in __init__."], ["another tolerance", "approx(Resistor(220, 1).low(), 217.8)", "Use the tolerance given."], ["power", "approx(Resistor(10000, 5).power(0.01), 1.0)", "power = current ** 2 * ohms"], ["text form", "str(Resistor(4700, 5)) == '4700 ohm +/-5%'", "Return an f-string from __str__."], ["objects are independent", "Resistor(1, 1).ohms == 1 and Resistor(2, 1).ohms == 2", "Use self.ohms, not a global."]]}}, {"id": "t2", "title": "Battery class", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Write <code>class Battery<\/code> with <code>__init__(self, capacity_mah)<\/code> (starts full), <code>discharge(current_ma, hours)<\/code> that removes charge, never goes below 0, and returns the charge actually drawn, <code>charge(mah)<\/code> that adds charge, never goes above capacity, and returns the charge actually added, <code>percent()<\/code>, and <code>runtime_hours(current_ma)<\/code> (hours left at that constant current).<\/p>", "starter": "class Battery:\n    def __init__(self, capacity_mah):\n        ...\n\n    def discharge(self, current_ma, hours):\n        ...\n\n    def charge(self, mah):\n        ...\n\n    def percent(self):\n        ...\n\n    def runtime_hours(self, current_ma):\n        ...\n\nb = Battery(2000)\nprint(b.discharge(500, 1), b.percent(), b.runtime_hours(150))\n", "hint_html": "<p>Keep <code>self.capacity_mah<\/code> and <code>self.charge_mah<\/code>. Use <code>min<\/code> to clamp: <code>used = min(current_ma * hours, self.charge_mah)<\/code>. For charging, the room left is <code>self.capacity_mah - self.charge_mah<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import math", "items": [["starts full", "Battery(2000).percent() == 100", "Initialize charge to the capacity."], ["discharge returns the charge used", "Battery(2000).discharge(500, 1) == 500", "Return the amount drawn."], ["percent after discharge", "approx((lambda b: (b.discharge(500, 1), b.percent())[1])(Battery(2000)), 75.0)", "percent = 100 * charge / capacity"], ["clamps at empty", "(lambda b: (b.discharge(1000, 10), b.percent(), b.discharge(5, 1)))(Battery(1000)) == (1000, 0.0, 0)", "Use min() so the charge never goes below 0."], ["charge clamps at full", "(lambda b: (b.discharge(100, 3), b.charge(500), b.percent()))(Battery(1000)) == (300, 300, 100.0)", "Add at most the room left."], ["runtime", "approx(Battery(1500).runtime_hours(150), 10.0)", "runtime = charge / current"], ["batteries are independent", "(lambda a, b: (a.discharge(100, 1), b.percent())[1])(Battery(1000), Battery(1000)) == 100", "Use self attributes, not shared ones."]]}}, {"id": "t3", "title": "Series and parallel", "points": 15, "minutes": 20, "bonus": false, "prompt_html": "<p>Using the supplied <code>Resistor<\/code>, write <code>series(parts)<\/code> and <code>parallel(parts)<\/code>. Each takes a list of Resistor objects and returns the total resistance in ohms (use the nominal <code>ohms<\/code>). Write <code>worst_series(parts)<\/code> that returns the largest possible series resistance (use <code>high()<\/code>).<\/p>", "starter": "class Resistor:\n    def __init__(self, ohms, tolerance=5):\n        self.ohms = ohms\n        self.tolerance = tolerance\n\n    def high(self):\n        return self.ohms * (1 + self.tolerance / 100)\n\n    def low(self):\n        return self.ohms * (1 - self.tolerance / 100)\n\n    def __str__(self):\n        return f\"{self.ohms} ohm +/-{self.tolerance}%\"\n\ndef series(parts):\n    ...\n\ndef parallel(parts):\n    ...\n\ndef worst_series(parts):\n    ...\n\nrs = [Resistor(100), Resistor(200), Resistor(300)]\nprint(series(rs), parallel(rs), worst_series(rs))\n", "hint_html": "<p><code>sum(r.ohms for r in parts)<\/code> for series. Parallel is <code>1 / sum(1 / r.ohms for r in parts)<\/code>. Worst series uses <code>r.high()<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import math", "items": [["series total", "series([Resistor(100), Resistor(200), Resistor(300)]) == 600", "Add the ohms of each part."], ["parallel pair", "approx(parallel([Resistor(100), Resistor(100)]), 50.0)", "Reciprocal of the sum of reciprocals."], ["parallel of three", "approx(parallel([Resistor(100), Resistor(200), Resistor(300)]), 600 / 11)", "1 / (1/100 + 1/200 + 1/300)"], ["worst case series", "approx(worst_series([Resistor(100, 10), Resistor(200, 5)]), 110 + 210)", "Use high() for each part."], ["single part", "series([Resistor(47)]) == 47 and approx(parallel([Resistor(47)]), 47)", "A list of one part returns that part."]]}}, {"id": "t4", "title": "Sensor family", "points": 20, "minutes": 30, "bonus": false, "prompt_html": "<p>Complete the sensor classes. <code>LinearSensor(name, gain, offset)<\/code> inherits from <code>Sensor<\/code> and returns <code>gain * raw + offset<\/code>. <code>ClampedSensor(name, gain, offset, low, high)<\/code> inherits from <code>LinearSensor<\/code> and limits the result to the range <code>low<\/code> to <code>high<\/code>. Create <code>s1 = LinearSensor(\"temp\", 20, 0.2)<\/code> and <code>s2 = ClampedSensor(\"safe\", 20, 0.2, 0, 50)<\/code>. Store <code>v1 = s1.read(3.0)<\/code> and <code>v2 = s2.read(3.0)<\/code>.<\/p>", "starter": "class Sensor:\n    def __init__(self, name):\n        self.name = name\n\n    def read(self, raw):\n        return raw\n\nclass LinearSensor(Sensor):\n    ...\n\nclass ClampedSensor(LinearSensor):\n    ...\n\ns1 = ...\ns2 = ...\nv1 = ...\nv2 = ...\n\nprint(v1, v2)\n", "hint_html": "<p>Write <code>__init__<\/code> in each subclass, call <code>super().__init__(...)<\/code> first, then store the new attributes. In <code>ClampedSensor.read<\/code>, compute <code>super().read(raw)<\/code> and then <code>max(self.low, min(self.high, value))<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import math", "items": [["LinearSensor inherits from Sensor", "issubclass(LinearSensor, Sensor) and LinearSensor('a', 1, 0).name == 'a'", "Declare class LinearSensor(Sensor) and call super().__init__(name)."], ["ClampedSensor inherits from LinearSensor", "issubclass(ClampedSensor, LinearSensor)", "Declare class ClampedSensor(LinearSensor)."], ["linear reading", "approx(v1, 60.2)", "gain * raw + offset"], ["clamped high", "approx(v2, 50.0)", "Limit the value to the high bound."], ["clamped low", "approx(ClampedSensor('x', 20, 0.2, 0, 50).read(-1.0), 0.0)", "Limit the value to the low bound too."], ["inside the range", "approx(ClampedSensor('x', 20, 0.2, 0, 50).read(1.0), 20.2)", "In range values pass through."], ["uses parent read", "approx(ClampedSensor('x', 2, 1, -100, 100).read(4), 9)", "Call super().read(raw) and do not recompute the value."]]}}, {"id": "t5", "title": "Thermostat controller", "points": 20, "minutes": 25, "bonus": false, "prompt_html": "<p>Write <code>class Thermostat<\/code> with <code>__init__(self, setpoint, band)<\/code> (heater starts off, attribute <code>on<\/code>) and <code>update(temp)<\/code>. The heater turns on when <code>temp<\/code> is strictly below <code>setpoint - band<\/code>, turns off when <code>temp<\/code> is strictly above <code>setpoint + band<\/code>, and otherwise keeps its state. <code>update<\/code> returns the heater state. The supplied <code>simulate<\/code> runs the room. Store <code>t_max<\/code> and <code>t_min<\/code> (the highest and lowest temperature from tick 10 on) and <code>switches<\/code> (how many times the heater changed state during 60 ticks).<\/p>", "starter": "class Thermostat:\n    ...\n\ndef simulate(th, ticks, start=18.0):\n    temp = start\n    log = []\n    for tick in range(ticks):\n        heater = th.update(temp)\n        temp += 0.5 if heater else -0.3\n        log.append((tick, round(temp, 2), heater))\n    return log\n\nlog = simulate(Thermostat(21, 1), 60)\nt_max = ...\nt_min = ...\nswitches = ...\n\nprint(t_max, t_min, switches)\n", "hint_html": "<p><code>update<\/code>: if <code>temp &lt; self.setpoint - self.band<\/code> set <code>self.on = True<\/code>; <code>elif temp &gt; self.setpoint + self.band<\/code> set <code>self.on = False<\/code>; then <code>return self.on<\/code>. Each log row is <code>(tick, temp, heater)<\/code>. Count positions where one row's heater state differs from the next.<\/p>", "stdin": null, "tests": {"setup": "import math", "items": [["starts off", "Thermostat(21, 1).on is False", "Set self.on = False in __init__."], ["turns on when cold", "Thermostat(21, 1).update(19.0) is True", "Compare with setpoint - band."], ["keeps state inside the band", "(lambda t: (t.update(19.0), t.update(21.0), t.update(21.9)))(Thermostat(21, 1)) == (True, True, True)", "Between the limits, do not change the state."], ["turns off when hot", "(lambda t: (t.update(19.0), t.update(23.0)))(Thermostat(21, 1)) == (True, False)", "Compare with setpoint + band."], ["exact limits do not switch", "(lambda t: (t.update(20.0), t.on))(Thermostat(21, 1)) == (False, False)", "Use strict comparisons < and >."], ["temperature range", "approx(t_max, 22.5) and approx(t_min, 19.8)", "Take min and max of the temperatures from tick 10 on."], ["switch count", "switches == 8", "Count rows where the heater state differs from the next row."]]}}, {"id": "t6", "title": "DC motor model", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Write <code>class DCMotor<\/code> with <code>__init__(self, resistance, kt)<\/code> where <code>kt<\/code> is the torque constant in N m/A (it is also the back-EMF constant in V s/rad). Add <code>stall_current(v)<\/code> (<code>v / resistance<\/code>), <code>stall_torque(v)<\/code> (<code>kt<\/code> times the stall current), <code>no_load_speed(v)<\/code> (<code>v / kt<\/code> in rad/s), and <code>speed(v, torque)<\/code> (the speed in rad/s at a load torque: <code>(v - resistance * torque / kt) / kt<\/code>). Create <code>m = DCMotor(2.0, 0.05)<\/code> and store <code>stall = m.stall_torque(12)<\/code> and <code>half = m.speed(12, stall / 2)<\/code>.<\/p>", "starter": "class DCMotor:\n    ...\n\nm = ...\nstall = ...\nhalf = ...\n\nprint(stall, half)\n", "hint_html": "<p>The current at a given torque is <code>torque / kt<\/code>. The voltage across the winding is <code>resistance * current<\/code>. Speed is the remaining voltage divided by <code>kt<\/code>. At half the stall torque the speed is half the no-load speed.<\/p>", "stdin": null, "tests": {"setup": "import math", "items": [["stall current", "approx(DCMotor(2.0, 0.05).stall_current(12), 6.0)", "stall current = v / resistance"], ["stall torque", "approx(stall, 0.3)", "stall torque = kt * stall current"], ["no-load speed", "approx(DCMotor(2.0, 0.05).no_load_speed(12), 240.0)", "no-load speed = v / kt"], ["speed at half stall torque", "approx(half, 120.0)", "speed = (v - resistance * torque / kt) / kt"], ["speed is zero at stall", "approx(DCMotor(2.0, 0.05).speed(12, stall), 0.0, abs_=1e-9)", "At stall torque the speed is zero."], ["another motor", "approx(DCMotor(1.0, 0.1).stall_torque(6), 0.6)", "Methods must use the object's own values."]]}}, {"id": "b1", "title": "Sort parts", "points": 10, "minutes": 20, "bonus": true, "prompt_html": "<p>Add <code>__lt__(self, other)<\/code> to <code>Part<\/code> so that <code>sorted<\/code> orders parts by <code>ohms<\/code> (smallest first). Store <code>ordered_names<\/code>, the list of names of <code>parts<\/code> in sorted order.<\/p>", "starter": "class Part:\n    def __init__(self, name, ohms):\n        self.name = name\n        self.ohms = ohms\n\nparts = [Part(\"R2\", 10000), Part(\"R1\", 220), Part(\"R3\", 4700)]\nordered_names = ...\n\nprint(ordered_names)\n", "hint_html": "<p>Add <code>def __lt__(self, other): return self.ohms &lt; other.ohms<\/code>. Then <code>[p.name for p in sorted(parts)]<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import math", "items": [["sorted names", "ordered_names == ['R1', 'R3', 'R2']", "Sort by ohms, smallest first."], ["less than works", "Part('a', 1) < Part('b', 2)", "Define __lt__ on Part."]]}}]}, "lab_minutes": 150, "quiz": [{"q": "What does <code>__init__<\/code> do?", "options": ["Compares two objects", "Deletes an object", "Sets up a new object when it is created", "Prints the object"], "answer": 2, "why": "Python calls <code>__init__<\/code> each time you create an object from the class."}, {"q": "In <code>def high(self):<\/code>, what is <code>self<\/code>?", "options": ["The return value", "The class", "A keyword that can be left out", "The object the method was called on"], "answer": 3, "why": "<code>r.high()<\/code> passes <code>r<\/code> as <code>self<\/code>."}, {"q": "What is the result of <code>Resistor(100, 10).high()<\/code> if <code>high<\/code> returns <code>ohms * (1 + tolerance / 100)<\/code>?", "options": ["110.0", "10", "1100", "100"], "answer": 0, "why": "10 percent of 100 is 10, so the high limit is 110."}, {"q": "You create <code>a = Battery(1000)<\/code> and <code>b = Battery(1000)<\/code>, then call <code>a.discharge(100, 1)<\/code>. What is <code>b.percent()<\/code>?", "options": ["90.0", "100.0", "0.0", "An error"], "answer": 1, "why": "Each object has its own attributes. Changing <code>a<\/code> leaves <code>b<\/code> unchanged."}, {"q": "Why should <code>discharge<\/code> use <code>min(requested, available)<\/code>?", "options": ["So the battery charges faster", "So the method is shorter", "So the charge never becomes negative", "So the method returns a string"], "answer": 2, "why": "A method should keep the object in a valid state."}, {"q": "What does <code>__str__<\/code> return?", "options": ["A list of attributes", "The type of the object", "The memory address", "The text shown by <code>print(obj)<\/code>"], "answer": 3, "why": "<code>print<\/code> calls <code>__str__<\/code> to turn the object into text."}, {"q": "What lets <code>sorted(parts)<\/code> order objects of your class?", "options": ["A <code>__lt__<\/code> method", "A <code>sort<\/code> attribute", "Nothing; it always works", "A <code>__sorted__<\/code> method"], "answer": 0, "why": "<code>sorted<\/code> compares items with <code>&lt;<\/code>, which calls <code>__lt__<\/code>."}, {"q": "What is the total of 200 ohm and 300 ohm in parallel?", "options": ["500 ohm", "120 ohm", "250 ohm", "60 ohm"], "answer": 1, "why": "1 / (1/200 + 1/300) = 120."}, {"q": "In <code>class Child(Parent):<\/code>, what does Child get?", "options": ["Only Parent's attributes", "A copy of Parent's data", "All of Parent's attributes and methods, which it can override", "Nothing from Parent"], "answer": 2, "why": "Inheritance shares behavior. A method with the same name replaces the parent's version."}, {"q": "What does <code>super().__init__(name)<\/code> do in a subclass?", "options": ["Deletes the parent", "Prints the name", "Creates a second object", "Runs the parent class setup"], "answer": 3, "why": "<code>super()<\/code> reaches the parent so its setup code runs."}, {"q": "A thermostat turns on below 20 and off above 22. The temperature is 21 and the heater is on. What does it do?", "options": ["Keeps the heater on", "Raises an error", "Turns the heater off", "Turns the heater on again"], "answer": 0, "why": "Inside the band the thermostat keeps its current state. That is hysteresis."}, {"q": "What does <code>assert b.percent() == 80<\/code> do if the percent is 75?", "options": ["Does nothing", "Stops with an AssertionError", "Prints False", "Sets the percent to 80"], "answer": 1, "why": "<code>assert<\/code> raises an error when the condition is false."}], "quiz_minutes": 18, "quiz_intro_html": "<p>Answer each question. You see the explanation right after you choose. You can reset the quiz and try again.<\/p>"}</script>
<script id="harness" type="text/x-python">import sys, io, os, json, ast, base64, builtins, traceback, contextlib, math, random

os.environ.setdefault("MPLBACKEND", "Agg")
import importlib
if "" not in sys.path:
    sys.path.insert(0, "")

_OUT_CAP = 20000
_LECTURE_NS = {"__name__": "__main__"}


class _Capped(io.StringIO):
    def write(self, s):
        if self.tell() > _OUT_CAP:
            raise RuntimeError("Output limit reached. Your code printed too much text.")
        return super().write(s)


def approx(a, b, rel=1e-6, abs_=1e-9):
    try:
        if "numpy" in sys.modules:
            import numpy as _np
            if isinstance(a, _np.ndarray) or isinstance(b, _np.ndarray):
                return bool(_np.allclose(a, b, rtol=rel, atol=abs_))
        if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
            return len(a) == len(b) and all(approx(x, y, rel, abs_) for x, y in zip(a, b))
        return abs(float(a) - float(b)) <= max(abs_, rel * abs(float(b)))
    except Exception:
        return False


def uses_node(src, *names):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    wanted = tuple(getattr(ast, n) for n in names)
    return any(isinstance(n, wanted) for n in ast.walk(tree))


def calls_name(src, name):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    for n in ast.walk(tree):
        if isinstance(n, ast.Call):
            f = n.func
            if isinstance(f, ast.Name) and f.id == name:
                return True
            if isinstance(f, ast.Attribute) and f.attr == name:
                return True
    return False


def line_has(src, target, *words):
    """True when an assignment to `target` has every word on its right side."""
    for line in src.splitlines():
        s = line.strip()
        if s.startswith("#") or "=" not in s:
            continue
        left, _, right = s.partition("=")
        if left.strip() == target and all(w in right for w in words):
            return True
    return False


def run_with(src, inputs=(), ns=None):
    """Run student source with scripted input() values; return what it printed."""
    queue = list(inputs)
    old = builtins.input

    def _fake(prompt=""):
        print(prompt, end="")
        if not queue:
            raise EOFError("input() called more times than expected")
        v = queue.pop(0)
        print(v)
        return v

    buf = io.StringIO()
    builtins.input = _fake
    try:
        with contextlib.redirect_stdout(buf):
            exec(compile(src, "<your code>", "exec"), ns if ns is not None else {"__name__": "__main__"})
    finally:
        builtins.input = old
    return buf.getvalue()


def rerun(src, **over):
    """Execute student source again with top-level assignments replaced by the given constants.
    Returns the resulting namespace. Output is discarded."""
    tree = ast.parse(src)
    for node in tree.body:
        if (isinstance(node, ast.Assign) and len(node.targets) == 1
                and isinstance(node.targets[0], ast.Name) and node.targets[0].id in over):
            node.value = ast.Constant(over[node.targets[0].id])
    ast.fix_missing_locations(tree)
    ns = {"__name__": "__main__"}
    with contextlib.redirect_stdout(io.StringIO()):
        exec(compile(tree, "<your code>", "exec"), ns)
    return ns


def count_defs(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.FunctionDef) for n in ast.walk(tree))


def count_classes(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.ClassDef) for n in ast.walk(tree))


def _format_error(exc, code):
    lines = code.split("\n")
    if isinstance(exc, SyntaxError):
        ln = exc.lineno
        msg = "SyntaxError: " + str(exc.msg)
        if ln and 1 <= ln <= len(lines):
            msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
        return msg
    tb = traceback.TracebackException.from_exception(exc)
    ln = None
    for fs in tb.stack:
        if fs.filename == "<your code>":
            ln = fs.lineno
    msg = "".join(tb.format_exception_only()).strip()
    if ln and 1 <= ln <= len(lines):
        msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
    return msg


def _make_input(stdin_lines, out):
    queue = list(stdin_lines)

    def _input(prompt=""):
        out.write(str(prompt))
        if not queue:
            raise EOFError("input() ran out of lines. Type one value per line in the Input box under the code.")
        val = queue.pop(0)
        out.write(val + "\n")
        return val

    return _input


def _exec_code(code, ns, out):
    tree = ast.parse(code, "<your code>", "exec")
    last = None
    if tree.body and isinstance(tree.body[-1], ast.Expr):
        last = ast.Expression(tree.body.pop().value)
    exec(compile(tree, "<your code>", "exec"), ns)
    if last is not None:
        val = eval(compile(last, "<your code>", "eval"), ns)
        if val is not None:
            out.write(repr(val) + "\n")


def _collect_images():
    imgs = []
    if "matplotlib.pyplot" in sys.modules:
        import matplotlib.pyplot as plt
        for num in plt.get_fignums():
            fig = plt.figure(num)
            buf = io.BytesIO()
            fig.savefig(buf, format="png", dpi=100, bbox_inches="tight")
            imgs.append(base64.b64encode(buf.getvalue()).decode("ascii"))
        plt.close("all")
    return imgs


def reset_lecture():
    _LECTURE_NS.clear()
    _LECTURE_NS["__name__"] = "__main__"


def run_cell(req_json):
    req = json.loads(req_json)
    code = req.get("code", "")
    mode = req.get("mode", "fresh")
    stdin_lines = req.get("stdin") or []
    tests = req.get("tests")
    ns = _LECTURE_NS if mode == "lecture" else {"__name__": "__main__"}
    importlib.invalidate_caches()
    out = _Capped()
    err = None
    real_input = builtins.input
    builtins.input = _make_input(stdin_lines, out)
    try:
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
            try:
                random.seed()
                _exec_code(code, ns, out)
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                err = _format_error(exc, code)
    finally:
        builtins.input = real_input
    result = {"stdout": out.getvalue(), "error": err, "images": [], "tests": None}
    try:
        result["images"] = _collect_images()
    except Exception as exc:
        result["stdout"] += "\n(Plot could not be drawn: %s)" % exc
    if tests is not None:
        result["tests"] = _run_tests(tests, ns, code, err, out.getvalue())
    return json.dumps(result)


def _run_tests(tests, ns, code, err, stdout_text):
    items = tests.get("items", [])
    results = []
    if err is not None:
        for label, _expr, hint in items:
            results.append({"label": label, "ok": False, "msg": "Fix the error above first."})
        return results
    env = ns
    helpers = {
        "approx": approx, "out": stdout_text, "src": code, "ast": ast,
        "uses_node": uses_node, "calls_name": calls_name,
        "count_defs": count_defs, "run_with": run_with, "rerun": rerun, "count_classes": count_classes, "line_has": line_has,
        "math": math, "random": random, "io": io, "_in_tests": True,
    }
    _missing = object()
    saved = {k: env.get(k, _missing) for k in helpers}
    env.update(helpers)
    sink = _Capped()
    try:
        setup = tests.get("setup")
        if setup:
            try:
                with contextlib.redirect_stdout(sink):
                    exec(compile(setup, "<tests>", "exec"), env)
            except BaseException as exc:
                reason = "Could not run the checks: %s: %s" % (type(exc).__name__, exc)
                return [{"label": l, "ok": False, "msg": reason} for l, _e, _h in items]
        for label, expr, hint in items:
            try:
                with contextlib.redirect_stdout(sink):
                    ok = bool(eval(compile(expr, "<tests>", "eval"), env))
                results.append({"label": label, "ok": ok, "msg": "" if ok else hint})
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                results.append({"label": label, "ok": False,
                                "msg": "%s (%s: %s)" % (hint, type(exc).__name__, exc)})
    finally:
        for k, v in saved.items():
            if v is _missing:
                env.pop(k, None)
            else:
                env[k] = v
    return results

    card.appendChild(h('p', { class: 'meta', text: (t.bonus ? 'Bonus challenge' : 'Task ' + (i + 1)) + ', ' + t.points + (t.bonus ? ' bonus points' : ' points') + ', about ' + t.minutes + ' minutes' }));
    card.appendChild(h('h3', { text: t.title }));
    card.appendChild(h('div', { html: t.prompt_html }));
    var res = S.lab[t.id];
    var note = h('p', { class: 'small', text: res ? ('Last check: ' + res.passed + ' of ' + res.total + ' tests passed.') : 'Not checked yet.' });
    var cell = codeCell({
      key: 'lab_' + t.id, code: t.starter, stdin: t.stdin, mode: 'fresh', tests: t.tests, hint: t.hint_html, timeout: 20, label: 'Code for ' + t.title,
      hasResult: function () { return !!S.lab[t.id]; },
      onCheck: function (r) {
        var passed = r.tests ? r.tests.filter(function (x) { return x.ok; }).length : 0;
        S.lab[t.id] = { passed: passed, total: r.tests ? r.tests.length : 0, at: new Date().toISOString() };
        save(); note.textContent = 'Last check: ' + passed + ' of ' + S.lab[t.id].total + ' tests passed.'; updateLab();
      }
    });
    card.appendChild(cell); card.appendChild(note);
    p.appendChild(card);
  });
  p.appendChild(h('h2', { text: 'Submit your work' }));
  var rep = h('div', { class: 'card' });
  rep.appendChild(h('p', { text: 'Enter your name, then copy the report or download it. Submit it the way your instructor asks. The report lists your scores and your final code for each task.' }));
  var nm = h('input', { type: 'text', id: 'stname', 'aria-label': 'Your name', placeholder: 'Your name', autocomplete: 'name' });
  nm.value = S.name;
  nm.addEventListener('input', function () { S.name = nm.value; save(); });
  rep.appendChild(h('div', { class: 'field' }, [h('label', { for: 'stname', text: 'Name' }), nm]));
  var ta = h('textarea', { class: 'report', readonly: '', 'aria-label': 'Report text' });
  var b1 = h('button', { class: 'btn primary', text: 'Build report', onclick: function () { ta.value = buildReport(); } });
  var b2 = h('button', { class: 'btn', text: 'Copy report', onclick: function () {
    ta.value = buildReport(); ta.select();
    var done = function () { b2.textContent = 'Copied'; setTimeout(function () { b2.textContent = 'Copy report'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(done, function () { try { document.execCommand('copy'); done(); } catch (e) {} }); }
    else { try { document.execCommand('copy'); done(); } catch (e) {} }
  } });
  var b3 = h('button', { class: 'btn', text: 'Download .txt', onclick: function () {
    var txt = buildReport(); ta.value = txt;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
    a.download = 'week' + D.num + '_report.txt'; document.body.appendChild(a); a.click(); a.remove();
  } });
  rep.appendChild(h('div', { class: 'row' }, [b1, b2, b3]));
  rep.appendChild(ta);
  p.appendChild(rep);
  updateLab();
}
function quizTally() {
  var correct = 0, answered = 0;
  D.quiz.forEach(function (q, i) { var a = S.quiz[i]; if (a !== undefined && a !== null) { answered++; if (a === q.answer) { correct++; } } });
  return { correct: correct, answered: answered, total: D.quiz.length };
}
function buildReport() {
  var L = [], s = labScore(), q = quizTally();
  var max = D.lab.tasks.filter(function (t) { return !t.bonus; }).reduce(function (a, t) { return a + t.points; }, 0);
  var lec = D.lecture.filter(function (_s, i) { return S.lecDone[i]; }).length;
  L.push('Course: ' + D.course_title);
  L.push('Week ' + D.num + ': ' + D.title);
  L.push('Name: ' + (S.name || '(not entered)'));
  L.push('Generated: ' + new Date().toLocaleString());
  L.push('');
  L.push('Lecture sections marked complete: ' + lec + ' of ' + D.lecture.length);
  L.push('Lab score (browser autograder): ' + s.score + ' of ' + max + (s.bonus ? ', bonus ' + s.bonus : ''));
  L.push('Quiz: ' + q.correct + ' correct, ' + q.answered + ' answered, ' + q.total + ' questions');
  L.push('');
  D.lab.tasks.forEach(function (t, i) {
    var r = S.lab[t.id];
    L.push('==== ' + (t.bonus ? 'Bonus' : 'Task ' + (i + 1)) + ': ' + t.title + ' (' + (r ? r.passed + '/' + r.total + ' tests' : 'not checked') + ') ====');
    L.push(S.code['lab_' + t.id] !== undefined ? S.code['lab_' + t.id] : t.starter);
    L.push('');
  });
  return L.join('\n');
}

/* ---------- quiz ---------- */
function updateQuiz() {
  var q = quizTally();
  var el = document.getElementById('quizscore');
  if (el) { el.textContent = q.correct + ' correct of ' + q.answered + ' answered, ' + q.total + ' questions'; }
  tiles.quiz.textContent = q.correct + '/' + q.total;
}
function renderQuiz() {
  var p = document.getElementById('panel-quiz');
  p.innerHTML = '';
  p.appendChild(h('div', { class: 'card', html: D.quiz_intro_html }));
  p.appendChild(h('div', { class: 'row' }, [
    h('strong', { text: 'Score: ' }), h('span', { id: 'quizscore', class: 'badge info' }),
    h('span', { style: 'flex:1' }),
    h('button', { class: 'btn', text: 'Reset quiz', onclick: function () {
      if (!confirm('Clear all quiz answers?')) { return; } S.quiz = {}; save(); renderQuiz();
    } })
  ]));
  D.quiz.forEach(function (q, i) {
    var card = h('div', { class: 'card' });
    card.appendChild(h('p', { class: 'meta', text: 'Question ' + (i + 1) + ' of ' + D.quiz.length }));
    card.appendChild(mcq({ cls: 'qbox', q: q.q, options: q.options, answer: q.answer, why: q.why, saved: S.quiz[i], onAnswer: function (k) { S.quiz[i] = k; save(); updateQuiz(); } }));
    p.appendChild(card);
  });
  updateQuiz();
}

/* ---------- shell ---------- */
document.getElementById('kicker').textContent = D.course_title + ', Week ' + D.num;
document.getElementById('title').textContent = D.title;
document.title = D.course_title + ' Week ' + D.num + ' ' + D.title;
var chips = document.getElementById('chips');
[D.lecture_minutes + ' min lecture', D.lab_minutes + ' min lab', D.quiz.length + ' quiz questions'].forEach(function (t) { chips.appendChild(h('li', { text: t })); });
var tabs = [['overview', 'Overview'], ['lecture', 'Lecture'], ['lab', 'Lab'], ['quiz', 'Quiz']];
var tl = document.getElementById('tablist');
tabs.forEach(function (t) {
  var b = h('button', { role: 'tab', id: 'tab-' + t[0], 'aria-controls': 'panel-' + t[0], 'aria-selected': 'false', text: t[1] });
  b.addEventListener('click', function () { show(t[0]); });
  tl.appendChild(b);
});
function show(name) {
  tabs.forEach(function (t) {
    document.getElementById('panel-' + t[0]).hidden = (t[0] !== name);
    document.getElementById('tab-' + t[0]).setAttribute('aria-selected', t[0] === name ? 'true' : 'false');
  });
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
  window.scrollTo(0, 0);
  document.querySelectorAll('#panel-' + name + ' textarea.code').forEach(function (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 4, 640) + 'px'; });
}
renderOverview(); renderLecture(); renderLab(); renderQuiz();
var start = (location.hash || '').replace('#', '');
show(tabs.some(function (t) { return t[0] === start; }) ? start : 'overview');
})();
</script>
