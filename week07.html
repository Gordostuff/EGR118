<head>

<title>Python for Engineers Week 7 Files, CSV Data, and Exceptions: Cleaning a Sensor File</title>

<style>
:root{
  --bg:#f6f5f0; --card:#ffffff; --ink:#1a1f24; --mute:#59636e; --line:#d9d6cb;
  --accent:#0a5aa0; --accent-ink:#ffffff; --accent-soft:#e4eef8;
  --ok:#17692f; --ok-bg:#e5f3e9; --bad:#a82217; --bad-bg:#fcebe8; --warn:#8a5a00; --warn-bg:#fdf3dc;
  --code-bg:#f0eee6; --out-bg:#e6edf6; --out-ink:#0a2a66;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151a; --card:#192028; --ink:#e7ebef; --mute:#9aa6b2; --line:#2c3641;
    --accent:#5eaeea; --accent-ink:#0b1219; --accent-soft:#17283a;
    --ok:#6fd08c; --ok-bg:#15301f; --bad:#ff8a7d; --bad-bg:#3a1b18; --warn:#f0c060; --warn-bg:#33290f;
    --code-bg:#10161c; --out-bg:#e6edf6; --out-ink:#0a2a66;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:50}
header.top{padding:28px 0 12px}
.kicker{font-size:13px;color:var(--mute);letter-spacing:.02em;margin:0 0 4px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.2;margin:0 0 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:13px;border:1px solid var(--line);background:var(--card);padding:2px 10px;border-radius:999px;color:var(--mute)}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--mute);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.statusbar{position:sticky;top:46px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:6px 12px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.statusbar .grow{flex:1}
main{padding:16px 0 80px}
.panel[hidden]{display:none}
h2{font-size:22px;margin:24px 0 8px;font-weight:600}
h3{font-size:18px;margin:0 0 6px;font-weight:600}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:22px}
li{margin:2px 0}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
.card .meta{font-size:13px;color:var(--mute);margin:0 0 8px}
.hook{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .big{font-size:24px;font-weight:600;font-family:var(--mono)}
.tile .lbl{font-size:13px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.bar>span{display:block;height:100%;background:var(--accent);width:0}
button.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.cell{margin:12px 0}
textarea.code{display:block;width:100%;font-family:var(--mono);font-size:14px;line-height:1.5;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;resize:vertical;tab-size:4;white-space:pre;overflow:auto;min-height:60px}
.stdin{margin-top:6px}
.stdin label{font-size:13px;color:var(--mute);display:block}
textarea.stdin-box{width:100%;font-family:var(--mono);font-size:13px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:48px}
.out{margin-top:8px}
pre.stdout{margin:0;background:var(--out-bg);color:var(--out-ink);font-family:var(--mono);font-size:13.5px;padding:10px 12px;border-radius:6px;border:1px solid #b9c8dc;overflow:auto;white-space:pre-wrap;word-break:break-word}
.err{margin-top:8px;border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:8px 12px;font-size:14px}
.err pre{margin:4px 0 0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;color:inherit}
.out img{max-width:100%;height:auto;background:#fff;border-radius:6px;margin-top:8px;border:1px solid var(--line)}
.tests{list-style:none;margin:8px 0 0;padding:0}
.tests li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.badge{font-family:var(--mono);font-size:12px;font-weight:500;padding:1px 8px;border-radius:4px;flex:none}
.badge.pass{background:var(--ok-bg);color:var(--ok)}
.badge.fail{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.hint{margin:8px 0;padding:8px 12px;background:var(--warn-bg);color:var(--ink);border-radius:6px;font-size:14px;border:1px solid var(--line)}
.q{margin:0 0 6px;font-weight:500}
.q p{margin:0 0 8px}
.q pre,.card pre{background:var(--code-bg);padding:8px 12px;border-radius:6px;overflow:auto;font-family:var(--mono);font-size:13.5px;font-weight:400;margin:0 0 10px}
.q pre code,.card pre code{background:none;padding:0}
.opts{list-style:none;padding:0;margin:0}
.opts button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:var(--ok-bg)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opts button:disabled{cursor:default}
.why{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:6px;background:var(--accent-soft)}
.checkq{margin:14px 0 4px;padding:12px;border:1px dashed var(--line);border-radius:8px}
.done-row{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.field input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-width:240px}
textarea.report{width:100%;min-height:200px;font-family:var(--mono);font-size:12.5px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px}
table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code-bg)}
.small{font-size:13px;color:var(--mute)}
@media (max-width:600px){ .field input{min-width:0;width:100%} .statusbar{top:44px} }
</style>

<script id="data" type="application/json">{"course_id": "pyeng", "course_title": "Python for Engineers", "pyodide_base": "https://cdn.jsdelivr.net/pyodide/v0.27.8/full/", "num": 7, "title": "Files, CSV Data, and Exceptions: Cleaning a Sensor File", "hook": "Data loggers, lab instruments, and test stands write their results to files, usually as comma-separated values (CSV). A script that handles a million good rows will stop on the first row that contains <code>N/A<\/code> unless you plan for it. This week you read and write files, parse CSV data, and handle errors without crashing, so one bad line does not cost you the whole test run.", "objectives": ["open, read, and write text files with <code>with open(...)<\/code>", "parse CSV lines with <code>split<\/code> and with the <code>csv<\/code> module", "catch errors with <code>try<\/code> and <code>except<\/code> and name the error you expect", "write a parser that records bad lines instead of stopping", "write a summary file from cleaned data"], "summary": "<ul><li><code>with open(name, mode) as f:<\/code> closes the file automatically. Modes: <code>\"r\"<\/code>, <code>\"w\"<\/code> (erases), <code>\"a\"<\/code> (appends).<\/li><li><code>f.read()<\/code> gives one string, <code>f.read().splitlines()<\/code> gives a list of lines, and <code>for line in f<\/code> walks them. Use <code>strip()<\/code> to remove the line break.<\/li><li><code>line.split(\",\")<\/code> gives text fields. Convert with <code>float<\/code> or <code>int<\/code>. <code>csv.DictReader<\/code> gives each row as a dictionary.<\/li><li><code>try<\/code> / <code>except SpecificError<\/code> handles an expected problem. <code>else<\/code> runs when none occurred. <code>finally<\/code> always runs.<\/li><li>Keep the <code>try<\/code> block short. Catch a named exception. Decide what happens next.<\/li><li>A defensive parser tries each field, records the bad lines, and keeps going. Report what you skipped.<\/li><li>Flag values such as -999 convert to numbers. Test for them by name.<\/li><li><code>os.path.exists<\/code> checks for a file. <code>os.remove<\/code> deletes one.<\/li><\/ul>", "lecture": [{"title": "Data lives in files", "minutes": 10, "html": "<p>A <strong>text file<\/strong> holds characters. A <strong>CSV file<\/strong> is a text file where each line is one record and commas separate the fields. The first line is often a <strong>header<\/strong> that names the columns.<\/p>\n<p>In this course, your Python session has its own small file storage. Files you write in one cell stay available to later cells in the same session. The cell below creates a sample CSV file you will reuse.<\/p>", "cells": [{"code": "data = \"\"\"time_s,sensor,value\n0,T1,21.5\n1,T1,21.7\n2,T1,N/A\n3,T1,22.0\n4,T1,-999\n5,T1,22.4\n\"\"\"\nwith open(\"sensor_data.csv\", \"w\") as f:\n    f.write(data)\nprint(\"Wrote\", len(data.splitlines()), \"lines\")\n", "stdin": null, "note": "Mode <code>\"w\"<\/code> creates the file or replaces an existing one."}]}, {"title": "Reading and writing text files", "minutes": 20, "html": "<p>Use <code>with open(name, mode) as f:<\/code> so Python closes the file for you. Common modes:<\/p>\n<ul><li><code>\"r\"<\/code> read (the default)<\/li><li><code>\"w\"<\/code> write, erasing any existing content<\/li><li><code>\"a\"<\/code> append to the end<\/li><\/ul>\n<p>Ways to read: <code>f.read()<\/code> returns the whole file as one string, <code>f.readlines()<\/code> returns a list of lines, and a <code>for<\/code> loop over <code>f<\/code> gives one line at a time. Each line ends with <code>\\n<\/code>. Use <code>strip()<\/code> to remove it.<\/p>", "cells": [{"code": "with open(\"log.txt\", \"w\") as f:\n    f.write(\"start\\n\")\n    f.write(\"running\\n\")\nwith open(\"log.txt\", \"a\") as f:\n    f.write(\"done\\n\")\n\nwith open(\"log.txt\") as f:\n    text = f.read()\nprint(text)\nprint(text.splitlines())\n", "stdin": null, "note": null}, {"code": "with open(\"log.txt\") as f:\n    for line in f:\n        print(line.strip().upper())\n", "stdin": null, "note": null}], "check": {"q": "What does opening a file with mode <code>\"w\"<\/code> do to an existing file?", "options": ["Raises an error", "Opens it read-only", "Erases its content and starts empty", "Appends to the end"], "answer": 2, "why": "Use <code>\"a\"<\/code> to add to a file and <code>\"w\"<\/code> only when you want to replace it."}}, {"title": "Parsing CSV lines", "minutes": 15, "html": "<p>For simple files, <code>line.split(\",\")<\/code> cuts a line into fields. Fields are strings, so convert numbers with <code>float<\/code> or <code>int<\/code>. The <code>csv<\/code> module handles quoted fields and other details; <code>csv.DictReader<\/code> gives each row as a dictionary keyed by the header names.<\/p>", "cells": [{"code": "with open(\"sensor_data.csv\") as f:\n    lines = f.read().splitlines()\nheader = lines[0].split(\",\")\nprint(header)\nfirst = lines[1].split(\",\")\nprint(first, float(first[2]) + 1)\n", "stdin": null, "note": null}, {"code": "import csv\nwith open(\"sensor_data.csv\") as f:\n    rows = list(csv.DictReader(f))\nprint(len(rows))\nprint(rows[0][\"sensor\"], rows[0][\"value\"])\n", "stdin": null, "note": "DictReader turns every field into a string."}], "check": {"q": "What type is <code>first[2]<\/code> after <code>first = line.split(\",\")<\/code>?", "options": ["<code>str<\/code>", "<code>int<\/code>", "<code>float<\/code>", "<code>list<\/code>"], "answer": 0, "why": "<code>split<\/code> returns text. Convert with <code>float()<\/code> or <code>int()<\/code> before math."}}, {"title": "Exceptions: try and except", "minutes": 20, "html": "<p>When Python cannot continue, it raises an <strong>exception<\/strong> such as <code>ValueError<\/code>, <code>ZeroDivisionError<\/code>, <code>KeyError<\/code>, or <code>FileNotFoundError<\/code>. Without handling, the program stops. A <code>try<\/code> block runs risky code, and an <code>except<\/code> block runs only if the named exception occurs.<\/p>\n<p>Rules that keep exception handling useful:<\/p>\n<ol><li>Catch the <strong>specific<\/strong> error you expect (<code>except ValueError<\/code>), not every error.<\/li><li>Keep the <code>try<\/code> block short.<\/li><li>Decide what the program does next: use a default, skip the item, or report.<\/li><\/ol>\n<p><code>else<\/code> runs when no exception happened. <code>finally<\/code> runs either way, which is useful for cleanup. You can raise your own error with <code>raise ValueError(\"message\")<\/code>.<\/p>", "cells": [{"code": "try:\n    value = float(\"abc\")\nexcept ValueError:\n    print(\"Not a number\")\n", "stdin": null, "note": null}, {"code": "def safe_divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None\n\nprint(safe_divide(10, 4), safe_divide(1, 0))\n", "stdin": null, "note": null}, {"code": "try:\n    with open(\"missing.txt\") as f:\n        text = f.read()\nexcept FileNotFoundError:\n    print(\"File not found\")\nelse:\n    print(\"Read ok\")\nfinally:\n    print(\"Done trying\")\n", "stdin": null, "note": null}, {"code": "def set_pressure(kpa):\n    if kpa < 0:\n        raise ValueError(\"Pressure cannot be negative\")\n    return kpa\n\nset_pressure(-5)\n", "stdin": null, "note": "An exception on purpose. Read the message that your own code produced."}], "check": {"q": "Why catch <code>ValueError<\/code> and not every possible error?", "options": ["<code>ValueError<\/code> runs faster", "Python only allows one except clause", "Catching everything can hide real bugs", "Other errors cannot be caught"], "answer": 2, "why": "A broad <code>except<\/code> swallows typos and logic errors. Catch the error you expect and decide what to do about it."}}, {"title": "Defensive parsing", "minutes": 15, "html": "<p>A parser for real data expects trouble: blank lines, <code>N/A<\/code>, missing fields, flags like <code>-999<\/code>, and text where a number belongs. The pattern is to try the conversion, record the line if it fails, and keep going. A function that returns <code>None<\/code> for a bad field keeps the main loop short.<\/p>\n<p>Count and report what you skipped. Silent data loss is worse than an error.<\/p>", "cells": [{"code": "def to_float(text):\n    try:\n        return float(text)\n    except ValueError:\n        return None\n\nfor sample in [\"21.5\", \"N/A\", \"\", \" 4.2 \", \"-999\"]:\n    print(repr(sample), to_float(sample))\n", "stdin": null, "note": "<code>float<\/code> accepts surrounding spaces. The flag <code>-999<\/code> converts fine and needs its own check."}], "check": {"q": "<code>float(\"-999\")<\/code> returns -999.0 without an error. How should the parser treat it?", "options": ["Check for it explicitly because it is a flag value", "Ignore it; it is a valid number", "Convert it to zero", "The conversion error will catch it"], "answer": 0, "why": "Flag values look like numbers. Your code must name them and decide what to do."}}, {"title": "Writing results", "minutes": 15, "html": "<p>Write results with <code>f.write(text)<\/code> or with <code>csv.writer<\/code>. A <code>write<\/code> call does not add a line break, so end each line with <code>\"\\n\"<\/code>. Pass <code>newline=\"\"<\/code> when you open a CSV file for the <code>csv<\/code> module so lines do not double up on some systems.<\/p>", "cells": [{"code": "import csv\nrows = [(\"sensor\", \"mean\"), (\"T1\", 21.5), (\"T2\", 19.0)]\nwith open(\"report.csv\", \"w\", newline=\"\") as f:\n    writer = csv.writer(f)\n    writer.writerows(rows)\nwith open(\"report.csv\") as f:\n    print(f.read())\n", "stdin": null, "note": null}]}, {"title": "Checking and removing files", "minutes": 10, "html": "<p><code>os.path.exists(path)<\/code> tells you whether a file exists. <code>os.remove(path)<\/code> deletes a file. Checking first avoids a <code>FileNotFoundError<\/code>, and catching the exception avoids the race between checking and opening. Either approach works; choose the one that reads clearly.<\/p>", "cells": [{"code": "import os\nprint(os.path.exists(\"log.txt\"))\nos.remove(\"log.txt\")\nprint(os.path.exists(\"log.txt\"))\n", "stdin": null, "note": null}], "check": {"q": "Which call tells you whether <code>data.csv<\/code> exists?", "options": ["<code>os.path.exists(\"data.csv\")<\/code>", "<code>os.remove(\"data.csv\")<\/code>", "<code>open(\"data.csv\", \"x\")<\/code>", "<code>exists(\"data.csv\")<\/code> without an import"], "answer": 0, "why": "<code>os.path.exists<\/code> returns True or False. <code>os.remove<\/code> deletes the file."}}, {"title": "Putting it together: clean a sensor file", "minutes": 25, "html": "<p>This program reads <code>sensor_data.csv<\/code>, converts each value, skips and records bad lines, and writes a cleaned file with a summary. It uses every tool from this week. Read it, predict the summary, and run it. Then open the cleaned output and check that the bad lines are gone.<\/p>", "cells": [{"code": "def to_float(text):\n    try:\n        value = float(text)\n    except ValueError:\n        return None\n    if value == -999:\n        return None\n    return value\n\ngood = []\nbad_lines = []\nwith open(\"sensor_data.csv\") as f:\n    lines = f.read().splitlines()\nfor number, line in enumerate(lines[1:], start=2):\n    parts = line.split(\",\")\n    value = to_float(parts[2]) if len(parts) > 2 else None\n    if value is None:\n        bad_lines.append(number)\n    else:\n        good.append((parts[0], value))\n\nwith open(\"clean.csv\", \"w\") as f:\n    f.write(\"time_s,value\\n\")\n    for t, v in good:\n        f.write(f\"{t},{v}\\n\")\n\nprint(\"Good rows:\", len(good))\nprint(\"Bad line numbers:\", bad_lines)\nprint(\"Mean:\", round(sum(v for _, v in good) / len(good), 2))\n", "stdin": null, "note": null}]}], "lecture_minutes": 130, "lab": {"summary": "A sensor file cleaner: read a file, parse CSV, convert safely, record bad lines, write a summary, and handle a missing file.", "intro_html": "<p>Each task starts with code that creates a small file for you. Leave that setup code in place. Your code goes below it and reads the file the setup code wrote. The checks run your code from a fresh start, so each task must work without help from other tasks.<\/p>\n<p>Line numbers in this lab start at 1, and the header is line 1.<\/p>", "tasks": [{"id": "t1", "title": "Read lines from a file", "points": 15, "minutes": 20, "bonus": false, "prompt_html": "<p>Read <code>data1.txt<\/code> with a <code>with<\/code> block. Store the lines without their line breaks in <code>lines<\/code> (a list) and the number of lines in <code>line_count<\/code>.<\/p>", "starter": "# Setup code: creates the file. Leave it in place.\nwith open(\"data1.txt\", \"w\") as f:\n    f.write(\"alpha\\nbeta\\ngamma\\n\")\n\n# Your code below\nlines = ...\nline_count = ...\n\nprint(lines, line_count)\n", "hint_html": "<p><code>with open(\"data1.txt\") as f:<\/code> then <code>lines = f.read().splitlines()<\/code>. <code>splitlines()<\/code> removes the line breaks.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["lines list", "lines == ['alpha', 'beta', 'gamma']", "Use splitlines() so no \\n remains."], ["line_count is 3", "line_count == 3", "Use len(lines)."], ["uses a with block", "uses_node(src, 'With')", "Open the file with a with block."]]}}, {"id": "t2", "title": "Parse numbers from a CSV file", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p><code>readings.csv<\/code> has a header line and numeric data in the second column. Read the file, skip the header, and build <code>values<\/code>, a list of floats from the second column. Also compute <code>mean<\/code>.<\/p>", "starter": "# Setup code: creates the file. Leave it in place.\nwith open(\"readings.csv\", \"w\") as f:\n    f.write(\"time_s,temp_c\\n0,20.5\\n1,21.0\\n2,19.8\\n3,22.3\\n\")\n\n# Your code below\nvalues = []\nmean = ...\n\nprint(values, mean)\n", "hint_html": "<p>Read the lines, loop over e file. Leave it in place.\nwith open(\"raw.csv\", \"w\") as f:\n    f.write(\"time_s,value\\n0,20.5\\n1,N/A\\n2,21.0\\n3,-999\\n4,abc\\n5,22.3\\n6,\\n7,23.1\\n\")\n\ndef to_float(text):\n    try:\n        return float(text)\n    except ValueError:\n        return None\n\ngood = []\nerrors = []\n\n# Your code below\n\nprint(good, errors)\n", "hint_html": "<p>Use <code>enumerate(lines[1:], start=2)<\/code> so the first data row is line 2. Treat <code>None<\/code> or <code>-999<\/code> as an error: record the line number and move on. Split each line and use <code>parts[1]<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["good values", "good == [20.5, 21.0, 22.3, 23.1]", "Keep only valid numbers and drop -999."], ["error line numbers", "errors == [3, 5, 6, 8]", "The header is line 1, so the first data row is line 2."], ["uses a loop and a function call", "uses_node(src, 'For') and calls_name(src, 'to_float')", "Loop over the data lines and call to_float for each value."]]}}, {"id": "t5", "title": "Write a summary file", "points": 20, "minutes": 25, "bonus": false, "prompt_html": "<p>Given <code>good<\/code> below, write <code>summary.txt<\/code> with exactly three lines:<\/p>\n<pre><code>count: 4\nmean: 21.7\nmax: 23.1<\/code><\/pre>\n<p>The mean uses one decimal. Then read the file back and store its lines in <code>written<\/code>.<\/p>", "starter": "good = [20.5, 21.0, 22.3, 23.1]\n\n# Write summary.txt here\n\nwritten = ...\n\nprint(written)\n", "hint_html": "<p>Open <code>summary.txt<\/code> with mode <code>\"w\"<\/code>. Write each line with an f-string and <code>\\n<\/code> at the end. Reopen in read mode and use <code>splitlines()<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["file has the three lines", "open('summary.txt').read().splitlines() == ['count: 4', 'mean: 21.7', 'max: 23.1']", "Write count, mean (one decimal), and max, one per line."], ["written holds the lines", "written == ['count: 4', 'mean: 21.7', 'max: 23.1']", "Read the file back with splitlines()."], ["uses good, not typed numbers", "line_has(src, 'written', 'open') or 'len(good)' in src", "Compute the values from the list good."]]}}, {"id": "t6", "title": "Read a file that might not exist", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Write <code>safe_read(path)<\/code>. It returns the full text of the file, or an empty string <code>\"\"<\/code> if the file does not exist. Handle the missing file with <code>try<\/code> and <code>except FileNotFoundError<\/code>.<\/p>", "starter": "def safe_read(path):\n    ...\n\nprint(repr(safe_read(\"no_such_file.txt\")))\n", "hint_html": "<p><code>try:<\/code> open the file inside a <code>with<\/code> block and return <code>f.read()<\/code>. <code>except FileNotFoundError:<\/code> return an empty string.<\/p>", "stdin": null, "tests": {"setup": "\nwith open(\"exists_test.txt\", \"w\") as _f:\n    _f.write(\"hello\\n\")\n", "items": [["missing file gives an empty string", "safe_read('definitely_missing_file.txt') == ''", "Catch FileNotFoundError and return an empty string."], ["existing file returns its text", "safe_read('exists_test.txt') == 'hello\\n'", "Return f.read() when the file opens."], ["uses try and except", "uses_node(src, 'Try')", "Use try and except FileNotFoundError."]]}}, {"id": "b1", "title": "Total per sensor with csv.DictReader", "points": 10, "minutes": 20, "bonus": true, "prompt_html": "<p><code>sensors.csv<\/code> has columns <code>sensor<\/code> and <code>value<\/code>. Use <code>csv.DictReader<\/code> to build <code>totals<\/code>, a dictionary of the sum of values for each sensor.<\/p>", "starter": "import csv\n\n# Setup code: creates the file. Leave it in place.\nwith open(\"sensors.csv\", \"w\") as f:\n    f.write(\"sensor,value\\nA,1.5\\nB,2.0\\nA,2.5\\nB,1.0\\nC,4.0\\n\")\n\ntotals = {}\n\n# Your code below\n\nprint(totals)\n", "hint_html": "<p><code>with open(\"sensors.csv\") as f:<\/code> then <code>for row in csv.DictReader(f):<\/code>. Convert <code>row[\"value\"]<\/code> with <code>float<\/code> and add it to <code>totals.get(row[\"sensor\"], 0)<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["totals per sensor", "totals == {'A': 4.0, 'B': 3.0, 'C': 4.0}", "Add the float value to the sensor's running total."], ["uses csv.DictReader", "calls_name(src, 'DictReader')", "Use csv.DictReader."]]}}]}, "lab_minutes": 150, "quiz": [{"q": "Which mode erases an existing file when you open it?", "options": ["<code>\"a\"<\/code>", "<code>\"rb\"<\/code>", "<code>\"r\"<\/code>", "<code>\"w\"<\/code>"], "answer": 3, "why": "Mode <code>\"w\"<\/code> truncates the file. Mode <code>\"a\"<\/code> adds to the end."}, {"q": "What does <code>f.read().splitlines()<\/code> return?", "options": ["A list of lines without line breaks", "The number of lines", "A tuple of characters", "One long string"], "answer": 0, "why": "<code>splitlines<\/code> cuts the text at each line break and drops the break characters."}, {"q": "What type does <code>\"21.5,T1\".split(\",\")[0]<\/code> produce?", "options": ["<code>int<\/code>", "<code>str<\/code>", "<code>list<\/code>", "<code>float<\/code>"], "answer": 1, "why": "Fields from <code>split<\/code> are always text, so convert with <code>float<\/code> before math."}, {"q": "What does <code>float(\"abc\")<\/code> do?", "options": ["Returns the text <code>abc<\/code>", "Returns 0", "Raises a <code>ValueError<\/code>", "Returns <code>None<\/code>"], "answer": 2, "why": "Python cannot convert text that does not look like a number."}, {"q": "What does <code>int(\"12\") + 3<\/code> return?", "options": ["12 + 3", "123", "An error", "15"], "answer": 3, "why": "<code>int(\"12\")<\/code> is 12, so the sum is 15."}, {"q": "When does an <code>else<\/code> block after <code>try<\/code> / <code>except<\/code> run?", "options": ["When no exception occurred", "Always", "When an exception occurred", "Never"], "answer": 0, "why": "<code>else<\/code> runs only if the <code>try<\/code> block finished without raising."}, {"q": "<pre><code>try:\n    x = 1 / 0\nexcept ZeroDivisionError:\n    x = -1<\/code><\/pre>\n<p>What is <code>x<\/code>?<\/p>", "options": ["An error", "-1", "1", "0"], "answer": 1, "why": "The division raises <code>ZeroDivisionError<\/code>, and the <code>except<\/code> block sets <code>x<\/code> to -1."}, {"q": "Why use <code>with open(...) as f:<\/code>?", "options": ["It makes the file read-only", "It sorts the lines", "Python closes the file for you", "It is required for numbers"], "answer": 2, "why": "The <code>with<\/code> statement closes the file at the end of the block, even if an error happens."}, {"q": "Which exception does <code>open(\"nofile.txt\")<\/code> raise when the file is missing?", "options": ["<code>ZeroDivisionError<\/code>", "<code>KeyError<\/code>", "<code>ValueError<\/code>", "<code>FileNotFoundError<\/code>"], "answer": 3, "why": "The error name states the problem: the file was not found."}, {"q": "What is a risk of writing <code>except:<\/code> with no error name?", "options": ["It can hide bugs that have nothing to do with the data", "It makes the program slower", "Python refuses to run it", "It only works for files"], "answer": 0, "why": "A broad handler swallows every problem, including typos. Name the exception you expect."}, {"q": "A file uses <code>-999<\/code> for missing readings. What should a parser do?", "options": ["Stop the program", "Check for that value by name and skip or flag it", "Convert it to zero", "Treat it as a normal reading"], "answer": 1, "why": "Flag values convert to numbers without an error, so the code must test for them directly."}, {"q": "<code>line.split(\",\")<\/code> gives <code>['0', 'T1', '21.5']<\/code>. Which expression gets the number 21.5 as a float?", "options": ["<code>int(parts[2])<\/code>", "<code>parts[2]<\/code>", "<code>float(parts[2])<\/code>", "<code>float(parts[3])<\/code>"], "answer": 2, "why": "Index 2 is the third field and <code>float<\/code> converts the text. Index 3 does not exist."}], "quiz_minutes": 18, "quiz_intro_html": "<p>Answer each question. You see the explanation right after you choose. You can reset the quiz and try again.<\/p>"}</script>
<script id="harness" type="text/x-python">import sys, io, os, json, ast, base64, builtins, traceback, contextlib, math, random

os.environ.setdefault("MPLBACKEND", "Agg")
import importlib
if "" not in sys.path:
    sys.path.insert(0, "")

_OUT_CAP = 20000
_LECTURE_NS = {"__name__": "__main__"}


class _Capped(io.StringIO):
    def write(self, s):
        if self.tell() > _OUT_CAP:
            raise RuntimeError("Output limit reached. Your code printed too much text.")
        return super().write(s)


def approx(a, b, rel=1e-6, abs_=1e-9):
    try:
        if "numpy" in sys.modules:
            import numpy as _np
            if isinstance(a, _np.ndarray) or isinstance(b, _np.ndarray):
                return bool(_np.allclose(a, b, rtol=rel, atol=abs_))
        if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
            return len(a) == len(b) and all(approx(x, y, rel, abs_) for x, y in zip(a, b))
        return abs(float(a) - float(b)) <= max(abs_, rel * abs(float(b)))
    except Exception:
        return False


def uses_node(src, *names):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    wanted = tuple(getattr(ast, n) for n in names)
    return any(isinstance(n, wanted) for n in ast.walk(tree))


def calls_name(src, name):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    for n in ast.walk(tree):
        if isinstance(n, ast.Call):
            f = n.func
            if isinstance(f, ast.Name) and f.id == name:
                return True
            if isinstance(f, ast.Attribute) and f.attr == name:
                return True
    return False


def line_has(src, target, *words):
    """True when an assignment to `target` has every word on its right side."""
    for line in src.splitlines():
        s = line.strip()
        if s.startswith("#") or "=" not in s:
            continue
        left, _, right = s.partition("=")
        if left.strip() == target and all(w in right for w in words):
            return True
    return False


def run_with(src, inputs=(), ns=None):
    """Run student source with scripted input() values; return what it printed."""
    queue = list(inputs)
    old = builtins.input

    def _fake(prompt=""):
        print(prompt, end="")
        if not queue:
            raise EOFError("input() called more times than expected")
        v = queue.pop(0)
        print(v)
        return v

    buf = io.StringIO()
    builtins.input = _fake
    try:
        with contextlib.redirect_stdout(buf):
            exec(compile(src, "<your code>", "exec"), ns if ns is not None else {"__name__": "__main__"})
    finally:
        builtins.input = old
    return buf.getvalue()


def rerun(src, **over):
    """Execute student source again with top-level assignments replaced by the given constants.
    Returns the resulting namespace. Output is discarded."""
    tree = ast.parse(src)
    for node in tree.body:
        if (isinstance(node, ast.Assign) and len(node.targets) == 1
                and isinstance(node.targets[0], ast.Name) and node.targets[0].id in over):
            node.value = ast.Constant(over[node.targets[0].id])
    ast.fix_missing_locations(tree)
    ns = {"__name__": "__main__"}
    with contextlib.redirect_stdout(io.StringIO()):
        exec(compile(tree, "<your code>", "exec"), ns)
    return ns


def count_defs(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.FunctionDef) for n in ast.walk(tree))


def count_classes(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.ClassDef) for n in ast.walk(tree))


def _format_error(exc, code):
    lines = code.split("\n")
    if isinstance(exc, SyntaxError):
        ln = exc.lineno
        msg = "SyntaxError: " + str(exc.msg)
        if ln and 1 <= ln <= len(lines):
            msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
        return msg
    tb = traceback.TracebackException.from_exception(exc)
    ln = None
    for fs in tb.stack:
        if fs.filename == "<your code>":
            ln = fs.lineno
    msg = "".join(tb.format_exception_only()).strip()
    if ln and 1 <= ln <= len(lines):
        msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
    return msg


def _make_input(stdin_lines, out):
    queue = list(stdin_lines)

    def _input(prompt=""):
        out.write(str(prompt))
        if not queue:
            raise EOFError("input() ran out of lines. Type one value per line in the Input box under the code.")
        val = queue.pop(0)
        out.write(val + "\n")
        return val

    return _input


def _exec_code(code, ns, out):
    tree = ast.parse(code, "<your code>", "exec")
    last = None
    if tree.body and isinstance(tree.body[-1], ast.Expr):
        last = ast.Expression(tree.body.pop().value)
    exec(compile(tree, "<your code>", "exec"), ns)
    if last is not None:
        val = eval(compile(last, "<your code>", "eval"), ns)
        if val is not None:
            out.write(repr(val) + "\n")


def _collect_images():
    imgs = []
    if "matplotlib.pyplot" in sys.modules:
        import matplotlib.pyplot as plt
        for num in plt.get_fignums():
            fig = plt.figure(num)
            buf = io.BytesIO()
            fig.savefig(buf, format="png", dpi=100, bbox_inches="tight")
            imgs.append(base64.b64encode(buf.getvalue()).decode("ascii"))
        plt.close("all")
    return imgs


def reset_lecture():
    _LECTURE_NS.clear()
    _LECTURE_NS["__name__"] = "__main__"


def run_cell(req_json):
    req = json.loads(req_json)
    code = req.get("code", "")
    mode = req.get("mode", "fresh")
    stdin_lines = req.get("stdin") or []
    tests = req.get("tests")
    ns = _LECTURE_NS if mode == "lecture" else {"__name__": "__main__"}
    importlib.invalidate_caches()
    out = _Capped()
    err = None
    real_input = builtins.input
    builtins.input = _make_input(stdin_lines, out)
    try:
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
            try:
                random.seed()
                _exec_code(code, ns, out)
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                err = _format_error(exc, code)
    finally:
        builtins.input = real_input
    result = {"stdout": out.getvalue(), "error": err, "images": [], "tests": None}
    try:
        result["images"] = _collect_images()
    except Exception as exc:
        result["stdout"] += "\n(Plot could not be drawn: %s)" % exc
    if tests is not None:
        result["tests"] = _run_tests(tests, ns, code, err, out.getvalue())
    return json.dumps(result)


def _run_tests(tests, ns, code, err, stdout_text):
    items = tests.get("items", [])
    results = []
    if err is not None:
        for label, _expr, hint in items:
            results.append({"label": label, "ok": False, "msg": "Fix the error above first."})
        return results
    env = ns
    helpers = {
        "approx": approx, "out": stdout_text, "src": code, "ast": ast,
        "uses_node": uses_node, "calls_name": calls_name,
        "count_defs": count_defs, "run_with": run_with, "rerun": rerun, "count_classes": count_classes, "line_has": line_has,
        "math": math, "random": random, "io": io, "_in_tests": True,
    }
    _missing = object()
    saved = {k: env.get(k, _missing) for k in helpers}
    env.update(helpers)
    sink = _Capped()
    try:
        setup = tests.get("setup")
        if setup:
            try:
                with contextlib.redirect_stdout(sink):
                    exec(compile(setup, "<tests>", "exec"), env)
            except BaseException as exc:
                reason = "Could not run the checks: %s: %s" % (type(exc).__name__, exc)
                return [{"label": l, "ok": False, "msg": reason} for l, _e, _h in items]
        for label, expr, hint in items:
            try:
                with contextlib.redirect_stdout(sink):
                    ok = bool(eval(compile(expr, "<tests>", "eval"), env))
                results.append({"label": label, "ok": ok, "msg": "" if ok else hint})
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                results.append({"label": label, "ok": False,
                                "msg": "%s (%s: %s)" % (hint, type(exc).__name__, exc)})
    finally:
        for k, v in saved.items():
            if v is _missing:
                env.pop(k, None)
            else:
                env[k] = v

</script>

let py = null;

  const m = e.data;

      py = await loadPyodide({ indexURL: m.base });

  }

    try {

      const quiet = { messageCallback: function () {}, errorCallback: function () {} };
      await py.loadPackagesFromImports(m.code, quiet);

var mem = null;

/* ---------- dom helpers ---------- */

/* ---------- python runner ---------- */
var Py = (function () {
  var worker = null, ready = false, current = null, queue = [], timer = null, nextId = 1;
  var stopBtn = document.getElementById('stopbtn');
  var statusEl = document.getElementById('pystatus');
  function status(t) { statusEl.textContent = t; }
  function start() {
    var blob = new Blob([WORKER_SRC], { type: 'text/javascript' });
    worker = new Worker(URL.createObjectURL(blob));
    ready = false;
    worker.onmessage = onMsg;
    worker.onerror = function (e) { finish(failure('The Python worker crashed: ' + (e.message || 'unknown error'))); };
    worker.postMessage({ type: 'init', harness: HARNESS, base: D.pyodide_base });

    }

  }
  function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } stopBtn.hidden = true; }
  function armTimer() {
    clearTimer(); stopBtn.hidden = false;
    var secs = (current && current.req.timeout) || 20;
    timer = setTimeout(function () {
      kill();
      finish(failure('Stopped after ' + secs + ' seconds. Look for a loop that never ends. Python restarted, so run earlier cells again.', current && current.req));
      start();
    }, secs * 1000);
  }
  function finish(result) {
    var c = current; current = null; clearTimer();
    if (c) { c.resolve(result); }
    status(ready ? 'Python ready' : 'Python restarting...');
    pump();
  }
  function onMsg(e) {
    var m = e.data;
    if (m.type === 'ready') { ready = true; status('Python ready'); pump(); }
    else if (m.type === 'initerror') {

      var q = queue.slice(); queue = [];
      if (current) { q.unshift(current); current = null; }
      q.forEach(function (c) { c.resolve(failure('Python could not start. It needs an internet connection to load. Reload the page and try again. Details: ' + m.message, c.req)); });
    }

    else if (m.type === 'result') { finish(m.result); }
    else if (m.type === 'error') { finish(failure('Python error: ' + m.message, current && current.req)); }

    current = queue.shift();

  }
  stopBtn.addEventListener('click', function () {
    if (!current) { return; }
    kill();
    finish(failure('Stopped. Python restarted, so run earlier cells again.', current.req));
    start();
  });

    run: function (req) {
      return new Promise(function (resolve) {
        queue.push({ id: nextId++, req: req, resolve: resolve });
        if (!worker) { start(); } else { pump(); }
      });
    },
    reset: function () { if (worker && ready) { worker.postMessage({ type: 'reset' }); } }
  };
})();

    var r = S.lab[t.id];
    L.push('==== ' + (t.bonus ? 'Bonus' : 'Task ' + (i + 1)) + ': ' + t.title + ' (' + (r ? r.passed + '/' + r.total + ' tests' : 'not checked') + ') ====');
    L.push(S.code['lab_' + t.id] !== undefined ? S.code['lab_' + t.id] : t.starter);
    L.push('');
  });
  return L.join('\n');
}

/* ---------- quiz ---------- */
function updateQuiz() {
  var q = quizTally();
  var el = document.getElementById('quizscore');
  if (el) { el.textContent = q.correct + ' correct of ' + q.answered + ' answered, ' + q.total + ' questions'; }
  tiles.quiz.textContent = q.correct + '/' + q.total;
}
function renderQuiz() {
  var p = document.getElementById('panel-quiz');
  p.innerHTML = '';
  p.appendChild(h('div', { class: 'card', html: D.quiz_intro_html }));
  p.appendChild(h('div', { class: 'row' }, [
    h('strong', { text: 'Score: ' }), h('span', { id: 'quizscore', class: 'badge info' }),
    h('span', { style: 'flex:1' }),
    h('button', { class: 'btn', text: 'Reset quiz', onclick: function () {
      if (!confirm('Clear all quiz answers?')) { return; } S.quiz = {}; save(); renderQuiz();
    } })
  ]));
  D.quiz.forEach(function (q, i) {
    var card = h('div', { class: 'card' });
    card.appendChild(h('p', { class: 'meta', text: 'Question ' + (i + 1) + ' of ' + D.quiz.length }));
    card.appendChild(mcq({ cls: 'qbox', q: q.q, options: q.options, answer: q.answer, why: q.why, saved: S.quiz[i], onAnswer: function (k) { S.quiz[i] = k; save(); updateQuiz(); } }));
    p.appendChild(card);
  });
  updateQuiz();
}

/* ---------- shell ---------- */
document.getElementById('kicker').textContent = D.course_title + ', Week ' + D.num;
document.getElementById('title').textContent = D.title;
document.title = D.course_title + ' Week ' + D.num + ' ' + D.title;
var chips = document.getElementById('chips');
[D.lecture_minutes + ' min lecture', D.lab_minutes + ' min lab', D.quiz.length + ' quiz questions'].forEach(function (t) { chips.appendChild(h('li', { text: t })); });
var tabs = [['overview', 'Overview'], ['lecture', 'Lecture'], ['lab', 'Lab'], ['quiz', 'Quiz']];
var tl = document.getElementById('tablist');
tabs.forEach(function (t) {
  var b = h('button', { role: 'tab', id: 'tab-' + t[0], 'aria-controls': 'panel-' + t[0], 'aria-selected': 'false', text: t[1] });
  b.addEventListener('click', function () { show(t[0]); });
  tl.appendChild(b);
});
function show(name) {
  tabs.forEach(function (t) {
    document.getElementById('panel-' + t[0]).hidden = (t[0] !== name);
    document.getElementById('tab-' + t[0]).setAttribute('aria-selected', t[0] === name ? 'true' : 'false');
  });
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
  window.scrollTo(0, 0);
  document.querySelectorAll('#panel-' + name + ' textarea.code').forEach(function (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 4, 640) + 'px'; });
}
renderOverview(); renderLecture(); renderLab(); renderQuiz();
var start = (location.hash || '').replace('#', '');
show(tabs.some(function (t) { return t[0] === start; }) ? start : 'overview');
})();
</script>
