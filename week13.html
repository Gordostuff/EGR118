<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python for Engineers Week 13 Simulation and Monte Carlo: Engineering with Uncertainty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f0; --card:#ffffff; --ink:#1a1f24; --mute:#59636e; --line:#d9d6cb;
  --accent:#0a5aa0; --accent-ink:#ffffff; --accent-soft:#e4eef8;
  --ok:#17692f; --ok-bg:#e5f3e9; --bad:#a82217; --bad-bg:#fcebe8; --warn:#8a5a00; --warn-bg:#fdf3dc;
  --code-bg:#f0eee6; --out-bg:#e6edf6; --out-ink:#0a2a66;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151a; --card:#192028; --ink:#e7ebef; --mute:#9aa6b2; --line:#2c3641;
    --accent:#5eaeea; --accent-ink:#0b1219; --accent-soft:#17283a;
    --ok:#6fd08c; --ok-bg:#15301f; --bad:#ff8a7d; --bad-bg:#3a1b18; --warn:#f0c060; --warn-bg:#33290f;
    --code-bg:#10161c; --out-bg:#e6edf6; --out-ink:#0a2a66;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:50}
header.top{padding:28px 0 12px}
.kicker{font-size:13px;color:var(--mute);letter-spacing:.02em;margin:0 0 4px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.2;margin:0 0 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:13px;border:1px solid var(--line);background:var(--card);padding:2px 10px;border-radius:999px;color:var(--mute)}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--mute);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.statusbar{position:sticky;top:46px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:6px 12px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.statusbar .grow{flex:1}
main{padding:16px 0 80px}
.panel[hidden]{display:none}
h2{font-size:22px;margin:24px 0 8px;font-weight:600}
h3{font-size:18px;margin:0 0 6px;font-weight:600}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:22px}
li{margin:2px 0}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
.card .meta{font-size:13px;color:var(--mute);margin:0 0 8px}
.hook{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .big{font-size:24px;font-weight:600;font-family:var(--mono)}
.tile .lbl{font-size:13px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.bar>span{display:block;height:100%;background:var(--accent);width:0}
button.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.cell{margin:12px 0}
textarea.code{display:block;width:100%;font-family:var(--mono);font-size:14px;line-height:1.5;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;resize:vertical;tab-size:4;white-space:pre;overflow:auto;min-height:60px}
.stdin{margin-top:6px}
.stdin label{font-size:13px;color:var(--mute);display:block}
textarea.stdin-box{width:100%;font-family:var(--mono);font-size:13px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:48px}
.out{margin-top:8px}
pre.stdout{margin:0;background:var(--out-bg);color:var(--out-ink);font-family:var(--mono);font-size:13.5px;padding:10px 12px;border-radius:6px;border:1px solid #b9c8dc;overflow:auto;white-space:pre-wrap;word-break:break-word}
.err{margin-top:8px;border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:8px 12px;font-size:14px}
.err pre{margin:4px 0 0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;color:inherit}
.out img{max-width:100%;height:auto;background:#fff;border-radius:6px;margin-top:8px;border:1px solid var(--line)}
.tests{list-style:none;margin:8px 0 0;padding:0}
.tests li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.badge{font-family:var(--mono);font-size:12px;font-weight:500;padding:1px 8px;border-radius:4px;flex:none}
.badge.pass{background:var(--ok-bg);color:var(--ok)}
.badge.fail{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.hint{margin:8px 0;padding:8px 12px;background:var(--warn-bg);color:var(--ink);border-radius:6px;font-size:14px;border:1px solid var(--line)}
.q{margin:0 0 6px;font-weight:500}
.q p{margin:0 0 8px}
.q pre,.card pre{background:var(--code-bg);padding:8px 12px;border-radius:6px;overflow:auto;font-family:var(--mono);font-size:13.5px;font-weight:400;margin:0 0 10px}
.q pre code,.card pre code{background:none;padding:0}
.opts{list-style:none;padding:0;margin:0}
.opts button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:var(--ok-bg)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opts button:disabled{cursor:default}
.why{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:6px;background:var(--accent-soft)}
.checkq{margin:14px 0 4px;padding:12px;border:1px dashed var(--line);border-radius:8px}
.done-row{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.field input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-width:240px}
textarea.report{width:100%;min-height:200px;font-family:var(--mono);font-size:12.5px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px}
table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code-bg)}
.small{font-size:13px;color:var(--mute)}
@media (max-width:600px){ .field input{min-width:0;width:100%} .statusbar{top:44px} }
</style>
</head>

<script id="data" type="application/json">{"course_id": "pyeng", "course_title": "Python for Engineers", "pyodide_base": "https://cdn.jsdelivr.net/pyodide/v0.27.8/full/", "num": 13, "title": "Simulation and Monte Carlo: Engineering with Uncertainty", "hook": "Real parts are never exact. A 10 kohm resistor sold at 5 percent tolerance can be 9.5 kohm or 10.5 kohm, and your circuit must work anyway. Instead of guessing the worst case, you can build 100,000 virtual circuits in under a second and count how many meet the spec. This week you use random numbers for tolerance and reliability studies, and you simulate a cooling object one small time step at a time.", "objectives": ["generate seeded random numbers with <code>np.random.default_rng<\/code>", "estimate probabilities by repeating a random experiment many times", "run a tolerance analysis and compare it with the worst case", "simulate a first-order system with Euler time steps", "see how step size and sample count change the error", "estimate reliability for a single part and a parallel pair"], "summary": "<ul><li><code>rng = np.random.default_rng(seed)<\/code> gives repeatable random numbers. Use <code>random<\/code>, <code>uniform<\/code>, <code>normal<\/code>, <code>integers<\/code>, <code>exponential<\/code>.<\/li><li>Monte Carlo estimates a probability as the mean of a Boolean array over many trials. Error falls like <code>1 / sqrt(N)<\/code>.<\/li><li>Tolerance study: sample each part value, compute the output, count the fraction within spec. Compare with the worst case.<\/li><li>Euler's method: <code>new = old + rate * dt<\/code>. Smaller <code>dt<\/code> gives lower error. Too large a step can make the answer unstable.<\/li><li>Parallel parts: system life is the maximum of the lifetimes. A series system uses the minimum.<\/li><li>Always compare a simulation with a known answer when one exists, and report the sample count and the seed.<\/li><\/ul>", "lecture": [{"title": "Random numbers and seeds", "minutes": 15, "html": "<p>Computers generate <strong>pseudo-random<\/strong> numbers from a formula. Create a generator with <code>rng = np.random.default_rng(seed)<\/code>. The same seed always gives the same sequence, which makes a simulation repeatable so you can debug it and compare runs.<\/p>\n<p>Useful calls: <code>rng.random(n)<\/code> for n numbers between 0 and 1, <code>rng.uniform(low, high, n)<\/code>, <code>rng.normal(mean, std, n)<\/code>, and <code>rng.integers(low, high, n)<\/code> (the high end is excluded).<\/p>", "cells": [{"code": "import numpy as np\nimport math\n\nrng = np.random.default_rng(42)\nprint(rng.random(3).round(3))\nrng = np.random.default_rng(42)\nprint(rng.random(3).round(3))\n", "stdin": null, "note": "Two generators with the same seed produce identical numbers."}, {"code": "rng = np.random.default_rng(1)\nrolls = rng.integers(1, 7, 10)\nprint(rolls.min() >= 1, rolls.max() <= 6)\n", "stdin": null, "note": "<code>integers(1, 7)<\/code> gives 1 through 6."}], "check": {"q": "Why set a seed when running a simulation?", "options": ["To make the program faster", "To keep the numbers between 0 and 1", "So the same random numbers appear every run and results can be reproduced", "To make the numbers more random"], "answer": 2, "why": "A seed fixes the sequence. That makes debugging and comparison possible."}}, {"title": "Estimating probability by counting", "minutes": 20, "html": "<p>The <strong>Monte Carlo<\/strong> method estimates a probability by running the random experiment many times and counting how often the event occurs. The mean of a Boolean array is the fraction of True values, which is exactly the estimate.<\/p>\n<p>Flip a fair coin 10,000 times: the fraction of heads should be near 0.5. Run it with more flips and the estimate settles down. The typical error shrinks like <code>1 / sqrt(N)<\/code>, so 100 times more samples gives 10 times less error.<\/p>", "cells": [{"code": "rng = np.random.default_rng(42)\nheads = rng.random(10000) < 0.5\nprint(round(heads.mean(), 2))\n", "stdin": null, "note": null}, {"code": "for n in [10, 100, 1000, 100000]:\n    est = (rng.random(n) < 0.5).mean()\n    print(n, round(abs(est - 0.5), 4))\n", "stdin": null, "note": "The error generally falls as n grows, but it does not fall every time. Rerun with a different seed to see that."}], "check": {"q": "You estimated a probability with 1,000 samples. About how many samples cut the typical error to one tenth?", "options": ["100,000", "10,000", "2,000", "1,000,000"], "answer": 0, "why": "Error scales as one over the square root of the sample count. A tenfold smaller error needs 100 times more samples."}}, {"title": "Estimating pi", "minutes": 15, "html": "<p>Drop random points in the unit square. The quarter circle of radius 1 covers pi/4 of the square, so the fraction of points with <code>x<strong>2 + y<\/strong>2 &lt;= 1<\/code> approaches pi/4. Multiply by 4 for pi.<\/p>\n<p>This is a standard test for a simulation: the answer is known, so you can measure the error.<\/p>", "cells": [{"code": "n = 200000\nx = rng.random(n)\ny = rng.random(n)\ninside = x ** 2 + y ** 2 <= 1\npi_est = 4 * inside.mean()\nprint(round(pi_est, 2))\nprint(abs(pi_est - math.pi) < 0.02)\n", "stdin": null, "note": "Expect about two correct digits with 200,000 points. Your estimate will differ slightly from pi, 3.14159."}], "check": {"q": "Why multiply the fraction of points inside the quarter circle by 4?", "options": ["To make the error smaller", "There are 4 random numbers per point", "The quarter circle covers pi/4 of the unit square", "To convert degrees to radians"], "answer": 2, "why": "Area of the quarter circle is pi/4. Inverting that ratio gives pi."}}, {"title": "Tolerance analysis: a voltage divider", "minutes": 25, "html": "<p>A divider of two 10 kohm resistors on a 5 V supply should output 2.5 V. Each resistor has a 5 percent tolerance. The <strong>worst case<\/strong> puts one resistor at its low limit and the other at its high limit. A Monte Carlo run asks a different question: for random parts, how often is the output within spec?<\/p>\n<p>Model each resistor as uniform between 9.5 and 10.5 kohm. Compute the output for 100,000 random pairs. The spec is 2.4 V to 2.6 V.<\/p>", "cells": [{"code": "rng = np.random.default_rng(1)\nN = 100000\nr1 = 10000 * rng.uniform(0.95, 1.05, N)\nr2 = 10000 * rng.uniform(0.95, 1.05, N)\nv = 5 * r2 / (r1 + r2)\n\nin_spec = (v >= 2.4) & (v <= 2.6)\nprint(round(v.mean(), 2), round(v.std(), 2), round(in_spec.mean(), 2))\n\nworst_low = 5 * 9500 / (9500 + 10500)\nworst_high = 5 * 10500 / (10500 + 9500)\nprint(worst_low, worst_high)\n", "stdin": null, "note": "The worst case falls outside the spec. Random parts rarely hit it, so about 96 percent pass."}], "check": {"q": "What is the main benefit of a Monte Carlo tolerance study compared with worst-case analysis?", "options": ["It estimates how often the design meets spec, not only the extreme limits", "It guarantees every unit passes", "It is always more accurate", "It needs no assumptions"], "answer": 0, "why": "Worst case shows the extremes. Monte Carlo shows how likely each outcome is, given your assumed part distributions."}}, {"title": "Time stepping: Newton's law of cooling", "minutes": 20, "html": "<p>Many systems follow <code>dT/dt = -k * (T - T_ambient)<\/code>. A computer solves them in small steps: the temperature change in one step is the rate times the step size <code>dt<\/code>. This is <strong>Euler's method<\/strong>:<\/p>\n<p><code>T[i] = T[i-1] + dt * (-k * (T[i-1] - T_ambient))<\/code><\/p>\n<p>A coffee at 90 C in a 20 C room with <code>k = 0.1<\/code> per second cools along <code>T = 20 + 70 * exp(-0.1 * t)<\/code>. Compare the simulation to that exact curve.<\/p>", "cells": [{"code": "k, Tamb, T0, dt = 0.1, 20.0, 90.0, 1.0\nt = np.arange(0, 31, dt)\nT = np.empty_like(t)\nT[0] = T0\nfor i in range(1, len(t)):\n    T[i] = T[i - 1] + dt * (-k * (T[i - 1] - Tamb))\n\nexact = Tamb + (T0 - Tamb) * np.exp(-k * t)\nprint(round(T[-1], 2), round(exact[-1], 2))\nprint(\"First time at or below 40 C:\", t[T <= 40][0], \"s\")\n", "stdin": null, "note": "Euler is slightly too low at 30 s. Smaller steps help."}, {"code": "import matplotlib.pyplot as plt\n\nfig, ax = plt.subplots()\nax.plot(t, exact, label=\"exact\")\nax.plot(t, T, \"--\", label=\"Euler, dt = 1 s\")\nax.set_xlabel(\"Time (s)\")\nax.set_ylabel(\"Temperature (C)\")\nax.legend()\nax.grid(True)\n", "stdin": null, "note": "The dashed line sits below the exact curve."}], "check": {"q": "In Euler's method, how do you get the next value?", "options": ["Multiply the current value by the step size", "Solve the equation exactly at the next time", "Add the rate of change times the step size to the current value", "Take the average of all earlier values"], "answer": 2, "why": "Euler follows the slope for one short step: new = old + rate * dt."}}, {"title": "Step size and accuracy", "minutes": 15, "html": "<p>Smaller steps give more accuracy but more work. For Euler the error shrinks roughly in proportion to the step size. Run the same cooling model with four step sizes and compare the final value at 30 s to the exact answer 23.49 C.<\/p>\n<p>For some systems, steps that are too large do worse than inaccurate: the answer oscillates or blows up. With <code>k * dt &gt; 2<\/code> Euler becomes unstable on this model.<\/p>", "cells": [{"code": "def cool(T0, Tamb, k, dt, t_end):\n    t = np.arange(0, t_end + dt / 2, dt)\n    T = np.empty_like(t)\n    T[0] = T0\n    for i in range(1, len(t)):\n        T[i] = T[i - 1] + dt * (-k * (T[i - 1] - Tamb))\n    return t, T\n\nfor dt in [5, 2, 0.5, 0.1]:\n    t, T = cool(90, 20, 0.1, dt, 30)\n    print(dt, round(T[-1], 2))\nprint(\"exact\", round(20 + 70 * math.exp(-3), 2))\n", "stdin": null, "note": null}], "check": {"q": "What usually happens to Euler's error when you cut the step size in half?", "options": ["It falls by about half", "It doubles", "It stays the same", "It falls to zero"], "answer": 0, "why": "Euler is a first-order method: the error is proportional to the step size."}}, {"title": "Random failure and reliability", "minutes": 20, "html": "<p>Electronic parts often fail at random with an <strong>exponential<\/strong> lifetime: <code>rng.exponential(mean_life, n)<\/code>. For a mean life of 1000 hours, the chance a part lasts past 1000 hours is <code>exp(-1)<\/code>, about 37 percent.<\/p>\n<p>Two identical parts in <strong>parallel<\/strong> work as long as at least one survives, so the system lifetime is the larger of the two. Simulate both and compare with the exact result <code>1 - (1 - exp(-1))**2<\/code>.<\/p>", "cells": [{"code": "rng = np.random.default_rng(5)\nN = 100000\nlife1 = rng.exponential(1000, N)\nlife2 = rng.exponential(1000, N)\n\nsingle = (life1 > 1000).mean()\nparallel = (np.maximum(life1, life2) > 1000).mean()\nprint(round(single, 2), round(parallel, 2))\nprint(round(math.exp(-1), 2), round(1 - (1 - math.exp(-1)) ** 2, 2))\n", "stdin": null, "note": "A second part raises the one-thousand-hour survival from 37 percent to about 60 percent."}], "check": {"q": "For two parts in parallel, how do you get the system lifetime in each trial?", "options": ["Take the smaller of the two lifetimes", "Average the two lifetimes", "Take the larger of the two lifetimes", "Add the two lifetimes"], "answer": 2, "why": "A parallel system works until both parts have failed, so it lasts as long as the longer-lived part."}}], "lecture_minutes": 130, "lab": {"summary": "Dice probabilities, pi by Monte Carlo, a divider tolerance study, an Euler cooling function, a moving-average filter, and a parallel reliability estimate.", "intro_html": "<p>Each task uses a fixed seed so results are repeatable. The checks accept a small range around the expected answer because a simulation is an estimate. If your estimate is just outside the range, check that you used the seed and sample count given in the task.<\/p>\n<p>Use <code>rng = np.random.  a mask on T and take the first time."], ["error is negative", "final_error < 0 and approx(final_error, 22.96738 - 23.48509, rel=1e-3)", "Euler lands below the exact value here."], ["smaller step is closer", "abs(cool(90, 20, 0.1, 0.1, 30)[1][-1] - (20 + 70 * math.exp(-3))) < 0.2", "The function must use dt, not a fixed step."]]}}, {"id": "t5", "title": "Moving-average filter", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Write <code>moving_avg(x, n)<\/code> that returns the average of each run of <code>n<\/code> consecutive values, using <code>np.convolve(x, np.ones(n) / n, mode=\"valid\")<\/code>. Apply it with <code>n = 5<\/code> to the noisy signal in the starter. Store <code>noise_before<\/code> (the standard deviation of <code>noisy - clean<\/code>) and <code>noise_after<\/code> (the standard deviation of <code>smooth - clean[2:-2]<\/code>).<\/p>", "starter": "import numpy as np\n\ndef moving_avg(x, n):\n    ...\n\nrng = np.random.default_rng(3)\ntt = np.linspace(0, 1, 200)\nclean = np.sin(2 * np.pi * 2 * tt)\nnoisy = clean + rng.normal(0, 0.3, 200)\n\nsmooth = ...\nnoise_before = ...\nnoise_after = ...\n\nprint(noise_before, noise_after)\n", "hint_html": "<p><code>np.convolve(x, np.ones(n) / n, mode=\"valid\")<\/code> has length <code>len(x) - n + 1<\/code>. For n = 5 the first average is centered at index 2, so compare with <code>clean[2:-2]<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import numpy as np\nimport math", "items": [["simple average", "approx(moving_avg([1, 2, 3, 4, 5], 3), [2, 3, 4])", "Average each run of 3 consecutive values."], ["length of result", "len(moving_avg(list(range(10)), 4)) == 7", "Use mode='valid': len(x) - n + 1."], ["smooth has 196 points", "len(smooth) == 196", "Apply moving_avg(noisy, 5)."], ["noise before is about 0.3", "0.25 < noise_before < 0.35", "Standard deviation of noisy - clean."], ["filtering reduces noise", "noise_after < 0.6 * noise_before", "Compare smooth with clean[2:-2]."]]}}, {"id": "t6", "title": "Parallel reliability", "points": 20, "minutes": 25, "bonus": false, "prompt_html": "<p>With <code>rng = np.random.default_rng(5)<\/code> and <code>N = 100000<\/code>, draw <code>life1<\/code> and then <code>life2<\/code> from <code>rng.exponential(1000, N)<\/code>. Store <code>p_single<\/code> (the fraction of <code>life1<\/code> greater than 1000 hours), <code>p_parallel<\/code> (the fraction of trials where the larger lifetime exceeds 1000), <code>p_series<\/code> (the fraction where the smaller lifetime exceeds 1000), and the exact values <code>exact_single<\/code> and <code>exact_parallel<\/code> from the formulas in the lecture.<\/p>", "starter": "import numpy as np\nimport math\n\nN = 100000\nrng = np.random.default_rng(5)\n\nlife1 = ...\nlife2 = ...\n\np_single = ...\np_parallel = ...\np_series = ...\nexact_single = ...\nexact_parallel = ...\n\nprint(p_single, p_parallel, p_series)\n", "hint_html": "<p><code>np.maximum(life1, life2)<\/code> is the parallel lifetime and <code>np.minimum(life1, life2)<\/code> the series lifetime. Exact values: <code>math.exp(-1)<\/code> and <code>1 - (1 - math.exp(-1)) ** 2<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import numpy as np\nimport math", "items": [["single part near 37 percent", "abs(p_single - math.exp(-1)) < 0.01", "p_single = (life1 > 1000).mean()"], ["parallel near 60 percent", "abs(p_parallel - 0.6004) < 0.01", "Use np.maximum for parallel."], ["series near 13.5 percent", "abs(p_series - math.exp(-2)) < 0.01", "Use np.minimum for series."], ["exact single", "approx(exact_single, 0.367879441)", "math.exp(-1)"], ["exact parallel", "approx(exact_parallel, 0.600423, rel=1e-5)", "1 - (1 - math.exp(-1)) ** 2"], ["ordering", "p_series < p_single < p_parallel", "Parallel is more reliable than a single part, series is less."]]}}, {"id": "b1", "title": "Random walk", "points": 10, "minutes": 20, "bonus": true, "prompt_html": "<p>Write <code>walk_rms(steps, trials, seed)<\/code>. Each trial takes <code>steps<\/code> steps of +1 or -1 chosen by <code>rng.integers(0, 2, (trials, steps)) * 2 - 1<\/code>. Return the root mean square of the final positions (the square root of the mean of the squared final positions). The theory says it equals the square root of <code>steps<\/code>.<\/p>", "starter": "import numpy as np\n\ndef walk_rms(steps, trials, seed):\n    ...\n\nprint(walk_rms(100, 20000, 1))\n", "hint_html": "<p>Sum each row with <code>.sum(axis=1)<\/code> to get final positions. Then <code>np.sqrt(np.mean(final ** 2))<\/code>.<\/p>", "stdin": null, "tests": {"setup": "import numpy as np\nimport math", "items": [["about 10 for 100 steps", "approx(walk_rms(100, 20000, 1), 10.0, rel=0.05)", "The RMS distance grows like sqrt(steps)."], ["about 20 for 400 steps", "approx(walk_rms(400, 20000, 2), 20.0, rel=0.05)", "Four times the steps doubles the distance."]]}}]}, "lab_minutes": 150, "quiz": [{"q": "What does the seed in <code>np.random.default_rng(seed)<\/code> control?", "options": ["How fast it runs", "Which sequence of random numbers the generator produces", "How many numbers it produces", "The range of the numbers"], "answer": 1, "why": "The same seed always gives the same sequence."}, {"q": "You want a fair die roll. Which call is correct?", "options": ["<code>rng.integers(0, 6)<\/code>", "<code>rng.random(6)<\/code>", "<code>rng.integers(1, 7)<\/code>", "<code>rng.integers(1, 6)<\/code>"], "answer": 2, "why": "The upper limit of <code>integers<\/code> is excluded, so 7 is needed to include 6."}, {"q": "In a Monte Carlo estimate, what does the mean of a Boolean array give?", "options": ["The largest True index", "The number of trials", "The sum of the values", "The fraction of trials where the event happened"], "answer": 3, "why": "True counts as 1 and False as 0, so the mean is the fraction of True values."}, {"q": "A simulation with 10,000 samples has an error near 0.01. About what error do you expect with 1,000,000 samples?", "options": ["0.001", "0.01", "0.0001", "0.005"], "answer": 0, "why": "Error scales as one over the square root of N. A hundredfold increase in N cuts the error by 10."}, {"q": "Why can a Monte Carlo result differ slightly from the exact answer?", "options": ["Random numbers cannot be used in science", "It is an estimate from a finite number of random samples", "The computer rounds incorrectly", "The seed was wrong"], "answer": 1, "why": "Sampling noise is expected. More samples reduce it."}, {"q": "A resistor is 10 kohm with 5 percent tolerance. What range does a uniform model use?", "options": ["5 to 15 kohm", "9.95 to 10.05 kohm", "9.5 to 10.5 kohm", "9 to 11 kohm"], "answer": 2, "why": "5 percent of 10 kohm is 0.5 kohm either side."}, {"q": "How does worst-case analysis differ from Monte Carlo analysis?", "options": ["They always give the same answer", "Worst case uses random numbers", "Monte Carlo checks only the extremes", "Worst case checks the extreme limits, and Monte Carlo estimates how often each outcome occurs"], "answer": 3, "why": "Worst case is a bound. Monte Carlo is a probability estimate."}, {"q": "Euler's method updates a quantity with which rule?", "options": ["new = old + rate * dt", "new = old - old", "new = old * dt", "new = rate / dt"], "answer": 0, "why": "Follow the current rate of change for one time step."}, {"q": "You halve the step size in an Euler simulation. What do you expect?", "options": ["A different physical answer", "Lower error and twice as many steps", "No change in error", "Higher error and half as many steps"], "answer": 1, "why": "Euler error shrinks with the step size, and the run needs more steps."}, {"q": "Newton's law of cooling is <code>dT/dt = -k (T - Tamb)<\/code>. What does the object temperature approach?", "options": ["Infinity", "Zero", "The ambient temperature", "The starting temperature"], "answer": 2, "why": "The rate becomes zero when T equals Tamb."}, {"q": "Two parts are in parallel and the system works if at least one part works. Whi <script id="harness" type="text/x-python">import sys, io, os, json, ast, base64, builtins, traceback, contextlib, math, random

os.environ.setdefault("MPLBACKEND", "Agg")
import importlib
if "" not in sys.path:
    sys.path.insert(0, "")

_OUT_CAP = 20000
_LECTURE_NS = {"__name__": "__main__"}


class _Capped(io.StringIO):
    def write(self, s):
        if self.tell() > _OUT_CAP:
            raise RuntimeError("Output limit reached. Your code printed too much text.")
        return super().write(s)


def approx(a, b, rel=1e-6, abs_=1e-9):
    try:
        if "numpy" in sys.modules:
            import numpy as _np
            if isinstance(a, _np.ndarray) or isinstance(b, _np.ndarray):
                return bool(_np.allclose(a, b, rtol=rel, atol=abs_))
        if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
            return len(a) == len(b) and all(approx(x, y, rel, abs_) for x, y in zip(a, b))
        return abs(float(a) - float(b)) <= max(abs_, rel * abs(float(b)))
    except Exception:
        return False


def uses_node(src, *names):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    wanted = tuple(getattr(ast, n) for n in names)
    return any(isinstance(n, wanted) for n in ast.walk(tree))


def calls_name(src, name):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    for n in ast.walk(tree):
        if isinstance(n, ast.Call):
            f = n.func
            if isinstance(f, ast.Name) and f.id == name:
                return True
            if isinstance(f, ast.Attribute) and f.attr == name:
                return True
    return False


def line_has(src, target, *words):
    """True when an assignment to `target` has every word on its right side."""
    for line in src.splitlines():
        s = line.strip()
        if s.startswith("#") or "=" not in s:
            continue
        left, _, right = s.partition("=")
        if left.strip() == target and all(w in right for w in words):
            return True
    return False


def run_with(src, inputs=(), ns=None):
    """Run student source with scripted input() values; return what it printed."""
    queue = list(inputs)
    old = builtins.input

    def _fake(prompt=""):
        print(prompt, end="")
        if not queue:
            raise EOFError("input() called more times than expected")
        v = queue.pop(0)
        print(v)
        return v

    buf = io.StringIO()
    builtins.input = _fake
    try:
        with contextlib.redirect_stdout(buf):
            exec(compile(src, "<your code>", "exec"), ns if ns is not None else {"__name__": "__main__"})
    finally:
        builtins.input = old
    return buf.getvalue()


def rerun(src, **over):
    """Execute student source again with top-level assignments replaced by the given constants.
    Returns the resulting namespace. Output is discarded."""
    tree = ast.parse(src)
    for node in tree.body:
        if (isinstance(node, ast.Assign) and len(node.targets) == 1
                and isinstance(node.targets[0], ast.Name) and node.targets[0].id in over):
            node.value = ast.Constant(over[node.targets[0].id])
    ast.fix_missing_locations(tree)
    ns = {"__name__": "__main__"}
    with contextlib.redirect_stdout(io.StringIO()):
        exec(compile(tree, "<your code>", "exec"), ns)
    return ns


def count_defs(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.FunctionDef) for n in ast.walk(tree))


def count_classes(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.ClassDef) for n in ast.walk(tree))


def _format_error(exc, code):
    lines = code.split("\n")
    if isinstance(exc, SyntaxError):
        ln = exc.lineno
        msg = "SyntaxError: " + str(exc.msg)
        if ln and 1 <= ln <= len(lines):
            msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
        return msg
    tb = traceback.TracebackException.from_exception(exc)
    ln = None
    for fs in tb.stack:
        if fs.filename == "<your code>":
            ln = fs.lineno
    msg = "".join(tb.format_exception_only()).strip()
    if ln and 1 <= ln <= len(lines):
        msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
    return msg


def _make_input(stdin_lines, out):
    queue = list(stdin_lines)

    def _input(prompt=""):
        out.write(str(prompt))
        if not queue:
            raise EOFError("input() ran out of lines. Type one value per line in the Input box under the code.")
        val = queue.pop(0)
        out.write(val + "\n")
        return val

    return _input


def _exec_code(code, ns, out):
    tree = ast.parse(code, "<your code>", "exec")
    last = None
    if tree.body and isinstance(tree.body[-1], ast.Expr):
        last = ast.Expression(tree.body.pop().value)
    exec(compile(tree, "<your code>", "exec"), ns)
    if last is not None:

def _collect_images():
    imgs = []
    if "matplotlib.pyplot" in sys.modules:
        import matplotlib.pyplot as plt
        for num in plt.get_fignums():
            fig = plt.figure(num)
            buf = io.BytesIO()
            fig.savefig(buf, format="png", dpi=100, bbox_inches="tight")
            imgs.append(base64.b64encode(buf.getvalue()).decode("ascii"))
        plt.close("all")
    return imgs


def reset_lecture():
    _LECTURE_NS.clear()
    _LECTURE_NS["__name__"] = "__main__"


def run_cell(req_json):
    req = json.loads(req_json)
    code = req.get("code", "")
    mode = req.get("mode", "fresh")
    stdin_lines = req.get("stdin") or []
    tests = req.get("tests")
    ns = _LECTURE_NS if mode == "lecture" else {"__name__": "__main__"}
    importlib.invalidate_caches()
    out = _Capped()
    err = None
    real_input = builtins.input
    builtins.input = _make_input(stdin_lines, out)
    try:
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
            try:
                random.seed()
                _exec_code(code, ns, out)
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                err = _format_error(exc, code)
    finally:
        builtins.input = real_input
    result = {"stdout": out.getvalue(), "error": err, "images": [], "tests": None}
    try:
        result["images"] = _collect_images()
    except Exception as exc:
        result["stdout"] += "\n(Plot could not be drawn: %s)" % exc
    if tests is not None:
        result["tests"] = _run_tests(tests, ns, code, err, out.getvalue())
    return json.dumps(result)


def _run_tests(tests, ns, code, err, stdout_text):
    items = tests.get("items", [])
    results = []
    if err is not None:
        for label, _expr, hint in items:
            results.append({"label": label, "ok": False, "msg": "Fix the error above first."})
        return results
    env = ns
    helpers = {
        "approx": approx, "out": stdout_text, "src": code, "ast": ast,
        "uses_node": uses_node, "calls_name": calls_name,
        "count_defs": count_defs, "run_with": run_with, "rerun": rerun, "count_classes": count_classes, "line_has": line_has,
        "math": math, "random": random, "io": io, "_in_tests": True,
    }
    _missing = object()
    saved = {k: env.get(k, _missing) for k in helpers}
    env.update(helpers)
    sink = _Capped()
    try:
        setup = tests.get("setup")
        if setup:
            try:
                with contextlib.redirect_stdout(sink):
                    exec(compile(setup, "<tests>", "exec"), env)
            except BaseException as exc:
                reason = "Could not run the checks: %s: %s" % (type(exc).__name__, exc)
                return [{"label": l, "ok": False, "msg": reason} for l, _e, _h in items]
        for label, expr, hint in items:
            try:
                with contextlib.redirect_stdout(sink):
                    ok = bool(eval(compile(expr, "<tests>", "eval"), env))
                results.append({"label": label, "ok": ok, "msg": "" if ok else hint})
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                results.append({"label": label, "ok": False,
                                "msg": "%s (%s: %s)" % (hint, type(exc).__name__, exc)})
    finally:
        for k, v in saved.items():
            if v is _missing:
                env.pop(k, None)
            else:
                env[k] = v
    return results

  var nm = h('input', { type: 'text', id: 'stname', 'aria-label': 'Your name', placeholder: 'Your name', autocomplete: 'name' });
  nm.value = S.name;
  nm.addEventListener('input', function () { S.name = nm.value; save(); });
  rep.appendChild(h('div', { class: 'field' }, [h('label', { for: 'stname', text: 'Name' }), nm]));
  var ta = h('textarea', { class: 'report', readonly: '', 'aria-label': 'Report text' });
  var b1 = h('button', { class: 'btn primary', text: 'Build report', onclick: function () { ta.value = buildReport(); } });
  var b2 = h('button', { class: 'btn', text: 'Copy report', onclick: function () {
    ta.value = buildReport(); ta.select();
    var done = function () { b2.textContent = 'Copied'; setTimeout(function () { b2.textContent = 'Copy report'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(done, function () { try { document.execCommand('copy'); done(); } catch (e) {} }); }
    else { try { document.execCommand('copy'); done(); } catch (e) {} }
  } });
  var b3 = h('button', { class: 'btn', text: 'Download .txt', onclick: function () {
    var txt = buildReport(); ta.value = txt;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
    a.download = 'week' + D.num + '_report.txt'; document.body.appendChild(a); a.click(); a.remove();
  } });
  rep.appendChild(h('div', { class: 'row' }, [b1, b2, b3]));
  rep.appendChild(ta);
  p.appendChild(rep);
  updateLab();
}
function quizTally() {
  var correct = 0, answered = 0;
  D.quiz.forEach(function (q, i) { var a = S.quiz[i]; if (a !== undefined && a !== null) { answered++; if (a === q.answer) { correct++; } } });
  return { correct: correct, answered: answered, total: D.quiz.length };
}
function buildReport() {
  var L = [], s = labScore(), q = quizTally();
  var max = D.lab.tasks.filter(function (t) { return !t.bonus; }).reduce(function (a, t) { return a + t.points; }, 0);
  var lec = D.lecture.filter(function (_s, i) { return S.lecDone[i]; }).length;
  L.push('Course: ' + D.course_title);
  L.push('Week ' + D.num + ': ' + D.title);
  L.push('Name: ' + (S.name || '(not entered)'));
  L.push('Generated: ' + new Date().toLocaleString());
  L.push('');
  L.push('Lecture sections marked complete: ' + lec + ' of ' + D.lecture.length);
  L.push('Lab score (browser autograder): ' + s.score + ' of ' + max + (s.bonus ? ', bonus ' + s.bonus : ''));
  L.push('Quiz: ' + q.correct + ' correct, ' + q.answered + ' answered, ' + q.total + ' questions');
  L.push('');
  D.lab.tasks.forEach(function (t, i) {
    var r = S.lab[t.id];
    L.push('==== ' + (t.bonus ? 'Bonus' : 'Task ' + (i + 1)) + ': ' + t.title + ' (' + (r ? r.passed + '/' + r.total + ' tests' : 'not checked') + ') ====');
    L.push(S.code['lab_' + t.id] !== undefined ? S.code['lab_' + t.id] : t.starter);
    L.push('');
  });
  return L.join('\n');
}

/* ---------- quiz ---------- */
function updateQuiz() {
  var q = quizTally();
  var el = document.getElementById('quizscore');
  if (el) { el.textContent = q.correct + ' correct of ' + q.answered + ' answered, ' + q.total + ' questions'; }
  tiles.quiz.textContent = q.correct + '/' + q.total;
}
function renderQuiz() {
  var p = document.getElementById('panel-quiz');
  p.innerHTML = '';
  p.appendChild(h('div', { class: 'card', html: D.quiz_intro_html }));
  p.appendChild(h('div', { class: 'row' }, [
    h('strong', { text: 'Score: ' }), h('span', { id: 'quizscore', class: 'badge info' }),
    h('span', { style: 'flex:1' }),
    h('button', { class: 'btn', text: 'Reset quiz', onclick: function () {
      if (!confirm('Clear all quiz answers?')) { return; } S.quiz = {}; save(); renderQuiz();
    } })
  ]));
  D.quiz.forEach(function (q, i) {
    var card = h('div', { class: 'card' });
    card.appendChild(h('p', { class: 'meta', text: 'Question ' + (i + 1) + ' of ' + D.quiz.length }));
    card.appendChild(mcq({ cls: 'qbox', q: q.q, options: q.options, answer: q.answer, why: q.why, saved: S.quiz[i], onAnswer: function (k) { S.quiz[i] = k; save(); updateQuiz(); } }));
    p.appendChild(card);
  });
  updateQuiz();
}

/* ---------- shell ---------- */
document.getElementById('kicker').textContent = D.course_title + ', Week ' + D.num;
document.getElementById('title').textContent = D.title;
document.title = D.course_title + ' Week ' + D.num + ' ' + D.title;
var chips = document.getElementById('chips');
[D.lecture_minutes + ' min lecture', D.lab_minutes + ' min lab', D.quiz.length + ' quiz questions'].forEach(function (t) { chips.appendChild(h('li', { text: t })); });
var tabs = [['overview', 'Overview'], ['lecture', 'Lecture'], ['lab', 'Lab'], ['quiz', 'Quiz']];
var tl = document.getElementById('tablist');
tabs.forEach(function (t) {
  var b = h('button', { role: 'tab', id: 'tab-' + t[0], 'aria-controls': 'panel-' + t[0], 'aria-selected': 'false', text: t[1] });
  b.addEventListener('click', function () { show(t[0]); });
  tl.appendChild(b);
});
function show(name) {
  tabs.forEach(function (t) {
    document.getElementById('panel-' + t[0]).hidden = (t[0] !== name);
    document.getElementById('tab-' + t[0]).setAttribute('aria-selected', t[0] === name ? 'true' : 'false');
  });
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
  window.scrollTo(0, 0);
  document.querySelectorAll('#panel-' + name + ' textarea.code').forEach(function (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 4, 640) + 'px'; });
}
renderOverview(); renderLecture(); renderLab(); renderQuiz();
var start = (location.hash || '').replace('#', '');
show(tabs.some(function (t) { return t[0] === start; }) ? start : 'overview');
})();
</script>
