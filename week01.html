<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python for Engineers Week 1 Python Basics: Expressions, Variables, and Units</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f0; --card:#ffffff; --ink:#1a1f24; --mute:#59636e; --line:#d9d6cb;
  --accent:#0a5aa0; --accent-ink:#ffffff; --accent-soft:#e4eef8;
  --ok:#17692f; --ok-bg:#e5f3e9; --bad:#a82217; --bad-bg:#fcebe8; --warn:#8a5a00; --warn-bg:#fdf3dc;
  --code-bg:#f0eee6; --out-bg:#e6edf6; --out-ink:#0a2a66;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151a; --card:#192028; --ink:#e7ebef; --mute:#9aa6b2; --line:#2c3641;
    --accent:#5eaeea; --accent-ink:#0b1219; --accent-soft:#17283a;
    --ok:#6fd08c; --ok-bg:#15301f; --bad:#ff8a7d; --bad-bg:#3a1b18; --warn:#f0c060; --warn-bg:#33290f;
    --code-bg:#10161c; --out-bg:#e6edf6; --out-ink:#0a2a66;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;font-size:16px}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-999px}
.skip:focus{left:8px;top:8px;background:var(--card);padding:8px;z-index:50}
header.top{padding:28px 0 12px}
.kicker{font-size:13px;color:var(--mute);letter-spacing:.02em;margin:0 0 4px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.2;margin:0 0 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:13px;border:1px solid var(--line);background:var(--card);padding:2px 10px;border-radius:999px;color:var(--mute)}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;color:var(--mute);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.statusbar{position:sticky;top:46px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:6px 12px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.statusbar .grow{flex:1}
main{padding:16px 0 80px}
.panel[hidden]{display:none}
h2{font-size:22px;margin:24px 0 8px;font-weight:600}
h3{font-size:18px;margin:0 0 6px;font-weight:600}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:22px}
li{margin:2px 0}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:1px 5px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 16px}
.card .meta{font-size:13px;color:var(--mute);margin:0 0 8px}
.hook{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 16px;border-radius:0 8px 8px 0;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 16px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .big{font-size:24px;font-weight:600;font-family:var(--mono)}
.tile .lbl{font-size:13px;color:var(--mute)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.bar>span{display:block;height:100%;background:var(--accent);width:0}
button.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:6px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.cell{margin:12px 0}
textarea.code{display:block;width:100%;font-family:var(--mono);font-size:14px;line-height:1.5;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;resize:vertical;tab-size:4;white-space:pre;overflow:auto;min-height:60px}
.stdin{margin-top:6px}
.stdin label{font-size:13px;color:var(--mute);display:block}
textarea.stdin-box{width:100%;font-family:var(--mono);font-size:13px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:48px}
.out{margin-top:8px}
pre.stdout{margin:0;background:var(--out-bg);color:var(--out-ink);font-family:var(--mono);font-size:13.5px;padding:10px 12px;border-radius:6px;border:1px solid #b9c8dc;overflow:auto;white-space:pre-wrap;word-break:break-word}
.err{margin-top:8px;border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:8px 12px;font-size:14px}
.err pre{margin:4px 0 0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;color:inherit}
.out img{max-width:100%;height:auto;background:#fff;border-radius:6px;margin-top:8px;border:1px solid var(--line)}
.tests{list-style:none;margin:8px 0 0;padding:0}
.tests li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.badge{font-family:var(--mono);font-size:12px;font-weight:500;padding:1px 8px;border-radius:4px;flex:none}
.badge.pass{background:var(--ok-bg);color:var(--ok)}
.badge.fail{background:var(--bad-bg);color:var(--bad)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.hint{margin:8px 0;padding:8px 12px;background:var(--warn-bg);color:var(--ink);border-radius:6px;font-size:14px;border:1px solid var(--line)}
.q{margin:0 0 6px;font-weight:500}
.q p{margin:0 0 8px}
.q pre,.card pre{background:var(--code-bg);padding:8px 12px;border-radius:6px;overflow:auto;font-family:var(--mono);font-size:13.5px;font-weight:400;margin:0 0 10px}
.q pre code,.card pre code{background:none;padding:0}
.opts{list-style:none;padding:0;margin:0}
.opts button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:var(--ok-bg)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opts button:disabled{cursor:default}
.why{margin-top:8px;font-size:14px;padding:8px 12px;border-radius:6px;background:var(--accent-soft)}
.checkq{margin:14px 0 4px;padding:12px;border:1px dashed var(--line);border-radius:8px}
.done-row{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
.field{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.field input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-width:240px}
textarea.report{width:100%;min-height:200px;font-family:var(--mono);font-size:12.5px;background:var(--code-bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px}
table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code-bg)}
.small{font-size:13px;color:var(--mute)}
@media (max-width:600px){ .field input{min-width:0;width:100%} .statusbar{top:44px} }
</style>
</head>

<script id="data" type="application/json">{"course_id": "pyeng", "course_title": "Python for Engineers", "pyodide_base": "https://cdn.jsdelivr.net/pyodide/v0.27.8/full/", "num": 1, "title": "Python Basics: Expressions, Variables, and Units", "hook": "A 12 V battery pushes 2 A through a motor. You can find the power in your head. Now do it for 500 battery and motor pairings, then change the battery. A script finishes that job before you finish typing the question. This week you write your first scripts and build an Ohm's law and power calculator.", "objectives": ["run Python code in a cell and read the output", "use arithmetic operators, including <code>**<\/code>, <code>//<\/code>, and <code>%<\/code>, with correct precedence", "store values in variables with clear, readable names", "apply Ohm's law and the power equations in code", "use <code>import math<\/code> for square roots, pi, and trigonometry", "read a basic error message and find the line that caused it"], "summary": "<ul><li>Run code in cells; the last value prints automatically; use <code>print()<\/code> for several outputs.<\/li><li>Operators: <code>+ - * / ** // %<\/code>. Python follows algebra order of operations.<\/li><li><code>name = expression<\/code> evaluates the right side, then stores it. Use lowercase names with underscores and include units.<\/li><li>Ohm's law: <code>current = voltage / resistance<\/code>. Power: <code>voltage * current<\/code> or <code>current ** 2 * resistance<\/code>.<\/li><li>Floats carry about 16 digits. Write <code>1e-6<\/code> for a microunit. Compare floats with a tolerance and round when you print.<\/li><li><code>import math<\/code> gives <code>sqrt<\/code>, <code>pi<\/code>, <code>sin<\/code>, <code>radians<\/code>, and more. Trig functions use radians.<\/li><li>Read errors from the last line up. Fix NameError, SyntaxError, and ZeroDivisionError by checking spelling, punctuation, and values.<\/li><\/ul>", "lecture": [{"title": "Welcome and your first program", "minutes": 15, "html": "<p>Python is a programming language that engineers use for calculations, data analysis, automation, and testing. This course uses it as a calculator that remembers what you tell it and repeats work without complaint.<\/p>\n<p>Each gray box below is a <strong>code cell<\/strong>. You can edit the code and press <strong>Run cell<\/strong>. Python runs inside your browser, so there is nothing to install. The first run takes 10 to 30 seconds while Python loads.<\/p>\n<p>A program is a list of instructions that run from top to bottom. The <code>print()<\/code> function shows a value on screen. Text goes inside quotation marks.<\/p>", "cells": [{"code": "print(\"Hello, engineer\")\n", "stdin": null, "note": null}, {"code": "print(\"Voltage:\", 12)\nprint(\"Current:\", 2)\n", "stdin": null, "note": "<code>print<\/code> accepts several values separated by commas and puts a space between them."}], "check": {"q": "Which line shows the text <code>Ready<\/code> on screen?", "options": ["<code>say(\"Ready\")<\/code>", "<code>show Ready<\/code>", "<code>print(\"Ready\")<\/code>", "<code>print(Ready)<\/code>"], "answer": 2, "why": "<code>print<\/code> shows a value. Text needs quotation marks. Without them, Python looks for a variable named Ready."}}, {"title": "Python as a calculator", "minutes": 20, "html": "<p>Python follows the same order of operations you learned in algebra: parentheses first, then exponents, then multiplication and division, then addition and subtraction.<\/p>\n<table><thead><tr><th>Operator<\/th><th>Meaning<\/th><th>Example<\/th><th>Result<\/th><\/tr><\/thead><tbody><tr><td><code>+<\/code> <code>-<\/code><\/td><td>add, subtract<\/td><td><code>7 - 2<\/code><\/td><td>5<\/td><\/tr><tr><td><code>*<\/code><\/td><td>multiply<\/td><td><code>6 * 3<\/code><\/td><td>18<\/td><\/tr><tr><td><code>/<\/code><\/td><td>divide (always gives a decimal)<\/td><td><code>7 / 2<\/code><\/td><td>3.5<\/td><\/tr><tr><td><code>**<\/code><\/td><td>power<\/td><td><code>2 ** 10<\/code><\/td><td>1024<\/td><\/tr><tr><td><code>//<\/code><\/td><td>floor division (whole part)<\/td><td><code>7 // 2<\/code><\/td><td>3<\/td><\/tr><tr><td><code>%<\/code><\/td><td>remainder<\/td><td><code>7 % 2<\/code><\/td><td>1<\/td><\/tr><\/tbody><\/table>\n<p>The last value in a cell prints automatically, so you can type an expression alone to see its value.<\/p>", "cells": [{"code": "2 + 3 * 4 ** 2\n", "stdin": null, "note": "Predict the answer before you run it."}, {"code": "(2 + 3) * 4 ** 2\n", "stdin": null, "note": null}, {"code": "print(7 / 2)\nprint(7 // 2)\nprint(7 % 2)\n", "stdin": null, "note": null}, {"code": "print(1 / 3)\nprint(2 ** 0.5)\n", "stdin": null, "note": "Python keeps about 16 significant digits for decimal numbers."}], "check": {"q": "What does <code>2 + 3 * 4 ** 2<\/code> evaluate to?", "options": ["50", "80", "26", "400"], "answer": 0, "why": "Exponent first: 4 ** 2 is 16. Then multiplication: 3 * 16 is 48. Then addition: 2 + 48 is 50."}}, {"title": "Variables and assignment", "minutes": 15, "html": "<p>A <strong>variable<\/strong> is a name attached to a value. The <code>=<\/code> sign means <strong>assign<\/strong>: evaluate the right side, then store the result under the name on the left. It does not state that two things are equal, so <code>x = x + 1<\/code> is a valid instruction that adds 1 to x.<\/p>\n<p>Name rules: letters, digits, and underscores; the name cannot start with a digit; no spaces; no Python keywords such as <code>class<\/code> or <code>if<\/code>. Names are case sensitive, so <code>Voltage<\/code> and <code>voltage<\/code> are different variables. Use lowercase words joined by underscores (<code>supply_voltage<\/code>). A reader should understand the name without a comment.<\/p>", "cells": [{"code": "voltage = 12\ncurrent = 2\npower = voltage * current\nprint(power)\n", "stdin": null, "note": null}, {"code": "count = 10\ncount = count + 1\ncount = count * 2\nprint(count)\n", "stdin": null, "note": "Trace the value of <code>count<\/code> on paper after each line, then run the cell."}, {"code": "print(voltage)\nvoltage = 5\nprint(voltage)\nprint(power)\n", "stdin": null, "note": "<code>power<\/code> keeps its old value. A variable stores a result, not the formula that made it."}], "check": {"q": "After <code>a = 4<\/code>, <code>b = a * 3<\/code>, <code>a = 10<\/code>, what is <code>b<\/code>?", "options": ["30", "10", "12", "7"], "answer": 2, "why": "<code>b<\/code> was computed when a was 4, so b is 12. Changing <code>a<\/code> later does not recompute <code>b<\/code>."}}, {"title": "Ohm's law and power in code", "minutes": 20, "html": "<p>Three equations cover most basic DC circuit work:<\/p>\n<ul><li>Ohm's law: <code>V = I * R<\/code><\/li><li>Power from voltage and current: <code>P = V * I<\/code><\/li><li>Power from current and resistance: <code>P = I ** 2 * R<\/code><\/li><\/ul>\n<p>When you rearrange an equation, write the version Python needs: the unknown alone on the left. If V and R are known, then <code>I = V / R<\/code>.<\/p>\n<p>Keep units in the variable names or comments. A name like <code>resistance_ohms<\/code> prevents the mistakes that unit mismatches cause. Week 2 covers a well-known spacecraft loss that came from exactly this kind of mismatch.<\/p>", "cells": [{"code": "voltage_v = 12\nresistance_ohm = 4\ncurrent_a = voltage_v / resistance_ohm\npower_w = voltage_v * current_a\nprint(\"Current:\", current_a, \"A\")\nprint(\"Power:\", power_w, \"W\")\n", "stdin": null, "note": null}, {"code": "power_w_alt = current_a ** 2 * resistance_ohm\nprint(power_w_alt)\n", "stdin": null, "note": "The second power equation gives the same answer. Agreement between two methods is a cheap way to catch mistakes."}, {"code": "resistance_ohm = 8\ncurrent_a = voltage_v / resistance_ohm\nprint(current_a)\n", "stdin": null, "note": "Change the resistance and rerun. You now have a calculator that takes one edit per question."}], "check": {"q": "A 5 V supply drives a 20 ohm resistor. Which line finds the current in amps?", "options": ["<code>current = 5 / 20<\/code>", "<code>current = 5 * 20<\/code>", "<code>current = 5 ** 20<\/code>", "<code>current = 20 / 5<\/code>"], "answer": 0, "why": "Ohm's law gives I = V / R, so 5 / 20 = 0.25 A."}}, {"title": "Integers, floats, and scientific notation", "minutes": 15, "html": "<p>Python has two number types you will use constantly. An <strong>int<\/strong> is a whole number such as <code>12<\/code>. A <strong>float<\/strong> is a number with a decimal point such as <code>12.0<\/code> or <code>0.05<\/code>. Any calculation with <code>/<\/code> gives a float.<\/p>\n<p>Engineering values span many powers of ten. Write them in scientific notation: <code>4.7e3<\/code> means 4.7 times 10 to the 3rd, which is 4700. A 100 nF capacitor is <code>100e-9<\/code> farads, or <code>1e-7<\/code>.<\/p>\n<p>Floats store about 16 digits and use binary fractions, so some decimals cannot be stored exactly. That causes tiny rounding differences. Compare floats by checking that they are close, and round when you print.<\/p>", "cells": [{"code": "print(type(12), type(12.0), type(12 / 4))\n", "stdin": null, "note": null}, {"code": "print(4.7e3)\nprint(100e-9)\nprint(1e6)\n", "stdin": null, "note": null}, {"code": "print(0.1 + 0.2)\nprint(0.1 + 0.2 == 0.3)\nprint(round(0.1 + 0.2, 2))\n", "stdin": null, "note": "This result surprises most beginners. Every language that uses standard floating point gives the same answer."}, {"code": "print(round(3.14159, 3))\nprint(round(2500.0, -2))\n", "stdin": null, "note": "A negative second argument rounds to hundreds, thousands, and so on."}], "check": {"q": "What value does <code>2.5e-3<\/code> represent?", "options": ["-7.5", "2500", "0.0025", "0.25"], "answer": 2, "why": "The exponent -3 moves the decimal point three places left: 2.5 becomes 0.0025."}}, {"title": "The math module", "minutes": 15, "html": "<p>Python includes a library of extra tools called <strong>modules<\/strong>. You load one with <code>import<\/code>. The <code>math<\/code> module provides <code>sqrt<\/code>, <code>pi<\/code>, <code>sin<\/code>, <code>cos<\/code>, <code>log10<\/code>, and many others.<\/p>\n<p>Trigonometric functions use <strong>radians<\/strong>. Convert degrees with <code>math.radians(degrees)<\/code>.<\/p>\n<p>Two formulas worth keeping:<\/p>\n<ul><li>RMS voltage of a sine wave: <code>v_rms = v_peak / math.sqrt(2)<\/code><\/li><li>Resonant frequency of an LC circuit: <code>f = 1 / (2 * math.pi * math.sqrt(L * C))<\/code><\/li><\/ul>", "cells": [{"code": "import math\nprint(math.sqrt(144))\nprint(math.pi)\n", "stdin": null, "note": null}, {"code": "angle = math.radians(30)\nprint(math.sin(angle))\n", "stdin": null, "note": "The result is 0.49999999999999994, which is 0.5 with floating-point noise."}, {"code": "v_peak = 170\nv_rms = v_peak / math.sqrt(2)\nprint(round(v_rms, 1))\n", "stdin": null, "note": "Household mains in North America is about 170 V peak, or 120 V RMS."}], "check": {"q": "What does <code>math.sin(30)<\/code> calculate?", "options": ["The sine of 30 radians", "The sine of 30 degrees", "30 divided by the sine function", "0.5"], "answer": 0, "why": "<code>math.sin<\/code> expects radians. For 30 degrees, use <code>math.sin(math.radians(30))<\/code>."}}, {"title": "Comments and reading error messages", "minutes": 15, "html": "<p>A <strong>comment<\/strong> starts with <code>#<\/code>. Python ignores everything after it on that line. Use comments to state units, sources, and the reason for a choice. Do not restate what the code obviously does.<\/p>\n<p>You will see errors every day you write code. An error message tells you where Python stopped and why. Read it from the bottom: the last line names the error type and describes the problem, and the line above it shows the code involved.<\/p>\n<p>Three errors you will see this week:<\/p>\n<ul><li><code>NameError<\/code>: you used a name Python has not seen (often a typo or wrong capitalization)<\/li><li><code>SyntaxError<\/code>: the code breaks a grammar rule (a missing quote or parenthesis)<\/li><li><code>ZeroDivisionError<\/code>: you divided by zero<\/li><\/ul>", "cells": [{"code": "resistance_ohm = 220  # measured with a multimeter\nprint(resistance_ohm)\n", "stdin": null, "note": null}, {"code": "print(Voltage)\n", "stdin": null, "note": "This cell raises a NameError on purpose. Python knows <code>voltage<\/code>, so <code>Voltage<\/code> is a different, undefined name."}, {"code": "print(\"Done)\n", "stdin": null, "note": "A SyntaxError on purpose. Find the missing quotation mark."}, {"code": "print(10 / 0)\n", "stdin": null, "note": null}], "check": {"q": "Where do you look first in an error message?", "options": ["The title of the page", "The first line, which always contains the fix", "The last line, which names the error type and problem", "Nowhere; rerun the cell until it works"], "answer": 2, "why": "The last line states what went wrong. The lines above it show where."}}, {"title": "Putting it together: an LED resistor", "minutes": 15, "html": "<p>An LED needs a series resistor to limit current. The resistor must drop the supply voltage minus the LED forward voltage at the desired current.<\/p>\n<p><code>R = (V_supply - V_led) / I<\/code><\/p>\n<p>For a 5 V supply, a red LED with a 2 V forward drop, and 20 mA of current, the resistor value is <code>(5 - 2) / 0.02<\/code>. Then check how much power the resistor dissipates, because a resistor that overheats fails.<\/p>\n<p>Read through the cell, predict the output, and then run it.<\/p>", "cells": [{"code": "supply_v = 5\nled_drop_v = 2\nled_current_a = 0.02\n\nresistor_v = supply_v - led_drop_v\nresistor_ohm = resistor_v / led_current_a\nresistor_power_w = led_current_a ** 2 * resistor_ohm\n\nprint(\"Resistor:\", resistor_ohm, \"ohm\")\nprint(\"Power in resistor:\", resistor_power_w, \"W\")\n", "stdin": null, "note": null}, {"code": "supply_v = 9\nresistor_v = supply_v - led_drop_v\nresistor_ohm = resistor_v / led_current_a\nprint(resistor_ohm)\n", "stdin": null, "note": "Change the supply to 9 V and rerun. The next lab asks you to build this kind of calculation yourself."}]}], "lecture_minutes": 130, "lab": {"summary": "Ohm's law and power calculator with resistor networks, an LED resistor, resonance, and a voltage divider.", "intro_html": "<p>You are building the first version of a bench calculator. Each task covers one calculation that an electrical technician or engineer does often. Write your code in the editor, press <strong>Run<\/strong> to see output, and press <strong>Check my work<\/strong> to run the tests.<\/p>\n<p>Variable names matter. The tests look for the exact names given in each task. Keep the starter comments; add your own where they help.<\/p>", "tasks": [{"id": "t1", "title": "Ohm's law basics", "points": 15, "minutes": 20, "bonus": false, "prompt_html": "<p>A 12 V source drives a 4 ohm load. Compute the current in amps (<code>current<\/code>) and the power in watts (<code>power<\/code>). Use the variables <code>voltage<\/code> and <code>resistance<\/code> in your formulas.<\/p>", "starter": "# Task 1: Ohm's law\nvoltage = 12      # volts\nresistance = 4    # ohms\n\n# Replace the ... with formulas that use the variables above\ncurrent = ...\npower = ...\n\nprint(current, power)\n", "hint_html": "<p>Rearrange <code>V = I * R<\/code> so that I is alone: <code>current = voltage / resistance<\/code>. Then <code>power = voltage * current<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["current is 3 A", "approx(current, 3.0)", "Divide voltage by resistance."], ["power is 36 W", "approx(power, 36.0)", "Multiply voltage by current."], ["current formula uses voltage and resistance", "line_has(src, 'current', 'voltage', 'resistance')", "Write the formula with the variable names instead of typing the number."], ["power formula uses variables", "line_has(src, 'power', 'voltage') or line_has(src, 'power', 'current')", "Use the variables in the power formula."]]}}, {"id": "t2", "title": "Series and parallel resistors", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>Three resistors have values <code>r1 = 220<\/code>, <code>r2 = 330<\/code>, and <code>r3 = 470<\/code> ohms. Compute <code>r_series<\/code>, the total when they connect in series, and <code>r_parallel<\/code>, the total when they connect in parallel.<\/p>\n<p>Series: add the values. Parallel: <code>1 / (1/r1 + 1/r2 + 1/r3)<\/code>.<\/p>", "starter": "# Task 2: resistor networks\nr1 = 220\nr2 = 330\nr3 = 470\n\nr_series = ...\nr_parallel = ...\n\nprint(\"Series:\", r_series)\nprint(\"Parallel:\", r_parallel)\n", "hint_html": "<p>Parentheses matter in the parallel formula: the denominator is the whole sum of reciprocals. Write <code>1 / (1 / r1 + 1 / r2 + 1 / r3)<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["series total is 1020 ohm", "approx(r_series, 1020)", "Add all three values."], ["parallel total is about 103.06 ohm", "approx(r_parallel, 103.0565, rel=1e-4)", "Use 1 / (1/r1 + 1/r2 + 1/r3) with parentheses around the sum."], ["parallel is smaller than the smallest resistor", "r_parallel < r1", "A parallel total is always below the smallest branch. Recheck the formula."]]}}, {"id": "t3", "title": "LED current-limiting resistor", "points": 15, "minutes": 25, "bonus": false, "prompt_html": "<p>A 9 V supply powers an LED with a 2.1 V forward drop at 20 mA (0.02 A).<\/p>\n<p>Compute:<\/p>\n<ul><li><code>resistor_v<\/code>: voltage across the resistor<\/li><li><code>led_resistor<\/code>: resistor value in ohms<\/li><li><code>resistor_power<\/code>: power the resistor dissipates in watts<\/li><\/ul>", "starter": "# Task 3: LED resistor\nsupply = 9          # volts\nled_drop = 2.1      # volts\nled_current = 0.02  # amps\n\nresistor_v = ...\nled_resistor = ...\nresistor_power = ...\n\nprint(led_resistor, resistor_power)\n", "hint_html": "<p>The resistor sees what the LED does not: <code>supply - led_drop<\/code>. Then Ohm's law gives the resistance. Use <code>led_current ** 2 * led_resistor<\/code> for power.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["resistor voltage is 6.9 V", "approx(resistor_v, 6.9)", "Subtract the LED drop from the supply."], ["resistor is 345 ohm", "approx(led_resistor, 345.0)", "Divide the resistor voltage by the LED current."], ["resistor power is 0.138 W", "approx(resistor_power, 0.138)", "Use current squared times resistance, or voltage times current."]]}}, {"id": "t4", "title": "Print a power report", "points": 15, "minutes": 20, "bonus": false, "prompt_html": "<p>A motor draws <code>current = 2<\/code> amps at <code>voltage = 12<\/code> volts for 3 hours. Calculate <code>power<\/code> in watts and <code>energy_wh<\/code> (watt-hours) for the 3 hours, then print exactly these two lines:<\/p>\n<pre><code>Power (W): 24\nEnergy for 3 hours (Wh): 72<\/code><\/pre>\n<p>Give <code>print<\/code> two values separated by a comma, such as <code>print(\"Power (W):\", power)<\/code>. Keep both numbers as whole numbers.<\/p>", "starter": "# Task 4: report\nvoltage = 12\ncurrent = 2\nhours = 3\n\npower = ...\nenergy_wh = ...\n\n# Print the two lines here\n", "hint_html": "<p><code>energy_wh = power * hours<\/code>. With whole-number inputs and only <code>*<\/code>, Python keeps whole numbers, so the output reads <code>24<\/code> and <code>72<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["power is 24", "power == 24", "power = voltage * current"], ["energy is 72", "energy_wh == 72", "energy_wh = power * hours"], ["output has exactly the two required lines", "out.strip().splitlines() == ['Power (W): 24', 'Energy for 3 hours (Wh): 72']", "Check spelling, spaces, and that you print only these two lines."]]}}, {"id": "t5", "title": "Resonance and RMS with the math module", "points": 20, "minutes": 30, "bonus": false, "prompt_html": "<p>Use <code>import math<\/code>.<\/p>\n<ol><li>An LC circuit has <code>L = 0.01<\/code> henries and <code>C = 100e-9<\/code> farads. Compute the resonant frequency <code>f0 = 1 / (2 * pi * sqrt(L * C))<\/code> in hertz.<\/li><li>A mains waveform has a peak of <code>v_peak = 170<\/code> volts. Compute <code>v_rms<\/code>.<\/li><li>Compute <code>sine_30<\/code>, the sine of 30 degrees.<\/li><\/ol>", "starter": "# Task 5: math module\nimport math\n\nL = 0.01        # henries\nC = 100e-9      # farads\nv_peak = 170    # volts\n\nf0 = ...\nv_rms = ...\nsine_30 = ...\n\nprint(f0, v_rms, sine_30)\n", "hint_html": "<p>Use <code>math.pi<\/code> and <code>math.sqrt(...)<\/code>. For the sine, convert first: <code>math.sin(math.radians(30))<\/code>.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["f0 is about 5033 Hz", "approx(f0, 5032.92, rel=1e-4)", "Check parentheses: the denominator is 2 * pi * sqrt(L * C)."], ["v_rms is about 120.2 V", "approx(v_rms, 120.208, rel=1e-4)", "Divide v_peak by math.sqrt(2)."], ["sine of 30 degrees is 0.5", "approx(sine_30, 0.5, rel=1e-9)", "Convert degrees with math.radians before calling math.sin."], ["uses the math module", "uses_node(src, 'Import') and 'math.' in src", "Import math and call its functions."]]}}, {"id": "t6", "title": "Voltage divider and percent error", "points": 20, "minutes": 30, "bonus": false, "prompt_html": "<p>A voltage divider has <code>vin = 12<\/code> V, <code>r1 = 10000<\/code> ohms, and <code>r2 = 5000<\/code> ohms.<\/p>\n<p>Compute:<\/p>\n<ul><li><code>vout = vin * r2 / (r1 + r2)<\/code><\/li><li><code>vout_measured = 3.92<\/code>, which is what your meter shows. Find <code>percent_error = abs(vout_measured - vout) / vout * 100<\/code><\/li><li><code>divider_current<\/code>: current through the divider in amps<\/li><li><code>r1_power<\/code>: power dissipated in <code>r1<\/code> in watts<\/li><\/ul>", "starter": "# Task 6: voltage divider\nvin = 12\nr1 = 10000\nr2 = 5000\nvout_measured = 3.92\n\nvout = ...\npercent_error = ...\ndivider_current = ...\nr1_power = ...\n\nprint(vout, percent_error, divider_current, r1_power)\n", "hint_html": "<p>The divider current is <code>vin / (r1 + r2)<\/code> because the resistors are in series. Power in <code>r1<\/code> is <code>divider_current ** 2 * r1<\/code>. <code>abs(x)<\/code> removes a minus sign.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["vout is 4 V", "approx(vout, 4.0)", "vout = vin * r2 / (r1 + r2)"], ["percent error is 2", "approx(percent_error, 2.0, rel=1e-6)", "Use abs(measured - expected) / expected * 100."], ["divider current is 0.8 mA", "approx(divider_current, 0.0008)", "The two resistors are in series: vin / (r1 + r2)."], ["r1 dissipates 6.4 mW", "approx(r1_power, 0.0064)", "Use divider_current ** 2 * r1."]]}}, {"id": "b1", "title": "Battery runtime", "points": 10, "minutes": 20, "bonus": true, "prompt_html": "<p>A battery has <code>capacity_mah = 2000<\/code> milliamp-hours and only 80 percent is usable (<code>usable_fraction = 0.8<\/code>). The load draws <code>load_ma = 250<\/code> milliamps. Compute <code>runtime_hours<\/code>.<\/p>", "starter": "# Bonus: battery runtime\ncapacity_mah = 2000\nusable_fraction = 0.8\nload_ma = 250\n\nruntime_hours = ...\nprint(runtime_hours)\n", "hint_html": "<p>Usable capacity is <code>capacity_mah * usable_fraction<\/code>. Divide by the load current to get hours.<\/p>", "stdin": null, "tests": {"setup": "", "items": [["runtime is 6.4 hours", "approx(runtime_hours, 6.4)", "usable capacity divided by load current"], ["formula uses the variables", "line_has(src, 'runtime_hours', 'capacity_mah', 'load_ma')", "Use the variables instead of typed numbers."]]}}]}, "lab_minutes": 150, "quiz": [{"q": "What does <code>print(2 + 3 * 4)<\/code> show?", "options": ["9", "14", "20", "24"], "answer": 1, "why": "Multiplication runs before addition: 3 * 4 is 12, then 2 + 12 is 14."}, {"q": "Which operator raises a number to a power?", "options": ["<code>//<\/code>", "<code>^<\/code>", "<code>**<\/code>", "<code>%<\/code>"], "answer": 2, "why": "Python uses <code>**<\/code> for powers. The <code>^<\/code> symbol is a different operation (bitwise exclusive or)."}, {"q": "What is the value of <code>17 // 5<\/code>?", "options": ["4", "2", "3.4", "3"], "answer": 3, "why": "Floor division keeps the whole part of the quotient: 17 divided by 5 is 3.4, so the result is 3."}, {"q": "What is the value of <code>17 % 5<\/code>?", "options": ["2", "0", "3", "3.4"], "answer": 0, "why": "The remainder after dividing 17 by 5 is 2, because 5 * 3 = 15 and 17 - 15 = 2."}, {"q": "After <code>x = 5<\/code> and then <code>x = x + 2<\/code>, what is <code>x<\/code>?", "options": ["52", "7", "5", "2"], "answer": 1, "why": "Python evaluates the right side with the old value of x (5 + 2), then stores 7 under the name x."}, {"q": "Which is a valid Python variable name?", "options": ["<code>supply voltage<\/code>", "<code>supply-voltage<\/code>", "<code>motor_current<\/code>", "<code>2nd_stage<\/code>"], "answer": 2, "why": "Names use letters, digits, and underscores, and cannot start with a digit. Spaces and hyphens are not allowed."}, {"q": "A 5 V supply drives a 20 ohm resistor. What is the current?", "options": ["25 A", "100 A", "4 A", "0.25 A"], "answer": 3, "why": "I = V / R = 5 / 20 = 0.25 A."}, {"q": "What does <code>0.1 + 0.2 == 0.3<\/code> evaluate to in Python?", "options": ["False", "An error", "0.3", "True"], "answer": 0, "why": "Floats store binary approximations. 0.1 + 0.2 equals 0.30000000000000004, which differs slightly from 0.3."}, {"q": "What number does <code>1e-6<\/code> represent?", "options": ["0.00001", "0.000001", "1000000", "-6"], "answer": 1, "why": "The exponent -6 moves the decimal point six places left."}, {"q": "What does <code>math.sqrt(16)<\/code> return?", "options": ["An error", "4", "4.0", "8"], "answer": 2, "why": "<code>math.sqrt<\/code> always returns a float, so the result is 4.0."}, {"q": "Which character starts a comment in Python?", "options": ["<code>//<\/code>", "<code>/*<\/code>", "<code>--<\/code>", "<code>#<\/code>"], "answer": 3, "why": "Python ignores everything after <code>#<\/code> on the same line."}, {"q": "Where does Python's error message name the error type?", "options": ["On the last line", "Nowhere; you must guess", "In the file name", "On the first line"], "answer": 0, "why": "The last line names the type (such as NameError) and describes the problem."}], "quiz_minutes": 18, "quiz_intro_html": "<p>Answer each question. You see the explanation right after you choose. You can reset the quiz and try again.<\/p>"}</script>
<script id="harness" type="text/x-python">import sys, io, os, json, ast, base64, builtins, traceback, contextlib, math, random

os.environ.setdefault("MPLBACKEND", "Agg")
import importlib
if "" not in sys.path:
    sys.path.insert(0, "")

_OUT_CAP = 20000
_LECTURE_NS = {"__name__": "__main__"}


class _Capped(io.StringIO):
    def write(self, s):
        if self.tell() > _OUT_CAP:
            raise RuntimeError("Output limit reached. Your code printed too much text.")
        return super().write(s)


def approx(a, b, rel=1e-6, abs_=1e-9):
    try:
        if "numpy" in sys.modules:
            import numpy as _np
            if isinstance(a, _np.ndarray) or isinstance(b, _np.ndarray):
                return bool(_np.allclose(a, b, rtol=rel, atol=abs_))
        if isinstance(a, (list, tuple)) and isinstance(b, (list, tuple)):
            return len(a) == len(b) and all(approx(x, y, rel, abs_) for x, y in zip(a, b))
        return abs(float(a) - float(b)) <= max(abs_, rel * abs(float(b)))
    except Exception:
        return False


def uses_node(src, *names):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    wanted = tuple(getattr(ast, n) for n in names)
    return any(isinstance(n, wanted) for n in ast.walk(tree))


def calls_name(src, name):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return False
    for n in ast.walk(tree):
        if isinstance(n, ast.Call):
            f = n.func
            if isinstance(f, ast.Name) and f.id == name:
                return True
            if isinstance(f, ast.Attribute) and f.attr == name:
                return True
    return False


def line_has(src, target, *words):
    """True when an assignment to `target` has every word on its right side."""
    for line in src.splitlines():
        s = line.strip()
        if s.startswith("#") or "=" not in s:
            continue
        left, _, right = s.partition("=")
        if left.strip() == target and all(w in right for w in words):
            return True
    return False


def run_with(src, inputs=(), ns=None):
    """Run student source with scripted input() values; return what it printed."""
    queue = list(inputs)
    old = builtins.input

    def _fake(prompt=""):
        print(prompt, end="")
        if not queue:
            raise EOFError("input() called more times than expected")
        v = queue.pop(0)
        print(v)
        return v

    buf = io.StringIO()
    builtins.input = _fake
    try:
        with contextlib.redirect_stdout(buf):
            exec(compile(src, "<your code>", "exec"), ns if ns is not None else {"__name__": "__main__"})
    finally:
        builtins.input = old
    return buf.getvalue()


def rerun(src, **over):
    """Execute student source again with top-level assignments replaced by the given constants.
    Returns the resulting namespace. Output is discarded."""
    tree = ast.parse(src)
    for node in tree.body:
        if (isinstance(node, ast.Assign) and len(node.targets) == 1
                and isinstance(node.targets[0], ast.Name) and node.targets[0].id in over):
            node.value = ast.Constant(over[node.targets[0].id])
    ast.fix_missing_locations(tree)
    ns = {"__name__": "__main__"}
    with contextlib.redirect_stdout(io.StringIO()):
        exec(compile(tree, "<your code>", "exec"), ns)
    return ns


def count_defs(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.FunctionDef) for n in ast.walk(tree))


def count_classes(src):
    try:
        tree = ast.parse(src)
    except SyntaxError:
        return 0
    return sum(isinstance(n, ast.ClassDef) for n in ast.walk(tree))


def _format_error(exc, code):
    lines = code.split("\n")
    if isinstance(exc, SyntaxError):
        ln = exc.lineno
        msg = "SyntaxError: " + str(exc.msg)
        if ln and 1 <= ln <= len(lines):
            msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
        return msg
    tb = traceback.TracebackException.from_exception(exc)
    ln = None
    for fs in tb.stack:
        if fs.filename == "<your code>":
            ln = fs.lineno
    msg = "".join(tb.format_exception_only()).strip()
    if ln and 1 <= ln <= len(lines):
        msg += "\n  on line %d: %s" % (ln, lines[ln - 1].strip())
    return msg


def _make_input(stdin_lines, out):
    queue = list(stdin_lines)

    def _input(prompt=""):
        out.write(str(prompt))
        if not queue:
            raise EOFError("input() ran out of lines. Type one value per line in the Input box under the code.")
        val = queue.pop(0)
        out.write(val + "\n")
        return val

    return _input


def _exec_code(code, ns, out):
    tree = ast.parse(code, "<your code>", "exec")
    last = None
    if tree.body and isinstance(tree.body[-1], ast.Expr):
        last = ast.Expression(tree.body.pop().value)
    exec(compile(tree, "<your code>", "exec"), ns)
    if last is not None:
        val = eval(compile(last, "<your code>", "eval"), ns)
        if val is not None:
            out.write(repr(val) + "\n")


def _collect_images():
    imgs = []
    if "matplotlib.pyplot" in sys.modules:
        import matplotlib.pyplot as plt
        for num in plt.get_fignums():
            fig = plt.figure(num)
            buf = io.BytesIO()
            fig.savefig(buf, format="png", dpi=100, bbox_inches="tight")
            imgs.append(base64.b64encode(buf.getvalue()).decode("ascii"))
        plt.close("all")
    return imgs


def reset_lecture():

def run_cell(req_json):
    req = json.loads(req_json)
    code = req.get("code", "")
    mode = req.get("mode", "fresh")
    stdin_lines = req.get("stdin") or []
    tests = req.get("tests")
    ns = _LECTURE_NS if mode == "lecture" else {"__name__": "__main__"}
    importlib.invalidate_caches()
    out = _Capped()
    err = None
    real_input = builtins.input
    builtins.input = _make_input(stdin_lines, out)
    try:
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(out):
            try:
                random.seed()
                _exec_code(code, ns, out)
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                err = _format_error(exc, code)
    finally:
        builtins.input = real_input
    result = {"stdout": out.getvalue(), "error": err, "images": [], "tests": None}
    try:
        result["images"] = _collect_images()
    except Exception as exc:
        result["stdout"] += "\n(Plot could not be drawn: %s)" % exc
    if tests is not None:
        result["tests"] = _run_tests(tests, ns, code, err, out.getvalue())
    return json.dumps(result)


def _run_tests(tests, ns, code, err, stdout_text):
    items = tests.get("items", [])
    results = []
    if err is not None:
        for label, _expr, hint in items:
            results.append({"label": label, "ok": False, "msg": "Fix the error above first."})
        return results
    env = ns
    helpers = {
        "approx": approx, "out": stdout_text, "src": code, "ast": ast,
        "uses_node": uses_node, "calls_name": calls_name,
        "count_defs": count_defs, "run_with": run_with, "rerun": rerun, "count_classes": count_classes, "line_has": line_has,
        "math": math, "random": random, "io": io, "_in_tests": True,
    }
    _missing = object()
    saved = {k: env.get(k, _missing) for k in helpers}
    env.update(helpers)
    sink = _Capped()
    try:
        setup = tests.get("setup")
        if setup:
            try:
                with contextlib.redirect_stdout(sink):
                    exec(compile(setup, "<tests>", "exec"), env)
            except BaseException as exc:
                reason = "Could not run the checks: %s: %s" % (type(exc).__name__, exc)
                return [{"label": l, "ok": False, "msg": reason} for l, _e, _h in items]
        for label, expr, hint in items:
            try:
                with contextlib.redirect_stdout(sink):
                    ok = bool(eval(compile(expr, "<tests>", "eval"), env))
                results.append({"label": label, "ok": ok, "msg": "" if ok else hint})
            except BaseException as exc:
                if isinstance(exc, KeyboardInterrupt):
                    raise
                results.append({"label": label, "ok": False,
                                "msg": "%s (%s: %s)" % (hint, type(exc).__name__, exc)})
    finally:
        for k, v in saved.items():
            if v is _missing:
                env.pop(k, None)
            else:
                env[k] = v
    return results

    ta.value = buildReport(); ta.select();
    var done = function () { b2.textContent = 'Copied'; setTimeout(function () { b2.textContent = 'Copy report'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(done, function () { try { document.execCommand('copy'); done(); } catch (e) {} }); }
    else { try { document.execCommand('copy'); done(); } catch (e) {} }
  } });
  var b3 = h('button', { class: 'btn', text: 'Download .txt', onclick: function () {
    var txt = buildReport(); ta.value = txt;
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/plain' }));
    a.download = 'week' + D.num + '_report.txt'; document.body.appendChild(a); a.click(); a.remove();
  } });
  rep.appendChild(h('div', { class: 'row' }, [b1, b2, b3]));
  rep.appendChild(ta);
  p.appendChild(rep);
  updateLab();
}
function quizTally() {
  var correct = 0, answered = 0;
  D.quiz.forEach(function (q, i) { var a = S.quiz[i]; if (a !== undefined && a !== null) { answered++; if (a === q.answer) { correct++; } } });
  return { correct: correct, answered: answered, total: D.quiz.length };
}
function buildReport() {
  var L = [], s = labScore(), q = quizTally();
  var max = D.lab.tasks.filter(function (t) { return !t.bonus; }).reduce(function (a, t) { return a + t.points; }, 0);
  var lec = D.lecture.filter(function (_s, i) { return S.lecDone[i]; }).length;
  L.push('Course: ' + D.course_title);
  L.push('Week ' + D.num + ': ' + D.title);
  L.push('Name: ' + (S.name || '(not entered)'));
  L.push('Generated: ' + new Date().toLocaleString());
  L.push('');
  L.push('Lecture sections marked complete: ' + lec + ' of ' + D.lecture.length);
  L.push('Lab score (browser autograder): ' + s.score + ' of ' + max + (s.bonus ? ', bonus ' + s.bonus : ''));
  L.push('Quiz: ' + q.correct + ' correct, ' + q.answered + ' answered, ' + q.total + ' questions');
  L.push('');
  D.lab.tasks.forEach(function (t, i) {
    var r = S.lab[t.id];
    L.push('==== ' + (t.bonus ? 'Bonus' : 'Task ' + (i + 1)) + ': ' + t.title + ' (' + (r ? r.passed + '/' + r.total + ' tests' : 'not checked') + ') ====');
    L.push(S.code['lab_' + t.id] !== undefined ? S.code['lab_' + t.id] : t.starter);
    L.push('');
  });
  return L.join('\n');
}

/* ---------- quiz ---------- */
function updateQuiz() {
  var q = quizTally();
  var el = document.getElementById('quizscore');
  if (el) { el.textContent = q.correct + ' correct of ' + q.answered + ' answered, ' + q.total + ' questions'; }
  tiles.quiz.textContent = q.correct + '/' + q.total;
}
function renderQuiz() {
  var p = document.getElementById('panel-quiz');
  p.innerHTML = '';
  p.appendChild(h('div', { class: 'card', html: D.quiz_intro_html }));
  p.appendChild(h('div', { class: 'row' }, [
    h('strong', { text: 'Score: ' }), h('span', { id: 'quizscore', class: 'badge info' }),
    h('span', { style: 'flex:1' }),
    h('button', { class: 'btn', text: 'Reset quiz', onclick: function () {
      if (!confirm('Clear all quiz answers?')) { return; } S.quiz = {}; save(); renderQuiz();
    } })
  ]));
  D.quiz.forEach(function (q, i) {
    var card = h('div', { class: 'card' });
    card.appendChild(h('p', { class: 'meta', text: 'Question ' + (i + 1) + ' of ' + D.quiz.length }));
    card.appendChild(mcq({ cls: 'qbox', q: q.q, options: q.options, answer: q.answer, why: q.why, saved: S.quiz[i], onAnswer: function (k) { S.quiz[i] = k; save(); updateQuiz(); } }));
    p.appendChild(card);
  });
  updateQuiz();
}

/* ---------- shell ---------- */
document.getElementById('kicker').textContent = D.course_title + ', Week ' + D.num;
document.getElementById('title').textContent = D.title;
document.title = D.course_title + ' Week ' + D.num + ' ' + D.title;
var chips = document.getElementById('chips');
[D.lecture_minutes + ' min lecture', D.lab_minutes + ' min lab', D.quiz.length + ' quiz questions'].forEach(function (t) { chips.appendChild(h('li', { text: t })); });
var tabs = [['overview', 'Overview'], ['lecture', 'Lecture'], ['lab', 'Lab'], ['quiz', 'Quiz']];
var tl = document.getElementById('tablist');
tabs.forEach(function (t) {
  var b = h('button', { role: 'tab', id: 'tab-' + t[0], 'aria-controls': 'panel-' + t[0], 'aria-selected': 'false', text: t[1] });
  b.addEventListener('click', function () { show(t[0]); });
  tl.appendChild(b);
});
function show(name) {
  tabs.forEach(function (t) {
    document.getElementById('panel-' + t[0]).hidden = (t[0] !== name);
    document.getElementById('tab-' + t[0]).setAttribute('aria-selected', t[0] === name ? 'true' : 'false');
  });
  try { history.replaceState(null, '', '#' + name); } catch (e) {}
  window.scrollTo(0, 0);
  document.querySelectorAll('#panel-' + name + ' textarea.code').forEach(function (t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 4, 640) + 'px'; });
}
renderOverview(); renderLecture(); renderLab(); renderQuiz();
var start = (location.hash || '').replace('#', '');
show(tabs.some(function (t) { return t[0] === start; }) ? start : 'overview');
})();
</script>
